 됨; hybrid(잡종)는 서식지 변화와 무관.<\/li><li>(ii) <code>been closely scrutinized<\/code>(면밀히 연구되었다)·<code>been taken for granted<\/code>(당연시되었다): 연구·인식의 문제라 \"잔존 종(relict)\"의 원인(서식지 물리적 소멸)이 못 됨.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>relict<\/td><td>n.<\/td><td>잔존 종, 유존물<\/td><td>survivor, remnant<\/td><td>(거만어 외) 정답 (≠ relic 유물)<\/td><\/tr><tr><td>endemic<\/td><td>adj./n.<\/td><td>(한 지역) 고유의<\/td><td>native, indigenous<\/td><td>오답<\/td><\/tr><tr><td>hybrid<\/td><td>n.<\/td><td>잡종, 혼성<\/td><td>crossbreed, mix<\/td><td>오답<\/td><\/tr><tr><td>scrutinize<\/td><td>v.<\/td><td>면밀히 살피다<\/td><td>examine, inspect<\/td><td>(거만어 외)<\/td><\/tr><tr><td>habitat<\/td><td>n.<\/td><td>서식지<\/td><td>environment<\/td><td>(거만어 외) 본문<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q4": {"html": true, "interp": "<p>많은 문화에서 변화가 정당성을 얻는 길 가운데 하나는 선례를 지어내는 것이다. 새 의례는 그것이 새롭다는 이유가 아니라, 옛 의례로 되돌아가는 일을 표시한다는 주장에 힘입어 권위를 얻는다.<\/p><p><b>해석 노트:<\/b> legitimated는 '합법화'로 옮기면 법률 문맥으로 오해되므로, 문화적 승인을 뜻하는 결을 살려 '정당성을 얻는'으로 풀었다. construction of precedent는 '선례의 구성'이라는 직역이 뜻을 가리므로, 없던 선례를 만들어 낸다는 함의를 담아 '선례를 지어내는 것'으로 옮겼다. 수동태 are given authority는 한국어 어순대로 '권위를 얻는다'로 뒤집고, 원문의 강조 이탤릭(novelty)은 '새롭다는 이유가 아니라'라는 대조 구문 자체로 살렸다. a return to는 방향성을 살려 '되돌아가는 일'로 명사화해 mark의 목적어 자리를 유지했다.<\/p>", "strat": "<ul><li>(i): 콜론 뒤 설명(\"새 의례가 <em>권위를 부여받음<\/em>\")이 (i)을 부연 → 변화가 <b>정당화(legitimated)<\/b>되는 방식.<\/li><li>(ii): 그 방식 = \"새로움이 아니라 <em>옛것과의 연결<\/em>을 주장\" → <em>선례를 만들어냄<\/em>. = <b>construction of precedent(선례의 구성)<\/b>.<\/li><li>(iii): <code>not by their novelty but by … they mark … the rituals of old<\/code>(trigger-15 not A but B) — \"새로움\"의 반대 = 옛 의례로의 <em>복귀<\/em>. = <b>a return to(~로의 복귀)<\/b>.<\/li><li>trigger-05 콜론 부연 «:»: 콜론 뒤 «new rituals are given authority not by their novelty but…»가 (ii)빈칸을 풀어 준다.<\/li><\/ul>", "correct": "<ul><li><b>(i) legitimated<\/b> · <b>(ii) construction of precedent<\/b> · <b>(iii) a return to<\/b>.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>One of the ways in which change is <b>legitimated<\/b> in many cultures is by the <b>construction of precedent<\/b>: new rituals are given authority not by their novelty but by claims that they mark <b>a return to<\/b> the rituals of old.<\/p>", "wrong": "<ul><li>(i) measured(측정된)·courted(추구된): \"권위 부여(정당화)\" 문맥과 안 맞음.<\/li><li>(ii) assignment of responsibility(책임 배정)·refusal of liability(책임 거부): 권위 부여 방식과 무관.<\/li><li>(iii) the rescission of(~의 폐지)·an abjuration of(~의 포기): \"옛것으로의 복귀(not novelty)\"와 정반대.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>legitimate<\/td><td>v.<\/td><td>정당화하다, 합법화하다<\/td><td>validate, sanction<\/td><td>(거만어 외) 다의어(여기 동사)<\/td><\/tr><tr><td>precedent<\/td><td>n.<\/td><td>선례<\/td><td>exemplar, model<\/td><td>(거만어 외)<\/td><\/tr><tr><td>rescission<\/td><td>n.<\/td><td>폐지, 철회<\/td><td>annulment, repeal<\/td><td>(거만어 외) 오답(iii)<\/td><\/tr><tr><td>abjuration<\/td><td>n.<\/td><td>(공개적) 포기, 철회<\/td><td>renunciation<\/td><td>(거만어 외) 오답(iii)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q5": {"html": true, "interp": "<p>1830년대에 스티븐스(Stephens)를 비롯한 고대 마야 도시 탐험가들은 당시 아직 해독되지 않은 상형문자가 매우 회화적으로 보인다는 점에 깊은 인상을 받았는데, 그 문자에는 사람과 동물의 머리가 자주 등장했다. 이 상형문자에서 머리는 거의 언제나 <b>왼쪽을 향한다<\/b>. 이집트 상형문자나 아나톨리아 상형문자처럼 회화에 기반한 기호를 쓰는 다른 초기 문자들에서는, 기호를 읽는 순서가 기호가 <b>향하는 방향과 반대<\/b>다. 따라서 스티븐스는 마야 문자를 실제로 읽을 능력이 없었는데도, <b>새로 해독된 이집트 문자에 대한 자신의 지식<\/b>에 기초해 일반적인 읽기 순서가 왼쪽에서 오른쪽이라고 옳게 <b>추측(surmise)<\/b>했을 수 있다 — 대개 오른쪽에서 왼쪽으로 훑어 읽는 이집트 문자와는 대조적으로.<\/p>", "strat": "<p><b>질문 1 — 추론<\/b><\/p><p><b>주제 문장 = S1<\/b> «In the 1830s, Stephens and other explorers of ancient Maya cities were struck by the highly pictorial appearance of the then undeciphered hieroglyphs, which frequently featured heads of humans and animals.» — S1이 소재(머리 그림이 많은 마야 상형문자)를 보여 주고, S2 머리 방향 + S3 다른 문자의 규칙 → S4 Thus 읽는 순서 추론으로 이어진다. 요약 = 19세기 탐험가들이 본 마야 상형문자의 그림 같은 모습(S1)에 대한 글 — 머리 방향(S2)과 다른 상형문자의 규칙(S3)으로 읽는 순서를 추론할 수 있었다(S4).<\/p><p>논리 연쇄: (i) 회화 기반 문자는 기호가 <b>향하는 방향의 반대<\/b>로 읽는다는 일반 규칙 → (ii) 마야 문자의 머리는 왼쪽을 향한다 → (iii) 따라서 마야는 (왼쪽 향함의 반대인) <b>왼쪽에서 오른쪽<\/b>으로 읽는다. 스티븐스가 이 추론을 할 수 있었던 것은 <b>이미 해독된 이집트 문자<\/b> 지식 덕분이다.<\/p><p>질문 1은 이집트 상형문자에 대한 <b>추론<\/b>(RC-02)이고 핵심 단서는 \"<b>newly deciphered<\/b> Egyptian script\"와 마야가 아직 미해독이었다는 대비다. 질문 2는 이집트·아나톨리아 문자를 언급한 <b>목적<\/b>(RC-08)을 묻는다 — 읽는 순서 추론의 근거가 되는 일반 규칙을 제시하기 위해서다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: Egyptian hieroglyphs를 주어로 재구성한다. 마야 문자는 1830년대에 아직 해독되지 않았고, 스티븐스는 «newly deciphered Egyptian script»의 지식을 썼다 — 이 대비에서 한 걸음만 나아간 보기를 고른다. 마야에 대한 서술을 이집트에 옮겨 붙이거나 본문에 없는 기원·인과 관계를 말한 보기는 버린다.<\/li><li><b>정답 B<\/b> — \"그것(이집트 상형문자)은 <b>마야 문자보다 먼저 해독되었다<\/b>.\"<\/li><li><b>정답 근거<\/b>: 지문은 마야 문자가 1830년대에 \"아직 해독되지 않았다\"고 하면서, 스티븐스가 \"<b>새로 해독된 이집트 문자<\/b>에 대한 지식\"으로 마야의 읽기 방향을 추측했다고 한다. 이집트 문자가 이미 해독되어 그 지식을 마야에 적용할 수 있었다는 것은, 이집트가 마야보다 <b>먼저 해독<\/b>되었음을 함의한다.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A(그 안에 그려진 머리들이 대체로 <b>왼쪽을 향한다<\/b>) — 왼쪽을 향한다는 것은 <b>마야<\/b> 문자에 관한 서술이다. 이집트에 대해서는 S3 규칙(그림 문자는 기호가 향하는 방향의 반대로 읽는다)과 S4(이집트는 대체로 오른쪽에서 왼쪽으로 읽는다)를 이으면 머리가 대체로 <b>오른쪽<\/b>을 향한다고 추론된다 — A는 그 추론과 정반대다.<\/li><li>C(그 해독이 <b>아나톨리아<\/b> 상형문자의 해독으로 더 쉬워졌다) — 아나톨리아와 이집트 해독의 선후·인과 관계는 지문에 없다. 근거 없음.<\/li><li>D(그것이 아나톨리아 상형문자의 <b>원천<\/b>이었다) — 두 문자의 기원 관계는 언급되지 않았다.<\/li><li>E(마야 상형문자와 달리 <b>동물 머리를 특징으로 하지 않았다<\/b>) — 이집트도 \"회화 기반 기호\"를 특징으로 하는 문자로 함께 묶였다. 동물 머리가 없다는 근거는 없다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>decipher<\/td><td>동<\/td><td>해독하다, 판독하다<\/td><td>decode, make out<\/td><td>거만어. newly deciphered script<\/td><\/tr><tr><td>hieroglyph<\/td><td>명<\/td><td>상형문자<\/td><td>pictograph<\/td><td>거만어. Maya hieroglyphs<\/td><\/tr><tr><td>surmise<\/td><td>동<\/td><td>(근거로) 추론하다, 짐작해 알아내다<\/td><td>infer, deduce<\/td><td>거만어. correctly surmised — FAC 구분상 검증 후 결론(inference·surmise)이다. 검증 전 결론 conjecture·hypothesize와 혼동 주의<\/td><\/tr><tr><td>pictorial<\/td><td>형<\/td><td>회화적인, 그림의<\/td><td>pictographic<\/td><td>(거만어 외) pictorial appearance<\/td><\/tr><tr><td>scan<\/td><td>동<\/td><td>훑어보다, 읽어 나가다<\/td><td>scrutinize, peruse<\/td><td>(거만어 외) scanned from right to left<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q6": {"html": true, "interp": "<p>1830년대에 스티븐스(Stephens)를 비롯한 고대 마야 도시 탐험가들은 당시 아직 해독되지 않은 상형문자가 매우 회화적으로 보인다는 점에 깊은 인상을 받았는데, 그 문자에는 사람과 동물의 머리가 자주 등장했다. 이 상형문자에서 머리는 거의 언제나 <b>왼쪽을 향한다<\/b>. 이집트 상형문자나 아나톨리아 상형문자처럼 회화에 기반한 기호를 쓰는 다른 초기 문자들에서는, 기호를 읽는 순서가 기호가 <b>향하는 방향과 반대<\/b>다. 따라서 스티븐스는 마야 문자를 실제로 읽을 능력이 없었는데도, <b>새로 해독된 이집트 문자에 대한 자신의 지식<\/b>에 기초해 일반적인 읽기 순서가 왼쪽에서 오른쪽이라고 옳게 <b>추측(surmise)<\/b>했을 수 있다 — 대개 오른쪽에서 왼쪽으로 훑어 읽는 이집트 문자와는 대조적으로.<\/p>", "strat": "<p><b>질문 2 — 어구의 기능<\/b><\/p><p><b>주제 문장 = S1<\/b> «In the 1830s, Stephens and other explorers of ancient Maya cities were struck by the highly pictorial appearance of the then undeciphered hieroglyphs, which frequently featured heads of humans and animals.» — S1이 소재(머리 그림이 많은 마야 상형문자)를 보여 주고, S2 머리 방향 + S3 다른 문자의 규칙 → S4 Thus 읽는 순서 추론으로 이어진다. 요약 = 19세기 탐험가들이 본 마야 상형문자의 그림 같은 모습(S1)에 대한 글 — 머리 방향(S2)과 다른 상형문자의 규칙(S3)으로 읽는 순서를 추론할 수 있었다(S4).<\/p><p>논리 연쇄: (i) 회화 기반 문자는 기호가 <b>향하는 방향의 반대<\/b>로 읽는다는 일반 규칙 → (ii) 마야 문자의 머리는 왼쪽을 향한다 → (iii) 따라서 마야는 (왼쪽 향함의 반대인) <b>왼쪽에서 오른쪽<\/b>으로 읽는다. 스티븐스가 이 추론을 할 수 있었던 것은 <b>이미 해독된 이집트 문자<\/b> 지식 덕분이다.<\/p><p>질문 1은 이집트 상형문자에 대한 <b>추론<\/b>(RC-02)이고 핵심 단서는 \"<b>newly deciphered<\/b> Egyptian script\"와 마야가 아직 미해독이었다는 대비다. 질문 2는 이집트·아나톨리아 문자를 언급한 <b>목적<\/b>(RC-08)을 묻는다 — 읽는 순서 추론의 근거가 되는 일반 규칙을 제시하기 위해서다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: Egyptian and Anatolian hieroglyphic이 든 문장을 해석한다. 이 문자들은 «기호가 향하는 방향의 반대로 읽는다»는 규칙의 기존 사례로 나오고, 그 규칙이 넷째 문장 Thus의 읽는 순서 추론을 support한다. 연대·기원·해독 순서로 읽은 보기는 버린다.<\/li><li><b>정답 D<\/b> — \"문자를 특정 방식으로 읽는 것에 대한 <b>선례(precedent)를 인용<\/b>하기 위해.\"<\/li><li><b>정답 근거<\/b>: 이집트·아나톨리아 상형문자는 \"기호가 <b>향하는 방향의 반대로 읽는다<\/b>\"는 규칙의 <b>기존 사례<\/b>로 제시된다. 스티븐스는 이 선례(특히 이미 해독된 이집트 문자)를 근거로, 왼쪽을 향하는 마야 문자를 왼쪽→오른쪽으로 읽는다고 추론했다. 즉 이 언급의 기능은 \"이런 식으로 읽는다\"는 <b>선례를 대는<\/b> 것이다. D.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: A(연대가 잘 알려진 문자와 비교해 마야 문자의 <b>연대(antiquity)를 확립<\/b>) — 연대 측정은 논점이 아니다. B(마야 문자와 <b>공통 기원<\/b>을 공유함을 시사) — 기원 관계는 언급되지 않았다. C(문자들이 해독된 <b>상대적 순서<\/b>를 표시) — 해독 순서를 말하려는 것이 아니라 읽기 방향의 선례를 대려는 것이다. E(회화 기반 문자에서 특정 기호의 <b>보편성<\/b>을 논증) — 기호의 보편성이 아니라 읽기 방향 규칙이 초점이다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>decipher<\/td><td>동<\/td><td>해독하다, 판독하다<\/td><td>decode, make out<\/td><td>거만어. newly deciphered script<\/td><\/tr><tr><td>hieroglyph<\/td><td>명<\/td><td>상형문자<\/td><td>pictograph<\/td><td>거만어. Maya hieroglyphs<\/td><\/tr><tr><td>surmise<\/td><td>동<\/td><td>(근거로) 추론하다, 짐작해 알아내다<\/td><td>infer, deduce<\/td><td>거만어. correctly surmised — FAC 구분상 검증 후 결론(inference·surmise)이다. 검증 전 결론 conjecture·hypothesize와 혼동 주의<\/td><\/tr><tr><td>pictorial<\/td><td>형<\/td><td>회화적인, 그림의<\/td><td>pictographic<\/td><td>(거만어 외) pictorial appearance<\/td><\/tr><tr><td>scan<\/td><td>동<\/td><td>훑어보다, 읽어 나가다<\/td><td>scrutinize, peruse<\/td><td>(거만어 외) scanned from right to left<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q7": {"html": true, "interp": "<p>지구의 충돌구 형성(cratering)이 보이는 한 가지 특징은 <em>쌍둥이 충돌구(doublet craters)<\/em>의 존재다. 지구의 큰 충돌구 28개(지름 20km 초과) 중 3개에 짝 충돌구가 있다. 예컨대 러시아의 카멘스크 충돌구(지름 25km)는 구세프 충돌구(폭 3km, 동일 연대)와 짝을 이룬다. 이런 쌍둥이는 서로 멀리 떨어진 두 소행성이 거의 <em>동시에<\/em> 지구에 충돌할 때 생기므로, 이것이 비교적 자주 나타난다는 사실은 <em>공전 동반(co-orbiting) 소행성<\/em>이 상당수 존재한다는 증거가 된다. 다른 암석 행성도 공전 동반 소행성의 충돌을 받을까? 금성은 표면이 젊고 침식이 거의 없으며 충돌구 수가 지구보다 훨씬 많으면서도 우연히 짝처럼 보이는 조합이 생길 확률이 높을 만큼 많지는 않아, 쌍둥이를 찾기에 유망한 행성이다. <span class=\"highlighted\">연구자들은 금성의 쌍둥이 충돌구 비율이 지구보다 유의하게 작다는 것을 발견했다.<\/span> 그러나(However) 금성의 더 짙은 대기가 일부 소행성 쌍 중 <em>더 작은<\/em> 쪽을 걸러낼(screen out) 수 있다. 만약 지구에도 비슷한 차단 효과가 있었다면 알려진 쌍둥이 3개 중 1개만 형성되었을 것이고, 그러면 지구의 쌍둥이 비율(3.6%)은 불확실성 범위 내에서 금성(2.2%)과 같아진다. 연구자들은 공전 동반 소행성이 근지구 소행성 개체군과 근금성 소행성 개체군 <em>양쪽 모두에서 흔할 것이 틀림없다<\/em>고 결론지었다.<\/p>", "strat": "<p><b>질문 1 — 유형 RC-06<\/b><\/p><ul><li>1단락(FAC3·5): 지구 쌍둥이 충돌구 → 공전 동반 소행성 존재 근거.<\/li><li>2단락: 금성 검증 → <em>겉보기 불일치<\/em>(금성 쌍둥이 비율이 더 작음) 발견 → <code>However<\/code> 대기 차단 효과로 <em>불일치 해소<\/em> → 결론(양쪽 다 흔함).<\/li><\/ul>", "correct": "<ul><li>신호: <code>The passage indicates that when two craters constitute a doublet, they are<\/code>(질문). <code>indicates<\/code>(내용 파악, →RC-06).<\/li><li><b>정답 C<\/b>: 카멘스크(25km)–구세프(3km)는 <em>크기가 크게 다른<\/em> 짝. 따라서 쌍둥이는 \"반드시 크기가 비슷하지는 않다.\" 본문 예시의 직접 진술.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(반드시 공전 동반이 <em>아님<\/em> — 본문은 공전 동반으로 형성된다고 함) / B(동시 생성이 <em>아닐 수도<\/em> — 본문은 \"거의 동시\" 형성이라 함; 동일 연대) / D(때로 <em>멀리 떨어져<\/em> 있음 — 소행성은 떨어져 있으나 충돌구 짝은 가까움) / E(충돌구 많은 지역엔 <em>없을<\/em> 것 — 근거 없음).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>doublet<\/td><td>n.<\/td><td>쌍둥이(짝을 이룬 것)<\/td><td>pair<\/td><td>(거만어 외) 본문 핵심어<\/td><\/tr><tr><td>co-orbiting<\/td><td>adj.<\/td><td>함께 공전하는<\/td><td>—<\/td><td>(거만어 외) 본문 핵심어<\/td><\/tr><tr><td>terrestrial<\/td><td>adj.<\/td><td>지구의, 육지의<\/td><td>earthly<\/td><td>본문<\/td><\/tr><tr><td>erosion<\/td><td>n.<\/td><td>침식, 부식<\/td><td>weathering, wearing away<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>screen out<\/td><td>v.<\/td><td>걸러내다, 차단하다<\/td><td>filter out, block<\/td><td>(거만어 외) 본문(설명 단서)<\/td><\/tr><tr><td>simultaneously<\/td><td>adv.<\/td><td>동시에<\/td><td>concurrently<\/td><td>(거만어 외) 본문<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q8": {"html": true, "interp": "<p>지구의 충돌구 형성(cratering)이 보이는 한 가지 특징은 <em>쌍둥이 충돌구(doublet craters)<\/em>의 존재다. 지구의 큰 충돌구 28개(지름 20km 초과) 중 3개에 짝 충돌구가 있다. 예컨대 러시아의 카멘스크 충돌구(지름 25km)는 구세프 충돌구(폭 3km, 동일 연대)와 짝을 이룬다. 이런 쌍둥이는 서로 멀리 떨어진 두 소행성이 거의 <em>동시에<\/em> 지구에 충돌할 때 생기므로, 이것이 비교적 자주 나타난다는 사실은 <em>공전 동반(co-orbiting) 소행성<\/em>이 상당수 존재한다는 증거가 된다. 다른 암석 행성도 공전 동반 소행성의 충돌을 받을까? 금성은 표면이 젊고 침식이 거의 없으며 충돌구 수가 지구보다 훨씬 많으면서도 우연히 짝처럼 보이는 조합이 생길 확률이 높을 만큼 많지는 않아, 쌍둥이를 찾기에 유망한 행성이다. <span class=\"highlighted\">연구자들은 금성의 쌍둥이 충돌구 비율이 지구보다 유의하게 작다는 것을 발견했다.<\/span> 그러나(However) 금성의 더 짙은 대기가 일부 소행성 쌍 중 <em>더 작은<\/em> 쪽을 걸러낼(screen out) 수 있다. 만약 지구에도 비슷한 차단 효과가 있었다면 알려진 쌍둥이 3개 중 1개만 형성되었을 것이고, 그러면 지구의 쌍둥이 비율(3.6%)은 불확실성 범위 내에서 금성(2.2%)과 같아진다. 연구자들은 공전 동반 소행성이 근지구 소행성 개체군과 근금성 소행성 개체군 <em>양쪽 모두에서 흔할 것이 틀림없다<\/em>고 결론지었다.<\/p>", "strat": "<p><b>질문 2 — 유형 RC-03<\/b><\/p><ul><li>1단락(FAC3·5): 지구 쌍둥이 충돌구 → 공전 동반 소행성 존재 근거.<\/li><li>2단락: 금성 검증 → <em>겉보기 불일치<\/em>(금성 쌍둥이 비율이 더 작음) 발견 → <code>However<\/code> 대기 차단 효과로 <em>불일치 해소<\/em> → 결론(양쪽 다 흔함).<\/li><\/ul>", "correct": "<ul><li>신호: <code>The author would be most likely to agree that the finding … is<\/code>(질문) → 저자가 어떻게 평가할지(동의/판단, →RC-03). 본문 강조 문장(금성 비율이 더 작다)에 대한 저자 태도.<\/li><li><b>정답 E<\/b>: 저자는 <code>However<\/code> 이후 금성 <em>대기의 차단 효과<\/em>로 그 작은 비율을 설명한다. 즉 \"금성 <em>대기<\/em>의 어떤 특성을 고려하면 <em>설명 가능<\/em>(explicable).\" 본문 논지 그대로.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(금성 <em>표면<\/em> 특성 때문에 <em>놀랍지 않다<\/em> — 설명 요인은 표면이 아니라 <em>대기<\/em>) / B(연구 방법이 의심스럽다 — 저자는 방법을 의심하지 않음) / C(크기 때문에 <em>수상하다<\/em> — 아님) / D(금성 <em>대기 속 공전 소행성 수<\/em> 때문에 예상됨 — 본문 왜곡; 대기 속 소행성 수 얘기 아님).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>doublet<\/td><td>n.<\/td><td>쌍둥이(짝을 이룬 것)<\/td><td>pair<\/td><td>(거만어 외) 본문 핵심어<\/td><\/tr><tr><td>co-orbiting<\/td><td>adj.<\/td><td>함께 공전하는<\/td><td>—<\/td><td>(거만어 외) 본문 핵심어<\/td><\/tr><tr><td>terrestrial<\/td><td>adj.<\/td><td>지구의, 육지의<\/td><td>earthly<\/td><td>본문<\/td><\/tr><tr><td>erosion<\/td><td>n.<\/td><td>침식, 부식<\/td><td>weathering, wearing away<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>screen out<\/td><td>v.<\/td><td>걸러내다, 차단하다<\/td><td>filter out, block<\/td><td>(거만어 외) 본문(설명 단서)<\/td><\/tr><tr><td>simultaneously<\/td><td>adv.<\/td><td>동시에<\/td><td>concurrently<\/td><td>(거만어 외) 본문<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q9": {"html": true, "interp": "<p>지구의 충돌구 형성(cratering)이 보이는 한 가지 특징은 <em>쌍둥이 충돌구(doublet craters)<\/em>의 존재다. 지구의 큰 충돌구 28개(지름 20km 초과) 중 3개에 짝 충돌구가 있다. 예컨대 러시아의 카멘스크 충돌구(지름 25km)는 구세프 충돌구(폭 3km, 동일 연대)와 짝을 이룬다. 이런 쌍둥이는 서로 멀리 떨어진 두 소행성이 거의 <em>동시에<\/em> 지구에 충돌할 때 생기므로, 이것이 비교적 자주 나타난다는 사실은 <em>공전 동반(co-orbiting) 소행성<\/em>이 상당수 존재한다는 증거가 된다. 다른 암석 행성도 공전 동반 소행성의 충돌을 받을까? 금성은 표면이 젊고 침식이 거의 없으며 충돌구 수가 지구보다 훨씬 많으면서도 우연히 짝처럼 보이는 조합이 생길 확률이 높을 만큼 많지는 않아, 쌍둥이를 찾기에 유망한 행성이다. <span class=\"highlighted\">연구자들은 금성의 쌍둥이 충돌구 비율이 지구보다 유의하게 작다는 것을 발견했다.<\/span> 그러나(However) 금성의 더 짙은 대기가 일부 소행성 쌍 중 <em>더 작은<\/em> 쪽을 걸러낼(screen out) 수 있다. 만약 지구에도 비슷한 차단 효과가 있었다면 알려진 쌍둥이 3개 중 1개만 형성되었을 것이고, 그러면 지구의 쌍둥이 비율(3.6%)은 불확실성 범위 내에서 금성(2.2%)과 같아진다. 연구자들은 공전 동반 소행성이 근지구 소행성 개체군과 근금성 소행성 개체군 <em>양쪽 모두에서 흔할 것이 틀림없다<\/em>고 결론지었다.<\/p>", "strat": "<p><b>질문 3 — 유형 RC-02<\/b><\/p><ul><li>1단락(FAC3·5): 지구 쌍둥이 충돌구 → 공전 동반 소행성 존재 근거.<\/li><li>2단락: 금성 검증 → <em>겉보기 불일치<\/em>(금성 쌍둥이 비율이 더 작음) 발견 → <code>However<\/code> 대기 차단 효과로 <em>불일치 해소<\/em> → 결론(양쪽 다 흔함).<\/li><\/ul>", "correct": "<ul><li>신호: <code>Which of the following can be inferred from the passage about the asteroid pairs that created the three … doublets on Earth<\/code>(질문) → 추론.<\/li><li><b>정답 D<\/b>: 본문 \"지구에 금성 같은 차단 효과가 있었다면 3개 중 <em>1개만<\/em> 형성됐을 것\" → 나머지 <em>2개<\/em>는 작은 쪽 소행성이 차단 효과를 <em>못 견뎠을(걸러졌을)<\/em> 것. \"두 쌍에서 적어도 하나의 소행성은 금성 대기 같은 차단을 <em>견디지 못했을<\/em> 것.\" 본문 가정의 직접 함의.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(적어도 두 쌍에서 <em>둘 다<\/em> 큰 충돌구를 낼 만큼 컸다 — 본문은 작은 쪽이 걸러진다고 함) / B(한 쌍만 큰 소행성 보유 — 근거 없음) / C(두 쌍만 크기가 비슷 — 근거 없음) / E(두 쌍에서 <em>둘 다<\/em> 차단을 견뎠을 것 — D와 정반대).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>doublet<\/td><td>n.<\/td><td>쌍둥이(짝을 이룬 것)<\/td><td>pair<\/td><td>(거만어 외) 본문 핵심어<\/td><\/tr><tr><td>co-orbiting<\/td><td>adj.<\/td><td>함께 공전하는<\/td><td>—<\/td><td>(거만어 외) 본문 핵심어<\/td><\/tr><tr><td>terrestrial<\/td><td>adj.<\/td><td>지구의, 육지의<\/td><td>earthly<\/td><td>본문<\/td><\/tr><tr><td>erosion<\/td><td>n.<\/td><td>침식, 부식<\/td><td>weathering, wearing away<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>screen out<\/td><td>v.<\/td><td>걸러내다, 차단하다<\/td><td>filter out, block<\/td><td>(거만어 외) 본문(설명 단서)<\/td><\/tr><tr><td>simultaneously<\/td><td>adv.<\/td><td>동시에<\/td><td>concurrently<\/td><td>(거만어 외) 본문<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q10": {"html": true, "interp": "<p>일부 역사가들은 정치적 쿠데타 전후 수십 년 사이의 단절을 과장해 왔다(overstated / exaggerated). 정작 그 쿠데타가 사회적·경제적으로 상당한 연속성이 유지되던 20년의 한가운데 일어났다는 사실은 무시한 것이다.<\/p><p><b>해석 노트:<\/b> «disjunction»은 전후 시대가 이어지지 않는다는 역사적 평가를 가리키므로 ‘단절’로 옮겼다. «continuity»는 모든 것이 똑같았다는 뜻보다 흐름이 이어졌다는 뜻이므로 ‘연속성’으로 번역했다. «fell in the middle»은 쿠데타의 발생 시점을 나타내므로 ‘한가운데 일어났다’로 풀었다.<\/p>", "strat": "<p>빈칸 자체보다 <b>목적어와 뒤의 설명<\/b>에서 방향을 잡는다.<\/p><ol><li><b>5 Zones — 목적어 확인:<\/b> 빈칸의 목적어는 «the disjunction», 즉 ‘단절’이다. 역사가들이 쿠데타 전후의 단절을 어떻게 평가했는지가 핵심이다.<\/li><li><b>분사구문의 설명:<\/b> 콤마 뒤 «ignoring the fact that»는 앞선 평가가 어떤 사실을 무시했는지 설명하는 trigger-03이다. 무시한 사실은 쿠데타 전후를 아우르는 20년 동안 «considerable social and economic continuity», 즉 <b>상당한 사회적·경제적 연속성<\/b>이 있었다는 것이다.<\/li><li><b>SE 짝 논리:<\/b> 연속성이 상당했는데 이를 무시하고 단절을 부각했다면, 단절을 <b>실제보다 크게 말했다<\/b>는 방향이다. 따라서 ‘과장했다’는 뜻의 <b>overstated–exaggerated<\/b>가 같은 의미의 문장을 만든다.<\/li><\/ol><p>논문에 쓸 수 있는 주장으로 정리하면, <b>일부 역사가들은 쿠데타를 가로질러 유지된 연속성을 간과하여 전후의 단절을 과장했다<\/b>는 비판이다.<\/p>", "correct": "<ul><li><b>overstated<\/b>(과장했다): 상당한 연속성을 무시하고 전후의 단절을 실제보다 크게 서술했다는 비판에 맞는다.<\/li><li><b>exaggerated<\/b>(과장했다): 단절의 정도를 부풀렸다는 뜻으로, <b>overstated<\/b>와 같은 의미의 문장을 완성한다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>«Some historians have <b>overstated<\/b> the disjunction between the decades preceding and the ones following the political coup, ignoring the fact that the coup fell in the middle of a twenty-year period of considerable social and economic continuity.»<\/p><p>«Some historians have <b>exaggerated<\/b> the disjunction between the decades preceding and the ones following the political coup, ignoring the fact that the coup fell in the middle of a twenty-year period of considerable social and economic continuity.»<\/p>", "wrong": "<ul><li><b>questioned<\/b>(의문을 제기했다): 단절에 의문을 제기하는 것은 오히려 연속성을 인정하는 방향이다. 연속성을 무시했다는 뒤의 설명과 맞지 않는다.<\/li><li><b>misjudged<\/b>(잘못 판단했다): ★가장 매력적인 오답. 역사가들의 평가가 잘못되었다는 점에는 맞지만, 판단이 <b>단절을 과장하는 방향<\/b>으로 잘못되었다는 핵심을 특정하지 못한다. 정답 두 단어와 같은 의미도 아니다.<\/li><li><b>misinterpreted<\/b>(잘못 해석했다): 해석의 오류를 넓게 나타낼 뿐, 단절의 정도를 실제보다 크게 평가했다는 뜻까지 담지는 않는다.<\/li><li><b>overlooked<\/b>(간과했다): 목적어인 ‘단절’을 간과했다는 뜻이 된다. 문장이 지적하는 것은 <b>연속성을 무시하여 단절을 과장한 것<\/b>이므로 방향이 맞지 않는다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>overstated<\/td><td>동사·과거분사<\/td><td>실제보다 크게 서술한, 과장한<\/td><td>exaggerated<\/td><td>(거만어 외)<\/td><\/tr><tr><td>exaggerated<\/td><td>동사·과거분사<\/td><td>정도를 부풀린, 과장한<\/td><td>overstated<\/td><td>(거만어 외)<\/td><\/tr><tr><td>questioned<\/td><td>동사·과거분사<\/td><td>의문을 제기한<\/td><td>challenged<\/td><td>(거만어 외)<\/td><\/tr><tr><td>misjudged<\/td><td>동사·과거분사<\/td><td>잘못 판단한<\/td><td>assessed incorrectly<\/td><td>(거만어 외)<\/td><\/tr><tr><td>misinterpreted<\/td><td>동사·과거분사<\/td><td>잘못 해석한<\/td><td>misconstrued<\/td><td>(거만어 외)<\/td><\/tr><tr><td>overlooked<\/td><td>동사·과거분사<\/td><td>간과한, 놓친<\/td><td>missed<\/td><td>(거만어 외)<\/td><\/tr><tr><td>disjunction<\/td><td>명사<\/td><td>단절, 분리<\/td><td>separation, discontinuity<\/td><td>거만어<\/td><\/tr><tr><td>considerable<\/td><td>형용사<\/td><td>상당한<\/td><td>substantial, significant<\/td><td>거만어<\/td><\/tr><tr><td>continuity<\/td><td>명사<\/td><td>연속성, 이어짐<\/td><td>connectedness, persistence<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q11": {"html": true, "interp": "<p>전통적인 중국 사학(historiography)은 겉으로는 사건을 중립적으로 기술했지만, 초기 역사가들이 편향(tendentiousness)을 늘 삼갔던(eschew) 것은 아니어서, 때로는 자신들이 다룬 역사적 인물에 대해 도덕적 판단을 내리곤 했다.<\/p><p><b>해석 노트:<\/b> eschew는 의식적으로 멀리한다는 뜻이라 '삼가다'로 옮겼고, not always는 전면 부정으로 읽히지 않도록 '늘 ~했던 것은 아니어서'라는 부분부정 어법으로 살렸다. ostensibly는 표면과 실상의 대비를 예고하는 말이므로 '겉으로는'을 앞세워 뒤 절과 맞세웠다. tendentiousness는 특정 입장으로 기우는 성향을 가리키므로 '편파'보다 '편향'이 담백하다. sometimes offering이 담은 반복적인 상(相)은 '~하곤 했다'로 처리했다. 다른 정답 forgo를 넣어도 '할 수 있는 것을 하지 않고 두다'라는 같은 방향의 뜻이 된다.<\/p>", "strat": "<p><code>While<\/code>(trigger-10 역접) + <code>ostensibly<\/code>(trigger-13 \"겉보기엔 — 사실은 아닌\")가 골격. \"겉으로는 중립 ↔ 실은 편향(도덕 판단)\"의 대조.<\/p><ul><li>앞: \"겉으로는 <em>중립<\/em>.\" 뒤: 그러나 늘 편향을 ___한 건 아님 + \"때로 도덕 판단을 함\"(=편향을 드러냄). 즉 \"편향을 <em>피한<\/em> 것은 아니다 = 편향을 안고 갔다\"가 되어야 뒷부분(도덕 판단)과 일치.<\/li><li>따라서 빈칸 = \"피하다/삼가다\". <code>did not always eschew<\/code>(늘 피한 건 아니다) = 때로 편향을 <em>드러냈다<\/em>. SE 동의어 쌍 → <code>eschew<\/code>(피하다, 삼가다)·<code>forgo<\/code>(포기·자제하다).<\/li><\/ul>", "correct": "<ul><li><b>eschew(피하다, 삼가다)<\/b> / <b>forgo(자제·포기하다)<\/b> — 둘 다 \"(편향을) <em>멀리하다<\/em>.\" not always + (eschew/forgo) = \"늘 피하진 않았다 → 때로 편향됨.\" 뒤의 \"도덕 판단\"과 호응.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>While traditional Chinese historiography ostensibly described events in a neutral manner, early historians did not always <b>eschew<\/b> tendentiousness, sometimes offering moral judgments about the historical figures they discussed.<\/p>", "wrong": "<ul><li><b>denounce(비난하다)·descry(발견하다)<\/b> — \"편향을 <em>비난/발견<\/em>하지 않았다\"는 문맥(스스로 편향됨)과 안 맞고 pair도 약함.<\/li><li><b>defend(옹호하다)·justify(정당화하다)<\/b> — \"편향을 <em>옹호/정당화<\/em>하지 않았다\"는 \"때로 도덕 판단(편향)을 드러냄\"과 <em>반대<\/em> 방향(옹호 안 함 = 편향 안 함)이 되어 <code>While<\/code>/뒷절과 모순.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>eschew<\/td><td>v.<\/td><td>피하다, 삼가다<\/td><td>shun, avoid<\/td><td><\/td><\/tr><tr><td>forgo<\/td><td>v.<\/td><td>포기·자제하다<\/td><td>relinquish, abstain from<\/td><td><\/td><\/tr><tr><td>tendentiousness<\/td><td>n.<\/td><td>편향성, 당파성<\/td><td>bias, partiality<\/td><td>(거만어 외)<\/td><\/tr><tr><td>denounce<\/td><td>v.<\/td><td>비난·고발하다<\/td><td>condemn, decry<\/td><td><\/td><\/tr><tr><td>descry<\/td><td>v.<\/td><td>(멀리 있는 것을) 발견하다<\/td><td>discern, espy<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q12": {"html": true, "interp": "<p>사람들이 히메네스에게서 보는 것은, 그가 결단력 있게 이끌 줄 아는 유일한 후보라는 점이다. 재임 시절 내내 <b>갈팡질팡<\/b>으로 얼룩졌던 디아스와는 너무도 대비되는 대목이다.<\/p><p><b>해석 노트:<\/b> irresolution을 '우유부단'으로 옮겨도 되지만, 팀 전체의 일 처리를 말하는 자리이므로 움직임이 보이는 '갈팡질팡'으로 했다. <code>marred by<\/code>는 '~로 손상된'이 직역이나 흠집이 남았다는 결이 살도록 '~으로 얼룩졌던'으로 받았다. <code>in stark contrast to<\/code>의 stark는 대비의 날카로움이므로 '너무도 대비되는'으로 강조했다. <code>capable of decisive leadership<\/code>은 명사구를 풀어 '결단력 있게 이끌 줄 아는'으로 동사화했다.<\/p>", "strat": "<p>SE — 한 빈칸에 넣어 같은 뜻이 되는 두 단어를 고른다. <b><code>in stark contrast to<\/code>가 반대말을 요구한다<\/b>(trigger-10 대조).<\/p><ul><li>대비의 한쪽: <code>the one candidate capable of <b>decisive<\/b> leadership<\/code> — <b>결단력 있는<\/b> 지도력.<\/li><li><code>in stark contrast to Diaz, whose team … has been <b>marred by<\/b> 빈칸<\/code> — 디아스 쪽은 그 반대다.<\/li><li>빈칸 = <b>decisive의 반대<\/b> = <b>결단을 못 내림<\/b> → <b>irresolution / vacillation<\/b>.<\/li><\/ul><p><b>대비되는 항이 무엇인지 정확히 못 박는 것이 전부다.<\/b> 여기서 맞세워진 것은 <b>«지도력의 결단성»<\/b>이다. 인물의 도덕성도, 성격의 거칠기도 아니다.<\/p><p>★<b>최대 함정은 <code>belligerence<\/code>–<code>pugnacity<\/code> 짝이다.<\/b> 둘 다 «호전성»이라 <b>짝 검사를 통과<\/b>하고, 정치 문맥에서 상대 후보를 깎는 말로도 자연스럽다. 그러나 <b>축이 다르다<\/b> — 호전성의 반대는 «온건함»이지 «결단력»이 아니다. 오히려 호전적인 사람은 결단이 빠른 쪽에 가까워, 대비가 아니라 <b>같은 편<\/b>이 되어 버린다.<\/p><ul><li><b>요령: 대조 문제에서는 «무엇의 반대인가»를 한 낱말로 적어 둔다.<\/b> 여기서는 <code>decisive<\/code> 하나다.<\/li><\/ul><p>★<b>두 번째 함정은 <code>corruption<\/code>(부패)다.<\/b> <code>marred by<\/code>(~으로 얼룩진)라는 표현과 아주 잘 붙고, 정치인 팀을 두고 하는 말로 가장 흔하다. 그러나 <b>부패의 반대는 청렴이지 결단력이 아니고<\/b>, 무엇보다 <b>짝이 없다.<\/b><\/p><p>★<b><code>defensiveness<\/code>(방어적 태도)<\/b>는 «결단 못 함»과 결이 닿을 듯하지만 초점이 다르고(비판에 움츠러드는 태도) 짝도 없다.<\/p><p>★<b><code>irresolution<\/code>과 <code>vacillation<\/code>의 결<\/b> — irresolution은 «결단을 못 내리는 상태», vacillation은 «이랬다저랬다 흔들림»으로 초점이 조금 다르지만, <b><code>decisive<\/code>의 반대라는 한 축<\/b>에 나란히 선다. SE는 완전한 동의어가 아니라 <b>같은 축의 짝<\/b>을 요구한다.<\/p>", "correct": "<ul><li><b>irresolution(결단 못 함)<\/b> + <b>vacillation(갈팡질팡, 흔들림)<\/b>: 둘 다 «decisive의 반대»라는 축. <code>in stark contrast to<\/code>가 요구하는 대척점을 정확히 채운다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>What they see in Jimenez is the one candidate capable of decisive leadership, in stark contrast to Diaz, whose team in office has been marred by <b>irresolution<\/b>.<\/p>", "wrong": "<ul><li><b>belligerence(호전성)<\/b> + <b>pugnacity(싸우려 드는 성질)<\/b>: 짝이자 최대 함정. 그러나 축이 다르고(온건함의 반대), 오히려 결단성 쪽에 가까워 대비가 무너진다.<\/li><li><b>corruption(부패)<\/b>: <code>marred by<\/code>와 잘 붙고 정치 문맥에도 맞지만 <b>짝이 없고<\/b> <code>decisive<\/code>의 반대도 아니다.<\/li><li><b>defensiveness(방어적 태도)<\/b>: 초점이 다르고 짝이 없다.<\/li><li>★<b>SE 함정 정리<\/b> — 이 문제는 «정치 문맥에서 흔한 비난»(부패·호전성)을 미끼로 깔아 두었다. 지문이 맞세운 낱말은 <b><code>decisive<\/code> 하나<\/b>이며, 그 반대만이 답이다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>irresolution<\/td><td>n.<\/td><td>결단하지 못함<\/td><td>indecision, hesitancy<\/td><td>(거만어) 정답<\/td><\/tr><tr><td>vacillation<\/td><td>n.<\/td><td>갈팡질팡, 동요<\/td><td>wavering, dithering<\/td><td>vacillate 계열 · 정답<\/td><\/tr><tr><td>belligerence<\/td><td>n.<\/td><td>호전성<\/td><td>pugnacity, aggression<\/td><td>(거만어 외) 오답 — pugnacity와 짝 함정<\/td><\/tr><tr><td>pugnacity<\/td><td>n.<\/td><td>싸우려 드는 성질<\/td><td>combativeness<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>mar<\/td><td>v.<\/td><td>흠집을 내다, 망치다<\/td><td>blemish, tarnish<\/td><td>(거만어)<\/td><\/tr><tr><td>decisive<\/td><td>adj.<\/td><td>결단력 있는<\/td><td>resolute, determined<\/td><td>(거만어 외) ★반대말의 기준항<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q13": {"html": true, "interp": "<p>하루 평균 세 시간 텔레비전을 보는 사람은, 텔레비전을 아주 드물게 보는 사람보다 과체중일 가능성이 <em>두 배<\/em>다. 따라서 하루에 세 시간씩이나 텔레비전을 봄으로써 사람은 과체중이 될 가능성을 <em>높인다<\/em>고 결론지을 수 있다.<\/p><p>(질문: 이 논증은 어떤 근거에서 비판에 취약한가?)<\/p>", "strat": "<p><b>질문 1 — CR-02 오류<\/b><\/p><p>논증(P→Q→R, CR-02 오류): <em>상관<\/em>(TV 시청↔과체중) → <em>인과<\/em>(TV 시청이 과체중을 <em>유발<\/em>)로 비약. 고전적 <b>상관-인과 혼동<\/b>. 숨은 비약: 둘 다를 일으키는 <em>제3의 공통 원인<\/em>이 없다는 가정. q와 r 사이 비약을 공격해야 한다.<\/p>", "correct": "<p>질문 <code>The argument is vulnerable to criticism on the ground that<\/code>(CR-02 오류·비약). 인과 비약을 짚는 보기를 고른다. 오류 찾기는 \"q와 r 사이\"를 공격 — <em>근거만 부정<\/em>하거나 <em>결론만 부정<\/em>하면 오답(CR-02 해법).<\/p><ul><li><b>정답 D — \"<em>신체 운동을 싫어하는 성향<\/em>이 어떤 사람들로 하여금 TV 시청에 시간을 쓰게 <em>하는 동시에<\/em> 과체중이 되게도 만든다는 가능성을 간과한다.\"<\/b><\/li><li>근거: 운동 기피라는 <em>공통 원인(제3 변수)<\/em>이 TV 시청과 과체중을 <em>둘 다<\/em> 일으킨다면, TV 시청이 과체중의 <em>원인<\/em>이라는 인과는 무너진다(상관일 뿐). 상관-인과 비약을 정확히 공격.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b><\/li><li>A \"과체중이 사람을 TV 보게 <em>만든다<\/em>고 전제한다\" — 인과의 <em>역방향<\/em>을 <em>지적<\/em>하는 게 아니라 \"전제한다\"고 하는데, 논증은 그렇게 전제하지 않음(서술 부정확). (역인과 가능성은 약점이나, 보기 문구가 논증이 그것을 <em>take for granted<\/em>한다고 잘못 기술.)<\/li><li>B \"세 시간 이상 보는 사람은 아무도 규칙적 운동을 안 한다고 전제\" — 논증이 그렇게까지 단정하지 않음(과한 귀속).<\/li><li>C \"세 시간 보는 사람이 <em>직장에서<\/em> 신체활동적일 가능성 간과\" — 일부 약점이나, 공통 원인(D)만큼 인과 비약을 직접 무너뜨리지 못함(개별 반례 수준).<\/li><li>E \"과체중인데 TV를 전혀 안 보는 사람도 있다는 가능성 간과\" — 결론(시청→과체중 <em>증가<\/em>)을 직접 반박 못 함(TV 외 다른 과체중 경로의 존재는 인과를 부정하지 않음).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>predispose<\/td><td>v.<\/td><td>(~하기) 쉽게 만들다, 성향을 갖게 하다<\/td><td>incline, make prone<\/td><td>(거만어 외) A \"predisposes … to watch\"<\/td><\/tr><tr><td>overlook<\/td><td>v.<\/td><td>간과하다<\/td><td>disregard, neglect<\/td><td>(거만어 외) 오류 지적 보기 상투어<\/td><\/tr><tr><td>take for granted<\/td><td>phr.<\/td><td>당연하게 여기다, (암묵적으로) 전제하다<\/td><td>assume, presuppose<\/td><td>(거만어 외) A·B 보기<\/td><\/tr><tr><td>correlation<\/td><td>n.<\/td><td>상관관계<\/td><td>association<\/td><td>(거만어 외) 이 문제의 핵심 함정(상관≠인과)<\/td><\/tr><tr><td>overweight<\/td><td>adj.<\/td><td>과체중의<\/td><td>obese, heavy<\/td><td>(거만어 외) 결론 소재<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q14": {"html": true, "interp": "<p>Leeming은 James Baldwin 전기에서 Baldwin 주요 문학작품의 <b>사회정치적·경제적·문화적 의의<\/b>를 대체로 분석하며, 몇몇 작품 제목을 장(章) 제목으로 쓰기까지 한다. 이런 <b>미덕(meritorious features)<\/b>에도 불구하고, 이 책은 Baldwin의 저작을 <b>고르지 못하게 다룬(uneven treatment)<\/b> 탓에 다소 흠이 있다. 예컨대 <em>The Fire Next Time<\/em>은 지난 반세기 최고의 에세이 중 하나로 널리, 그리고 <b>온당하게(appropriately)<\/b> 인정받아 왔다. 그러나 Leeming은 분석적·해석적 논의 대신 인용문과 풀어 쓴 대목을 이어 붙인 <b>요약(summary)<\/b>만 내놓는다. 반면 그는 희곡 <em>Blues for Mister Charlie<\/em>에는 훨씬 더 많은 시간과 지면을 쓰는데, 정작 Baldwin은 혁신적이고 비중 있는 <b>극작가(dramatist)<\/b>라는 명성을 널리 누리지는 못한다.<\/p>", "strat": "<p><b>질문 1 — 추론 RC-02<\/b><\/p><p><b>주제 문장 = S2<\/b> «In spite of these meritorious features, the book suffers somewhat from an uneven treatment of Baldwin's writing.» — S1 장점 인정 → S2(그럼에도 이 전기는 볼드윈의 작품을 고르지 않게 다룬다)가 제목 — S3~S5가 예시(에세이 요약만, 희곡에 과다)로 뒷받침한다. 요약 = 리밍의 볼드윈 전기가 작품을 고르지 않게 다룬다는 글(S2) — 장점(S1)에도 불구하고, 대표 에세이는 요약만 하고(S3·S4) 희곡에 지나치게 할애한다(S5).<\/p><p>첫 문장에서 저자는 전기의 장점(작품의 의의 분석)을 인정한 뒤, <code>In spite of<\/code>로 전환해 <b>핵심 논지 = '고르지 못한 다룸(uneven treatment)'이라는 결점<\/b>을 제시한다. 이어지는 두 예시는 대비 구조다: (1) 통념상 최고 평가를 받는 에세이 <em>The Fire Next Time<\/em>에는 분석 없이 요약만 → 홀대. (2) 저자가 극작가로 평판이 없는 <em>Blues for Mister Charlie<\/em>에는 오히려 더 많은 지면 → 과잉. 즉 <b>작품의 통념적 중요도와 Leeming이 부여한 관심의 양이 역방향으로 어긋난 것<\/b>이 '고르지 못함'의 정체다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: uneven treatment를 주어로 셋째~다섯째 문장의 두 예시를 종합한다 — 높이 평가받는 에세이는 요약만, 극작가로 명성 없는 작가의 희곡엔 지면 과다. 두 예시를 함께 설명하는 «관심의 양과 통념적 평가의 어긋남» 범위에서 비약 없는 보기를 고른다.<\/li><\/ul><p>두 예시를 종합해 '고르지 못한 다룸'의 함의를 추론하는 문제. 신호어는 문맥의미(RC-09)에 가깝게 보이나, 정답이 단어 치환이 아니라 지문 논리의 종합적 해석이므로 내용상 추론(RC-02)이다.<\/p><ul><li><b>정답(B)<\/b>: \"Leeming이 특정 작품에 쏟는 관심이 그 작품에 대한 통념적 평가와 뚜렷이 대비된다.\" → 대작 에세이엔 홀대, 평판 낮은 희곡엔 과잉이라는 두 예시가 정확히 이 대비를 말한다.<\/li><\/ul>", "wrong": "<ul><li><b>오답(A)<\/b>: Leeming이 '다른 작가'에게 적용한 기준과 다르다? 지문에 타 작가 비교가 전혀 없다(범위 이탈).<\/li><li><b>오답(C)<\/b>: 문학적 가치보다 사회정치적 의의에 더 관심? 사회정치적 분석은 첫 문장에서 '미덕'으로 언급된 것이지 '고르지 못함'의 내용이 아니다(대상 혼동).<\/li><li><b>오답(D)<\/b>: 짧은 작품엔 과도한 지면, 긴 작품엔 홀대? 대비의 축은 작품의 '길이'가 아니라 '평판/중요도'다. 에세이 대 희곡을 길이로 왜곡함.<\/li><li><b>오답(E)<\/b>: 극작(dramatic works)을 분석 대신 요약하는 데 더 많은 지면? 요약만 받은 것은 극작이 아니라 에세이 <em>The Fire Next Time<\/em>이다. 주체를 뒤바꿈.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>meritorious<\/td><td>adj.<\/td><td>칭찬받을 만한, 훌륭한<\/td><td>praiseworthy, commendable<\/td><td>첫 대비의 '장점' 신호<\/td><\/tr><tr><td>inordinate<\/td><td>adj.<\/td><td>과도한, 지나친<\/td><td>excessive, immoderate<\/td><td>오답 D의 함정어<\/td><\/tr><tr><td>uneven<\/td><td>adj.<\/td><td>고르지 못한, 불균등한<\/td><td>inconsistent, unequal<\/td><td>문제의 핵심 표현<\/td><\/tr><tr><td>paraphrase<\/td><td>n./v.<\/td><td>부연·바꿔 말하기<\/td><td>rewording, restatement<\/td><td>요약의 구성요소<\/td><\/tr><tr><td>substantial<\/td><td>adj.<\/td><td>비중 있는, 상당한<\/td><td>considerable, weighty<\/td><td>극작가 평판 서술<\/td><\/tr><tr><td>acknowledge<\/td><td>v.<\/td><td>인정하다<\/td><td>recognize, concede<\/td><td>에세이 평가의 정당성<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q15": {"html": true, "interp": "<p>Leeming은 James Baldwin 전기에서 Baldwin 주요 문학작품의 <b>사회정치적·경제적·문화적 의의<\/b>를 대체로 분석하며, 몇몇 작품 제목을 장(章) 제목으로 쓰기까지 한다. 이런 <b>미덕(meritorious features)<\/b>에도 불구하고, 이 책은 Baldwin의 저작을 <b>고르지 못하게 다룬(uneven treatment)<\/b> 탓에 다소 흠이 있다. 예컨대 <em>The Fire Next Time<\/em>은 지난 반세기 최고의 에세이 중 하나로 널리, 그리고 <b>온당하게(appropriately)<\/b> 인정받아 왔다. 그러나 Leeming은 분석적·해석적 논의 대신 인용문과 풀어 쓴 대목을 이어 붙인 <b>요약(summary)<\/b>만 내놓는다. 반면 그는 희곡 <em>Blues for Mister Charlie<\/em>에는 훨씬 더 많은 시간과 지면을 쓰는데, 정작 Baldwin은 혁신적이고 비중 있는 <b>극작가(dramatist)<\/b>라는 명성을 널리 누리지는 못한다.<\/p>", "strat": "<p><b>질문 2 — 동의비동의 RC-03<\/b><\/p><p><b>주제 문장 = S2<\/b> «In spite of these meritorious features, the book suffers somewhat from an uneven treatment of Baldwin's writing.» — S1 장점 인정 → S2(그럼에도 이 전기는 볼드윈의 작품을 고르지 않게 다룬다)가 제목 — S3~S5가 예시(에세이 요약만, 희곡에 과다)로 뒷받침한다. 요약 = 리밍의 볼드윈 전기가 작품을 고르지 않게 다룬다는 글(S2) — 장점(S1)에도 불구하고, 대표 에세이는 요약만 하고(S3·S4) 희곡에 지나치게 할애한다(S5).<\/p><p>첫 문장에서 저자는 전기의 장점(작품의 의의 분석)을 인정한 뒤, <code>In spite of<\/code>로 전환해 <b>핵심 논지 = '고르지 못한 다룸(uneven treatment)'이라는 결점<\/b>을 제시한다. 이어지는 두 예시는 대비 구조다: (1) 통념상 최고 평가를 받는 에세이 <em>The Fire Next Time<\/em>에는 분석 없이 요약만 → 홀대. (2) 저자가 극작가로 평판이 없는 <em>Blues for Mister Charlie<\/em>에는 오히려 더 많은 지면 → 과잉. 즉 <b>작품의 통념적 중요도와 Leeming이 부여한 관심의 양이 역방향으로 어긋난 것<\/b>이 '고르지 못함'의 정체다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: agree의 주어는 저자다. 저자가 두 작품을 어떻게 평가하는지 — 에세이는 반세기 최고 중 하나, 희곡은 극작가로서 명성 없음 — 를 찾아 그 평가 방향과 일치하는 진술을 고른다.<\/li><\/ul><p>저자가 동의할 진술을 고르는 문제. 저자의 평가 방향을 지문에서 판정한다.<\/p><ul><li><b>정답(A)<\/b>: \"<em>Blues for Mister Charlie<\/em>는 <em>The Fire Next Time<\/em>보다 덜 중요한 작품이다.\" → 에세이는 '반세기 최고 에세이 중 하나'(온당한 평가), 희곡은 '극작가로서 명성 없음'. 저자가 에세이를 더 높이 두므로 동의.<\/li><\/ul>", "wrong": "<ul><li><b>오답(B)<\/b>: Baldwin이 에세이스트보다 극작가로 더 영향력? 지문은 정반대(극작가 평판 없음)를 말한다.<\/li><li><b>오답(C)<\/b>: 에세이스트로서의 명성이 실제 질에 비해 과대? 지문은 그 평가가 'appropriately(온당하게)' 이뤄졌다고 하여 명성이 정당함을 지지한다. 반대.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>meritorious<\/td><td>adj.<\/td><td>칭찬받을 만한, 훌륭한<\/td><td>praiseworthy, commendable<\/td><td>첫 대비의 '장점' 신호<\/td><\/tr><tr><td>inordinate<\/td><td>adj.<\/td><td>과도한, 지나친<\/td><td>excessive, immoderate<\/td><td>오답 D의 함정어<\/td><\/tr><tr><td>uneven<\/td><td>adj.<\/td><td>고르지 못한, 불균등한<\/td><td>inconsistent, unequal<\/td><td>문제의 핵심 표현<\/td><\/tr><tr><td>paraphrase<\/td><td>n./v.<\/td><td>부연·바꿔 말하기<\/td><td>rewording, restatement<\/td><td>요약의 구성요소<\/td><\/tr><tr><td>substantial<\/td><td>adj.<\/td><td>비중 있는, 상당한<\/td><td>considerable, weighty<\/td><td>극작가 평판 서술<\/td><\/tr><tr><td>acknowledge<\/td><td>v.<\/td><td>인정하다<\/td><td>recognize, concede<\/td><td>에세이 평가의 정당성<\/td><\/tr><\/table>", "uncertain": false}}, "source": "GRE Verbal Vault · 최근 1년(2025-11~2026-10) Part별 출제 점유 배분 · ETS 순서"};

const TYPE_LABELS={CR:'Critical Reasoning',RC_SINGLE:'Reading Comprehension',RC_MULTI:'Reading Comprehension',RC_SELECT:'Reading Comprehension',TC:'Text Completion',SE:'Sentence Equivalence'};
const ROMAN={i:'(i)',ii:'(ii)',iii:'(iii)'};
const CODE_API='';
const CODE_ALPHABET='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const state={screen:'start',sectionIdx:0,questionIdx:0,answers:{},timer:null,timeRemaining:0,sectionLocked:[],timerExpired:[],endExpired:false,expanded:{},marked:{},save:null};

function curSection(){return examData.sections[state.sectionIdx];}
function curQ(){return curSection().questions[state.questionIdx];}
function totalQ(){return examData.sections.reduce((s,x)=>s+x.questions.length,0);}
function fmt(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function isAnswered(id){const a=state.answers[id];return Array.isArray(a)&&a.filter(x=>x!==undefined&&x!=='').length>0;}
function arrEq(a,b){if(!a||!b||a.length!==b.length)return false;const x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i]);}
function normSent(s){if(typeof s!=='string')return '';return s.replace(/<[^>]+>/g,' ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();}
const _ABBR=['Mr.','Mrs.','Ms.','Dr.','St.','Jr.','Sr.','vs.','etc.','e.g.','i.e.','U.S.','U.K.','No.','Prof.','Inc.','Ltd.','Co.'];
function splitSentences(text){let t=text;_ABBR.forEach((a,i)=>{t=t.split(a).join('__A'+i+'__');});t=t.replace(/([A-Z])\.(?=\s[A-Z])/g,'$1__D__');
  return t.split(/(?<=[.!?])\s+(?=[A-Z"“(])/).map(p=>{let s=p;_ABBR.forEach((a,i)=>{s=s.split('__A'+i+'__').join(a);});return s.replace(/__D__/g,'.').trim();}).filter(s=>s.length>0);}
function trunc(s,n){s=s||'';return s.length>n?s.slice(0,n)+'…':s;}
function isCorrect(q){const u=state.answers[q.id];if(!isAnswered(q.id))return false;
  if(q.type==='RC_SELECT')return q.answer.length>0&&normSent(u[0])===normSent(q.answer[0]);
  if(q.type==='TC'){if(u.length!==q.answer.length)return false;return u.every((v,i)=>v===q.answer[i]);}
  return arrEq(u.filter(x=>x!==undefined&&x!==''),q.answer);}
function labelText(q,label){
  if(q.type==='TC'){for(const bl of q.blanks){const c=bl.choices.find(c=>c.label===label);if(c)return c.text;}return label;}
  const c=(q.choices||[]).find(c=>c.label===label);return c?c.text:label;}
function myAnswerDisplay(q){const u=state.answers[q.id];if(!isAnswered(q.id))return '<span class="mark-skip">미응답</span>';
  if(q.type==='RC_SELECT')return '“'+trunc(u[0],46)+'”';
  if(q.type==='TC')return u.map(l=>l?labelText(q,l):'—').join(' / ');
  if(q.type==='SE')return u.map(l=>labelText(q,l)).join(', ');
  return u.join(', ');}
function correctDisplay(q){
  if(q.type==='RC_SELECT')return q.answer.length?('“'+trunc(q.answer[0],46)+'”'):'<span class="exp-uncertain">검수 필요</span>';
  if(q.type==='TC'||q.type==='SE')return (q.answerText||q.answer).join(q.type==='TC'?' / ':', ');
  return q.answer.join(', ');}

/* ---- timer ---- */
function startTimer(){if(state.timer)clearInterval(state.timer);state.timeRemaining=curSection().timeLimit*60;state.deadline=Date.now()+state.timeRemaining*1000;updTimer();
  state.timer=setInterval(()=>{state.timeRemaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));updTimer();if(state.timeRemaining<=0){clearInterval(state.timer);state.timer=null;state.timerExpired[state.sectionIdx]=true;onExpire();}},1000);}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null;}}
function updTimer(){const el=document.getElementById('timer');if(el){el.textContent=fmt(Math.max(0,state.timeRemaining));el.classList.toggle('warning',state.timeRemaining<=60);}}
function onExpire(){state.endExpired=true;state.screen='sectionEnd';render();}

/* ---- modal ---- */
function showModal(o){document.getElementById('modal-title').textContent=o.title;document.getElementById('modal-message').innerHTML=o.message;
  const cf=document.getElementById('modal-confirm'),cc=document.getElementById('modal-cancel');
  cf.textContent=o.confirmText||'확인';cc.textContent=o.cancelText||'취소';cc.style.display=o.showCancel===false?'none':'inline-block';
  cf.onclick=()=>{if(o.onConfirm)o.onConfirm();};cc.onclick=()=>{if(o.onCancel)o.onCancel();hideModal();};
  document.getElementById('modal').classList.add('show');}
function hideModal(){document.getElementById('modal').classList.remove('show');}

/* ---- render ---- */
function render(){const app=document.getElementById('app');
  if(state.screen==='start')renderStart(app);
  else if(state.screen==='sectionIntro')renderSectionIntro(app);
  else if(state.screen==='question')renderQuestion(app);
  else if(state.screen==='sectionEnd')renderSectionEnd(app);
  else if(state.screen==='results')renderResults(app);
  else if(state.screen==='review')renderReviewScreen(app);
  if(!state.keepScroll)window.scrollTo(0,0);state.keepScroll=false;}

      ${examData.sections.map(s=>`<div class="row"><span class="k">Section ${s.number}</span><span class="v">${s.questions.length}문항 · ${s.timeLimit}분</span></div>`).join('')}
      ${!examData.diag?`<div class="row"><span class="k">환산 점수(추정)</span><span class="v">round(${sf.multiplier} × 정답수) + ${sf.base}</span></div>`
        :examData.diag.score==='diag'?`<div class="row"><span class="k">진단 점수</span><span class="v">130 + 2 × 정답수 (GRE 점수 예측 아님)</span></div>`
        :`<div class="row"><span class="k">결과</span><span class="v">${totalQ()}문항 중 맞힌 수 · 다시 외울 문항</span></div>`}
    </div>

      <li>${examData.sections.length>1?'각 섹션은 독립 타이머로 진행되며, 섹션을 완료하면 답안을 수정할 수 없습니다.':'제한 시간 안에 풀고, 완료하면 답안을 수정할 수 없습니다.'}</li>
      <li>Sentence Equivalence는 정확히 2개를 선택합니다. 채점 후 문항별 해설을 제공합니다.</li>

function renderSectionIntro(app){const s=curSection();
  app.innerHTML=`<div class="card-center">
    <div class="num">Section ${s.number} of ${examData.sections.length}</div>

  </div>`;}

function renderQuestion(app){const q=curQ(),s=curSection(),tot=s.questions.length;
  const isLast=state.questionIdx===tot-1,pct=((state.questionIdx+1)/tot)*100;
  const isRC=['CR','RC_SINGLE','RC_MULTI','RC_SELECT'].includes(q.type);
  let body='';
  if(q.directions)body+=`<div class="directions">${q.directions}</div>`;
  body+=`<div class="question-text">${q.questionText}</div>`;
  body+=renderChoices(q);
  if(q.type==='SE')body+=`<div class="se-warning" id="se-warning"></div>`;
  app.innerHTML=`<div class="topbar"><div class="topbar-left"><span class="label">Section</span><span class="value">${s.number}</span>
      <span style="margin:0 10px;color:var(--line);">·</span><span class="label">Question</span><span class="value">${state.questionIdx+1} / ${tot}</span></div>
      <div class="tb-right"><button class="tb-btn ${state.marked[q.id]?'marked':''}" onclick="toggleMark()">${state.marked[q.id]?'★ Marked':'☆ Mark'}</button><button class="tb-btn" onclick="openReview()">Review</button><div class="timer" id="timer">${fmt(state.timeRemaining)}</div></div></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <main><div class="question-meta"><span class="qtype">${TYPE_LABELS[q.type]}</span><span>${q.poolId}</span></div>
    ${isRC?`<div class="layout-rc">
        <div class="passage" id="passage-box"><span class="passage-label">${q.rangeLabel||'Passage'}</span>${renderPassageHTML(q)}</div>
        <div class="question-body">${body}</div></div>`
       :`<div class="question-body"><span class="qnum-badge">${q.id.replace('-',' ')}</span>${body}</div>`}
    </main>
    <div class="footer-nav"><div class="nav-group"><button class="btn" onclick="handlePrev()" ${state.questionIdx===0?'disabled':''}>← 이전</button></div>
      <div class="nav-group">${isLast?`<button class="btn btn-finish" onclick="goSectionEnd()">섹션 종료 →</button>`:`<button class="btn btn-primary" onclick="handleNext()">다음 →</button>`}</div></div>`;
  updTimer();attachListeners();}

function mk(){return '<span class="mk"></span>';}
function renderPassageHTML(q){
  if(q.type!=='RC_SELECT')return q.passage.split(/\n\n+/).map(p=>`<p>${p}</p>`).join('');
  const u=state.answers[q.id]||[];const selN=u[0]?normSent(u[0]):null;
  return q.passage.split(/\n\n+/).map(para=>{const ss=splitSentences(para.replace(/<[^>]+>/g,''));
    return '<p>'+ss.map(s=>{const sel=selN&&normSent(s)===selN;return `<span class="sentence ${sel?'sel':''}" tabindex="0" data-text="${s.replace(/"/g,'&quot;')}">${s}</span>`;}).join(' ')+'</p>';}).join('');}
function renderChoices(q){const u=state.answers[q.id]||[];
  if(q.type==='RC_SELECT')
    return `<div class="directions">지문에서 정답에 해당하는 문장을 클릭하세요. (한 문장만 선택)</div>`;
  if(q.type==='CR'||q.type==='RC_SINGLE')
    return `<ul class="choices">${q.choices.map(c=>`<li class="choice oval ${u.includes(c.label)?'selected':''}" data-mode="single" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='RC_MULTI')
    return `<ul class="choices">${q.choices.map(c=>`<li class="choice square ${u.includes(c.label)?'selected':''}" data-mode="multi" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='SE')
    return `<div class="se-hint">정확히 2개를 선택하세요.</div><ul class="choices">${q.choices.map(c=>`<li class="choice square ${u.includes(c.label)?'selected':''}" data-mode="se" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='TC'){
    if(q.blanks.length===1){const bl=q.blanks[0];
      return `<table class="tc-table single"><tbody>${bl.choices.map(c=>`<tr><td data-blank="0" data-value="${c.label}" class="${u[0]===c.label?'selected':''}">${c.text}</td></tr>`).join('')}</tbody></table>`;}
    const n=q.blanks.length,rows=q.blanks[0].choices.length;
    let html=`<table class="tc-table"><thead><tr>${q.blanks.map(b=>`<th>Blank ${ROMAN[b.id]||'('+b.id+')'}</th>`).join('')}</tr></thead><tbody>`;
    for(let r=0;r<rows;r++){html+='<tr>'+q.blanks.map((b,ci)=>{const c=b.choices[r];return `<td data-blank="${ci}" data-value="${c.label}" class="${u[ci]===c.label?'selected':''}">${c.text}</td>`;}).join('')+'</tr>';}
    html+='</tbody></table>';return html;}
  return '';}

function attachListeners(){
  document.querySelectorAll('.choice').forEach(li=>li.addEventListener('click',()=>onChoice(li)));
  document.querySelectorAll('.tc-table td').forEach(td=>td.addEventListener('click',()=>onTC(td)));
  const q=curQ();
  if(q&&q.type==='RC_SELECT'){document.querySelectorAll('.passage .sentence').forEach(sp=>{
    const pick=()=>{const txt=sp.dataset.text;const cur=state.answers[q.id]||[];const is=cur[0]&&normSent(cur[0])===normSent(txt);
      state.answers[q.id]=is?[]:[txt];document.querySelectorAll('.passage .sentence').forEach(x=>x.classList.remove('sel'));if(!is)sp.classList.add('sel');};
    sp.addEventListener('click',pick);sp.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();pick();}});});}}
function onChoice(li){const q=curQ(),mode=li.dataset.mode,val=li.dataset.value;
  if(mode==='single'){state.answers[q.id]=[val];document.querySelectorAll('.choice[data-mode="single"]').forEach(x=>x.classList.remove('selected'));li.classList.add('selected');}
  else if(mode==='multi'){let cur=state.answers[q.id]||[];if(cur.includes(val)){cur=cur.filter(v=>v!==val);li.classList.remove('selected');}else{cur=[...cur,val];li.classList.add('selected');}state.answers[q.id]=cur;}
  else if(mode==='se'){let cur=state.answers[q.id]||[];const w=document.getElementById('se-warning');
    if(cur.includes(val)){cur=cur.filter(v=>v!==val);li.classList.remove('selected');}
    else{if(cur.length>=2){w.textContent='정확히 2개까지만 선택할 수 있습니다.';w.classList.add('show');setTimeout(()=>w.classList.remove('show'),1800);return;}cur=[...cur,val];li.classList.add('selected');}
    state.answers[q.id]=cur;}}
function onTC(td){const q=curQ(),bi=+td.dataset.blank,val=td.dataset.value;
  let cur=state.answers[q.id]||new Array(q.blanks.length).fill(undefined);cur=[...cur];cur[bi]=val;state.answers[q.id]=cur;
  document.querySelectorAll(`.tc-table td[data-blank="${bi}"]`).forEach(x=>x.classList.remove('selected'));td.classList.add('selected');}

function renderResults(app){let totalCorrect=0;
  const stats=examData.sections.map(s=>{let c=0;s.questions.forEach(q=>{if(isCorrect(q))c++;});totalCorrect+=c;return{num:s.number,correct:c,total:s.questions.length};});
  const tq=totalQ();const score=Math.round(examData.scoringFormula.multiplier*totalCorrect)+examData.scoringFormula.base;
  /* 진단고사(계약 v1.0 §1·§5): score 'diag' = min(170,130+2×정답) «진단 점수», 'none' = 점수 없이 «20문항 중 N개». «환산» 표기 금지 */

    :D.score==='diag'?`<div class="score-cell"><div class="label">진단 점수</div><div class="value">${Math.min(170,130+2*totalCorrect)}</div><div class="sub">130 + 2 × ${totalCorrect}</div></div>`
    :`<div class="score-cell"><div class="label">다시 외울 문항</div><div class="value">${tq-totalCorrect}<span class="total">개</span></div><div class="sub">${tq}문항 중 ${totalCorrect}개 정답</div></div>`;
  const diagNote=D&&D.note?`<div class="diag-note">${D.note}</div>`:'';
  let rows='';
  examData.sections.forEach(s=>{
    rows+=`<tr class="section-divider"><td colspan="7">Section ${s.number}</td></tr>`;
    s.questions.forEach(q=>{const ok=isCorrect(q);const mark=ok?'<span class="mark-correct">✓</span>':'<span class="mark-wrong">✗</span>';
      rows+=`<tr><td>${q.id}</td><td><div class="m-pool">${q.poolId}${q.part?' · '+q.part:''}</div>${tierBadge(q.frequency)}</td><td style="color:var(--ink-mute);font-size:12px;">${shortType(q.type)}</td>
        <td>${myAnswerDisplay(q)}</td><td><strong>${correctDisplay(q)}</strong></td>
        <td style="text-align:center;font-size:17px;">${mark}</td>
        <td><button class="exp-toggle" onclick="toggleExp('${q.id}')">${state.expanded[q.id]?'해설 닫기 ▲':'▶ 해설'}</button></td></tr>`;
      if(state.expanded[q.id])rows+=`<tr class="exp-row"><td colspan="7"><div class="exp-wrap">${renderExplanation(q)}</div></td></tr>`;});
  });
  app.innerHTML=`<main class="results">
    <div class="results-header"><div class="eyebrow">Test Complete</div><h2>채점 결과</h2></div>
    <div class="score-card">
      <div class="score-cell"><div class="label">총 정답</div><div class="value">${totalCorrect}<span class="total"> / ${tq}</span></div><div class="sub">${stats.map(s=>'S'+s.num+': '+s.correct+'/'+s.total).join(' · ')}</div></div>
      <div class="score-cell"><div class="label">정답률</div><div class="value">${Math.round(totalCorrect/tq*100)}<span class="total">%</span></div><div class="sub">${totalCorrect} of ${tq}</div></div>
      ${scoreCell}
    </div>
    ${diagNote}
    ${renderPromo()}
    <div class="meta-notice">※ 각 해설 첫 줄의 <b>총 출제 횟수</b>·<b>출제 연월</b>·<b>교재 Part</b>는 송종옥 선생님의 시험 후기 기록(GRE Verbal Vault) 기준입니다.<br>※ 같은 달에 여러 번 출제된 문제는 출제 연월보다 출제 횟수가 많을 수 있습니다.${D?'':' 환산 점수는 정답 수 기반 추정치입니다.'}</div>
    <div class="exp-controls"><button class="btn" onclick="expandAll(true)">모두 펼치기</button><button class="btn" onclick="expandAll(false)">모두 접기</button></div>
    <div class="tier-legend"><span>빈출 등급(출제 횟수):</span><span class="tier tier-top">★★★ 최상위</span>8회↑<span class="tier tier-high">★★ 상위</span>4–7회<span class="tier tier-mid">★ 중위</span>2–3회<span class="tier tier-low">☆ 저빈도</span>1회</div>
    <div class="results-table"><table><thead><tr><th style="width:70px;">번호</th><th style="width:172px;">모모집 · 빈출 등급</th><th>유형</th><th>내 답</th><th>정답</th><th style="width:52px;text-align:center;">결과</th><th style="width:88px;">해설</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="results-actions" style="text-align:center;display:flex;gap:12px;justify-content:center;">
      <button class="btn" onclick="window.print()">결과 인쇄</button><button class="btn btn-primary" onclick="location.reload()">다시 풀기</button><a class="btn" href="./">다른 회차 보기</a></div>
  </main>`;}
function renderPromo(){return `<section class="promo" aria-labelledby="promo-title">

    <div class="promo-row"><a class="btn btn-primary" href="https://greverbal.com/" target="_blank" rel="noopener">greverbal.com 바로가기 →</a><a class="btn" href="https://open.kakao.com/o/s0ifxj1f" target="_blank" rel="noopener">카카오톡으로 물어보기</a></div>
  </section>`;}
function shortType(t){return t==='RC_SINGLE'?'RC':t==='RC_MULTI'?'RC·다':t==='RC_SELECT'?'RC·문장':t;}
function tierBadge(f){const M={'최상위':['tier-top','★★★'],'상위':['tier-high','★★'],'중위':['tier-mid','★'],'저빈도':['tier-low','☆']};const t=M[f.bucket]||['tier-low','☆'];return `<span class="tier ${t[0]}">${t[1]} ${f.bucket} · ${f.count}회</span>`;}
function toggleExp(id){state.expanded[id]=!state.expanded[id];render();}
function expandAll(v){examData.sections.forEach(s=>s.questions.forEach(q=>state.expanded[q.id]=v));render();}
/* ── 내 기록 코드 저장 (Portal «기록 코드» 연동, 2026-11-06) ──
   결과 화면에 들어선 순간 attempt_id·taken_at을 한 번 만들고, 해설 펼침 등으로 다시 그려도 유지한다. */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function newAttemptId(){try{if(crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});}
function initSave(){if(state.save)return;const saved=lsGet('mycode');
  state.save={attempt:newAttemptId(),takenAt:new Date().toISOString(),code:saved||'',remember:!!saved,busy:false,done:false,msg:'',cls:''};}
function normCode(v){return(v||'').replace(/[\s-]+/g,'').toUpperCase();}
function fmtCode(c){return c.length>4?c.slice(0,4)+' '+c.slice(4):c;}
function escAttr(t){return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function renderCodeSave(){initSave();const v=state.save;const dis=(v.busy||v.done)?' disabled':'';
  return `<section class="code-save" aria-labelledby="cs-title">
    <h3 id="cs-title">이 결과를 내 기록에 담기</h3>
    <div class="cs-desc">${examData.codeContract?'코드를 넣어야 누적 결과에 남습니다.':'코드를 넣으면 이 회차 점수가 내 기록에 쌓입니다. 비워 두면 저장되지 않습니다.'}</div>
    <div class="cs-row"><input type="text" id="cs-code" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="11" placeholder="ABCD EFGH" aria-label="내 코드 8자" value="${escAttr(fmtCode(v.code))}" oninput="state.save.code=normCode(this.value)" onkeydown="if(event.key==='Enter')saveToCode()"${dis}>
      <button class="btn btn-primary" id="cs-btn" onclick="saveToCode()"${dis}>${v.busy?'저장 중…':v.done?'저장됨':'저장'}</button></div>
    <label class="cs-remember"><input type="checkbox" id="cs-remember" ${v.remember?'checked':''} onchange="state.save.remember=this.checked;if(!this.checked)lsSet('mycode',null)"> 이 기기에서 코드 기억하기</label>
    <div class="cs-msg ${v.cls}" role="status" aria-live="polite">${v.msg}</div>
    <div class="cs-foot">${examData.codeContract?'고른 보기도 함께 저장됩니다. /me/에서 언제든 지울 수 있습니다.<br>':''}이름·연락처·IP는 받지 않습니다. 코드를 가진 사람만 이 기록을 볼 수 있습니다.</div>
  </section>`;}
function setSaveMsg(msg,cls){const v=state.save;v.msg=msg;v.cls=cls||'';
  const box=document.querySelector('.code-save');if(!box){render();return;}
  const tmp=document.createElement('div');tmp.innerHTML=renderCodeSave();box.replaceWith(tmp.firstElementChild);}
async function saveToCode(){const v=state.save;if(!v||v.busy||v.done)return;
  const inp=document.getElementById('cs-code');if(inp)v.code=normCode(inp.value);const c=v.code;
  if(!c){setSaveMsg('코드를 넣어 주세요.','err');return;}
  if(/[0O1I]/.test(c)){setSaveMsg('이 코드는 0·O·1·I를 쓰지 않습니다.','err');return;}
  if(c.length!==8||[...c].some(ch=>!CODE_ALPHABET.includes(ch))){setSaveMsg('코드는 8자입니다. 다시 확인해 주세요.','err');return;}
  let correct=0;const items=[];const V1=!!examData.codeContract;
  examData.sections.forEach(s=>s.questions.forEach(q=>{const ok=isCorrect(q);if(ok)correct++;const it={n:q.id,pool:q.poolId,ok:ok};
    if(V1){it.a=isAnswered(q.id);const p=pickOf(q);if(p!==null)it.pick=p;}items.push(it);}));
  const body={code:c,attempt_id:v.attempt,exam:examData.round,taken_at:v.takenAt,correct:correct,total:totalQ(),items:items};
  if(V1)body.map_rev=examData.mapRev||1;
  v.busy=true;setSaveMsg('저장 중…','');
  /* 계약 v1.0 §2-4: 완료는 200(ok·dup)뿐. 429는 Retry-After, 503은 2·4·8·16초 지수 대기(최대 5회), 409 conflict·507 full은 재전송 안 함 */
  let st=0,j=null,tries=0;
  while(true){
    try{const r=await fetch(CODE_API,{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      st=r.status;j=null;try{j=await r.json();}catch(e){}
      if(st===429&&tries<5){tries++;const ra=Math.min(60,Math.max(1,parseInt(r.headers.get('Retry-After')||'5',10)||5));setSaveMsg('요청이 몰려 '+ra+'초 뒤 다시 보냅니다…','');await new Promise(res=>setTimeout(res,ra*1000));continue;}
      if(st===503&&tries<5){const w=2**(tries+1);tries++;setSaveMsg('서버가 잠시 바빠 '+w+'초 뒤 다시 보냅니다…','');await new Promise(res=>setTimeout(res,w*1000));continue;}
    }catch(e){v.busy=false;setSaveMsg('연결이 되지 않았습니다. 잠시 뒤 다시 시도해 주세요.','err');return;}
    break;}
  v.busy=false;
  if(st===200&&j&&j.ok){v.done=true;lsSet('mycode',v.remember?c:null);setSaveMsg(j.dup?'이미 저장된 응시입니다 ✓ 내 기록에서 볼 수 있습니다':'저장했어요 ✓ 내 기록에서 볼 수 있습니다','ok');return;}
  const err=j&&j.error;
  if(st===404)setSaveMsg('코드가 맞지 않습니다.','err');
  else if(st===400&&!V1)setSaveMsg('코드가 맞지 않습니다.','err');
  else if(st===400)setSaveMsg('결과 형식이 맞지 않아 저장하지 못했습니다. 선생님께 알려 주세요. ('+(err||'bad-request')+')','err');
  else if(st===507||err==='full')setSaveMsg('저장 공간이 찼습니다. 내 기록(/me/)에서 오래된 기록을 지운 뒤 다시 저장해 주세요.','err');
  else if(st===409){v.done=true;setSaveMsg('이 응시에는 이미 다른 결과가 저장돼 있습니다.','err');}
  else setSaveMsg('잠시 뒤 다시 시도해 주세요.','err');}
/* 계약 v1.0 §2-3 pick: TC는 빈칸 순서대로(무응답 칸 '-'), SE·RCM은 알파벳 오름차순, RC1·CR은 0~1개.
   RCS(문장 선택)는 문장 배열 고정 전까지 보내지 않는다(null = 필드 생략). */
function pickOf(q){const u=state.answers[q.id]||[];
  if(q.type==='RC_SELECT')return null;
  if(q.type==='TC'){if(!isAnswered(q.id))return [];return q.blanks.map((b,i)=>u[i]?u[i]:'-');}
  return u.filter(x=>x!==undefined&&x!=='').slice().sort();}


function renderReview(q){const u=state.answers[q.id]||[];const isRC=['CR','RC_SINGLE','RC_MULTI'].includes(q.type);
  let h='';
  if(q.type==='RC_SELECT'){const selN=u[0]?normSent(u[0]):null,corN=q.answer.length?normSent(q.answer[0]):null;
    h+='<div class="rev-passage">'+q.passage.split(/\n\n+/).map(para=>{const ss=splitSentences(para.replace(/<[^>]+>/g,''));
      return '<p>'+ss.map(s=>{const n=normSent(s);let c=(corN&&n===corN)?'rev-sent-correct':((selN&&n===selN)?'rev-sent-wrong':'');return c?`<span class="${c}">${s}</span>`:s;}).join(' ')+'</p>';}).join('')+'</div>';
    h+=`<div class="rev-stem">${q.questionText}</div><div style="font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);">초록 = 정답 문장 · 빨강 = 내가 고른 문장${corN?'':' · ⚠️ 정답 문장 매핑 검수 필요'}</div>`;
    return h;}
  if(isRC){h+=`<div class="rev-passage">${q.passage.split(/\n\n+/).map(p=>'<p>'+p+'</p>').join('')}</div>`;
    if(q.directions)h+=`<div class="directions">${q.directions}</div>`;
    h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.choices.map(c=>{const correct=q.answer.includes(c.label),mine=u.includes(c.label);
      let cls=correct?'is-correct':(mine?'is-wrong':'');let tag='';
      if(correct)tag='<span class="rev-tag t-correct">정답</span>';else if(mine)tag='<span class="rev-tag t-mine">내 선택</span>';
      const m=q.type==='RC_SINGLE'||q.type==='CR'?'oval':'square';
      return `<div class="rev-choice ${cls}"><span class="rc-let">${c.label}</span><div>${c.text}</div>${tag}</div>`;}).join('');
  }else if(q.type==='SE'){h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.choices.map(c=>{const correct=q.answer.includes(c.label),mine=u.includes(c.label);
      let cls=correct?'is-correct':(mine?'is-wrong':'');let tag=correct?'<span class="rev-tag t-correct">정답</span>':(mine?'<span class="rev-tag t-mine">내 선택</span>':'');
      return `<div class="rev-choice ${cls}"><div>${c.text}</div>${tag}</div>`;}).join('');
  }else{ // TC
    h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.blanks.map((bl,i)=>{const correct=q.answer[i],mine=u[i];const ct=labelText(q,correct);const mt=mine?labelText(q,mine):'미응답';const ok=mine===correct;
      return `<div class="rev-blank"><span class="bl">Blank ${bl.id==='i'?'(i)':bl.id==='ii'?'(ii)':'(iii)'}</span><br>정답: <span class="ans-ok">${ct}</span> · 내 답: <span class="${ok?'ans-ok':'ans-no'}">${mt}${mine&&!ok?' ✗':''}</span></div>`;}).join('');
  }
  return h;}

function renderExplanation(q){const e=examData.explanations[q.id]||{};const f=q.frequency;const ok=isCorrect(q);
  const months=f.months.join(', ');
  const myDisp=isAnswered(q.id)?myAnswerDisplay(q):'<span class="mark-skip">미응답</span>';
  let wrong='';
  if(e.wrong&&typeof e.wrong==='object'){wrong=Object.keys(e.wrong).map(L=>{const t=labelText(q,L);return `<li><b>(${L}) ${t?'<i>'+t+'</i>':''}</b> — ${e.wrong[L]}</li>`;}).join('');}
  return `<div class="exp-grid">
    <div class="exp-left"><div class="exp-col-title">▣ 풀이 다시보기</div>${renderReview(q)}</div>
    <div class="exp-right"><div class="exp-col-title">▤ 해설</div>
      <div class="exp-meta">
        <span class="m-id">모모집 ${q.poolId}</span>${q.part?`<span class="m-part">${q.part}</span>`:''}<span class="m-cnt">출제 ${f.count}회</span> ${tierBadge(f)}${q.ets?`<span class="m-ets">ETS 모의고사</span>`:''}
        <div class="m-row">출제 연월: ${months}${f.recent?` · 최근 1년 ${f.recent}회`:''}</div>
        ${q.link?`<div class="m-row"><a href="${q.link}" target="_blank" rel="noopener">전체 해설 보기 ↗</a></div>`:''}
        <div class="m-row m-ans">정답: <span class="ans-c">${correctDisplay(q)}</span> · 내 선택: <span class="ans-m ${ok?'':'mark-wrong'}">${myDisp}${ok?' ✓':' ✗'}</span></div>
      </div>
      ${e.html?`
      <div class="exp-sec"><h4>【해석】</h4><div class="md">${e.interp||''}</div></div>
      <div class="exp-sec"><h4>【유형·해법】</h4><div class="md">${e.strat||''}</div></div>
      <div class="exp-sec"><h4>【정답 근거】</h4><div class="md">${e.correct||''}</div></div>
      <div class="exp-sec"><h4>【오답 이유】</h4><div class="md">${e.wrong||''}</div></div>
      ${e.vocab?`<div class="exp-sec"><h4>【핵심 어휘】</h4><div class="md">${e.vocab}</div></div>`:''}`:`
      <div class="exp-sec"><h4>【해석】</h4><p>${e.interp||''}</p></div>
      <div class="exp-sec"><h4>【유형·해법】</h4><p>${e.strat||''}</p></div>
      <div class="exp-sec"><h4>【정답 근거】</h4><p>${e.correct||''}</p></div>
      <div class="exp-sec"><h4>【오답 이유】</h4><ul>${wrong}</ul></div>`}
      ${e.uncertain?'<div class="exp-uncertain">⚠️ 근거 불확실 — 검수 필요</div>':''}
    </div></div>`;}

/* ---- handlers ---- */
function handleStart(){state.screen='sectionIntro';render();}
function handleSectionStart(){state.screen='question';state.questionIdx=0;startTimer();render();}
function handlePrev(){if(state.questionIdx>0){state.questionIdx--;render();}}
function handleNext(){if(state.questionIdx<curSection().questions.length-1){state.questionIdx++;render();}}
document.addEventListener('DOMContentLoaded',render);render();

</script>
