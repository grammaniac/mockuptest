<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Verbal 빈출 문제 모의고사 — 무료 공개 4회</title>
<style>
:root{
  --bg:#f7f5f0; --paper:#fff; --ink:#1a1a1a; --ink-soft:#555; --ink-mute:#888;
  --line:#d8d4ca; --line-soft:#e8e5dd; --accent:#1f3a5f; --accent-soft:#e8eef5;
  --correct:#2d6a4f; --wrong:#b03a2e; --warn:#c0392b; --highlight:#fff3a8;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
  --ui:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --serif:'Iowan Old Style','Palatino','Georgia','Noto Serif KR',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;}
body{background-image:radial-gradient(circle at 20% 10%,rgba(31,58,95,.03) 0,transparent 50%),radial-gradient(circle at 80% 90%,rgba(31,58,95,.03) 0,transparent 50%);}
.ui{font-family:var(--ui);}

/* topbar */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;font-family:var(--ui);}
.topbar-left{font-size:13px;color:var(--ink-soft);}
.topbar-left .label{color:var(--ink-mute);margin-right:6px;} .topbar-left .value{color:var(--ink);font-weight:600;}
.timer{font-family:'SF Mono','Menlo',monospace;font-size:21px;font-weight:600;color:var(--accent);letter-spacing:.05em;padding:5px 13px;background:var(--accent-soft);border-radius:4px;min-width:104px;text-align:center;}
.timer.warning{color:var(--warn);background:#fdecea;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.progress-bar{height:3px;background:var(--line-soft);} .progress-fill{height:100%;background:var(--accent);transition:width .3s;}

main{max-width:1120px;margin:0 auto;padding:30px 26px 120px;}

/* buttons */
.btn{font-family:var(--ui);font-size:14px;font-weight:500;padding:11px 22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;transition:all .15s;}
.btn:hover:not(:disabled){border-color:var(--ink);background:#fafaf7;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover:not(:disabled){background:#15294a;border-color:#15294a;}
.btn-finish{background:var(--correct);color:#fff;border-color:var(--correct);}
.btn-finish:hover:not(:disabled){background:#1d4d39;}
.btn-large{font-size:16px;padding:14px 38px;}

/* ===== INTRO (1-viewport) ===== */
.intro{max-width:640px;margin:34px auto;text-align:center;}
.intro-eyebrow{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px;}
.intro-title{font-family:var(--serif);font-size:2.2em;font-weight:700;line-height:1.3;letter-spacing:-.01em;}
.intro-round{font-size:1.1em;font-style:italic;color:var(--ink-soft);margin-top:4px;}
.main-copy{background:linear-gradient(180deg,#fbfaf6,#f3f0e8);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 24px;margin:20px auto;max-width:560px;font-size:1.18em;font-weight:600;line-height:1.5;color:var(--accent);}
.author{font-size:1.05em;font-weight:500;color:var(--ink-soft);margin-bottom:18px;letter-spacing:.02em;white-space:pre-wrap;}
.intro-info{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 26px;max-width:600px;margin:0 auto 16px;text-align:left;box-shadow:var(--shadow);}
.intro-info .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-family:var(--ui);font-size:14px;}
.intro-info .row:last-child{border-bottom:none;}
.intro-info .k{color:var(--ink-mute);} .intro-info .v{color:var(--ink);font-weight:500;}
.intro-note{max-width:600px;margin:0 auto 18px;text-align:left;font-family:var(--ui);font-size:.92em;color:var(--ink-soft);line-height:1.7;}
.intro-note ul{padding-left:20px;} .intro-note li{margin-bottom:3px;}

/* section intro / end */
.card-center{max-width:580px;margin:54px auto;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:46px 44px;box-shadow:var(--shadow);}
.card-center .num{font-family:var(--ui);font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:16px;}
.card-center h2{font-family:var(--serif);font-size:2.1em;font-weight:700;margin-bottom:20px;}
.card-center .meta{font-family:var(--ui);font-size:15px;color:var(--ink-soft);margin-bottom:30px;line-height:1.8;}
.card-center .meta strong{color:var(--ink);}
.warn-box{background:#fdf6ec;border:1px solid #f0d9b5;border-radius:8px;padding:16px 18px;margin:0 auto 26px;max-width:460px;font-family:var(--ui);font-size:14px;color:#92400e;line-height:1.7;}
.end-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* question */
.question-meta{font-family:var(--ui);font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.14em;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.question-meta .qtype{background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:3px;font-size:11px;}
.layout-rc{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:start;}
.passage{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:24px 28px;font-size:15.5px;line-height:1.82;box-shadow:var(--shadow);}
@media(min-width:769px){.passage{position:sticky;top:82px;max-height:calc(100vh - 108px);overflow-y:auto;}}
.passage::-webkit-scrollbar{width:8px;} .passage::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.passage-label{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;margin-bottom:14px;}
.qnum-badge{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;margin-bottom:16px;}
.passage p{margin-bottom:12px;text-align:justify;} .passage p:last-child{margin-bottom:0;}
.highlighted{background:var(--highlight);padding:1px 2px;border-radius:2px;}
.passage .sentence{cursor:pointer;padding:0 1px;border-radius:2px;transition:background .12s;}
.passage .sentence:hover{background:rgba(31,58,95,.12);}
.passage .sentence:focus{outline:2px solid var(--accent);outline-offset:1px;}
.passage .sentence.sel{background:#bcd6f0;box-shadow:inset 0 -2px 0 var(--accent);}
.rev-sent-correct{background:#cde8d8;padding:0 1px;border-radius:2px;} .rev-sent-wrong{background:#f6cfca;padding:0 1px;border-radius:2px;}
.question-body{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 32px;box-shadow:var(--shadow);}
.question-text{font-size:16.5px;line-height:1.7;margin-bottom:22px;font-weight:500;}
.directions{font-family:var(--ui);font-size:13.5px;color:var(--ink-soft);font-style:italic;margin-bottom:16px;}

/* choices markers */
.choices{list-style:none;}
.choice{display:flex;gap:13px;align-items:flex-start;padding:9px 6px;margin-bottom:2px;border:none;border-radius:0;cursor:pointer;transition:background .12s;font-size:15.5px;line-height:1.55;}
.choice:hover{background:#faf9f4;}
.choice .mk{flex-shrink:0;margin-top:3px;border:2px solid var(--ink-mute);background:#fff;transition:all .12s;}
.choice.oval .mk{width:24px;height:15px;border-radius:50%;}
.choice.square .mk{width:16px;height:16px;border-radius:3px;}
.choice.selected{background:var(--accent-soft);border-radius:6px;}
.choice.selected .mk{border-color:var(--accent);background:var(--accent);}
.se-hint{font-family:var(--ui);font-size:13px;color:var(--ink-mute);margin-bottom:10px;}
.se-warning{font-family:var(--ui);font-size:13px;color:var(--warn);margin-top:12px;padding:8px 12px;background:#fdecea;border-radius:4px;display:none;}
.se-warning.show{display:block;}

/* TC table */
.tc-table{border-collapse:collapse;margin-top:6px;width:100%;max-width:560px;}
.tc-table th{font-family:var(--ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;border:1px solid var(--line);padding:9px 8px;background:#fafaf7;text-align:center;}
.tc-table td{border:1px solid var(--line);padding:12px 16px;cursor:pointer;font-size:15px;transition:all .1s;}
.tc-table td:hover{background:#faf9f4;}
.tc-table td.selected{background:var(--accent-soft);font-weight:600;box-shadow:inset 0 0 0 2px var(--accent);}
.tc-table.single{max-width:430px;}

/* footer nav */
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;z-index:5;box-shadow:0 -2px 10px rgba(0,0,0,.03);}
.footer-nav .nav-group{display:flex;gap:10px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--paper);border-radius:8px;padding:34px 38px;max-width:460px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);}
.modal h3{font-size:20px;margin-bottom:14px;font-weight:600;}
.modal p{font-family:var(--ui);font-size:14.5px;color:var(--ink-soft);margin-bottom:26px;line-height:1.6;}
.modal .modal-actions{display:flex;gap:10px;justify-content:center;}

/* results */
.results{max-width:1000px;margin:0 auto;}
.results-header{text-align:center;margin-bottom:34px;}
.results-header .eyebrow{font-family:var(--ui);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px;}
.results-header h2{font-family:var(--serif);font-size:2.2em;font-weight:700;}
.score-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:34px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;text-align:center;box-shadow:var(--shadow);}
.score-cell .label{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px;}
.score-cell .value{font-size:46px;font-weight:300;color:var(--accent);line-height:1;}
.score-cell .value .total{font-size:21px;color:var(--ink-mute);}
.score-cell .sub{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
/* 내 기록 코드 저장 (Portal «기록 코드», 2026-11-06) */
.code-save{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);font-family:var(--ui);}
.code-save h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.code-save .cs-desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.55;}
.code-save .cs-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.code-save input[type=text]{font-family:'SF Mono','Menlo',monospace;font-size:17px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:6px;width:13ch;min-width:0;}
.code-save input[type=text]:disabled{background:var(--line-soft);}
.code-save .cs-remember{font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;margin-top:10px;}
.code-save .cs-msg{font-size:13.5px;margin-top:10px;min-height:1em;}
.code-save .cs-msg.ok{color:var(--correct);font-weight:600;} .code-save .cs-msg.err{color:var(--wrong);}
.code-save .cs-foot{font-size:12px;color:var(--ink-mute);margin-top:10px;}
.diag-note{border-left:3px solid var(--accent);background:#f4f7fb;padding:10px 14px;font-family:var(--ui);font-size:.95em;color:var(--ink);line-height:1.6;margin:-6px 0 18px;border-radius:0 6px 6px 0;}
.meta-notice{background:#fafaf7;border:1px solid var(--line-soft);border-radius:8px;padding:12px 16px;font-family:var(--ui);font-size:.9em;color:var(--ink-soft);line-height:1.6;margin-bottom:18px;}
.exp-controls{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px;}
.results-table{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px;box-shadow:var(--shadow);}
.results-table table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px;}
.results-table th{background:#fafaf7;padding:13px 14px;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;border-bottom:1px solid var(--line);}
.results-table td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
.results-table tr.section-divider td{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.mark-correct{color:var(--correct);font-weight:700;} .mark-wrong{color:var(--wrong);font-weight:700;} .mark-skip{color:var(--ink-mute);}
.exp-toggle{font-family:var(--ui);font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;}
.exp-toggle:hover{background:var(--accent-soft);}
.m-pool{font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.tier{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.tier-top{background:#b8860b;color:#fff;} .tier-high{background:var(--accent);color:#fff;}
.tier-mid{background:#6b7a8f;color:#fff;} .tier-low{background:#e8e5dd;color:var(--ink-soft);}
.tier-legend{font-family:var(--ui);font-size:12px;color:var(--ink-soft);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}

/* explanation 2-col */
.exp-row td{padding:0 !important;background:#fbfaf6;border-bottom:2px solid var(--line);}
.exp-wrap{padding:22px 22px;}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
.exp-col-title{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:12px;border-bottom:1px solid var(--line-soft);padding-bottom:6px;}
.rev-passage{background:#fff;border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:6px;padding:16px 18px;font-size:14.5px;line-height:1.75;margin-bottom:14px;}
.rev-stem{font-size:15px;font-weight:600;margin-bottom:12px;line-height:1.6;}
.rev-choice{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line-soft);border-radius:6px;margin-bottom:6px;font-size:14px;line-height:1.5;}
.rev-choice .rc-let{font-family:var(--ui);font-weight:700;color:var(--ink-mute);min-width:18px;}
.rev-choice.is-correct{background:#eaf5ef;border-color:var(--correct);}
.rev-choice.is-wrong{background:#fdeeec;border-color:var(--wrong);}
.rev-tag{font-family:var(--ui);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:auto;white-space:nowrap;}
.rev-tag.t-correct{background:var(--correct);color:#fff;} .rev-tag.t-mine{background:var(--wrong);color:#fff;}
.rev-blank{font-size:14px;margin-bottom:8px;padding:8px 12px;border:1px solid var(--line-soft);border-radius:6px;}
.rev-blank .bl{font-family:var(--ui);font-weight:700;color:var(--ink-mute);font-size:12px;}
.ans-ok{color:var(--correct);font-weight:600;} .ans-no{color:var(--wrong);font-weight:600;}

.exp-meta{background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-family:var(--ui);font-size:13px;line-height:1.7;}
.exp-meta .m-id{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.02em;}
.exp-meta .m-cnt{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:1px 9px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta .m-row{margin-top:6px;color:var(--ink-soft);}
.exp-meta .m-ans .ans-c{color:var(--correct);font-weight:700;} .exp-meta .m-ans .ans-m{font-weight:700;}
.exp-sec{margin-bottom:13px;}
.exp-sec h4{font-family:var(--ui);font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.02em;}
.exp-sec p,.exp-sec li{font-size:14px;line-height:1.65;color:var(--ink);}
.exp-sec ul{padding-left:4px;list-style:none;} .exp-sec li{margin-bottom:5px;}
.exp-sec li b{color:var(--ink);}
.exp-uncertain{color:var(--warn);font-weight:700;font-family:var(--ui);font-size:12.5px;margin-top:6px;}

/* v2: Mark / Review (ETS) */
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-btn{font-family:var(--ui);font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;}
.tb-btn:hover{border-color:var(--ink);}
.tb-btn.marked{background:#fff6d6;border-color:#b8860b;color:#7a5a00;}
.review-wrap{max-width:760px;margin:0 auto;}
.review-wrap h2{font-family:var(--serif);font-size:1.7em;margin-bottom:6px;}
.review-wrap .sub{font-family:var(--ui);font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
.review-table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
.review-table th{background:#fafaf7;text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);border-bottom:1px solid var(--line);}
.review-table td{padding:10px 14px;border-bottom:1px solid var(--line-soft);}
.review-table tr.rv-row{cursor:pointer;} .review-table tr.rv-row:hover td{background:var(--accent-soft);}
.review-table tr.rv-cur td{background:#eef3f9;font-weight:600;}
.st-ans{color:var(--correct);font-weight:600;} .st-not{color:var(--wrong);font-weight:600;} .st-inc{color:#b8860b;font-weight:600;}
.mk-flag{color:#b8860b;font-weight:700;}
/* v2: Vault 해설 */
.exp-sec .md p{margin-bottom:6px;} .exp-sec .md ul{padding-left:18px;list-style:disc;} .exp-sec .md li{margin-bottom:4px;}
.exp-sec .md table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:12.5px;margin-top:4px;}
.exp-sec .md th,.exp-sec .md td{border:1px solid var(--line-soft);padding:4px 6px;text-align:left;vertical-align:top;}
.exp-sec .md th{background:#f3f0e8;}
.exp-sec .md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--ink-soft);margin:6px 0;}
.exp-sec .md h5{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);margin:8px 0 3px;}
.exp-meta .m-part{display:inline-block;background:#fff;border:1px solid var(--accent);color:var(--accent);font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta .m-ets{display:inline-block;background:#1f3a5f;color:#fff;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta a{color:var(--accent);font-weight:600;}
@media(max-width:768px){
  .layout-rc{grid-template-columns:1fr;}
  .passage{position:static !important;max-height:none !important;overflow-y:visible !important;top:auto !important;}
  .score-card{grid-template-columns:1fr;gap:18px;}
  .exp-grid{grid-template-columns:1fr;gap:18px;}
  main{padding:22px 14px 120px;} .intro-title{font-size:1.8em;}
}
@media print{.footer-nav,.topbar,.exp-controls,.results-actions,.code-save{display:none;}body{background:#fff;}}

/* 공개판: greverbal.com 안내 (build_pub.py) */
.promo{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);font-family:var(--ui);}
.promo h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.promo p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px;}
.promo .promo-row{display:flex;gap:8px;flex-wrap:wrap;}
a.btn{text-decoration:none;display:inline-block;}
@media print{.promo{display:none;}}
</style>

s not interacted with any nearby star since the supernova.\n\nBut newer evidence of a different pulsar with planets is more promising. This is a rapidly spinning “millisecond pulsar” thought to be a much older object that has pulled gaseous material from a stellar neighbor, causing its rotational speed to increase. Leftover, unconsumed gas around such a pulsar could, in theory, coalesce into planets. Or the pulsar’s radiation might have vaporized a companion star, providing new material for planetary formation.", "passageGroupId": "G_23", "rangeLabel": "S1 Q10-Q12", "questionText": "Which of the following can be inferred regarding the pulsar discussed in the first paragraph?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "Theorists initially doubted its existence."}, {"label": "B", "text": "If its existence had been confirmed, astronomers would have turned their attention to the pulsar discussed in the second paragraph."}, {"label": "C", "text": "If the supernova explosion that created it had been more powerful, the resulting radiation would have preceded the subsequent formation of a planet."}, {"label": "D", "text": "If it had interacted with a nearby star since the supernova explosion, it would rotate faster than it does."}, {"label": "E", "text": "Astronomers’ interest in it ultimately led to a new theory of planetary formation."}], "answer": ["D"]}, {"id": "S1-Q12", "poolId": "RCCR 23", "frequency": {"count": 10, "months": ["2021-11", "2022-12", "2023-03", "2024-11", "2024-12", "2025-05", "2025-12", "2026-03", "2026-05", "2026-10"], "bucket": "최상위", "recent": 4}, "part": "Part I", "ets": false, "passage": "The recently announced discovery of the first known planet orbiting a pulsar (the ultradense, pulsating remnant of the supernova explosion of a star) turned out to be based on faulty data. Had this discovery been confirmed, theorists would have had difficulty accounting for the existence of such a planet. The supernova would certainly have destroye ace left. In other early scripts that feature pictorially based signs, such as Egyptian and Anatolian hieroglyphic, the order in which the signs are to be read is opposite to the way they face. Thus, even without the ability to actually read Maya writing, Stephens, based on his knowledge of the newly deciphered Egyptian script, might have correctly surmised that the general reading order is left to right—in contrast to Egyptian, which is usually scanned from right to left.", "passageGroupId": "G_1012", "rangeLabel": "S2 Q5-Q6", "questionText": "Which of the following statements about ancient Egyptian hieroglyphic can be inferred from the passage?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "Heads depicted within it generally face to the left."}, {"label": "B", "text": "It was deciphered before Maya script was."}, {"label": "C", "text": "Its deciphering was made easier by the deciphering of Anatolian hieroglyphic."}, {"label": "D", "text": "It was the source for Anatolian hieroglyphic."}, {"label": "E", "text": "Unlike Maya hieroglyphic it did not feature heads of animals."}], "answer": ["B"]}, {"id": "S2-Q6", "poolId": "RCCR 1012", "frequency": {"count": 2, "months": ["2025-11", "2026-10"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "In the 1830s, Stephens and other explorers of ancient Maya cities were struck by the highly pictorial appearance of the then undeciphered hieroglyphs, which frequently featured heads of humans and animals. In these hieroglyphs, the heads almost always face left. In other early scripts that feature pictorially based signs, such as <span class=\"highlighted\">Egyptian and Anatolian hieroglyphic<\/span>, the order in which the signs are to be read is opposite to the way they face. Thus, even without the ability to actually read Maya writing, Stephens, based on his knowledge of the newly deciphered Egyptian script, might have correctly surmised that the general reading order is left to right—in contrast to Egyptian, which is usually scanned from right to left.", "passageGroupId": "G_1012", "rangeLabel": "S2 Q5-Q6", "questionText": "The author of the passage refers to \"Egyptian and Anatolian hieroglyphic\" script primarily in order to", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "establish the antiquity of Maya script by comparing it with writing systems whose age is well known"}, {"label": "B", "text": "suggest that they share a common origin with Maya script"}, {"label": "C", "text": "indicate the relative order in which different scripts were deciphered"}, {"label": "D", "text": "cite a precedent for reading scripts in a particular way"}, {"label": "E", "text": "argue for the universality of certain symbols in pictorially based scripts"}], "answer": ["D"]}, {"id": "S2-Q7", "poolId": "RCCR 699", "frequency": {"count": 8, "months": ["2023-02", "2023-03", "2023-04", "2023-08", "2024-03", "2024-07", "2025-11", "2026-10"], "bucket": "최상위", "recent": 2}, "part": "Part II", "ets": false, "passage": "One characteristic of terrestrial cratering is the presence of doublet craters: 3 of the 28 large impact craters on Earth (greater than 20 kilometers diameter) have partner craters. For example, the Kamensk crater in Russia, 25 kilometers in diameter, is partnered by the Gusev crater, 3 kilometers wide and of identical age. Since such doublets form when two well-separated asteroids impact Earth nearly simultaneously, their relatively frequent occurrence serves as evidence for the existence of a substantial population of co-orbiting asteroids.\n\nAre other rocky planets subject to impacts from co-orbiting asteroids? Venus is a promising planet to search for doublets because its surface is young, erosion is nearly nonexistent, and its crater population is significantly larger than Earth's, but not so large that there is a high probability of chance associations. Researchers found that the proportion of doublet craters on Venus is significantly smaller than on Earth. However, Venus’ denser atmosphere may screen out the smaller member of some asteroid pairs. If Earth had a similar screening effect, only one of its three known doublets would have formed, making the proportion of doublet craters on Earth(3.6%) identical to Venus'(2.2%) within uncertainties. The researchers concluded that co-orbiting asteroids must be common among both the near-Earth and near-Venus asteroid populations.", "passageGroupId": "G_699", "rangeLabel": "S2 Q7-Q9", "questionText": "The passage indicates that when two craters constitute a doublet, they are", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "not necessarily formed by co-orbiting asteroids"}, {"label": "B", "text": "not necessarily created at the same time"}, {"label": "C", "text": "not necessarily of similar size"}, {"label": "D", "text": "sometimes widely separated"}, {"label": "E", "text": "unlikely to be in a heavily cratered area"}], "answer": ["C"]}, {"id": "S2-Q8", "poolId": "RCCR 699", "frequency": {"count": 8, "months": ["2023-02", "2023-03", "2023-04", "2023-08", "2024-03", "2024-07", "2025-11", "2026-10"], "bucket": "최상위", "recent": 2}, "part": "Part II", "ets": false, "passage": "One characteristic of terrestrial cratering is the presence of doublet craters: 3 of the 28 large impact craters on Earth (greater than 20 kilometers diameter) have partner craters. For example, the Kamensk crater in Russia, 25 kilometers in diameter, is partnered by the Gusev crater, 3 kilometers wide and of identical age. Since such doublets form when two well-separated asteroids impact Earth nearly simultaneously, their relatively frequent occurrence serves as evidence for the existence of a substantial population of co-orbiting asteroids.\n\nAre other rocky planets subject to impacts from co-orbiting asteroids? Venus is a promising planet to search for doublets because its surface is young, erosion is nearly nonexistent, and its crater population is significantly larger than Earth's, but not so large that there is a high probability of chance associations. <span class=\"highlighted\">Researchers found that the proportion of doublet craters on Venus is significantly smaller than on Earth.<\/span> However, Venus’ denser atmosphere may screen out the smaller member of some asteroid pairs. If Earth had a similar screening effect, only one of its three known doublets would have formed, making the proportion of doublet craters on Earth(3.6%) identical to Venus'(2.2%) within uncertainties. The researchers concluded that co-orbiting asteroids must be common among both the near-Earth and near-Venus asteroid populations.", "passageGroupId": "G_699", "rangeLabel": "S2 Q7-Q9", "questionText": "The author would be most likely to agree that the finding presented in the highlighted sentence is", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "unsurprising, given certain characteristics of Venus' surface"}, {"label": "B", "text": "dubious, given the methods used by the researchers studying Venus"}, {"label": "C", "text": "suspect, given Venus’ size relative to Earth's size"}, {"label": "D", "text": "expected, given the number of co-orbiting asteroids in Venus’ atmosphere"}, {"label": "E", "text": "explicable, once certain characteristics of Venus’ atmosphere are considered"}], "answer": ["E"]}, {"id": "S2-Q9", "poolId": "RCCR 699", "frequency": {"count": 8, "months": ["2023-02", "2023-03", "2023-04", "2023-08", "2024-03", "2024-07", "2025-11", "2026-10"], "bucket": "최상위", "recent": 2}, "part": "Part II", "ets": false, "passage": "One characteristic of terrestrial cratering is the presence of doublet craters: 3 of the 28 large impact craters on Earth (greater than 20 kilometers diameter) have partner craters. For example, the Kamensk crater in Russia, 25 kilometers in diameter, is partnered by the Gusev crater, 3 kilometers wide and of identical age. Since such doublets form when two well-separated asteroids impact Earth nearly simultaneously, their relatively frequent occurrence serves as evidence for the existence of a substantial population of co-orbiting asteroids.\n\nAre other rocky planets subject to impacts from co-orbiting asteroids? Venus is a promising planet to search for doublets because its surface is young, erosion is nearly nonexistent, and its crater population is significantly larger than Earth's, but not so large that there is a high probability of chance associations. Researchers found that the proportion of doublet craters on Venus is significantly smaller than on Earth. However, Venus’ denser atmosphere may screen out the smaller member of some asteroid pairs. If Earth had a similar screening effect, only one of its three known doublets would have formed, making the proportion of doublet craters on Earth(3.6%) identical to Venus'(2.2%) within uncertainties. The researchers concluded that co-orbiting asteroids must be common among both the near-Earth and near-Venus asteroid populations.", "passageGroupId": "G_699", "rangeLabel": "S2 Q7-Q9", "questionText": "Which of the following can be inferred from the passage about the asteroid pairs that created the three known doublet craters on Earth?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "In at least two of the three pairs, both of the asteroids were large enough to create a large impact crater."}, {"label": "B", "text": "In only one of the three pairs was there at least one asteroid large enough to create a large impact crater."}, {"label": "C", "text": "In only two of the three pairs were the asteroids roughly the same size."}, {"label": "D", "text": "In two of the three pairs, at least one of the asteroids would not have been able to withstand a screening effect like that presented by the Venusian atmosphere."}, {"label": "E", "text": "In at least two of the three pairs, both of the asteroids would have been large enough to withstand a screening effect like that presented by the Venusian atmosphere."}], "answer": ["D"]}, {"id": "S2-Q10", "poolId": "TCSE 3679", "frequency": {"count": 1, "months": ["2026-09"], "bucket": "저빈도", "recent": 1}, "part": "Part V", "ets": false, "type": "SE", "questionText": "Some historians have __________ the disjunction between the decades preceding and the ones following the political coup, ignoring the fact that the coup fell in the middle of a twenty-year period of considerable social and economic continuity.", "choices": [{"label": "A", "text": "overstated"}, {"label": "B", "text": "exaggerated"}, {"label": "C", "text": "questioned"}, {"label": "D", "text": "misjudged"}, {"label": "E", "text": "misinterpreted"}, {"label": "F", "text": "overlooked"}], "answer": ["A", "B"], "answerText": ["overstated", "exaggerated"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q11", "poolId": "TCSE 2557", "frequency": {"count": 7, "months": ["2024-11", "2025-02", "2025-05", "2025-08", "2025-09", "2025-12", "2026-01"], "bucket": "상위", "recent": 2}, "part": "Part III", "ets": false, "type": "SE", "questionText": "While traditional Chinese historiography ostensibly described events in a neutral manner, early historians did not always __________ tendentiousness, sometimes offering moral judgments about the historical figures they discussed.", "choices": [{"label": "A", "text": "eschew"}, {"label": "B", "text": "forgo"}, {"label": "C", "text": "denounce"}, {"label": "D", "text": "descry"}, {"label": "E", "text": "defend"}, {"label": "F", "text": "justify"}], "answer": ["A", "B"], "answerText": ["eschew", "forgo"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q12", "poolId": "TCSE 3629", "frequency": {"count": 5, "months": ["2023-08", "2023-09", "2025-08", "2026-03", "2026-08"], "bucket": "상위", "recent": 2}, "part": "Part IV", "ets": false, "type": "SE", "questionText": "What they see in Jimenez is the one candidate capable of decisive leadership, in stark contrast to Diaz, whose team in office has been marred by __________.", "choices": [{"label": "A", "text": "defensiveness"}, {"label": "B", "text": "corruption"}, {"label": "C", "text": "irresolution"}, {"label": "D", "text": "vacillation"}, {"label": "E", "text": "belligerence"}, {"label": "F", "text": "pugnacity"}], "answer": ["C", "D"], "answerText": ["irresolution", "vacillation"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q13", "poolId": "RCCR 251", "frequency": {"count": 9, "months": ["2022-08", "2023-05", "2024-08", "2024-12", "2025-02", "2025-07", "2025-08", "2026-03", "2026-09"], "bucket": "최상위", "recent": 2}, "part": "Part I", "ets": false, "passage": "People who watch television for an average of three hours per day are twice as likely to be overweight as those who watch television very rarely. It can be concluded that by watching television for as much as three hours each day, a person increases his or her chances of becoming overweight.", "passageGroupId": "G_251", "rangeLabel": "S2 Q13", "questionText": "The argument is vulnerable to criticism on the ground that", "type": "CR", "choices": [{"label": "A", "text": "it takes it for granted that the condition of being overweight predisposes overweight people to watch television"}, {"label": "B", "text": "takes it for granted that no one who watches television more than three hours a day engages in regular physical exercise"}, {"label": "C", "text": "overlooks the possibility that those who watch television for an average of three hours per day are physically active at work"}, {"label": "D", "text": "overlooks the possibility that a dislike of physical exercise makes certain people more likely both to spend time watching television and to be overweight"}, {"label": "E", "text": "overlooks the possibility that there are some people who are overweight and yet watch no television at all"}], "answer": ["D"], "stimulus": "People who watch television for an average of three hours per day are twice as likely to be overweight as those who watch television very rarely. It can be concluded that by watching television for as much as three hours each day, a person increases his or her chances of becoming overweight."}, {"id": "S2-Q14", "poolId": "RCCR 1050", "frequency": {"count": 2, "months": ["2026-01", "2026-03"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "In his biography of James Baldwin, Leeming generally analyzes the sociopolitical, economic, and cultural significance of Baldwin's principal literary works, even using several of their titles as chapter headings. In spite of these meritorious features, the book suffers somewhat from an <span class=\"highlighted\">uneven treatment<\/span> of Baldwin's writing. For example, The Fire Next Time has been widely, and appropriately, acknowledged as one of the great essays of the past half century. But rather than an analytical and interpretive discussion, Leeming provides only a summary stitched together from quotations and paraphrases. He expends considerably more time and space on the play Blues for Mister Charlie, even though Baldwin does not enjoy a widespread reputation as an innovative and substantial dramatist.", "passageGroupId": "G_1050", "rangeLabel": "S2 Q14-Q15", "questionText": "Which of the following best characterizes what the author of the passage means by “uneven treatment”?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "The critical standards that Leeming applies to Baldwin's writing are different from those that he has applied to the work of other writers."}, {"label": "B", "text": "The attention that Leeming devotes to certain works by Baldwin contrasts sharply with the conventional evaluation of those works."}, {"label": "C", "text": "Leeming is more concerned with the sociopolitical, economic, and cultural significance of Baldwin's works than he is with their literary merit."}, {"label": "D", "text": "Leeming devotes inordinate space to some of Baldwin's shorter works while giving short shrift to many of his longer works."}, {"label": "E", "text": "Leeming devotes more space to summarizing Baldwin's dramatic works than to subjecting those works to analysis and interpretation."}], "answer": ["B"]}, {"id": "S2-Q15", "poolId": "RCCR 1050", "frequency": {"count": 2, "months": ["2026-01", "2026-03"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "In his biography of James Baldwin, Leeming generally analyzes the sociopolitical, economic, and cultural significance of Baldwin's principal literary works, even using several of their titles as chapter headings. In spite of these meritorious features, the book suffers somewhat from an uneven treatment of Baldwin's writing. For example, The Fire Next Time has been widely, and appropriately, acknowledged as one of the great essays of the past half century. But rather than an analytical and interpretive discussion, Leeming provides only a summary stitched together from quotations and paraphrases. He expends considerably more time and space on the play Blues for Mister Charlie, even though Baldwin does not enjoy a widespread reputation as an innovative and substantial dramatist.", "passageGroupId": "G_1050", "rangeLabel": "S2 Q14-Q15", "questionText": "It can be inferred that the author of the passage would agree with which of the following statements about Baldwin's literary output?", "type": "RC_MULTI", "choices": [{"label": "A", "text": "Blues for Mister Charlie is a less important work than is The Fire Next Time."}, {"label": "B", "text": "Baldwin was more influential as a dramatist than as an essayist."}, {"label": "C", "text": "Baldwin's reputation as an essayist is not fully justified by the quality of his essays."}], "answer": ["A"], "directions": "Consider each of the choices separately and select all that apply."}]}], "passageGroups": {"G_907": {"appliedTo": ["S1-Q4", "S1-Q5"], "range": "S1 Q4-Q5"}, "G_23": {"appliedTo": ["S1-Q10", "S1-Q11", "S1-Q12"], "range": "S1 Q10-Q12"}, "G_1012": {"appliedTo": ["S2-Q5", "S2-Q6"], "range": "S2 Q5-Q6"}, "G_699": {"appliedTo": ["S2-Q7", "S2-Q8", "S2-Q9"], "range": "S2 Q7-Q9"}, "G_251": {"appliedTo": ["S2-Q13"], "range": "S2 Q13"}, "G_1050": {"appliedTo": ["S2-Q14", "S2-Q15"], "range": "S2 Q14-Q15"}}, "explanations": {"S1-Q1": {"html": true, "interp": "<p>래브라도 오리(Labrador duck)는 멸종한 새들 가운데서도 가장 수수께끼 같은(enigmatic) 존재다. 표본은 꽤 여러 점 남아 있지만, 신뢰할 만한 자료를 내놓은 것은 거의 없고, 이 종의 번식 양상에 대해 알려진 바도 거의 없다.<\/p><p><b>해석 노트:<\/b> one of the most enigmatic extinct birds를 \"가장 수수께끼 같은 멸종 조류 중 하나\"로 직역하면 수식이 겹쳐 읽기 어려우므로, \"멸종한 새들 가운데서도 가장 수수께끼 같은 존재\"로 갈라 놓았다. enigmatic은 '논란거리'(controversial)도 '이례적'(anomalous)도 아니라 '알 수 없음'이 핵심이므로 \"수수께끼 같은\"으로 못 박아 콜론 뒤의 '자료 없음·알려진 바 없음'과 곧바로 이어지게 했다. few…and little…의 병렬은 \"거의 없고 … 거의 없다\"로 되풀이해 원문의 반복 리듬을 남겼고, 콜론은 부연 문장으로 끊어 처리했다.<\/p>", "strat": "<p>콜론(<code>:<\/code>, trigger-05)이 빈칸을 노골적으로 설명한다. 콜론 뒤가 빈칸의 정체.<\/p><ul><li>콜론 뒤 양보 <code>although there are a fair number of specimens, few have yielded reliable data and little is known<\/code>(trigger-10 although 역접): \"표본은 많은데도 정보는 거의 없다\" — 표본의 풍부함과 지식의 빈곤 사이의 대조 = <b>수수께끼 같음<\/b>.<\/li><li>빈칸은 이 \"정보가 거의 없는, 알 수 없는\" 상태를 한 단어로 = <b>enigmatic(수수께끼 같은)<\/b>.<\/li><\/ul>", "correct": "<p><b>enigmatic(수수께끼 같은, 알 수 없는)<\/b>. \"표본은 많지만 데이터도 번식 양상도 거의 알려지지 않았다\"는 콜론 설명이 곧 \"수수께끼 같다\"는 빈칸을 규정한다.<\/p><p><b>완성 문장<\/b><\/p><p>The Labrador duck is one of the most <b>enigmatic<\/b> extinct birds: although there are a fair number of specimens, few have yielded reliable data and little is known about the species’ breeding patterns.<\/p>", "wrong": "<ul><li><b>anomalous(이례적인, 변칙적인)<\/b>: \"예외적\"이라는 뜻으로, 콜론이 설명하는 \"알려진 게 없다(미지)\"와 결이 다르다. 정보 부족 ≠ 변칙성.<\/li><li><b>controversial(논쟁적인)<\/b>: 논쟁이 있다는 근거가 콜론 뒤에 없다. 근거 없음.<\/li><li><b>misrepresented(잘못 표현된)<\/b>: 정보가 왜곡됐다는 게 아니라 아예 거의 없다는 것. 부분진실 함정.<\/li><li><b>cherished(소중히 여겨지는)<\/b>: 감정·평가 어휘로 미지(未知)와 무관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>enigmatic<\/td><td>adj.<\/td><td>수수께끼 같은, 알 수 없는<\/td><td>mysterious, inscrutable<\/td><td>콜론 설명과 호응<\/td><\/tr><tr><td>anomalous<\/td><td>adj.<\/td><td>이례적인, 변칙적인<\/td><td>aberrant, atypical<\/td><td>오답(결 다름)<\/td><\/tr><tr><td>controversial<\/td><td>adj.<\/td><td>논쟁적인<\/td><td>contentious<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>misrepresented<\/td><td>adj.<\/td><td>잘못 표현된<\/td><td>distorted, falsified<\/td><td>(거만어 외) 오답(부분진실)<\/td><\/tr><tr><td>cherished<\/td><td>adj.<\/td><td>소중히 여겨지는<\/td><td>treasured, prized<\/td><td>(거만어 외) 오답<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q2": {"html": true, "interp": "<p>판사의 법적 판결에 대중이 등을 돌리게 하려는 시도에서, 판사의 적수들은 그녀와 그녀의 판결을 희화화해(caricatured) 왔다. 그렇게 함으로써 그들은, 자신들이 정작 사안의 본질(merits)을 놓고 벌이는 논쟁에서는 이길 능력이 없으며 판사의 결정 뒤에 놓인 논리에는 관심이 없다는 인상을 남긴다.<\/p><p><b>해석 노트:<\/b> caricature는 특징을 과장해 우스꽝스럽게 그린다는 뜻이므로 밋밋한 '왜곡'이 아니라 \"희화화하다\"로 옮기고, 현재완료가 담은 누적된 행위를 \"-해 왔다\"로 살렸다. are incapable of는 단순한 '못한다'보다 무능함이 드러나도록 \"이길 능력이 없다\"로 옮기고, 앞에 \"정작\"을 두어 사람을 희화화하는 일과 본질 논쟁을 대비시켰다. on the merits는 법률 문맥에서 절차가 아닌 실체적 쟁점을 뜻하므로 \"사안의 본질\"로, reasoning은 판결문의 논증을 가리키므로 \"논리\"로 옮겼다. (ii)의 근거는 뒤의 uninterested와 나란히 부정적 인상을 이뤄야 한다는 점이어서, 긍정적 함의의 have long prepared for·have great interest in은 오답이다.<\/p>", "strat": "<p>세미콜론(trigger-05)이 앞 절 전체를 부연한다. <code>in so doing<\/code>(그렇게 함으로써)은 인과(trigger-02) — 앞 행위의 결과로 어떤 인상을 남기는지.<\/p><ul><li><b>Blank (i)<\/b>: 대중을 판결에 등 돌리게 하려는 적들의 행위. 본질이 아니라 <em>왜곡·희화화<\/em>로 공격 → \"희화화하다(caricatured)\". (<code>in so doing<\/code>이 \"본질 논쟁을 못 한다\"로 이어지므로, (i)은 본질 회피적 공격이어야 함.)<\/li><li><b>Blank (ii)<\/b>: <code>they (ii) winning the argument on the merits<\/code>. 세미콜론 뒤 핵심은 \"본질 논쟁엔 무능·무관심\". 따라서 → \"본질로 이기는 능력이 없다(are incapable of)\". 뒤의 \"uninterested in the reasoning\"과 같은 방향.<\/li><\/ul>", "correct": "<ul><li><b>(i) caricatured(희화화했다)<\/b>: 본질 대신 인물·판결을 우스꽝스럽게 왜곡.<\/li><li><b>(ii) are incapable of(~할 능력이 없다)<\/b>: 본질 논쟁에서 이길 능력이 없음 → 그래서 왜곡에 의존.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>In attempting to turn the public against the judge’s legal rulings, the judge’s adversaries have <b>caricatured<\/b> her and her rulings; in so doing, they leave the impression that they <b>are incapable of<\/b> winning the argument on the merits and that they are uninterested in the reasoning behind the judge’s decisions.<\/p>", "wrong": "<ul><li><b>(i) evaluated(평가했다)<\/b>: 중립적. 대중을 등 돌리게 하려는 <em>공격<\/em> 맥락에 약하다.<\/li><li><b>(i) exonerated(무죄로 했다)<\/b>: 정반대. 적들이 판사를 <em>변호<\/em>할 리 없다.<\/li><li><b>(ii) have long prepared for(오래 준비해 왔다) / have great interest in(큰 관심이 있다)<\/b>: 둘 다 \"본질에 무관심·무능\"이라는 세미콜론 뒤 흐름과 모순.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>caricature<\/td><td>v./n.<\/td><td>희화화하다; 풍자화<\/td><td>parody, distort<\/td><td>(거만어 외)<\/td><\/tr><tr><td>exonerate<\/td><td>v.<\/td><td>무죄임을 밝히다, 면제하다<\/td><td>absolve, acquit<\/td><td><\/td><\/tr><tr><td>merit<\/td><td>n.<\/td><td>가치, 장점; (pl.) 본질·시비<\/td><td>worth; substance<\/td><td>이 문제 sense=사안의 본질<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q3": {"html": true, "interp": "<p>이 새 비평서를 두고 기껏해야 할 수 있는 말은, 그것이 반짝거릴 만큼 얄팍하다는 것이다. 저자는 자신이 연구하는 시인들의 사소한 세부에는 능란하지만, 전체적 비전을 밝히는 일에는 자못 무심하다. 그의 글이 지닌 언어적 정교함과 화려함은 그 개념적 빈곤과 대조를 이룬다. 고찰 대상인 시들에 진정한 착상이 거의 없다면, 저자의 비평에서도 그것이 모자라기는 마찬가지다.<\/p><p><b>해석 노트:<\/b> scintillatingly shallow는 칭찬어(반짝인다)와 폄하어(얄팍하다)를 맞붙인 역설이므로 목적·결과로 읽히는 \"반짝거리도록\" 대신 정도를 나타내는 \"반짝거릴 만큼\"으로 옮겨 빈정거림이 자연스럽게 드러나게 했다. indifferent는 감정적 냉담이라기보다 그 일을 해내는 데 관심이 없다는 뜻이라 \"무심하다\"로 처리해 앞의 \"능란하지만\"과 대조가 서게 했다. poverty는 재정적 가난이 아니라 있어야 할 것이 없다는 결핍이므로 \"빈곤\"으로 옮겨 conceptual과 붙였다. 마지막 문장의 them(authentic ideas)은 한국어에서 \"그것\"만 두면 지시가 흐려지므로 \"모자라기는 마찬가지다\"로 되받아, 시와 비평 양쪽 모두 착상이 없다는 반복 구조를 드러냈다.<\/p>", "strat": "<p>마지막 문장이 결정타: \"시에도 아이디어가 없고, 비평에도 아이디어가 부족하다\"(trigger-06 류 반복으로 (iii)을 확정). 즉 이 책은 표면은 화려하나 알맹이가 없다. (i)=기껏 칭찬해야 \"반짝이지만 얄팍하다\"(scintillatingly + 부정), (ii)=세부엔 능하나 큰 그림엔 \"무관심·서툴다\"(trigger-10 but adept↔(ii)), (iii)=언어적 화려함과 대조되는 개념적 \"빈곤\". 세 빈칸 모두 \"겉은 화려, 속은 빈약\" 방향.<\/p>", "correct": "<ul><li>(i) <code>shallow<\/code>(얄팍한, 피상적인) — \"반짝이도록 얄팍하다\"는 역설적 혹평. 마지막 문장(아이디어 부족)과 일관.<\/li><li>(ii) <code>indifferent<\/code>(시원찮은, 무관심한) — <code>adept at trivial details, but quite (ii) … overall vision<\/code>. 세부엔 능하나 큰 비전엔 무능·무심. but의 대조.<\/li><li>(iii) <code>poverty<\/code>(빈곤, 결핍) — \"언어적 정교함·화려함 ↔ 개념적 빈곤\"의 대조. 아이디어 부족(shortage)과 동치.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Perhaps the best one can say of this new book of criticism is that it is scintillatingly <b>shallow<\/b>. The author is adept at dealing with trivial details in the poets he studies, but he is quite <b>indifferent<\/b> when it comes to illuminating the overall vision. The verbal intricacy and panache of his writing contrast with its conceptual <b>poverty<\/b>. If there are very few authentic ideas in the poems under consideration, there is also a shortage of them in the author’s commentary.<\/p>", "wrong": "<ul><li>(i) <code>perceptive<\/code>(통찰력 있는)·<code>risqué<\/code>(아슬아슬한) — perceptive는 \"아이디어 빈곤\"이라는 결론과 모순. risqué는 무관.<\/li><li>(ii) <code>accomplished<\/code>(능숙한)·<code>argumentative<\/code>(논쟁적인) — but의 대조(세부엔 능, 비전엔 무능)를 못 만듦. accomplished면 칭찬이 되어 역접 소멸.<\/li><li>(iii) <code>complexity<\/code>(복잡함)·<code>rigor<\/code>(엄밀함) — \"화려함과 대조\"되는 것은 개념적 \"빈곤\"이라야 함. complexity·rigor는 오히려 화려함과 같은 방향이라 대조 불성립.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>shallow<\/td><td>adj.<\/td><td>얄팍한, 피상적인<\/td><td>superficial, facile<\/td><td>(거만어 외) (i)정답<\/td><\/tr><tr><td>indifferent<\/td><td>adj.<\/td><td>시원찮은; 무관심한<\/td><td>mediocre; apathetic<\/td><td>(거만어 외) (ii)정답<\/td><\/tr><tr><td>poverty<\/td><td>n.<\/td><td>빈곤, 결핍<\/td><td>dearth, paucity<\/td><td>(거만어 외) (iii)정답<\/td><\/tr><tr><td>perceptive<\/td><td>adj.<\/td><td>통찰력 있는<\/td><td>astute, discerning<\/td><td>(i)오답<\/td><\/tr><tr><td>adept<\/td><td>adj.<\/td><td>능숙한<\/td><td>proficient, skilled<\/td><td>본문<\/td><\/tr><tr><td>rigor<\/td><td>n.<\/td><td>엄밀함, 엄격함<\/td><td>exactness, stringency<\/td><td>(iii)오답<\/td><\/tr><tr><td>panache<\/td><td>n.<\/td><td>(당당한) 화려함, 멋<\/td><td>flair, verve<\/td><td>본문<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q4": {"html": true, "interp": "<p>기록물(written records)에 적용될 때 “보존(preservation)”이라는 말에는 여러 의미와 함의가 <em>뒤얽혀 있다<\/em>. 어떤 기록보관자(archivists)에게 보존은 <em>유물을 물리적 훼손에서 구해내려는 시도<\/em>이며, <em>원본 문서의 보존(conservation)<\/em>과 같은 말이다. <span class=\"highlighted\">반대 견해를 가진 기록보관자(archivists with a contrary view)<\/span>에게 무엇보다 중요한 <span class=\"highlighted\">의무(obligation)<\/span>는 <em>대용물(surrogates)을 통해 지적 내용을 구하는 것<\/em>이다. 따라서 정보를 담은 <em>원래 매체(original carriers)<\/em>는 불필요하고, 그 결과 <em>폐기해도 되는 것<\/em>으로 여겨진다. 옛 신문을 마이크로필름으로 찍고 원본을 버리는 관행이 그런 보존의 한 예다. 또 다른 차원에서 보존은, 한정된 보관 공간을 거의 열람되지 않는 자료에 무한정 내줄 것인지, 아니면 어떤 자료는 현재의 관심사와 너무 동떨어져 있어 <em>아예 폐기<\/em>하고 더 긴요한 자료가 들어설 자리를 확보할 것인지를 따진다.<\/p>", "strat": "<p><b>질문 1 — RC-02<\/b><\/p><p><b>주제 = S1<\/b>. 단어 preservation이 «<b>fraught with multiple meanings<\/b>»라는 것은 제목 표현(다의·복잡)이라 S4(Thus)가 아니라 S1이 주제다.<\/p><p>핵심 대립(보존의 두 입장): <b>① 일부 기록보관자<\/b> = <em>원본(물리적 유물) 보존<\/em> = conservation. <b>② 반대 견해<\/b> = <em>지적 내용 보존<\/em>(대용물로), 원본은 폐기 가능. 마이크로필름 사례가 ②의 예. \"obligation\"은 ②의 <em>최우선 의무<\/em>.<\/p>", "correct": "<p>신호어: <code>It can be inferred that which of the following approaches … would be unacceptable to \"some archivists\" but acceptable to the \"archivists with a contrary view\"<\/code> + select-all → 추론(RC-02). 즉 <b>원본을 버리고 내용만 디지털/필름으로 남기는 것<\/b> = ①은 거부, ②는 수용. 보기별 O/X.<\/p><ul><li><b>★해법<\/b>: 추론은 비약이 없어야 한다. 먼저 두 집단의 기준을 한 줄로 세운다 — «일부»는 원본 보존, «반대 견해»는 내용만 대용물로 살리고 원본은 버려도 된다. 보기마다 «원본은 버리되 내용은 남기는가»를 물어, 그런 보기만 고른다.<\/li><li><b>정답 B — \"주지사의 친필 논평을 컴퓨터 파일로 <em>스캔<\/em>하고 공간 절약을 위해 <em>원본을 폐기<\/em>\": O<\/b><\/li><li>근거: 내용은 대용물(스캔)로 보존하되 <em>원본(친필)을 버림<\/em>. ②(지적 내용 보존, 원본 폐기 가능)는 수용, ①(원본 보존)은 거부. 정확히 두 입장을 가르는 사례.<\/li><\/ul>", "wrong": "<ul><li><b>오답 A — \"역사 문서를 <em>유리 케이스에 전시<\/em>해 손상 없이 보게 함\": X<\/b> — 이는 <em>원본 물리 보존<\/em>(①의 방식). ②가 특별히 더 수용하는 것이 아니고, ①도 거부하지 않음(오히려 ① 선호).<\/li><li><b>오답 C — \"5년간 안 본 목격담 <em>비디오테이프를 파기<\/em>\": X<\/b> — 이는 \"주변적 자료 폐기\"(셋째 차원)로, <em>원본을 대용물로 대체<\/em>하는 ①vs② 쟁점이 아님. 내용 보존 없이 그냥 폐기라 ②의 \"내용은 살림\"과도 다름. 두 집단을 가르는 기준에 안 맞음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>obligation<\/td><td>n.<\/td><td>의무, 책임, 본분<\/td><td>responsibility, duty<\/td><td>obligate (거만어, 어근). 질문 2 정답=responsibility<\/td><\/tr><tr><td>surrogate<\/td><td>n.<\/td><td>대용물, 대리<\/td><td>substitute, replacement<\/td><td>(거만어 외) ②의 핵심(내용 보존 수단)<\/td><\/tr><tr><td>overriding<\/td><td>adj.<\/td><td>가장 중요한, 최우선의<\/td><td>paramount, primary<\/td><td>(거만어). \"overriding obligation\"<\/td><\/tr><tr><td>superfluous<\/td><td>adj.<\/td><td>불필요한, 남아도는<\/td><td>redundant, excess<\/td><td>(거만어 외) \"original carriers … superfluous\"<\/td><\/tr><tr><td>fraught<\/td><td>adj.<\/td><td>(~로) 가득 찬, 복잡한<\/td><td>laden, filled<\/td><td>(거만어 외) \"fraught with multiple meanings\"<\/td><\/tr><tr><td>correspond<\/td><td>v.<\/td><td>일치하다; 서신을 주고받다<\/td><td>match; write<\/td><td>(거만어). \"correspondence\" 보기<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q5": {"html": true, "interp": "<p>기록물(written records)에 적용될 때 “보존(preservation)”이라는 말에는 여러 의미와 함의가 <em>뒤얽혀 있다<\/em>. 어떤 기록보관자(archivists)에게 보존은 <em>유물을 물리적 훼손에서 구해내려는 시도<\/em>이며, <em>원본 문서의 보존(conservation)<\/em>과 같은 말이다. <span class=\"highlighted\">반대 견해를 가진 기록보관자(archivists with a contrary view)<\/span>에게 무엇보다 중요한 <span class=\"highlighted\">의무(obligation)<\/span>는 <em>대용물(surrogates)을 통해 지적 내용을 구하는 것<\/em>이다. 따라서 정보를 담은 <em>원래 매체(original carriers)<\/em>는 불필요하고, 그 결과 <em>폐기해도 되는 것<\/em>으로 여겨진다. 옛 신문을 마이크로필름으로 찍고 원본을 버리는 관행이 그런 보존의 한 예다. 또 다른 차원에서 보존은, 한정된 보관 공간을 거의 열람되지 않는 자료에 무한정 내줄 것인지, 아니면 어떤 자료는 현재의 관심사와 너무 동떨어져 있어 <em>아예 폐기<\/em>하고 더 긴요한 자료가 들어설 자리를 확보할 것인지를 따진다.<\/p>", "strat": "<p><b>질문 2 — RC-09<\/b><\/p><p><b>주제 = S1<\/b>. 단어 preservation이 «<b>fraught with multiple meanings<\/b>»라는 것은 제목 표현(다의·복잡)이라 S4(Thus)가 아니라 S1이 주제다.<\/p><p>핵심 대립(보존의 두 입장): <b>① 일부 기록보관자<\/b> = <em>원본(물리적 유물) 보존<\/em> = conservation. <b>② 반대 견해<\/b> = <em>지적 내용 보존<\/em>(대용물로), 원본은 폐기 가능. 마이크로필름 사례가 ②의 예. \"obligation\"은 ②의 <em>최우선 의무<\/em>.<\/p>", "correct": "<p>신호어: <code>In the context in which it appears, \"obligation\" most nearly means<\/code> → 문맥상 의미(RC-09).<\/p><ul><li><b>★해법<\/b>: 사전적 뜻 가운데 본문에 발현된 뜻을 찾는다. the overriding obligation is to save intellectual content는 «가장 우선해서 해야 할 일»이므로 «마땅히 해야 할 일»에 맞는 보기를 고르고, 법적·심리적 뉘앙스가 붙은 보기는 버린다.<\/li><li><b>정답 E — \"responsibility(책임, 본분).\"<\/b><\/li><li>근거: \"the overriding <em>obligation<\/em> is to save intellectual content\" — 반대 견해 기록보관자의 <em>가장 중요한 본분·책임<\/em>. 문맥상 \"마땅히 해야 할 일\" = responsibility.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A \"prerequisite(전제 조건)\" — 조건이 아니라 <em>해야 할 의무<\/em>. B \"compulsion(강박, 강제 충동)\" — 심리적 강박 뉘앙스, 부적합. C \"imposition(부과·강요, 폐 끼침)\" — 외부 강요·부담의 뜻, 문맥과 안 맞음. D \"liability(법적 책임·부채)\" — 법적·금전 책임 뉘앙스, 여기선 <em>직업적 본분<\/em>이라 E가 더 적확.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>obligation<\/td><td>n.<\/td><td>의무, 책임, 본분<\/td><td>responsibility, duty<\/td><td>obligate (거만어, 어근). 질문 2 정답=responsibility<\/td><\/tr><tr><td>surrogate<\/td><td>n.<\/td><td>대용물, 대리<\/td><td>substitute, replacement<\/td><td>(거만어 외) ②의 핵심(내용 보존 수단)<\/td><\/tr><tr><td>overriding<\/td><td>adj.<\/td><td>가장 중요한, 최우선의<\/td><td>paramount, primary<\/td><td>(거만어). \"overriding obligation\"<\/td><\/tr><tr><td>superfluous<\/td><td>adj.<\/td><td>불필요한, 남아도는<\/td><td>redundant, excess<\/td><td>(거만어 외) \"original carriers … superfluous\"<\/td><\/tr><tr><td>fraught<\/td><td>adj.<\/td><td>(~로) 가득 찬, 복잡한<\/td><td>laden, filled<\/td><td>(거만어 외) \"fraught with multiple meanings\"<\/td><\/tr><tr><td>correspond<\/td><td>v.<\/td><td>일치하다; 서신을 주고받다<\/td><td>match; write<\/td><td>(거만어). \"correspondence\" 보기<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q6": {"html": true, "interp": "<p>『Our Lady of the Forest』는 작은 벌목 마을의 가장 침울한 인물들을 그리면서도 임상 기록에 가까운 공정함을 이루어 내지만, 이 소설에는 호감 가는 인물이 하나도 없고 정밀한(precise) 문체를 끝까지 지켜 내지 못하는 대목이 너무 잦다.<\/p><p><b>해석 노트:<\/b> precise는 문체를 두고 쓰인 말이므로 '정확한'보다 군더더기 없이 벼려진 결이 드러나는 '정밀한'을 택했다. 다른 정답 exact를 넣어도 '한 치의 어긋남 없는 문체'라는 같은 뜻이 된다. clinical evenhandedness는 '임상적 공정함'이라는 직역이 굳어 읽히지 않아 '임상 기록에 가까운 공정함'으로 풀었다. too often fails to sustain은 '너무 자주 유지하지 못한다'로 부사를 앞세우면 어색해지므로, '~지켜 내지 못하는 대목이 너무 잦다'로 빈도를 문말 서술에 올렸다.<\/p>", "strat": "<p><b>역접 구조(trigger-10 even though).<\/b> 앞 절은 장점(\"clinical evenhandedness를 이룸\"), 뒤 절은 단점(\"호감 인물 없음 + […] 문체를 유지 못함\"). 칭찬할 만한 자질 하나가 \"clinical(임상적·냉정·정확)\"이었다.<\/p><p><code>fails to sustain a [빈칸] style<\/code> — <b>\"유지 못한다\"는 부정어<\/b>가 빈칸 앞에 있으므로, 빈칸에는 <em>바람직한·있어야 할<\/em> 문체가 들어가고 그것을 \"자주 놓친다\"는 뜻이 된다(부정 맥락이 극성을 뒤집는다). 앞에서 인정한 미덕 \"clinical evenhandedness(임상적 정확·냉정)\"와 같은 방향 → 빈칸 = <b>정확한·정밀한<\/b>.<\/p><p>SE이므로 \"정확한\"을 뜻하는 <b>동의어 두 개<\/b>를 고른다.<\/p>", "correct": "<p><b>precise(정밀한)<\/b> 와 <b>exact(정확한)<\/b> — 서로 동의어이며, 앞에서 인정된 \"clinical evenhandedness(냉정·정확)\"와 호응한다. \"그런 정확한 문체를 자주 유지하지 못한다\"가 자연스럽다. 각각 넣어도 뜻이 동등(SE 요건).<\/p><p><b>완성 문장<\/b><\/p><p>Even though Our Lady of the Forest achieves clinical evenhandedness in depicting the most depressing members of a small logging town, the novel lacks a single likable character and too often fails to sustain a <b>precise<\/b> style.<\/p>", "wrong": "<ul><li><b>stilted(부자연스럽게 격식 차린)<\/b> / <b>wooden(딱딱한·생기 없는)<\/b> — 둘끼리 \"어색·경직\" 동의어쌍이지만 <em>부정적<\/em> 문체. \"유지하지 못한다\"의 목적어로 오면 \"어색한 문체를 유지 못한다\"=칭찬이 되어, 단점을 말하는 뒤 절 논리와 충돌. SE 함정.<\/li><li><b>caustic(신랄한)<\/b> — 어조에 관한 말. clinical 미덕과 직접 연결 안 되고, 짝 동의어도 없다.<\/li><li><b>convoluted(뒤얽힌·난해한)<\/b> — 부정적 문체. 짝 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>precise<\/td><td>adj.<\/td><td>정밀한, 정확한<\/td><td>exact, accurate, meticulous<\/td><td>(거만어 외) 정답①. clinical evenhandedness와 호응<\/td><\/tr><tr><td>exact<\/td><td>adj.<\/td><td>정확한, 꼭 들어맞는<\/td><td>precise, accurate<\/td><td>(거만어 외) 정답②<\/td><\/tr><tr><td>stilted<\/td><td>adj.<\/td><td>(말·문체가) 부자연스럽게 격식 찬, 딱딱한<\/td><td>stiff, wooden, formal<\/td><td>(거만어). 오답(wooden과 동의어쌍, 극성 부정)<\/td><\/tr><tr><td>caustic<\/td><td>adj.<\/td><td>신랄한, 부식성의<\/td><td>scathing, acerbic, biting<\/td><td>(거만어). 오답(어조어, 짝 없음)<\/td><\/tr><tr><td>convoluted<\/td><td>adj.<\/td><td>뒤얽힌, 난해한<\/td><td>tortuous, labyrinthine, complicated<\/td><td>(거만어). 오답<\/td><\/tr><tr><td>evenhandedness<\/td><td>n.<\/td><td>공정함, 공평무사<\/td><td>impartiality, fairness<\/td><td>(거만어 외) 앞 절 미덕 — 빈칸 극성의 기준점<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q7": {"html": true, "interp": "<p>선거운동 관계자는 후보 지지율이 크게 출렁인 것이 유권자의 <b>변덕<\/b> 때문이 아니라 여론조사의 오차범위와 제각각인 조사 방법 때문이라고 주장했다.<\/p><p><b>해석 노트:<\/b> <code>large swings<\/code>를 '큰 변동'으로 옮기면 통계 용어처럼 굳으므로, 오르내리는 그림이 살도록 '크게 출렁인'으로 했다. capriciousness는 '변덕스러움'이 정확하나 명사구가 길어져 '변덕'으로 줄였다. <code>divergent methodologies<\/code>는 '서로 다른 방법론'이 직역이나 조사기관마다 제각각이라는 결이 있어 '제각각인 조사 방법'으로 풀었다. <code>a result not of A but rather of B<\/code>는 한국어에서 '~때문이 아니라 ~때문'으로 옮기는 것이 가장 짧고 정확하다.<\/p>", "strat": "<p>SE — 한 빈칸에 넣어 같은 뜻이 되는 두 단어를 고른다. <b>인과와 대조가 각각 다른 일을 한다.<\/b><\/p><p><b>① <code>a result of<\/code>가 빈칸의 내용을 정한다<\/b>(trigger-02 인과). 설명해야 할 현상은 <code>the <b>large swings<\/b> in the candidate's approval ratings<\/code> — <b>지지율이 크게 출렁인다<\/b>는 것이다. 빈칸은 그 출렁임의 <b>원인 후보로 지목된 유권자의 속성<\/b>이다. 유권자의 무엇이 지지율을 출렁이게 하겠는가 — <b>마음이 자주 바뀌는 것<\/b>이다.<\/p><p><b>② <code>not … but rather …<\/code>가 그 원인을 기각한다<\/b>(trigger-10 대조). <code><b>not<\/b> of the 빈칸 of the electorate <b>but rather<\/b> of the polls' margins of error and divergent methodologies<\/code> — 관계자의 주장은 「유권자가 변덕스러워서가 아니라 조사가 부정확해서」다. 즉 <b>빈칸은 기각된 설명<\/b>이다.<\/p><p>★<b>여기서 주의할 것<\/b> — 기각된다고 해서 빈칸에 «반대말»을 넣으면 안 된다. <code>not A but B<\/code>에서 A와 B는 <b>경쟁하는 두 원인<\/b>이지 반대말 쌍이 아니다. 빈칸은 어디까지나 <b>A(=출렁임을 설명할 법한 유권자의 속성)<\/b>를 채우는 자리다. 관계자가 무엇을 부인하고 싶어 하는지를 생각하면 분명해진다 — 선거운동 쪽은 «우리 후보 지지가 흔들린다»는 말을 부인하고 싶다.<\/p><p>★<b>최대 함정은 <code>exactitude<\/code>–<code>scrupulousness<\/code> 짝이다.<\/b> 둘 다 «정확·꼼꼼»이라 짝을 이룬다. 그러나 이것은 뒤 절의 <code>margins of error<\/code>(오차)에서 연상된 단어이지 <b>유권자의 속성이 아니고<\/b>, 무엇보다 정확함으로는 <b>큰 출렁임이 설명되지 않는다.<\/b> <code>of the electorate<\/code>(유권자의)라는 한정을 놓치면 그대로 걸린다.<\/p><p>★<b>두 번째 함정 — <code>partisanship<\/code>(당파성).<\/b> 유권자의 속성인 것은 맞고 정치 문맥과도 어울린다. 그러나 당파성이 강한 유권자는 <b>지지가 고정되어 흔들리지 않는다.<\/b> 큰 출렁임을 설명하기는커녕 정반대를 예측한다. <code>resurgence<\/code>(재기)는 유권자의 속성이 아니며 짝도 없다.<\/p><ul><li>trigger-12 구조: «not of the 빈칸 of the electorate but rather of the polls' margins of error and …» — <code>not A, but rather B<\/code>의 연결어(rather) 공식. 단 이 문장은 위 ★주의처럼 A·B가 경쟁하는 두 원인이라 반대말 치환은 하지 않는다.<\/li><\/ul>", "correct": "<ul><li><b>capriciousness(변덕)<\/b> + <b>volatility(쉽게 흔들림, 불안정성)<\/b>: 둘 다 «마음이 자주 바뀐다»는 축. <code>large swings<\/code>를 설명할 수 있는 유권자의 속성은 이것뿐이다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>The campaign official argued that the large swings in the candidate's approval ratings were a result not of the <b>capriciousness<\/b> of the electorate but rather of the polls' margins of error and divergent methodologies.<\/p>", "wrong": "<ul><li><b>exactitude(정확함)<\/b> + <b>scrupulousness(꼼꼼함)<\/b>: 짝이자 최대 함정. 뒤 절의 <code>margins of error<\/code>에서 연상되지만 <b>유권자의 속성이 아니고<\/b> 출렁임도 설명하지 못한다.<\/li><li><b>partisanship(당파성)<\/b>: 유권자의 속성이긴 하나 <b>지지가 고정된다<\/b>는 뜻이라 큰 출렁임의 정반대를 예측한다.<\/li><li><b>resurgence(재기, 되살아남)<\/b>: 유권자의 속성이 아니며 짝도 없다.<\/li><li>★<b>SE 함정 정리<\/b> — 이 문제는 <b>①빈칸이 누구의 속성인가(<code>of the electorate<\/code>) ②그 속성이 <code>large swings<\/code>를 설명하는가<\/b>를 차례로 물으면 정확히 갈린다. ①만 보면 partisanship이 남고, ②를 건너뛰면 exactitude–scrupulousness 짝에 걸린다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>capriciousness<\/td><td>n.<\/td><td>변덕<\/td><td>fickleness, whimsy<\/td><td>capricious 계열 · 정답<\/td><\/tr><tr><td>volatility<\/td><td>n.<\/td><td>쉽게 흔들림, 불안정성<\/td><td>instability, fickleness<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>exactitude<\/td><td>n.<\/td><td>정확함<\/td><td>precision, accuracy<\/td><td>(거만어) 오답 — scrupulousness와 짝 함정<\/td><\/tr><tr><td>scrupulousness<\/td><td>n.<\/td><td>꼼꼼함, 세심함<\/td><td>meticulousness<\/td><td>scrupulous 계열 · 오답<\/td><\/tr><tr><td>partisanship<\/td><td>n.<\/td><td>당파성<\/td><td>factionalism<\/td><td>partisan 계열 · 오답 — 오히려 고정성<\/td><\/tr><tr><td>electorate<\/td><td>n.<\/td><td>유권자 전체<\/td><td>voters<\/td><td>(거만어 외) ★한정어 — 놓치면 오답<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q8": {"html": true, "interp": "<p>로마 고고학 연구가 대체로 대도시와 그 기념물 쪽으로 쏠려 있음에도, 고고학은 로마 영토의 농촌이 어떻게 발전해 갔는지를 한결 더 잘 이해하는 데 크게 기여해 왔다.<\/p><p><b>해석 노트:<\/b> bias를 '편견'으로 옮기면 연구자를 탓하는 가치판단이 과해지므로, toward와 결합해 관심의 편중을 뜻하는 결을 살려 '~쪽으로 쏠려 있다'로 처리했다. 이 편중은 특정 과거의 사건이 아니라 학계의 일반적 경향이므로 시제를 과거가 아닌 현재로 두었다. a better understanding of rural developments는 명사구를 그대로 직역하면 굳어버리기에 '농촌이 어떻게 발전해 갔는지를 한결 더 잘 이해하는'이라는 절로 풀었고, 현재완료 has contributed는 축적된 공로를 담아 '기여해 왔다'로 옮겼다. 다른 정답 orientation을 넣으면 '지향'이라는 중립적 표현이 되지만 문장의 뜻은 같다.<\/p>", "strat": "<p>역접 전치사 Despite가 축이다(trigger-11 Despite).<\/p><ul><li><code>Despite the general 빈칸 of Roman … studies toward the major cities … , archaeology has contributed much to … rural developments<\/code>: \"대도시 쪽으로 ___해 있었지만, 그럼에도 농촌 연구에 기여\"라는 양보 구조(trigger-11).<\/li><li>빈칸은 \"연구가 대도시 <b>쪽으로<\/b> 기울어 있던\" 성향을 가리킨다(toward와 호응). 곧 = \"치우침·편향·지향\".<\/li><li>SE이므로 \"한쪽으로 치우친 지향\"이라는 같은 방향의 <b>두 단어 pair<\/b>.<\/li><\/ul>", "correct": "<p><b>bias(편향, 치우침)<\/b> 와 <b>orientation(지향, 방향성)<\/b>. 둘 다 \"(대도시) 쪽으로의 기울어진 방향성\"으로 의미가 같고, \"toward the major cities\"와 호응하며 양보 구조에 부합한다(SE pair 성립).<\/p><p><b>완성 문장<\/b><\/p><p>Despite the general <b>bias<\/b> of Roman archaeological studies toward the major cities and their monuments, archaeology has contributed much to a better understanding of rural developments in Roman territory.<\/p>", "wrong": "<ul><li><b>hostility(적대)<\/b> / <b>animus(적의)<\/b>: 이 둘이 \"적대\"라는 동의쌍을 이루지만, \"toward the major cities(대도시 <b>쪽으로<\/b>)\"는 그쪽을 향한 <b>선호·집중<\/b>이지 적대가 아니다. 함정 pair.<\/li><li><b>indifference(무관심)<\/b>: 대도시 쪽으로 \"기울어졌다(toward)\"는 집중과 정반대.<\/li><li><b>openness(개방성)<\/b>: 결이 다르고 pair 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>bias<\/td><td>n.<\/td><td>편향, 치우침<\/td><td>leaning, partiality<\/td><td>(거만어 외) 정답 pair<\/td><\/tr><tr><td>orientation<\/td><td>n.<\/td><td>지향, 방향성<\/td><td>leaning, inclination<\/td><td>(거만어 외) 정답 pair<\/td><\/tr><tr><td>hostility<\/td><td>n.<\/td><td>적대, 적의<\/td><td>antagonism, animus<\/td><td>(거만어 외) 함정쌍<\/td><\/tr><tr><td>animus<\/td><td>n.<\/td><td>적의, 악감정<\/td><td>hostility, animosity<\/td><td>(거만어 외) 함정쌍<\/td><\/tr><tr><td>indifference<\/td><td>n.<\/td><td>무관심<\/td><td>apathy, unconcern<\/td><td>(거만어 외) 오답(정반대)<\/td><\/tr><tr><td>openness<\/td><td>n.<\/td><td>개방성, 솔직함<\/td><td>candor, receptiveness<\/td><td>(거만어 외) 오답<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q9": {"html": true, "interp": "<p>이 소설은 위대한 문학이라 할 수 없다. 등장인물이 지나치게 많고 곁줄거리도 지나치게 많은 데다, 뚜렷이 규정된 주인공조차 없으니, 결국 초점이 사방으로 흩어진(diffuse) 산만한 이야기가 되고 만다.<\/p><p><b>해석 노트:<\/b> diffuse는 하나로 모이지 못하고 널리 퍼져 옅어진 상태를 가리키므로 '산만한'만으로는 부족하다고 보아 '초점이 사방으로 흩어진'을 앞세워 그 확산의 이미지를 살렸다. 결과를 나타내는 분사구문 making for는 '결국 ~이 되고 만다'로 받아, 열거된 결함이 필연적으로 낳는 귀결임을 어미로 드러냈다. 콜론은 앞 판정의 근거를 여는 자리이므로 그대로 두지 않고 '~고, ~며, ~없으니'의 연쇄로 풀어 한국어 어순에 맞췄다. 다른 정답 an amorphous를 넣어도 '뚜렷한 윤곽이 잡히지 않는'이라는 같은 뜻이 된다.<\/p>", "strat": "<p>콜론(<code>:<\/code>, trigger-05)이 빈칸의 근거를 노골적으로 설명하고, <code>making for 빈칸 story<\/code>는 콤마 없는 분사구문(trigger-03 계열)으로 앞 내용을 요약한다. 콜론 뒤 = \"인물·곁가지 과다 + 뚜렷한 주인공 부재\" → 즉 초점이 흩어지고 형태가 잡히지 않은 이야기. 따라서 빈칸 = \"<b>산만한 / 형태 없는<\/b>\". SE이므로 이 방향 두 단어를 고른다.<\/p>", "correct": "<p>a diffuse, an amorphous — \"산만하게 퍼진 / 형태가 불분명한\". \"주인공도 없고 줄거리가 사방으로 흩어진다\"는 콜론 뒤 설명에 정확히 맞는다.<\/p><p><b>완성 문장<\/b><\/p><p>This novel is not great literature: there are too many characters, too many subplots, and no clearly defined protagonist, making for <b>a diffuse<\/b> story.<\/p>", "wrong": "<ul><li>a banal, a hackneyed: \"진부한/식상한\" 동의어쌍이지만, 콜론 뒤 근거는 \"초점 없음(산만)\"이지 \"진부함\"이 아님(초점 어긋남).<\/li><li>a mawkish: \"지나치게 감상적인\". 감정 축 — 무관.<\/li><li>an innocuous: \"무해한\". 무관(근거 없음).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>diffuse<\/td><td>adj.<\/td><td>산만한, 장황한<\/td><td>rambling, unfocused<\/td><td>정답. 거만어 diffuse<\/td><\/tr><tr><td>amorphous<\/td><td>adj.<\/td><td>형태 없는, 막연한<\/td><td>shapeless, formless<\/td><td>정답. 거만어 amorphous<\/td><\/tr><tr><td>banal<\/td><td>adj.<\/td><td>진부한, 평범한<\/td><td>trite, hackneyed<\/td><td>오답. 거만어 banal<\/td><\/tr><tr><td>hackneyed<\/td><td>adj.<\/td><td>식상한, 진부한<\/td><td>clichéd, stale<\/td><td>오답. 거만어 hackneyed<\/td><\/tr><tr><td>mawkish<\/td><td>adj.<\/td><td>지나치게 감상적인<\/td><td>maudlin, sentimental<\/td><td>오답. 거만어 mawkish<\/td><\/tr><tr><td>innocuous<\/td><td>adj.<\/td><td>무해한, 악의 없는<\/td><td>harmless, inoffensive<\/td><td>오답. 거만어 innocuous<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q10": {"html": true, "interp": "<p>펄서(별이 초신성으로 폭발하고 남은, 초고밀도로 맥동하는 잔해)를 도는 행성이 처음으로 발견되었다는 최근의 발표는, 결함 있는 데이터에 근거한 것으로 드러났다. 만약 이 발견이 확증되었다면, 이론가들은 그런 행성이 존재한다는 사실을 설명하기 어려웠을 것이다. 초신성 폭발은 기존에 있던 행성을 틀림없이 모두 파괴했을 것이다. 바로 이 펄서는 비교적 젊어서 새 행성이 뭉쳐질 시간이 거의 없었고, 회전 속도도 비교적 느린데, 이는 초신성 폭발 이후 인근의 어떤 별과도 상호작용하지 않았음을 시사한다.<\/p><p>그러나 행성을 거느린 또 다른 펄서에 관한 새로운 증거는 한결 유망하다. 이것은 빠르게 회전하는 “밀리초 펄서”로, 훨씬 더 오래된 천체이며 이웃한 별에서 기체 물질을 끌어당긴 탓에 회전 속도가 빨라졌다고 여겨진다. 그런 펄서 둘레에 소비되지 않고 남은 기체는 이론상 뭉쳐서 행성이 될 수 있다. 또는 펄서가 내뿜는 복사가 동반성을 기화시켜 행성 형성에 쓰일 새 물질을 공급했을 수도 있다.<\/p>", "strat": "<p><b>질문 1 — 유형 RC-01<\/b><\/p><ul><li><b>주제 문장 = S5<\/b> — 두 단락 글의 둘째 단락 첫 문장이 But으로 첫 발견과 대비하며 다른 펄서의 행성 증거가 더 유망하다고 세우고, S6~S8이 그 까닭을 풀어 준다.<\/li><li><b>두 펄서 사례의 대비<\/b>: ① 첫 펄서(젊고 느림) — 행성 존재를 설명하기 어려움(게다가 데이터 결함). ② 둘째 펄서(오래되고 빠른 밀리초 펄서) — 기체 응축·동반성 기화로 행성 형성 설명 가능 → \"더 유망.\"<\/li><li>둘 다 <b>아직 확증되지 않은<\/b> 펄서 주위 행성의 존재에 관한 발견. 저자는 그 신뢰성을 따져 봄.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (C)<\/b>: 글은 아직 검증되지 않은 한 부류의 천체(펄서 주위 행성)의 존재에 관한 최근 발견들의 <b>신뢰성을 평가<\/b>한다 — 하나는 결함 데이터로 기각, 하나는 더 유망 → \"아직 미확인인 한 부류 천체의 존재에 관한 최근 발견들의 신빙성을 평가한다.\"<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A(결함 데이터 기반 발견의 위험 사례 제공) — 첫 사례의 한 측면일 뿐, 글 전체 목적이 아님.<\/li><li>B(설명의 어려움 예시) — 첫 펄서에만 해당, 둘째는 설명 가능하므로 전체를 못 담음.<\/li><li>D(어떤 가설이 모순 현상을 설명 못 함을 논증) — 특정 가설 반박이 목적이 아님.<\/li><li>E(현상의 실체 규명의 어려움 입증) — 둘째 사례는 유망하다고 했으므로 \"어려움 입증\"이 전부가 아님.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>coalesce<\/td><td>v.<\/td><td>응축되다, 합쳐지다<\/td><td>merge, condense<\/td><td>본문 \"coalesce into planets\"<\/td><\/tr><tr><td>vaporize<\/td><td>v.<\/td><td>기화시키다<\/td><td>evaporate, dematerialize<\/td><td>본문 \"vaporized a companion\"<\/td><\/tr><tr><td>remnant<\/td><td>n.<\/td><td>잔해, 나머지<\/td><td>remains, vestige<\/td><td>(거만어 외) 본문 \"remnant of supernova\"<\/td><\/tr><tr><td>subsequent<\/td><td>adj.<\/td><td>그 이후의<\/td><td>following, ensuing<\/td><td>본문<\/td><\/tr><tr><td>illustrate<\/td><td>v.<\/td><td>예시하다, 보여 주다<\/td><td>exemplify, demonstrate<\/td><td>오답 보기<\/td><\/tr><tr><td>implicate<\/td><td>v.<\/td><td>함의하다<\/td><td>imply<\/td><td>본문(implications)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q11": {"html": true, "interp": "<p>펄서(별이 초신성으로 폭발하고 남은, 초고밀도로 맥동하는 잔해)를 도는 행성이 처음으로 발견되었다는 최근의 발표는, 결함 있는 데이터에 근거한 것으로 드러났다. 만약 이 발견이 확증되었다면, 이론가들은 그런 행성이 존재한다는 사실을 설명하기 어려웠을 것이다. 초신성 폭발은 기존에 있던 행성을 틀림없이 모두 파괴했을 것이다. 바로 이 펄서는 비교적 젊어서 새 행성이 뭉쳐질 시간이 거의 없었고, 회전 속도도 비교적 느린데, 이는 초신성 폭발 이후 인근의 어떤 별과도 상호작용하지 않았음을 시사한다.<\/p><p>그러나 행성을 거느린 또 다른 펄서에 관한 새로운 증거는 한결 유망하다. 이것은 빠르게 회전하는 “밀리초 펄서”로, 훨씬 더 오래된 천체이며 이웃한 별에서 기체 물질을 끌어당긴 탓에 회전 속도가 빨라졌다고 여겨진다. 그런 펄서 둘레에 소비되지 않고 남은 기체는 이론상 뭉쳐서 행성이 될 수 있다. 또는 펄서가 내뿜는 복사가 동반성을 기화시켜 행성 형성에 쓰일 새 물질을 공급했을 수도 있다.<\/p>", "strat": "<p><b>질문 2 — 유형 RC-02<\/b><\/p><ul><li><b>주제 문장 = S5<\/b> — 두 단락 글의 둘째 단락 첫 문장이 But으로 첫 발견과 대비하며 다른 펄서의 행성 증거가 더 유망하다고 세우고, S6~S8이 그 까닭을 풀어 준다.<\/li><li><b>두 펄서 사례의 대비<\/b>: ① 첫 펄서(젊고 느림) — 행성 존재를 설명하기 어려움(게다가 데이터 결함). ② 둘째 펄서(오래되고 빠른 밀리초 펄서) — 기체 응축·동반성 기화로 행성 형성 설명 가능 → \"더 유망.\"<\/li><li>둘 다 <b>아직 확증되지 않은<\/b> 펄서 주위 행성의 존재에 관한 발견. 저자는 그 신뢰성을 따져 봄.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (D)<\/b>: 첫 펄서는 \"rotates relatively <b>slowly<\/b>, implying that it has <b>not interacted<\/b> with any nearby star since the supernova.\" 대우(對偶)로, 만약 인근 별과 상호작용했다면 지금보다 <b>더 빠르게<\/b> 회전했을 것이다 → D. (둘째 펄서가 기체를 끌어와 회전이 빨라졌다는 서술과도 정합.)<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A(이론가들이 처음에 그 존재를 의심) — 본문은 데이터 결함을 말할 뿐, 이론가의 초기 의심은 근거 없음.<\/li><li>B(확증됐다면 둘째 펄서로 관심을 돌렸을 것) — 인과 근거 없음.<\/li><li>C(초신성이 더 강했다면 복사가 행성 형성에 선행) — 본문에 그런 조건문 근거 없음.<\/li><li>E(그에 대한 관심이 새 행성 형성 이론을 낳음) — 근거 없는 비약.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>coalesce<\/td><td>v.<\/td><td>응축되다, 합쳐지다<\/td><td>merge, condense<\/td><td>본문 \"coalesce into planets\"<\/td><\/tr><tr><td>vaporize<\/td><td>v.<\/td><td>기화시키다<\/td><td>evaporate, dematerialize<\/td><td>본문 \"vaporized a companion\"<\/td><\/tr><tr><td>remnant<\/td><td>n.<\/td><td>잔해, 나머지<\/td><td>remains, vestige<\/td><td>(거만어 외) 본문 \"remnant of supernova\"<\/td><\/tr><tr><td>subsequent<\/td><td>adj.<\/td><td>그 이후의<\/td><td>following, ensuing<\/td><td>본문<\/td><\/tr><tr><td>illustrate<\/td><td>v.<\/td><td>예시하다, 보여 주다<\/td><td>exemplify, demonstrate<\/td><td>오답 보기<\/td><\/tr><tr><td>implicate<\/td><td>v.<\/td><td>함의하다<\/td><td>imply<\/td><td>본문(implications)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q12": {"html": true, "interp": "<p>펄서(별이 초신성으로 폭발하고 남은, 초고밀도로 맥동하는 잔해)를 도는 행성이 처음으로 발견되었다는 최근의 발표는, 결함 있는 데이터에 근거한 것으로 드러났다. 만약 이 발견이 확증되었다면, 이론가들은 그런 행성이 존재한다는 사실을 설명하기 어려웠을 것이다. 초신성 폭발은 기존에 있던 행성을 틀림없이 모두 파괴했을 것이다. 바로 이 펄서는 비교적 젊어서 새 행성이 뭉쳐질 시간이 거의 없었고, 회전 속도도 비교적 느린데, 이는 초신성 폭발 이후 인근의 어떤 별과도 상호작용하지 않았음을 시사한다.<\/p><p>그러나 행성을 거느린 또 다른 펄서에 관한 새로운 증거는 한결 유망하다. 이것은 빠르게 회전하는 “밀리초 펄서”로, 훨씬 더 오래된 천체이며 이웃한 별에서 기체 물질을 끌어당긴 탓에 회전 속도가 빨라졌다고 여겨진다. 그런 펄서 둘레에 소비되지 않고 남은 기체는 이론상 뭉쳐서 행성이 될 수 있다. 또는 펄서가 내뿜는 복사가 동반성을 기화시켜 행성 형성에 쓰일 새 물질을 공급했을 수도 있다.<\/p>", "strat": "<p><b>질문 3 — 유형 RC-01<\/b><\/p><ul><li><b>주제 문장 = S5<\/b> — 두 단락 글의 둘째 단락 첫 문장이 But으로 첫 발견과 대비하며 다른 펄서의 행성 증거가 더 유망하다고 세우고, S6~S8이 그 까닭을 풀어 준다.<\/li><li><b>두 펄서 사례의 대비<\/b>: ① 첫 펄서(젊고 느림) — 행성 존재를 설명하기 어려움(게다가 데이터 결함). ② 둘째 펄서(오래되고 빠른 밀리초 펄서) — 기체 응축·동반성 기화로 행성 형성 설명 가능 → \"더 유망.\"<\/li><li>둘 다 <b>아직 확증되지 않은<\/b> 펄서 주위 행성의 존재에 관한 발견. 저자는 그 신뢰성을 따져 봄.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (A)<\/b>: 유사 현상(펄서 주위 행성)에 관한 <b>두 연구 결과<\/b>를 언급하고, <b>각각의 이론적 함의<\/b>를 논한다 → A.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>B(한 설명을 제시·기각하고 더 나은 대안 제시) — 첫 사례는 데이터 결함으로 기각이지 \"이론적 설명을 기각\"한 게 아니고, 둘째는 같은 현상의 다른 사례이지 같은 현상에 대한 대안 설명이 아님.<\/li><li>C(같은 데이터의 두 해석 비교) — 서로 다른 두 펄서(데이터)이지 한 데이터의 두 해석이 아님.<\/li><li>D(부주의한 연구 vs 엄밀한 분석) — 둘째가 더 \"엄밀한 분석\"이라고 대비한 게 아니라 더 유망한 사례일 뿐.<\/li><li>E(설명 불가 현상의 지식 현황 + 후속 연구 권고) — 연구 권고가 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>coalesce<\/td><td>v.<\/td><td>응축되다, 합쳐지다<\/td><td>merge, condense<\/td><td>본문 \"coalesce into planets\"<\/td><\/tr><tr><td>vaporize<\/td><td>v.<\/td><td>기화시키다<\/td><td>evaporate, dematerialize<\/td><td>본문 \"vaporized a companion\"<\/td><\/tr><tr><td>remnant<\/td><td>n.<\/td><td>잔해, 나머지<\/td><td>remains, vestige<\/td><td>(거만어 외) 본문 \"remnant of supernova\"<\/td><\/tr><tr><td>subsequent<\/td><td>adj.<\/td><td>그 이후의<\/td><td>following, ensuing<\/td><td>본문<\/td><\/tr><tr><td>illustrate<\/td><td>v.<\/td><td>예시하다, 보여 주다<\/td><td>exemplify, demonstrate<\/td><td>오답 보기<\/td><\/tr><tr><td>implicate<\/td><td>v.<\/td><td>함의하다<\/td><td>imply<\/td><td>본문(implications)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q1": {"html": true, "interp": "<p>액션 영화는 관객에게 액션만 잔뜩 안기고 플롯은 주지 않는다는 평판을 안고 있다. 서사의 빈곤이라는 그 평판은 디지털 효과가 점점 더 널리 쓰이면서 한층 힘을 얻은 듯하다.<\/p><p><b>해석 노트:<\/b> paucity는 단순한 '부족'보다 양이 모자라 빈약하다는 결이 있어 '빈곤'으로 옮기고, 앞 문장의 no plot과 곧바로 맞물리게 했다. that reputation for narrative paucity를 '서사적 빈곤에 대한 평판'으로 직역하면 조사가 겹쳐 겉돌기에 '서사의 빈곤이라는 그 평판'으로 동격화했다. gained further traction은 견인력이라는 원래의 비유를 그대로 살리기보다 '한층 힘을 얻다'로 관용화하고, seems to have gained의 완료·추정을 '얻은 듯하다'로 한 어미에 담았다. increasingly ubiquitous use라는 명사구는 절로 풀어 '점점 더 널리 쓰이면서'로 옮겨 원인의 흐름을 살렸다.<\/p>", "strat": "<ul><li>앞 절 \"all action and <b>no plot<\/b>(플롯 없음)\"이 빈칸을 그대로 가리킨다(trigger-06 반복): \"narrative 빈칸\"의 평판 = \"플롯이 없다\"는 평판. → 빈칸 = \"결핍/부족(paucity)\".<\/li><li>4Rules 문어체: \"reputation for narrative ___\" = 서사가 ___하다는 평판 = 서사가 <b>모자란다<\/b>.<\/li><\/ul>", "correct": "<ul><li><b>paucity<\/b>(부족, 결핍): \"no plot\"의 명사화 = 서사의 결핍.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Action cinema has a reputation for giving spectators all action and no plot, and that reputation for narrative <b>paucity<\/b> seems to have gained further traction with the increasingly ubiquitous use of digital effects.<\/p>", "wrong": "<ul><li><b>homogeneity<\/b>(균질성)·<b>predictability<\/b>(예측 가능성)·<b>convolution<\/b>(복잡함)·<b>diffuseness<\/b>(산만함): 모두 서사가 <b>존재하되 어떤 성질<\/b>을 가졌다는 말. 앞 절은 서사가 \"없다(no plot)\"이므로, 성질이 아니라 <b>양의 부족<\/b>(paucity)이 정확.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>paucity<\/td><td>n.<\/td><td>부족, 결핍<\/td><td>dearth, scarcity<\/td><td><\/td><\/tr><tr><td>homogeneity<\/td><td>n.<\/td><td>균질성<\/td><td>uniformity<\/td><td>(거만어 외)<\/td><\/tr><tr><td>convolution<\/td><td>n.<\/td><td>복잡함, 뒤얽힘<\/td><td>intricacy, complexity<\/td><td>(거만어 외)<\/td><\/tr><tr><td>diffuseness<\/td><td>n.<\/td><td>산만함, 장황함<\/td><td>verbosity, prolixity<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q2": {"html": true, "interp": "<p>많은 동물행동학자(ethologist)는 동물이 무언가를 짓는 행동에서 양육(nurture)이 하는 역할을 선뜻 일축해 왔고 — 그런 행동을 순전히 타고난 회로에 새겨진(hardwired) 것으로 여기는 데 만족한 채 — 본능과 학습은 서로 양립할 수 없다는, 최근에야 비로소 도전받기 시작한 가정 아래 연구해 왔다.<\/p><p><b>해석 노트:<\/b> hardwired는 회로가 붙박이로 배선되어 있다는 비유이므로 '선천적'이라는 밋밋한 말 대신 '타고난 회로에 새겨진'으로 옮겨 원어의 기계 비유를 남겼다. incompatible은 함께 놓일 수 없다는 뜻이라 '양립할 수 없다'로 받아, 본능이면 학습이 아니라는 이분법이 드러나게 했다. animal building behaviors는 둥지·굴처럼 무엇을 짓는 행동을 통칭하므로, 원문에 없는 '둥지'를 끼워 넣지 않고 '동물이 무언가를 짓는 행동'으로 옮겼다. 괄호 안의 being content to think…는 일축의 배경이 되는 태도라 원문처럼 삽입구로 두었고, assumption에 끼어든 only recently challenged는 '최근에야 비로소 도전받기 시작한'으로 풀어 가정을 앞에서 수식하게 했다. 완료시제 have dismissed·have worked는 '∼해 왔다'로 통일해 오래된 관행임을 드러냈다.<\/p>", "strat": "<ul><li><b>괄호는 콜론 대용<\/b>이다(trigger-05). «(being content to think of them as purely (i) ___)»는 앞 절 «양육의 역할을 선뜻 일축했다»를 풀어 설명한다. 괄호 속은 <b>분사구문<\/b>이다(trigger-03 — being content …). 앞 절을 노골적으로 부연하는 자리이므로 (i)은 «양육을 일축한다»와 같은 방향이어야 한다.<\/li><li>(i): \"양육(후천)의 역할을 일축하고 순전히 …로 여김\" → 본능(선천) 쪽 = <b>hardwired(타고난·내장된)<\/b>. (양육=nurture를 부정하니 반대편 nature.)<\/li><li>(ii): \"본능과 학습이 …라는 가정\" — 본능을 hardwired로만 보면 <em>본능과 학습이 양립 불가<\/em>라고 가정한 것. = <b>incompatible(양립 불가)<\/b>. (동격·부연 trigger-04 — 신호어 <code>the assumption, only recently challenged, that …<\/code>: 동격 that절이 «가정»의 내용을 풀고, (i) hardwired 관점이 (ii) 본능↔학습 분리로 이어짐.)<\/li><\/ul>", "correct": "<ul><li><b>(i) hardwired(타고난, 내장된)<\/b>: 양육이 아닌 <em>본능<\/em>만의 산물로 봄.<\/li><li><b>(ii) incompatible(양립할 수 없는)<\/b>: 본능과 학습이 함께 갈 수 없다는 가정.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Many ethologists have readily dismissed the role of nurture in animal building behaviors (being content to think of them as purely <b>hardwired<\/b>) and have worked under the assumption, only recently challenged, that instinct and learning are <b>incompatible<\/b>.<\/p>", "wrong": "<ul><li>(i) aberrant(일탈적인)·logical(논리적인): \"양육 부정→본능\"의 맥락과 안 맞음.<\/li><li>(ii) interchangeable(호환되는)·efficient(효율적인): \"본능 vs 학습 분리\" 가정과 반대/무관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>hardwired<\/td><td>adj.<\/td><td>(행동이) 타고난, 내장된<\/td><td>innate, ingrained<\/td><td>(거만어 외) ↔ learned<\/td><\/tr><tr><td>incompatible<\/td><td>adj.<\/td><td>양립할 수 없는<\/td><td>irreconcilable, at odds<\/td><td>(거만어 외)<\/td><\/tr><tr><td>ethologist<\/td><td>n.<\/td><td>동물행동학자<\/td><td>—<\/td><td>(거만어 외)<\/td><\/tr><tr><td>nurture<\/td><td>n.<\/td><td>양육, 후천적 환경<\/td><td>upbringing<\/td><td>(거만어 외) ↔ nature/instinct<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q3": {"html": true, "interp": "<p>북부 멕시코의 가지뿔영양은 옛 시대의 유물처럼 남은 잔존종(a relict species)으로 볼 수 있다. 이 영양의 주된 역사적 서식지였던 북미 대초원의 대부분이 세월이 흐르며 사라져 버렸기(disappeared over time) 때문이다.<\/p><p><b>해석 노트:<\/b> relict는 지질·생물학에서 옛 시대의 유물처럼 남은 개체군을 가리키므로 '잔존종'이라는 정착 역어를 쓰되 '옛 시대의 유물처럼 남은'을 덧붙여 결을 살리고 원어를 병기했다. 접속사 as는 '~이므로'로 한 문장에 욱여넣는 대신 뒤 절을 독립 문장으로 끊고 '~때문이다'로 받아, 판단(주절)과 근거(종속절)의 순서를 한국어 논리 흐름에 맞췄다. has disappeared over time의 현재완료는 지금까지 이어진 결과라는 상(相)을 살려 '사라져 버렸다'로, over time은 '세월이 흐르며'로 옮겨 점진성을 드러냈다. its chief historical habitat는 동격 삽입구라 관계절로 늘이지 않고 '~였던'이라는 관형절로 앞당겨 읽기 부담을 줄였다.<\/p>", "strat": "<p><code>as<\/code>(trigger-02 인과 — \"왜냐하면\")가 (i)과 (ii)을 묶는다. (ii) = (i)의 근거. 빈칸끼리 관계로 추론(trigger-18): 서식지에 무슨 일이 생겨서 영양이 특정 종이 되었는가.<\/p><ul><li>(ii): 서식지(대초원) 대부분이 \"<b>사라졌다<\/b>\"면 → 영양은 옛 환경의 잔존물이 된다.<\/li><li>(i): 과거의 광범위 분포에서 남은 \"<b>잔존 종(relict)<\/b>\". (ii)(서식지 소멸)이 (i)(잔존 종)의 원인.<\/li><\/ul>", "correct": "<ul><li>(i) <code>a relict<\/code>(잔존 종): 옛 서식지가 사라져 일부만 남은 유존(遺存) 종.<\/li><li>(ii) <code>disappeared over time<\/code>(시간이 지나며 사라졌다): 대초원 소멸이 잔존 종이 된 이유.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>The pronghorn antelope in northern Mexico may be viewed as <b>a relict<\/b> species, as most of the North American prairie, its chief historical habitat, has <b>disappeared over time<\/b>.<\/p>", "wrong": "<ul><li>(i) <code>an endemic<\/code>(고유종)·<code>a hybrid<\/code>(잡종): endemic은 \"한 지역 고유\"라는 뜻으로 \"서식지 소멸\"이 원인이 못
