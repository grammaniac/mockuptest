status. Recently, however, as interest in memoirs has grown, writers and publishers have outflanked critics: \"memoir\" is now the prestige term.", "passageGroupId": "G_1061", "rangeLabel": "S2 Q14-Q15", "questionText": "The author mentions the \"article\" primarily to", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "show how a particular distinction has become blurred"}, {"label": "B", "text": "cite an argument that challenges a widespread view"}, {"label": "C", "text": "demonstrate that a change has occurred over time"}, {"label": "D", "text": "note an example of a scholarly controversy"}, {"label": "E", "text": "illustrate a claim about a particular term"}], "answer": ["E"]}]}], "passageGroups": {"G_873": {"appliedTo": ["S1-Q4", "S1-Q5"], "range": "S1 Q4-Q5"}, "G_141": {"appliedTo": ["S1-Q10", "S1-Q11", "S1-Q12"], "range": "S1 Q10-Q12"}, "G_1073": {"appliedTo": ["S2-Q5", "S2-Q6"], "range": "S2 Q5-Q6"}, "G_741": {"appliedTo": ["S2-Q7", "S2-Q8", "S2-Q9"], "range": "S2 Q7-Q9"}, "G_310": {"appliedTo": ["S2-Q13"], "range": "S2 Q13"}, "G_1061": {"appliedTo": ["S2-Q14", "S2-Q15"], "range": "S2 Q14-Q15"}}, "explanations": {"S1-Q1": {"html": true, "interp": "<p>블레이크(Blake)가 유약하다는 평판은 그럴듯해 보일 뿐 실속이 없다. 그와 함께 일해 본 사람은 거의 모두가 그를 절제력 있고, 지적으로 만만치 않으며, 매우 강단 있는 정치인이라고 말한다.<\/p><p><b>해석 노트:<\/b> specious는 \"거짓\"이 아니라 겉보기의 그럴듯함과 속의 부실함이 한 낱말에 겹쳐 있으므로, 한 단어로 옮기지 않고 \"그럴듯해 보일 뿐 실속이 없다\"로 두 겹을 펼쳐 옮겼다. 콜론은 뒤가 근거 제시이므로 한국어에서는 문장을 끊고 이어 읽게 두는 편이 자연스럽다. 현재완료 have worked with him은 경험의 상을 살려 \"일해 본\"으로, formidable은 물리적 위압이 아니라 지적 상대하기 어려움이므로 \"만만치 않으며\"로 옮겼다.<\/p>", "strat": "<ul><li>trigger-05 콜론(:) — 콜론 뒤가 빈칸을 <b>부연<\/b>. 콜론 뒤는 \"사실은 강하고 만만치 않다\"는 정반대 증언.<\/li><li>trigger-10 — \"유약하다는 평판\"과 \"실은 강함\"이 <b>모순<\/b>. 즉 그 평판은 <em>겉보기엔 그럴듯하나 실은 틀린<\/em> 것 → 빈칸 = <b>specious(그럴듯하지만 허위인)<\/b>.<\/li><\/ul>", "correct": "<ul><li><b>specious(그럴듯하나 거짓인)<\/b>: \"유약\" 평판은 표면적으로 통용되지만 실제(강단 있는 정치인)와 어긋남 → <em>허울뿐인<\/em> 평판. 콜론 뒤 반박 증언이 그것을 폭로.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Blake’s reputation for weakness is <b>specious<\/b>: almost all who have worked with him say he is disciplined, intellectually formidable, and a very tough politician.<\/p>", "wrong": "<ul><li><b>pervasive(널리 퍼진)<\/b>: 평판이 <em>퍼졌다<\/em>는 분포일 뿐, 그것이 <em>거짓<\/em>임을 콜론 뒤 반박과 연결하지 못함.<\/li><li><b>irreversible(되돌릴 수 없는)<\/b>: 평판의 거짓 여부와 무관한 속성.<\/li><li><b>trivial(사소한)<\/b>: 콜론 뒤는 \"사소함\"이 아니라 \"사실과 반대\"를 말함 — 핵심은 허위성.<\/li><li><b>ambivalent(상반된 감정의)<\/b>: 증언이 한결같이 \"강하다\"이므로 <em>양가적<\/em>이지 않음 — 모순.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>specious<\/td><td>adj.<\/td><td>그럴듯하나 거짓인<\/td><td>deceptive, plausible-but-false<\/td><td>정답<\/td><\/tr><tr><td>pervasive<\/td><td>adj.<\/td><td>널리 퍼진<\/td><td>ubiquitous, prevalent<\/td><td>오답<\/td><\/tr><tr><td>ambivalent<\/td><td>adj.<\/td><td>상반된 감정의<\/td><td>conflicted, equivocal<\/td><td>오답<\/td><\/tr><tr><td>formidable<\/td><td>adj.<\/td><td>만만찮은, 대단한<\/td><td>daunting, redoubtable<\/td><td>본문 단서<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q2": {"html": true, "interp": "<p>튀니지 패션 디자이너 살라 바르카(Salah Barka)가 지은 의상은 스타일 면에서 절제되어(understated) 있지는 않지만, 지역의 문화와 역사를 끌어들이는 방식만큼은 은근하다. 즉 바르카는 한눈에 알아볼 만한 토착 양식 요소를 그대로 복제하지 않으면서 아프리카를 환기해 낸다(evoke).<\/p><p><b>해석 노트:<\/b> subtle을 '미묘한'으로 옮기면 모호하다는 군더더기 뉘앙스가 붙으므로, 드러내지 않으면서 스며들게 한다는 결을 살려 '은근하다'로 했다. references는 명사 그대로 '언급'이라 하면 딱딱해져 '끌어들이는 방식'으로 풀었고, 앞 문장을 풀어 설명하는 콜론은 '즉'으로 받았다. direct reproduction of는 '직접 재현'보다 원본을 그대로 베껴 온다는 어감이 강해 '그대로 복제하다'로 옮겨, 절제되지 않은 스타일과 은근한 참조 사이의 역설이 살아나게 했다.<\/p>", "strat": "<p>콜론(<code>:<\/code>)이 (i)를 부연한다(trigger-05). 콜론 뒤 = \"쉽게 알아볼 토착 요소를 <em>(ii)하지 않고도<\/em> 아프리카를 환기한다\". <code>without (ii)<\/code>가 핵심 — <em>직접 드러내지 않고<\/em> 은근히 환기한다는 뜻.<\/p><ul><li>(i): \"지역 문화 <em>언급<\/em> 방식이 (i)하다\" + 콜론 뒤 \"직접 드러내지 않고 환기\" → (i) = \"은근한·미묘한(subtle)\". 앞의 <code>though not understated in style<\/code>(스타일은 절제 안 됨)과 역접(trigger-10)으로, <em>스타일<\/em>은 화려해도 <em>언급 방식<\/em>은 미묘하다는 대조.<\/li><li>(ii): <code>without (ii) readily discernible indigenous elements<\/code> — 토착 요소를 \"그대로 베끼지 않고\" 환기. (ii) = \"직접 재현\".<\/li><\/ul>", "correct": "<ul><li><b>(i) subtle(미묘한·은근한)<\/b> — 토착 요소를 노골적으로 쓰지 않고 은근히 암시.<\/li><li><b>(ii) direct reproduction of(~의 직접 재현)<\/b> — 알아보기 쉬운 토착 요소를 <em>그대로 베끼지 않으면서<\/em> 아프리카를 환기.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>The garments created by Tunisian fashion designer Salah Barka, though not understated in style, are <b>subtle<\/b> in their references to local cultures and histories: Barka evokes Africa without <b>direct reproduction of<\/b> readily discernible indigenous stylistic elements.<\/p>", "wrong": "<ul><li><b>(i) commanding(위풍당당한)<\/b> — \"언급의 미묘함\"이 아니라 \"강렬함\". 콜론 뒤(은근히 환기)와 모순.<\/li><li><b>(i) inconsistent(일관성 없는)<\/b> — 본문에 근거 없음.<\/li><li><b>(ii) obvious departure from(~에서의 명백한 일탈)<\/b> — \"토착 요소에서 <em>벗어나지<\/em> 않고 환기\"가 되어, \"쉽게 알아볼 요소\"를 쓰면서 환기한다는 모순.<\/li><li><b>(ii) imaginative adaptations of(~의 창의적 각색)<\/b> — <code>without<\/code> 뒤에 오면 \"창의적 각색 <em>없이<\/em> 환기\"가 되어, subtle(미묘함)의 정답 논리와 어긋난다(각색 없이는 오히려 직접적).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>subtle<\/td><td>adj.<\/td><td>미묘한, 은근한, 절묘한<\/td><td>understated, nuanced, delicate<\/td><td>(거만어). 정답(i)<\/td><\/tr><tr><td>understate<\/td><td>v.<\/td><td>절제해 표현하다, 축소해 말하다<\/td><td>downplay, soft-pedal<\/td><td>(거만어). 본문 understated<\/td><\/tr><tr><td>indigenous<\/td><td>adj.<\/td><td>토착의, 원산의<\/td><td>native, aboriginal<\/td><td>(거만어). 본문 단서<\/td><\/tr><tr><td>commanding<\/td><td>adj.<\/td><td>위풍당당한, 압도적인<\/td><td>imposing, dominant<\/td><td>(거만어 외). 오답(i)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q3": {"html": true, "interp": "<p>폴린 케일(Pauline Kael)의 첫 영화평은, 채플린(Chaplin)이 슬랩스틱 광대라는 제 뿌리를 내세우기보다 희극 예술가의 외투를 걸쳤다며 그를 매섭게 몰아붙였다. 케일만큼 고상한 독서 취향을 지닌 평론가가 위를 넘보는 오락 영화인들을 허세를 부린다며 공격하고 주류 오락물이던 영화들을 편든다는 것은 이상해 보일 법하다. 그러나 그런 입장 자체가 엘리트주의적(elitist)으로 비칠 수 있다. 마치 문학만이 진지함을 지향해야 한다는 듯, 참된 예술이라는 어떤 관념을 대중의 침범(popular encroachment)으로부터 지켜 내는(guards) 셈이기 때문이다.<\/p><p><b>해석 노트:<\/b> elitist는 굳은 역어 '엘리트주의적'을 쓰되 be seen as를 '비치다'로 옮겨, 케일이 스스로 그렇게 자처한 것이 아니라 그렇게 보인다는 거리감을 남겼다. guards는 단순한 '보호한다'가 아니라 성역을 지키는 문지기의 결이 있어 '지켜 내다'로, encroachment는 슬금슬금 밀고 들어오는 잠식의 어감을 살려 '침범'으로 옮겼다. as it guards의 이유절은 한국어에서 앞으로 끌면 문장이 늘어지므로 문장을 끊어 '~하기 때문이다'로 뒤에 놓았고, as if절은 그 안에서 앞자리로 당겨 '마치 ~라는 듯'으로 먼저 읽히게 했다. 세 빈칸은 한 논리로 묶인다 — 오락은 오락답게 있으라는 요구가 결국 '진짜 예술'의 영역을 대중에게서 지켜 내는 태도(elitist)가 된다.<\/p>", "strat": "<p><b>먼저 세 조각을 하나로 묶는다.<\/b> 둘째 문장에는 따로 노는 듯한 세 가지가 나온다 — ① 케일의 <em>고상한 독서 취향<\/em>, ② <em>예술가 행세하는<\/em> 영화인들에 대한 공격, ③ 오히려 <em>주류 오락 영화<\/em>를 옹호. 문장이 스스로 \"이상해 보인다(<code>It might seem strange<\/code>)\"고 말하는 이유가 여기 있다. 고상한 취향의 평론가라면 예술을 지향하는 쪽을 편들 것 같은데, 정반대로 굴기 때문이다.<\/p><p><code>Yet<\/code> 뒤에서 그 이상함이 풀린다. <b>②와 ③은 모순이 아니라 하나의 원리에서 나온 두 반응<\/b>이다. 케일은 \"참된 예술\"의 경계를 미리 그어 두었고 — 경계를 넘보는 자(예술가를 자처하는 영화인)는 치고, 경계를 넘지 않는 자(스스로 오락이라 자처하는 영화)는 편든다. 그러니 소탈해 보이는 그 태도는 실은 <b>\"영화는 오락에 머물러라\"는 판단<\/b>이고, 그 판단 자체가 이미 대중예술을 아래로 보는 것이다. ①의 고상한 취향은 그 경계선이 어디에 그어졌는지 알려주는 단서다. → (i)이 <code>elitist<\/code>인 까닭.<\/p><blockquote>💡 <b>비유<\/b> — 문학만 '진짜 예술'이라 믿는 평론가를 떠올리면 된다. 웹툰 작가가 \"그냥 재밌는 웹툰 그립니다\" 하면 오히려 흐뭇해하고, \"저는 예술가입니다, 순수문학급입니다\" 하면 발끈한다. 두 반응은 서로 어긋나 보이지만 <b>같은 경계 수호<\/b>다. 케일이 하는 일이 정확히 이것이다.<\/blockquote><p>이제 신호어로 확인한다. <code>Yet<\/code>로 시작하는 반전(trigger-10) — \"대중 영화를 옹호하는 듯한 케일의 입장이 <em>그 자체로는<\/em> (i)으로 보인다\". 끝의 <code>as if only literature should aspire to seriousness<\/code>(문학만이 진지함을 추구해야 한다는 듯)가 결정적 단서: 참된 예술을 소수(문학)에게만 허용하는 <b>엘리트주의<\/b>적 태도. → (i) <code>elitist<\/code>.<\/p><ul><li><b>(ii)+(iii)<\/b>: \"참된 예술이라는 관념을 (iii)으로부터 (ii)한다\". 엘리트주의라면, 참된 예술의 영역을 <em>대중의 침범<\/em>으로부터 <b>지킨다<\/b>. <code>from<\/code>은 동사 <code>guards X from Y<\/code>의 전치사로 \"X를 Y로부터 지키다\"라는 방어·구별 축을 만든다. (iii)=대중의 침범(popular encroachment), (ii)=지킨다(guards). (trigger-16 only로 \"문학만\"을 강조해 엘리트주의를 확증.)<\/li><\/ul>", "correct": "<ul><li>(i) <b>elitist(엘리트주의의)<\/b> — \"문학만이 진지함을 추구\"라는 소수 특권적 태도.<\/li><li>(ii) <b>guards(지킨다)<\/b> — 참된 예술의 영역을 방어.<\/li><li>(iii) <b>popular encroachment(대중의 침범)<\/b> — 그 영역을 위협하는 것으로 상정된 대상.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Pauline Kael’s first movie review tore into Charlie Chaplin for taking up the mantle of comic artist rather than claiming his roots as slapstick clown. It might seem strange that a reviewer with such highbrow reading tastes as Kael had would attack upward-reaching film entertainers for their pretensions and champion films that were mainstream entertainments. Yet such a stance could itself be seen as <b>elitist<\/b>, as it <b>guards<\/b> a certain idea of true art from <b>popular encroachment<\/b>, as if only literature should aspire to seriousness.<\/p>", "wrong": "<ul><li>(i) <b>ascetic(금욕적인)·egalitarian(평등주의의)<\/b> — egalitarian은 \"문학만\"이라는 소수특권과 정반대, ascetic은 무관.<\/li><li>(ii) <b>redeems(구원한다)·displaces(밀어낸다)<\/b> — \"from ~로부터 지킨다\"의 방어 구도와 안 맞음.<\/li><li>(iii) <b>enervating refinement(맥 빠지게 하는 세련됨)·revolutionary claims(혁명적 주장)<\/b> — \"대중으로부터 예술을 지킨다\"는 엘리트 구도의 상대항(대중 침범)이 아님.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>elitist<\/td><td>adj./n.<\/td><td>엘리트주의의, 선민의식의<\/td><td>exclusive, snobbish<\/td><td>(거만어 외)<\/td><\/tr><tr><td>encroachment<\/td><td>n.<\/td><td>침범, 잠식<\/td><td>intrusion, infringement<\/td><td>(거만어 외)<\/td><\/tr><tr><td>ascetic<\/td><td>adj./n.<\/td><td>금욕적인; 금욕주의자<\/td><td>austere, abstemious<\/td><td><\/td><\/tr><tr><td>egalitarian<\/td><td>adj.<\/td><td>평등주의의<\/td><td>equalitarian<\/td><td><\/td><\/tr><tr><td>enervate<\/td><td>v.<\/td><td>기력을 빼앗다<\/td><td>weaken, sap<\/td><td>(enervating)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q4": {"html": true, "interp": "<p>실험과 야외 관찰에 따르면, 지중해 식물 군집에서 가뭄은 관목 묘목(shrub seedling) 정착에 <em>반직관적으로 <span class=\"highlighted\">긍정적 효과<\/span><\/em>를 미친다. <em>한해살이(annuals)와의 경쟁이 줄기 때문<\/em>에, 가뭄은 관목 묘목에 기회를 늘린다. 비(非)가뭄 조건에서는 한해살이가 관목 묘목과 더 효과적으로 <em>경쟁<\/em>했는데, 이는 \"한해살이가 관목 묘목보다 물 가용성 증가에서 더 이득을 본다\"는 실험자들의 가정을 확인해 준다. 이는 한해살이가 토양 자원을 더 빠르게 혹은 더 효율적으로 흡수하기 때문일 수 있다. 비슷한 양상은 다른 반건조 군집에서도 관찰된다. 주레나(Jurena)와 아처(Archer)는 사바나 군집에서, 더 습한 조건에서는 <em>풀의 뿌리 생물량이 늘어<\/em> 관목 묘목의 침입(encroachment)에 대한 <em>초지의 취약성이 줄었음<\/em>을 보였다.<\/p>", "strat": "<p><b>질문 1 — RC-02<\/b><\/p><p><b>주제 = S1<\/b>. 전달동사(Experiments … show that)이지만 «counterintuitively positive effect»라는 <b>저자 평가어<\/b>가 붙은 발견이라 그 결과 진술 자체가 논지다 — 사실 나열로 보지 않는다.<\/p><p>핵심 인과: 가뭄 → <em>한해살이 경쟁 약화<\/em> → 관목 묘목에 유리(반직관적 긍정 효과). 즉 묘목 자신이 물을 더 쓰는 게 아니라, <em>경쟁자(한해살이)가 억제<\/em>되는 것이 비결. FAC 문장 기능 — 가설 확인형.<\/p>", "correct": "<p>신호어: <code>It can be inferred … the \"positive effect\" occurs because<\/code> → 추론(RC-02).<\/p><ul><li><b>★해법<\/b>: the positive effect를 주어로 재구성한다 — 본문은 바로 «한해살이와의 경쟁 감소» 때문이라고 밝힌다. 묘목 자신이 아니라 경쟁자의 억제를 원인으로 보는 보기를 고르고, 가뭄이 물 부족을 푼다거나 묘목이 더 효율적이라는 등 인과를 뒤집은 보기는 버린다.<\/li><li><b>정답 C — \"<em>특정 다른 식물(한해살이)의 성장이 억제<\/em>되기 때문\"<\/b><\/li><li>근거: 본문 \"<em>한해살이와의 경쟁 감소<\/em> 때문에 가뭄이 관목 묘목 기회를 늘린다\". 경쟁자 억제가 직접 원인. 비약 없음.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A \"물이 <em>제한 요인이기를 멈춤<\/em>\" — 가뭄은 물을 <em>더 부족<\/em>하게 함(반대). B \"묘목이 성숙 식물보다 물을 <em>덜<\/em> 필요\" — 본문 무관. D \"건조 조건이 <em>다양한 한해살이를 선호<\/em>\" — 오히려 한해살이가 <em>불리<\/em>해짐. E \"관목 묘목이 다른 묘목보다 자원을 <em>더 효율적으로<\/em> 흡수\" — 본문은 <em>한해살이가<\/em> 더 효율적이라 함(반대).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>seedling<\/td><td>n.<\/td><td>묘목, 모종<\/td><td>sapling<\/td><td>(거만어 외) 본문 핵심<\/td><\/tr><tr><td>annual<\/td><td>n.<\/td><td>한해살이 식물<\/td><td>annual plant<\/td><td>(거만어 외) 경쟁자<\/td><\/tr><tr><td>counterintuitive<\/td><td>adj.<\/td><td>반직관적인<\/td><td>surprising, paradoxical<\/td><td>(거만어 외) 긍정 효과 성격<\/td><\/tr><tr><td>encroachment<\/td><td>n.<\/td><td>침입, 잠식<\/td><td>intrusion, incursion<\/td><td>(거만어 외) \"shrub encroachment\"<\/td><\/tr><tr><td>biomass<\/td><td>n.<\/td><td>생물량<\/td><td>—<\/td><td>(거만어 외) 풀 뿌리량<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q5": {"html": true, "interp": "<p>실험과 야외 관찰에 따르면, 지중해 식물 군집에서 가뭄은 관목 묘목(shrub seedling) 정착에 <em>반직관적으로 <span class=\"highlighted\">긍정적 효과<\/span><\/em>를 미친다. <em>한해살이(annuals)와의 경쟁이 줄기 때문<\/em>에, 가뭄은 관목 묘목에 기회를 늘린다. 비(非)가뭄 조건에서는 한해살이가 관목 묘목과 더 효과적으로 <em>경쟁<\/em>했는데, 이는 \"한해살이가 관목 묘목보다 물 가용성 증가에서 더 이득을 본다\"는 실험자들의 가정을 확인해 준다. 이는 한해살이가 토양 자원을 더 빠르게 혹은 더 효율적으로 흡수하기 때문일 수 있다. 비슷한 양상은 다른 반건조 군집에서도 관찰된다. 주레나(Jurena)와 아처(Archer)는 사바나 군집에서, 더 습한 조건에서는 <em>풀의 뿌리 생물량이 늘어<\/em> 관목 묘목의 침입(encroachment)에 대한 <em>초지의 취약성이 줄었음<\/em>을 보였다.<\/p>", "strat": "<p><b>질문 2 — RC-03<\/b><\/p><p><b>주제 = S1<\/b>. 전달동사(Experiments … show that)이지만 «counterintuitively positive effect»라는 <b>저자 평가어<\/b>가 붙은 발견이라 그 결과 진술 자체가 논지다 — 사실 나열로 보지 않는다.<\/p><p>핵심 인과: 가뭄 → <em>한해살이 경쟁 약화<\/em> → 관목 묘목에 유리(반직관적 긍정 효과). 즉 묘목 자신이 물을 더 쓰는 게 아니라, <em>경쟁자(한해살이)가 억제<\/em>되는 것이 비결. FAC 문장 기능 — 가설 확인형.<\/p>", "correct": "<p>신호어: <code>The author … would most likely agree with which … about the growth of shrub seedlings?<\/code> → 동의(RC-03).<\/p><ul><li><b>★해법<\/b>: agree의 주어는 저자, 목적어는 «가뭄의 긍정 효과 = 경쟁자 억제»라는 인과다. 이 인과를 경쟁자가 있을 때와 없을 때에 각각 적용해 저자 논리와 맞는 보기를 고르고, 강수 증가나 가뭄의 효과 방향을 뒤집은 보기는 버린다.<\/li><li><b>정답 C — \"묘목을 <em>고립시켜<\/em> 기르면, 물 제한은 그 성장에 <em>긍정적 영향을 주지 않을<\/em> 것.\"<\/b><\/li><li>근거: 가뭄의 긍정 효과는 <em>경쟁자(한해살이) 억제<\/em>에서 옴. 경쟁자가 없는 <em>고립<\/em> 조건이면 물 제한은 묘목 자체엔 이로울 게 없음(오히려 부족). 저자 인과 논리와 정합.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A \"자연 조건에서 물 가용성이 묘목 성장과 <em>양의 상관<\/em>\" — 본문은 (경쟁 탓에) <em>가뭄<\/em>이 묘목에 유리하다 함(반대 뉘앙스). B \"반건조 기후에서 <em>더 습한 조건이 묘목 성장에 영향 없음<\/em>\" — 주레나·아처는 습할수록 풀이 우세해 묘목 침입이 <em>줄었다<\/em> 함(영향 있음). D \"한해살이 경쟁이 있으면, 묘목 성장이 <em>강수 증가로 이득<\/em>\" — 강수 증가는 <em>한해살이<\/em>를 유리하게 해 묘목엔 불리(반대). E \"한해살이가 잘 자리잡은 곳에서 가뭄이 묘목 성장에 <em>부정적<\/em>\" — 정반대(가뭄=긍정).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>seedling<\/td><td>n.<\/td><td>묘목, 모종<\/td><td>sapling<\/td><td>(거만어 외) 본문 핵심<\/td><\/tr><tr><td>annual<\/td><td>n.<\/td><td>한해살이 식물<\/td><td>annual plant<\/td><td>(거만어 외) 경쟁자<\/td><\/tr><tr><td>counterintuitive<\/td><td>adj.<\/td><td>반직관적인<\/td><td>surprising, paradoxical<\/td><td>(거만어 외) 긍정 효과 성격<\/td><\/tr><tr><td>encroachment<\/td><td>n.<\/td><td>침입, 잠식<\/td><td>intrusion, incursion<\/td><td>(거만어 외) \"shrub encroachment\"<\/td><\/tr><tr><td>biomass<\/td><td>n.<\/td><td>생물량<\/td><td>—<\/td><td>(거만어 외) 풀 뿌리량<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q6": {"html": true, "interp": "<p>초기 푸에르토리코 노동자들의 식단을 이루는 재료로서 옥수숫가루가 지녔던 한 가지 미덕은 그 맛이 순하다는 점이었다. 바로 그 순함 덕분에 옥수숫가루는 다른 음식의 강한 맛을 누그러뜨릴 수 있었다.<\/p><p><b>해석 노트:<\/b> the mildness of its taste는 명사 대 명사로 옮기면 굳어지므로 ‘맛이 순하다는 점’이라는 서술형 명사구로 풀었다. temper는 쇠를 담금질해 성질을 다스린다는 뜻에서 온 말이라 강한 맛을 없애는 것이 아니라 그 모서리를 깎아 부드럽게 만든다는 결이 있어 ‘누그러뜨리다’로 옮겼다. 다른 정답인 neutralize를 넣으면 ‘중화하다’가 되어 같은 취지의 문장이 된다. 동격절 a trait that ...은 우리말에서 앞으로 걸면 늘어지므로 문장을 끊고 ‘바로 그 순함 덕분에’로 받아 인과를 드러냈다.<\/p>", "strat": "<p>4Rules 문어체·동격(trigger-04 — <code>a trait that enabled it to ...<\/code>가 mildness를 부연). 옥수숫가루의 \"맛의 순함(mildness)\"이 원인 → 다른 음식의 \"강한 맛(strong flavors)\"을 <b>누그러뜨림·중화함<\/b>. 순한 것이 강한 맛을 완화한다는 인과. 빈칸 = \"완화하다, 약화시키다, 중화하다\".<\/p>", "correct": "<p>SE — \"완화·중화하다\" 동의어 둘.<\/p><ul><li><code>temper<\/code>(누그러뜨리다, 완화하다) — 강한 맛을 순하게.<\/li><li><code>neutralize<\/code>(중화하다, 상쇄하다) — temper와 \"강함을 약화시킴\" 의미로 pair.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>One virtue of cornmeal as a component of the diets of laborers in early Puerto Rico was the mildness of its taste, a trait that enabled it to <b>temper<\/b> the strong flavors of other foods.<\/p>", "wrong": "<ul><li><code>mimic<\/code>(흉내 내다) — 강한 맛을 \"따라 함\"이라 \"완화\"와 무관.<\/li><li><code>camouflage<\/code>(위장하다, 감추다) — 맛을 \"가림\"일 뿐 \"약화\"와 다름. pair 약함.<\/li><li><code>complement<\/code>(보완하다)·<code>augment<\/code>(증대하다) — 둘 다 강한 맛을 \"더함\" 방향이라 \"순함이 강함을 누름\"과 정반대.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>temper<\/td><td>v.<\/td><td>누그러뜨리다, 완화하다<\/td><td>moderate, mitigate<\/td><td>정답<\/td><\/tr><tr><td>neutralize<\/td><td>v.<\/td><td>중화하다, 상쇄하다<\/td><td>counteract, offset<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>camouflage<\/td><td>v.<\/td><td>위장하다, 감추다<\/td><td>disguise, mask<\/td><td>오답<\/td><\/tr><tr><td>complement<\/td><td>v.<\/td><td>보완하다<\/td><td>supplement, round out<\/td><td>오답<\/td><\/tr><tr><td>augment<\/td><td>v.<\/td><td>증대하다, 늘리다<\/td><td>increase, amplify<\/td><td>오답<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q7": {"html": true, "interp": "<p>실제로 일어난 일에 대한 사람들의 인식에 그 영화가 미친 영향은, 허구가 역사를 밀어내고 그 자리를 대신 차지하는 힘을 여실히 보여 준다. 명백히 부정확한데도(patently inaccurate), 그 영화가 들려주는 이야기는 어느새 표준적인 설명으로 자리 잡은 것이다.<\/p><p><b>해석 노트:<\/b> supplant는 단순한 \"대체\"가 아니라 기존의 것을 밀어내고 그 자리를 차지한다는 뜻이므로 \"밀어내고 그 자리를 대신 차지하는\"이라는 두 동작으로 나누어 옮겼다. 또 다른 정답 trump를 넣어도 허구가 역사를 눌러 이기고 우위를 차지한다는 같은 뜻이 된다. has come to be는 서서히 그리 되었다는 상(相)을 담고 있어 \"어느새 ~로 자리 잡았다\"로 처리했다. 콜론은 앞 주장을 구체적 사례로 풀어 보이는 자리이므로, 원문에 없는 인과를 덧씌우지 않도록 \"~때문이다\" 대신 \"~한 것이다\"로 받아 부연의 결을 유지했다.<\/p>", "strat": "<p>콜론(:) 뒤의 부연(trigger-05)이 빈칸을 규정한다. \"명백히 부정확한데도 그 영화의 이야기가 <b>표준적 설명이 되어 버렸다<\/b>\" — 즉 허구가 실제 역사(진실한 기록)를 밀어내고 그 자리를 차지했다. 따라서 빈칸은 \"(진실을) <b>밀어내고 대신 차지하다/능가하다<\/b>\"여야 한다. SE이므로 동의어 쌍을 고른다.<\/p><ul><li><code>nevertheless<\/code>(trigger-10 역접, 보조): 콜론 뒤 «inaccurate … nevertheless … standard account»가 정답 방향을 받친다.<\/li><\/ul>", "correct": "<p><b>trump(능가하다, 앞지르다)<\/b> 와 <b>supplant(대체하다, 밀어내고 그 자리를 차지하다)<\/b> — 둘 다 \"기존의 것(진짜 역사)을 눌러 그 자리를 차지하다\"를 뜻하는 동의어 쌍. 허구가 사실을 밀어내 표준이 되었다는 문맥과 정확히 맞는다.<\/p><p><b>완성 문장<\/b><\/p><p>The impact of the film on people's perceptions of what happened illustrates the power of fiction to <b>supplant<\/b> history: patently inaccurate, the story told by the film has nevertheless come to be the standard account.<\/p>", "wrong": "<ul><li><b>distort(왜곡하다)<\/b> — 매력적 함정. 그러나 문장은 허구가 역사를 \"왜곡\"한 것을 넘어 아예 <b>표준 설명이 되어 대체했다<\/b>는 점을 강조한다. 또 distort는 supplant와 동의어 쌍을 이루지 못한다.<\/li><li><b>exploit(이용하다)<\/b> / <b>utilize(활용하다)<\/b> — 이용·활용이지 \"밀어내 대체\"가 아니다.<\/li><li><b>popularize(대중화하다)<\/b> — 널리 알림이지, \"진실을 밀어내 그 자리를 차지\"함과 다르다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>trump<\/td><td>동<\/td><td>능가하다, 앞지르다<\/td><td>outdo, override<\/td><td>거만어. 정답<\/td><\/tr><tr><td>supplant<\/td><td>동<\/td><td>대체하다, 밀어내다<\/td><td>displace, oust, replace<\/td><td>거만어. 정답<\/td><\/tr><tr><td>distort<\/td><td>동<\/td><td>왜곡하다<\/td><td>twist, misrepresent<\/td><td>거만어. 오답(함정)<\/td><\/tr><tr><td>exploit<\/td><td>동<\/td><td>이용하다, 착취하다<\/td><td>utilize, capitalize on<\/td><td>거만어. 오답<\/td><\/tr><tr><td>patent<\/td><td>형<\/td><td>명백한<\/td><td>obvious, manifest<\/td><td>거만어. patently inaccurate<\/td><\/tr><tr><td>illustrate<\/td><td>동<\/td><td>예시하다, 보여 주다<\/td><td>exemplify, demonstrate<\/td><td>거만어. illustrates the power<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q8": {"html": true, "interp": "<p>감기 치료법은 너무도 붙잡기 어려운 것이어서, 헛된 노력의 현대적 상징이 되어 버렸다.<\/p><p><b>해석 노트:<\/b> futility는 '아무 성과가 없음'을 뜻하므로 '무용성'처럼 딱딱한 한자어를 피하고 '헛된 노력'으로 풀어, 애써도 소용없다는 함의를 드러냈다. elusive는 '규정하기 어려운'보다 앞의 '치료법'과 어울리는 '붙잡기 어려운'을 택했고, so ... that은 '너무도 ~여서'로 이어 정도와 인과를 함께 살렸다. 현재완료 has become은 지금까지 이어진 결과임을 보이려 '되어 버렸다'로 옮겼다. 다른 정답 pointlessness를 넣어도 '무의미함, 헛됨'이라는 같은 뜻이 된다.<\/p>", "strat": "<p><code>so elusive that it has become a modern symbol of ___<\/code>(trigger-02 so~that 인과). 치료법이 \"elusive(끝내 잡히지 않는)\"하다 → 그래서 그것이 상징하는 것은 \"(아무리 애써도) 헛됨, 무익함\". 4Rules 문어체로 \"치료법이 잡히지 않음\"이 원인이 되어 \"헛수고의 상징\"이라는 결과. SE이므로 '헛됨' 동의어 pair를 찾는다.<\/p>", "correct": "<ul><li><b>futility(헛됨, 무용함)<\/b> + <b>pointlessness(무의미함, 헛됨)<\/b>: 둘 다 \"끝내 잡히지 않는 치료법\"이 상징하는 \"아무리 노력해도 소용없음\"을 가리켜 의미 수렴.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>A cure for the common cold has been so elusive that it has become a modern symbol of <b>futility<\/b>.<\/p>", "wrong": "<ul><li>danger(위험): 감기 치료법 못 찾는 것이 '위험'의 상징은 아님, pair 없음.<\/li><li>unease(불안): 감정어 — '헛됨'과 다른 축.<\/li><li>sloth(나태): 치료법은 '게을러서' 못 찾는 게 아니라 '아무리 애써도' 안 됨 — 의미 반대.<\/li><li>apathy(무관심): sloth와 비슷 — '노력해도 안 됨(헛됨)'과 다른 축.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>futility<\/td><td>n.<\/td><td>헛됨, 무용함<\/td><td>uselessness, fruitlessness<\/td><td>(거만어 외) bootless와 동의<\/td><\/tr><tr><td>pointlessness<\/td><td>n.<\/td><td>무의미함, 헛됨<\/td><td>futility, uselessness<\/td><td>(거만어 외)<\/td><\/tr><tr><td>apathy<\/td><td>n.<\/td><td>무관심, 냉담<\/td><td>indifference, lethargy<\/td><td>오답<\/td><\/tr><tr><td>sloth<\/td><td>n.<\/td><td>나태, 게으름<\/td><td>indolence, laziness<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>unease<\/td><td>n.<\/td><td>불안<\/td><td>disquiet, anxiety<\/td><td>(거만어 외) 오답<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q9": {"html": true, "interp": "<p>이 책은 편의적인 허구(fictions)를 여럿 거리낌 없이 끌어다 쓰는데, 미심쩍은 연대기와 집단 저작인 양 꾸민 겉치레가 그런 예다.<\/p><p><b>해석 노트:<\/b> indulge in에는 '자제 없이 탐닉한다'는 비판의 결이 있어 '거리낌 없이 끌어다 쓴다'로 옮겼다. convenient fictions는 이야기를 짜 맞추기에 편리하다는 뜻이므로 '편의적인 허구'로 받았고, 복수형은 '허구를 여럿'으로 살렸다. veneer는 겉에만 얇게 입힌 무늬목이라는 비유가 핵심이라 '집단 저작인 양 꾸민 겉치레'로 풀었다. including 이하는 한국어에서 앞 명사에 바로 붙이면 수식이 늘어지므로 문장을 이어 '그런 예다'로 받아, 원문의 어순과 예시 관계를 함께 지켰다. 또 하나의 정답 inventions를 넣어도 '지어낸 이야기'라는 같은 뜻이 된다.<\/p>", "strat": "<p><code>including ...<\/code>로 예시가 빈칸을 부연하는 동격 구조다(trigger-04 동격 / trigger-06 계열 — 예시가 앞 명사를 받음). including 뒤 예시가 빈칸의 정체를 규정한다.<\/p><ul><li>예시: <code>dubious timeline<\/code>(미심쩍은 연대기), <code>veneer of collective authorship<\/code>(집단 저작인 척하는 겉치레) = 둘 다 \"지어낸 거짓·허구\". <code>convenient<\/code>(편리한)도 \"편의를 위해 꾸며낸\"의 어조. 빈칸은 \"허구·날조\".<\/li><li>SE이므로 두 정답은 \"허구·꾸며냄\"을 공유하는 <b>동의어쌍<\/b>.<\/li><\/ul>", "correct": "<ul><li><b>fictions(허구, 꾸며낸 이야기)<\/b> / <b>inventions(지어낸 것, 날조)<\/b>: 둘 다 \"사실이 아닌 꾸며낸 것\". <code>dubious<\/code>·<code>veneer<\/code> 예시에 부합하며 동의어쌍.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>This book indulges in a number of convenient <b>fictions<\/b>, including its dubious timeline and its veneer of collective authorship.<\/p>", "wrong": "<ul><li><b>contradictions(모순)<\/b>: 모순은 \"허구\"와 다른 축이며, 예시(연대기·저작 겉치레)는 모순이 아니라 날조.<\/li><li><b>analyses(분석)<\/b>: 중립적 분석은 <code>dubious<\/code>·<code>veneer<\/code>의 부정적 함의와 안 맞음, 짝 없음.<\/li><li><b>reminiscences(회상)<\/b>: 회고를 뜻해 본문과 무관, 짝 없음.<\/li><li><b>refutations(반박)<\/b>: 반박을 뜻해 \"허구\" 축과 무관, 짝 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>fiction<\/td><td>n.<\/td><td>허구, 꾸며낸 이야기<\/td><td>fabrication, invention<\/td><td>정답쌍<\/td><\/tr><tr><td>invention<\/td><td>n.<\/td><td>지어낸 것, 날조<\/td><td>fabrication, fiction<\/td><td>정답쌍<\/td><\/tr><tr><td>contradiction<\/td><td>n.<\/td><td>모순<\/td><td>inconsistency<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>reminiscence<\/td><td>n.<\/td><td>회상, 추억담<\/td><td>recollection<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>veneer<\/td><td>n.<\/td><td>겉치레, 허울<\/td><td>facade, pretense<\/td><td>(거만어 외) 본문 신호<\/td><\/tr><tr><td>dubious<\/td><td>adj.<\/td><td>미심쩍은, 의심스러운<\/td><td>questionable, suspect<\/td><td>(거만어 외) 본문 신호<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q10": {"html": true, "interp": "<p>1920년대에 헌법학자 집단인 법현실주의자(Legal Realists)들은 당시 미국에서 지배적이던 법적 추론 방식인 \"형식주의(formalism)\"에 도전했다. 형식주의 지지자들은 개인적 경험도 사건의 사회적 함의도 판사의 판결을 좌우해서는 안 된다고 믿었고, 그래서 판사들에게 유사한 사건에서 이전 법원들이 내린 판결로부터 연역한 일반 원리를 적용해 까다로운 새 사건을 판결하라고 촉구했다. 법현실주의자들은 두 가지를 주장했다. 첫째, 판사의 결정은 그 결정이 갖는 사회적 함의와 판사 자신의 삶의 경험에 영향을 받으며, 후자는 사건 당사자와 증인에 대한 판사의 인식, 따라서 사건의 '사실'에 대한 인식까지 불가피하게 물들인다. 둘째, 유사한 사건의 선례에서 이끌어낼 수 있는 법 원리들은 서로 너무 일관되지 않아 매우 다른 판결을 낳기 쉽다. 그리하여 법현실주의자들은 법 원리가 의미 있고 유용하려면 일반적·추상적이어서는 안 되고 구체적 상황을 가리켜야 한다고 논했다. <b>계약이 걸린 어떤 사건을 판결하는 데 적절한 원리가 다른 계약 사건에는 적절하지 않을 수 있는데, 계약은 저마다 매우 다른 상황에서 체결되고 집행되기 때문이다.<\/b><\/p>", "strat": "<p><b>질문 1 — 문장 기능/관계 RC-07<\/b><\/p><ul><li><b>주제 문장 = S1<\/b> «In the 1920s, the Legal Realists, a group of constitutional scholars, challenged “formalism,” …» — 글의 틀(법현실주의자 vs 형식주의의 맞섬)을 세우는 문장. S2(형식주의 입장)·S3(법현실주의자의 반박)·S4(Thus — 법현실주의자가 그 반박에서 끌어낸 결론)·S5(계약 예시)가 모두 S1의 «도전»을 풀어 준다. S4 Thus는 장치이지만 저자의 논지가 아니라 한쪽 진영 논증의 결론이고, 글의 목적(질문 3 B «두 접근의 차이를 짚는다»)은 S1이 담는다.<\/li><\/ul><p>FAC 문장 기능: 도입(형식주의 = 논박 대상) → but 법현실주의자의 반박(전제 부정: 판사는 경험·사회함의에 영향받고, 선례 원리는 비일관적) → 결론(법 원리는 구체적 상황을 가리켜야 한다) → 마지막 문장(계약 예시로 결론을 구체화). 저자 태도는 중립적 서술.<\/p>", "correct": "<ul><li><b>정답 A<\/b>: 마지막 문장(계약 사건마다 원리가 달라짐)은 앞 문장의 일반론(\"법 원리는 구체적 상황을 가리켜야 한다\")을 <b>예증(illustrate)<\/b>한다. FAC 문장 기능 강화(for example류)에 해당.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: B(예외 아님 — 같은 방향), C(평가 아님), D(앞 주장을 교정하지 않음), E(앞 문장은 예시가 아니라 일반 원리라 \"예시에 논평\"이 아님).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>proponent<\/td><td>n.<\/td><td>지지자, 옹호자<\/td><td>advocate, supporter<\/td><td>본문 어휘<\/td><\/tr><tr><td>deduce<\/td><td>v.<\/td><td>연역하다, 추론하다<\/td><td>infer, derive<\/td><td>본문 (deduced from)<\/td><\/tr><tr><td>color<\/td><td>v.<\/td><td>물들이다, 편향시키다<\/td><td>bias, influence<\/td><td>본문 (this sense: 영향)<\/td><\/tr><tr><td>implication<\/td><td>n.<\/td><td>함의, 영향, 파장<\/td><td>consequence, ramification<\/td><td>본문 (social implications)<\/td><\/tr><tr><td>formalism<\/td><td>n.<\/td><td>형식주의<\/td><td>—<\/td><td>(거만어 외) 논박 대상<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q11": {"html": true, "interp": "<p>1920년대에 헌법학자 집단인 법현실주의자(Legal Realists)들은 당시 미국에서 지배적이던 법적 추론 방식인 \"형식주의(formalism)\"에 도전했다. 형식주의 지지자들은 개인적 경험도 사건의 사회적 함의도 판사의 판결을 좌우해서는 안 된다고 믿었고, 그래서 판사들에게 유사한 사건에서 이전 법원들이 내린 판결로부터 연역한 일반 원리를 적용해 까다로운 새 사건을 판결하라고 촉구했다. 법현실주의자들은 두 가지를 주장했다. 첫째, 판사의 결정은 그 결정이 갖는 사회적 함의와 판사 자신의 삶의 경험에 영향을 받으며, 후자는 사건 당사자와 증인에 대한 판사의 인식, 따라서 사건의 '사실'에 대한 인식까지 불가피하게 물들인다. 둘째, 유사한 사건의 선례에서 이끌어낼 수 있는 법 원리들은 서로 너무 일관되지 않아 매우 다른 판결을 낳기 쉽다. 그리하여 법현실주의자들은 법 원리가 의미 있고 유용하려면 일반적·추상적이어서는 안 되고 구체적 상황을 가리켜야 한다고 논했다. <b>계약이 걸린 어떤 사건을 판결하는 데 적절한 원리가 다른 계약 사건에는 적절하지 않을 수 있는데, 계약은 저마다 매우 다른 상황에서 체결되고 집행되기 때문이다.<\/b><\/p>", "strat": "<p><b>질문 2 — 구체 내용 RC-06<\/b><\/p><ul><li><b>주제 문장 = S1<\/b> «In the 1920s, the Legal Realists, a group of constitutional scholars, challenged “formalism,” …» — 글의 틀(법현실주의자 vs 형식주의의 맞섬)을 세우는 문장. S2(형식주의 입장)·S3(법현실주의자의 반박)·S4(Thus — 법현실주의자가 그 반박에서 끌어낸 결론)·S5(계약 예시)가 모두 S1의 «도전»을 풀어 준다. S4 Thus는 장치이지만 저자의 논지가 아니라 한쪽 진영 논증의 결론이고, 글의 목적(질문 3 B «두 접근의 차이를 짚는다»)은 S1이 담는다.<\/li><\/ul><p>FAC 문장 기능: 도입(형식주의 = 논박 대상) → but 법현실주의자의 반박(전제 부정: 판사는 경험·사회함의에 영향받고, 선례 원리는 비일관적) → 결론(법 원리는 구체적 상황을 가리켜야 한다) → 마지막 문장(계약 예시로 결론을 구체화). 저자 태도는 중립적 서술.<\/p>", "correct": "<ul><li><b>정답 B<\/b>: \"원리가 적용되는 사건의 상황과의 관련성.\" 본문 — 법현실주의자는 원리가 유용하려면 \"구체적 상황을 가리켜야 한다\"고 봄 → 유용성 기준 = 사건 상황과의 관련성. 해당 문장 rephrasing.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: A(\"다양한 상황에 적용 가능\"은 형식주의(일반·추상)의 입장이라 정반대), C(선례에서 쉽게 도출 — 법현실주의자는 선례 원리를 비일관적이라 비판), D(상이한 사건의 유사성 식별 — 본문에 없음), E(판사 개인 경험에 물든 정도 — 유용성 \"기준\"이 아님).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>proponent<\/td><td>n.<\/td><td>지지자, 옹호자<\/td><td>advocate, supporter<\/td><td>본문 어휘<\/td><\/tr><tr><td>deduce<\/td><td>v.<\/td><td>연역하다, 추론하다<\/td><td>infer, derive<\/td><td>본문 (deduced from)<\/td><\/tr><tr><td>color<\/td><td>v.<\/td><td>물들이다, 편향시키다<\/td><td>bias, influence<\/td><td>본문 (this sense: 영향)<\/td><\/tr><tr><td>implication<\/td><td>n.<\/td><td>함의, 영향, 파장<\/td><td>consequence, ramification<\/td><td>본문 (social implications)<\/td><\/tr><tr><td>formalism<\/td><td>n.<\/td><td>형식주의<\/td><td>—<\/td><td>(거만어 외) 논박 대상<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q12": {"html": true, "interp": "<p>1920년대에 헌법학자 집단인 법현실주의자(Legal Realists)들은 당시 미국에서 지배적이던 법적 추론 방식인 \"형식주의(formalism)\"에 도전했다. 형식주의 지지자들은 개인적 경험도 사건의 사회적 함의도 판사의 판결을 좌우해서는 안 된다고 믿었고, 그래서 판사들에게 유사한 사건에서 이전 법원들이 내린 판결로부터 연역한 일반 원리를 적용해 까다로운 새 사건을 판결하라고 촉구했다. 법현실주의자들은 두 가지를 주장했다. 첫째, 판사의 결정은 그 결정이 갖는 사회적 함의와 판사 자신의 삶의 경험에 영향을 받으며, 후자는 사건 당사자와 증인에 대한 판사의 인식, 따라서 사건의 '사실'에 대한 인식까지 불가피하게 물들인다. 둘째, 유사한 사건의 선례에서 이끌어낼 수 있는 법 원리들은 서로 너무 일관되지 않아 매우 다른 판결을 낳기 쉽다. 그리하여 법현실주의자들은 법 원리가 의미 있고 유용하려면 일반적·추상적이어서는 안 되고 구체적 상황을 가리켜야 한다고 논했다. <b>계약이 걸린 어떤 사건을 판결하는 데 적절한 원리가 다른 계약 사건에는 적절하지 않을 수 있는데, 계약은 저마다 매우 다른 상황에서 체결되고 집행되기 때문이다.<\/b><\/p>", "strat": "<p><b>질문 3 — 주제 RC-01<\/b><\/p><ul><li><b>주제 문장 = S1<\/b> «In the 1920s, the Legal Realists, a group of constitutional scholars, challenged “formalism,” …» — 글의 틀(법현실주의자 vs 형식주의의 맞섬)을 세우는 문장. S2(형식주의 입장)·S3(법현실주의자의 반박)·S4(Thus — 법현실주의자가 그 반박에서 끌어낸 결론)·S5(계약 예시)가 모두 S1의 «도전»을 풀어 준다. S4 Thus는 장치이지만 저자의 논지가 아니라 한쪽 진영 논증의 결론이고, 글의 목적(질문 3 B «두 접근의 차이를 짚는다»)은 S1이 담는다.<\/li><\/ul><p>FAC 문장 기능: 도입(형식주의 = 논박 대상) → but 법현실주의자의 반박(전제 부정: 판사는 경험·사회함의에 영향받고, 선례 원리는 비일관적) → 결론(법 원리는 구체적 상황을 가리켜야 한다) → 마지막 문장(계약 예시로 결론을 구체화). 저자 태도는 중립적 서술.<\/p>", "correct": "<ul><li><b>정답 B<\/b>: \"미국 사법 판결의 두 접근(형식주의 vs 법현실주의)의 차이를 지적한다.\" 글 전체가 두 입장을 대비하는 구조. 주제 정확.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: A(한 접근의 발전 연대기 아님), C(\"보이는 만큼 모순적이지 않다\"는 본문 취지 아님 — 분명히 대립), D(법현실주의가 판사 행동을 재편했다는 결과 서술 없음), E(한 접근이 우월하다는 평가 안 함 — 중립).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>proponent<\/td><td>n.<\/td><td>지지자, 옹호자<\/td><td>advocate, supporter<\/td><td>본문 어휘<\/td><\/tr><tr><td>deduce<\/td><td>v.<\/td><td>연역하다, 추론하다<\/td><td>infer, derive<\/td><td>본문 (deduced from)<\/td><\/tr><tr><td>color<\/td><td>v.<\/td><td>물들이다, 편향시키다<\/td><td>bias, influence<\/td><td>본문 (this sense: 영향)<\/td><\/tr><tr><td>implication<\/td><td>n.<\/td><td>함의, 영향, 파장<\/td><td>consequence, ramification<\/td><td>본문 (social implications)<\/td><\/tr><tr><td>formalism<\/td><td>n.<\/td><td>형식주의<\/td><td>—<\/td><td>(거만어 외) 논박 대상<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q1": {"html": true, "interp": "<p>전기를 치료에 이용하려는 인간의 욕구는 적어도 고대까지 거슬러 올라가며, 처음에는 두통 치료법으로 전기를 내는 물고기(electric fish)를 머리에 갖다 대는 것으로 충족되었다(satisfied by).<\/p><p><b>해석 노트:<\/b> satisfied by를 '만족시켜졌다'로 옮기면 번역기투가 되므로, 욕구를 주어로 둔 채 '…으로 충족되었다'로 수동을 한국어 어순에 녹였다. electric fish는 전기가오리·전기뱀장어처럼 발전 기관을 가진 물고기를 통칭하는 말이라 확립된 한국명 대신 '전기를 내는 물고기'로 풀고 원어를 병기했다. goes back의 현재는 '거슬러 올라가며', was satisfied의 과거는 '충족되었다'로 갈라, 욕구는 지금까지 이어지되 그 충족 방식은 옛일이라는 originally의 시제 대비를 살렸다.<\/p>", "strat": "<p>시간 표현 <code>goes back at least to antiquity<\/code>, <code>originally<\/code>(trigger-17 과거 turning point 신호)가 깔려 있다. \"전기를 치료에 쓰려는 욕구(the drive to use electricity therapeutically)\"가 원래는 어떻게 다루어졌는가. 빈칸 뒤 <code>the application of electric fish to the head as a cure(전기 물고기를 머리에 대는 치료)<\/code>는 그 욕구를 <b>채워 주던 방식<\/b>이다. 즉 욕구가 그 원시적 방법으로 <b>충족되었다<\/b>. 주어(drive)와 수단(electric fish application)의 관계는 \"욕구가 ~로 채워졌다\". → <b>satisfied by<\/b>.<\/p>", "correct": "<ul><li><b>satisfied by<\/b>(~로 충족되었다): 치료 욕구가 \"전기 물고기를 머리에 대는\" 원시적 방법으로 충족됨. drive(욕구)를 받는 동사로 자연스럽다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>The human drive to use electricity therapeutically goes back at least to antiquity and was originally <b>satisfied by<\/b> the application of electric fish to the head as a cure for headaches.<\/p>", "wrong": "<ul><li><b>compared to<\/b>(~에 비교되어): 욕구를 방법과 단순 비교하는 것은 의미 불성립.<\/li><li><b>predicated on<\/b>(~에 근거하여): \"욕구가 그 방법에 근거를 둔다\"는 인과 역전 — 욕구가 먼저고 방법이 그것을 채운 것이므로 어색.<\/li><li><b>resistant to<\/b>(~에 저항하는): 욕구가 그 방법에 저항한다는 것은 모순(그 방법으로 욕구를 풀려 한 것).<\/li><li><b>mistaken for<\/b>(~로 오인되어): 오인의 뜻으로 문맥 무관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>satisfy<\/td><td>v.<\/td><td>충족시키다<\/td><td>fulfill, gratify<\/td><td>(거만어 외) · 정답. 이 sense는 \"(욕구를) 채우다\"<\/td><\/tr><tr><td>predicate (on)<\/td><td>v.<\/td><td>~에 근거를 두다<\/td><td>base on, ground on<\/td><td>오답<\/td><\/tr><tr><td>antiquity<\/td><td>n.<\/td><td>고대<\/td><td>ancient times<\/td><td>(거만어 외) · 시간 신호<\/td><\/tr><tr><td>therapeutically<\/td><td>adv.<\/td><td>치료적으로<\/td><td>medicinally<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q2": {"html": true, "interp": "<p>빛 속도의 불변성은 양방향(왕복) 빛 전송에 대해서는 실험으로 확립되었지만, 일방향 빛 속도를 겨냥한 검사들은 정밀한 검증을 끝내 견뎌 내지 못했다. 그런 검사를 하려면 시계를 동기화해야 하는데, 그것은 역사적으로 이룰 수 없는 일이었기 때문이다. 예컨대 가뇽(Gagnon)의 일방향 빛 속도 검사들도 타당하지 않은 것으로 판명되었다.<\/p><p><b>해석 노트:<\/b> withstand scrutiny는 \"조사를 견디다\"라는 직역보다 검증대에 올려도 무너지지 않는다는 함의가 핵심이므로 \"정밀한 검증을 끝내 견뎌 내지 못했다\"로 옮겨, 현재완료가 담은 누적된 실패의 감각을 \"끝내 ~못했다\"라는 어미에 실었다. they require clock synchronization that has historically been impossible to achieve는 긴 관계절을 앞으로 당기면 문장이 무거워져, 마침표로 끊고 \"그런 검사를 하려면 시계를 동기화해야 하는데 ~ 때문이다\"로 능동으로 풀었다. invalid는 검사에 대한 평가이므로 법률 냄새가 나는 \"무효\" 대신 \"타당하지 않은 것으로 판명되었다\"로 새겼고, 앞 문장의 일반론에 대한 사례임을 보조사 \"~도\"로 표시했다.<\/p>", "strat": "<p><code>While<\/code>(trigger-10 대조)로 \"양방향은 확립됨 ↔ 일방향은 …\"을 맞세운다. 콜론(:) 뒤(trigger-05 부연) \"역사적으로 불가능한 시계 동기화를 요구한다\"가 (i)의 뜻을 정한다 — 일방향 검사는 필수 조건을 못 갖춰 <b>신뢰성을 인정받지 못했다<\/b>. 그리고 \"For example\"로 이어지는 (ii)는 그 구체 사례이므로, 가뇽의 검사는 <b>무효<\/b>로 판명되었다.<\/p><ul><li><b>(i)<\/b>: 검사들이 <b>검증을 견디지 못했다(not withstood scrutiny)<\/b>.<\/li><li><b>(ii)<\/b>: 그 예로 가뇽의 검사는 <b>무효(invalid)<\/b>.<\/li><\/ul>", "correct": "<ul><li><b>(i) not withstood scrutiny(면밀한 검토를 견디지 못했다)<\/b> — 일방향 검사들이 신뢰를 얻지 못함.<\/li><li><b>(ii) invalid(무효한, 타당하지 않은)<\/b> — 그 대표 사례.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>While light speed invariance has been experimentally established for two-way light transmission, tests of the one-way speed of light have <b>not withstood scrutiny<\/b>: they require clock synchronization that has historically been impossible to achieve. For example, Gagnon's one-way light speed tests were shown to be <b>invalid<\/b>.<\/p>", "wrong": "<ul><li>(i) been surprisingly accurate(놀랍도록 정확했다) / upended existing theories(기존 이론을 뒤집었다) — 콜론 뒤의 \"불가능한 동기화를 요구한다\"(=결함)와 어긋난다. 둘 다 긍정적이라 반대.<\/li><li>(ii) redundant(불필요한, 중복된) / serviceable(쓸 만한) — (i)이 \"검증 못 견딤\"이므로 그 예는 \"<b>무효<\/b>\"여야 한다. redundant(중복)·serviceable(유용)은 무효성과 다르다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>withstand scrutiny<\/td><td>동(구)<\/td><td>면밀한 검토를 견디다<\/td><td>hold up to examination<\/td><td>(거만어 외) 정답 (i, 부정형)<\/td><\/tr><tr><td>invalid<\/td><td>형<\/td><td>무효한, 타당하지 않은<\/td><td>unsound, void<\/td><td>(거만어 외) 정답 (ii)<\/td><\/tr><tr><td>redundant<\/td><td>형<\/td><td>불필요한, 중복된<\/td><td>superfluous, excess<\/td><td>거만어. 오답 (ii)<\/td><\/tr><tr><td>upend<\/td><td>동<\/td><td>뒤집다, 전복하다<\/td><td>overturn, topple<\/td><td>거만어. 오답 (i)<\/td><\/tr><tr><td>experimental<\/td><td>형<\/td><td>실험적인<\/td><td>empirical<\/td><td>거만어. experimentally established<\/td><\/tr><tr><td>invariance<\/td><td>명<\/td><td>불변성<\/td><td>constancy<\/td><td>(거만어 외) light speed invariance<\/td><\/tr><tr><td>synchronization<\/td><td>명<\/td><td>동기화<\/td><td>coordination<\/td><td>(거만어 외) clock synchronization<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q3": {"html": true, "interp": "<p>그 시장은 돈에 매수된다는 평판을 얻었다. 청렴함으로 이름난 도시도 아닌 곳에서조차, 이 평판은 그의 행정부에 점점 커지는 위험이 되고 있다.<\/p><p><b>해석 노트:<\/b> venality는 단순한 '부패'보다 관직과 편의를 돈으로 사고팔 만큼 매수에 열려 있다는 결이 있어 '돈에 매수된다'로 풀었다. integrity는 도시 전체의 기풍을 가리키므로 '청렴함'으로 옮기고, not known for에 담긴 반어(원래 깨끗하지도 않은 도시)를 '…로 이름난 도시도 아닌 곳에서조차'로 살렸다. 현재완료는 결과가 남은 상태이므로 '얻었다'로, 현재진행 is proving은 판명되어 가는 과정이므로 '되고 있다'로 처리했다. 원문의 and 이하가 길어 한국어에서는 문장을 둘로 끊었다.<\/p>", "strat": "<p><b>(ii) 빈칸 — even + not 구조(trigger-16).<\/b> \"even in a city <em>not known for<\/em> its (ii)\" — \"(ii)으로 유명하지 않은 도시<em>에서조차<\/em> 위험\"이라는 강조. 평판이 <em>위험<\/em>이 되려면 (i)은 부정적 자질이고, 그것이 위험해지는 배경은 \"그 도시가 (ii)을 <em>중시하지 않는데도<\/em>\"여야 강조가 산다. 즉 (ii) = 시민이 으레 기대하는 미덕 = <b>integrity(청렴·정직)<\/b>. (\"그 도시가 청렴을 특별히 따지지도 않는데, 그런 곳에서조차 시장의 부패 평판이 문제다\" → 부패가 얼마나 심한지 강조.)<\/p><p><b>(i) 빈칸.<\/b> (ii) integrity(청렴)의 <em>반대<\/em> 평판이 위험을 부른다 → (i) = <b>venality(부패·매수되기 쉬움)<\/b>. (trigger-06 대비 관계: 청렴을 안 따지는 도시 ↔ 그래도 문제 되는 부패.)<\/p>", "correct": "<ul><li><b>(i) venality(부패, 돈에 매수됨)<\/b> — 시장이 얻은 위험한 평판.<\/li><li><b>(ii) integrity(청렴·정직)<\/b> — 그 도시조차 특별히 중시하지 않는 미덕. even 강조의 기준점.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>The mayor has developed a reputation for <b>venality<\/b>, and even in a city not known for its <b>integrity<\/b>, this reputation is proving to be a growing danger to his administration.<\/p>", "wrong": "<ul><li>(i) <b>ostentation(과시)<\/b> / <b>rectitude(올곧음)<\/b> — ostentation은 부패만큼 \"행정부에 위험\"이 약하고, rectitude(올곧음)는 <em>미덕<\/em>이라 위험 평판이 될 수 없음(방향 반대).<\/li><li>(ii) <b>flamboyance(화려함)<\/b> — (i) ostentation 짝으로 유혹하나, \"위험한 평판\"의 대비축(부패↔청렴)과 다름.<\/li><li>(ii) <b>decadence(타락)<\/b> — (i)과 <em>같은<\/em> 부정 자질이라, \"그것조차 안 따지는 도시\"의 <em>미덕<\/em> 자리(integrity)에 안 맞음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>venality<\/td><td>n.<\/td><td>부패, 돈에 매수됨<\/td><td>corruptibility, graft<\/td><td>(거만어 외) 정답(i). venal(매수되는)의 명사형<\/td><\/tr><tr><td>integrity<\/td><td>n.<\/td><td>청렴, 정직, 고결<\/td><td>probity, honesty, rectitude<\/td><td>(거만어). 정답(ii). venality와 대비축<\/td><\/tr><tr><td>rectitude<\/td><td>n.<\/td><td>올곧음, 도덕적 정직<\/td><td>uprightness, probity<\/td><td>(거만어). 오답(i, 미덕이라 위험 아님)<\/td><\/tr><tr><td>ostentation<\/td><td>n.<\/td><td>과시, 허세<\/td><td>showiness, flaunting<\/td><td>(거만어 외) 오답(i)<\/td><\/tr><tr><td>decadence<\/td><td>n.<\/td><td>타락, 퇴폐<\/td><td>degeneracy, decay<\/td><td>(거만어 외) 오답(ii)<\/td><\/tr><tr><td>flamboyance<\/td><td>n.<\/td><td>화려함, 현란함<\/td><td>extravagance, showiness<\/td><td>(거만어 외) 오답(ii)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q4": {"html": true, "interp": "<p>태양계 소행성대의 작은 소행성 가운데 상당수가 아직 <b>눈에 띄지 않았을<\/b> 가능성은 꽤 높다. 그렇더라도 그것들을 다 합친 질량이 <b>크지는<\/b> 않을 것이다. 이미 알려진 소행성들의 중력을 모두 합하면, 소행성대가 화성 같은 인근 행성의 움직임에 미치는 영향을 남김없이 설명하기에 <b>충분하기<\/b> 때문이다.<\/p><p><b>해석 노트:<\/b> <code>escaped detection<\/code>을 '탐지를 피했다'로 옮기면 능동적으로 숨은 것처럼 들리므로 '눈에 띄지 않았다'로 했다. <code>cannot be substantial<\/code>은 '상당할 수 없다'가 어색해 '크지는 않을 것이다'로 풀었다. Although절이 길어 문장을 끊고 '그렇더라도'로 이었고, since절도 따로 떼어 '~때문이다'로 받아 세 마디의 논리를 또렷하게 했다. <code>fully account for<\/code>는 '온전히 설명하다'보다 '남김없이 설명하다'가 sufficient의 «충분함»과 어울린다.<\/p>", "strat": "<p>빈칸 3개. <b>맨 뒤부터 푼다.<\/b> <code>since<\/code>가 이유를 대고, 그 이유가 (ii)를 정하고, (ii)가 <code>Although<\/code>를 통해 (i)을 부른다.<\/p><p><b>① (iii) — <code>since<\/code>절이 어느 쪽으로 기울어야 하는가<\/b>(trigger-02 인과). <code>since the combined gravitational pull of <b>all known asteroids<\/b> is (iii)빈칸 <b>to fully account for<\/b> the asteroid belt's effect …<\/code><\/p><ul><li>이 절은 <b>결론의 근거<\/b>다. 결론은 「미발견 소행성들의 총질량에 관한 무엇」이다.<\/li><li>이미 <b>알려진<\/b> 소행성들만으로 벨트의 효과가 <b>온전히 설명된다면<\/b>, 아직 못 찾은 것들이 무겁게 남아 있을 여지가 없다.<\/li><li>→ <b>(iii) = sufficient(충분한)<\/b>.<\/li><\/ul><p><b>② (ii) — 그 이유가 무엇을 부정하는가.<\/b> <code>the total mass of these objects <b>cannot be<\/b> (ii)빈칸<\/code> — 알려진 것만으로 이미 설명이 끝났으니, 미발견분의 총질량은 <b>클 수 없다<\/b>.<\/p><ul><li>→ <b>(ii) = substantial(상당한, 큰)<\/b>. 「상당할 수는 없다」.<\/li><\/ul><p><b>③ (i) — <code>Although<\/code>가 양보하는 것.<\/b> <code><b>Although<\/b> it is quite probable that many small asteroids … have (i)빈칸, the total mass … cannot be substantial<\/code><\/p><ul><li>양보 구조: 「<b>수는 많을지 몰라도<\/b> 무게는 크지 않다」.<\/li><li>그렇다면 (i)은 <b>«많이 있는데 아직 못 찾았다»<\/b>여야 한다. → <b>(i) = escaped detection(탐지를 피했다)<\/b>.<\/li><li>이래야 Although가 제 일을 한다 — 못 찾은 것이 많다는 사실과 그 총질량이 작다는 결론이 맞선다.<\/li><\/ul><p><b>세 빈칸이 하나의 사슬을 이룬다<\/b>: 「못 찾은 게 많다(i) ↔ 그래도 총질량은 작다(ii) ← 알려진 것만으로 이미 설명이 되니까(iii)」.<\/p><p>★<b>(ii)의 최대 함정은 <code>estimated<\/code>(추정되다)다.<\/b> 「총질량을 <b>추정할 수 없다<\/b>」는 천문학 문장으로 매우 그럴듯하고, (i)의 «탐지를 피했다»와도 자연스럽게 이어진다. 그러나 <b>since절이 대는 이유와 맞지 않는다.<\/b><\/p><ul><li>「알려진 것만으로 충분히 설명된다」는 것은 <b>추정을 막는 이유가 아니라 «작다»는 결론의 근거<\/b>다. 오히려 설명이 충분하다면 나머지 질량은 <b>추정할 수 있다<\/b>(거의 0에 가깝다고).<\/li><li><b>요령: <code>since<\/code>·<code>because<\/code>가 붙은 절은 «결론의 근거»여야 한다.<\/b> 후보를 넣고 「이 이유가 저 결론을 떠받치는가」를 물으면 estimated가 떨어진다.<\/li><\/ul><p>★<b>(iii)의 함정 <code>unlikely<\/code>(가능성이 낮은)<\/b> — 형태상 <code>is unlikely to fully account for<\/code>가 자연스러워 손이 간다. 그러나 넣으면 <b>결론이 뒤집힌다<\/b>: 알려진 것만으로 설명이 <b>안 된다면<\/b> 미발견분의 질량이 <b>커야<\/b> 하므로, <code>cannot be substantial<\/code>과 정면으로 충돌한다.<\/p><ul><li><code>required<\/code>(필요한)는 <code>is required to account for<\/code>가 되어 뜻이 어정쩡해지고, 역시 결론을 떠받치지 못한다.<\/li><\/ul><p>★<b>(i)의 함정 <code>formed by accretion<\/code>(강착으로 형성되었다)·<code>similar structures<\/code>(비슷한 구조)<\/b> — 둘 다 천문학 용어라 그럴듯하지만 <b>Although의 양보가 성립하지 않는다.<\/b> 강착으로 생겼든 구조가 비슷하든, 그 사실이 「총질량이 작다」와 맞설 이유가 없다. 맞설 수 있는 것은 <b>«아직 못 찾은 것이 많다»<\/b>뿐이다.<\/p>", "correct": "<ul><li><b>(i) escaped detection(아직 발견되지 않았다)<\/b>: Although가 «수는 많다 ↔ 무게는 작다»를 맞세우려면 이것이어야 한다.<\/li><li><b>(ii) substantial(상당한, 큰)<\/b>: since절이 대는 이유가 곧바로 이 부정을 낳는다.<\/li><li><b>(iii) sufficient(충분한)<\/b>: 알려진 것만으로 설명이 끝난다는 뜻. 결론의 근거다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Although it is quite probable that many small asteroids in the solar system's asteroid belt have <b>escaped detection<\/b>, the total mass of these objects cannot be <b>substantial<\/b>, since the combined gravitational pull of all known asteroids is <b>sufficient<\/b> to fully account for the asteroid belt's effect on the motion of nearby planets such as Mars.<\/p>", "wrong": "<ul><li><b>(ii) estimated(추정되다)<\/b>: 최대 함정. 문장 하나로는 그럴듯하나 since절이 그 이유가 되지 못한다.<\/li><li><b>(ii) diminishing(줄어드는)<\/b>: 총질량이 줄어든다는 말은 지문 어디에서도 근거를 찾을 수 없다.<\/li><li><b>(iii) unlikely(가능성이 낮은)<\/b>: 넣으면 결론이 뒤집힌다.<\/li><li><b>(iii) required(필요한)<\/b>: 뜻이 어정쩡해지고 결론을 떠받치지 못한다.<\/li><li><b>(i) formed by accretion(강착으로 형성된)<\/b> · <b>similar structures(비슷한 구조)<\/b>: Although의 양보가 성립하지 않는다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>substantial<\/td><td>adj.<\/td><td>상당한, 큰<\/td><td>considerable, sizable<\/td><td>(거만어) 정답<\/td><\/tr><tr><td>sufficient<\/td><td>adj.<\/td><td>충분한<\/td><td>adequate, ample<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>escape detection<\/td><td>phr.<\/td><td>발견되지 않다<\/td><td>go unnoticed<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>account for<\/td><td>phr.<\/td><td>설명하다, ~의 원인이 되다<\/td><td>explain<\/td><td>(거만어 외) ★(iii)의 결합어<\/td><\/tr><tr><td>accretion<\/td><td>n.<\/td><td>강착, 조금씩 쌓임<\/td><td>accumulation<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>gravitational pull<\/td><td>n.<\/td><td>중력<\/td><td>gravity<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q5": {"html": true, "interp": "<p>언뜻 보면 모더니즘 작가들 사이에서 <b>헨리 제임스<\/b>의 위치는 다소 <b>문제적(problematic)<\/b>이다. 그가 쓴 열두 편 이상의 소설과 수십 편의 단편은 고전적 규칙을 따른다. 등장인물의 내면에 초점을 맞춰 \"아무 일도 일어나지 않는다\"는 비평가들의 불평을 자아낸 모더니즘 소설과 <b>달리<\/b>, 제임스의 플롯은 <b>가차 없는(relentless)<\/b> 속도로 전진하며 <b>대단원(denouement)<\/b>은 관습이 놓아둔 자리, 즉 <em>끝<\/em>에서 일어난다. 작품 속 대화는 때로 과장될지언정 <b>사실적(naturalistic — 실제 말투 같은)<\/b>이고, 작가는 전지(全知)적 존재로 등장한다. 그러나 이런 문학적 <b>정통(orthodoxy)에도 불구하고<\/b>, 제임스의 작품—<b>특히 후기 소설<\/b>—은 놀랍도록 새롭고 예상치 못한 무언가를 보여준다. 그의 <b>의식(consciousness)<\/b> 탐구는 어떤 복잡성 앞에서도 위축되지 않으며, 다른 면에서는 관습적인 그의 소설에 소설 분야의 모더니즘 기획을 특징짓는 <b>내면성(interiority)<\/b>을 부여한다.<\/p>", "strat": "<p><b>질문 1 — 추론 RC-02<\/b><\/p><p><b>주제 문장 = S1 «At first glance, the place of Henry James among Modernist writers remains somewhat problematic.»<\/b> — 난이 표현(problematic, 자리매김이 어렵다)을 내건 제목 문장이다. S2~S4는 «문제적»인 까닭(고전적 형식)이고, S5 <em>Despite … though<\/em> 뒤 S5·S6은 제목에 대한 저자의 답(내면성 탐구의 모더니즘)이다. 요약 = 모더니즘 작가 사이에서 헨리 제임스의 위치(S1) — 형식은 고전적이지만(S2~S4) 의식·내면성 탐구에서 모더니즘적(S5·S6)이라는 이중성.<\/p><p>통념 대비 구조다. 표면(관습적 형식: 빠른 플롯·끝의 대단원·사실적 대화·전지적 화자)에서 제임스는 모더니즘과 거리가 있어 그의 위치가 \"problematic\"하다. 그러나 <code>Despite ~ though<\/code> 역접 뒤가 저자의 진짜 논지 — 후기작의 <b>의식·내면성 탐구<\/b>가 그를 모더니즘 기획에 잇는다. 즉 <em>형식은 고전적이나 내면성에서 모더니즘적<\/em>이라는 이중성이 글 전체의 축이다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: 질문의 본문 단어(제임스의 소설)를 주어로 재구성한다. 둘째~넷째 문장의 relentless pace, 끝에 오는 대단원 같은 고전적 형식의 근거에서 모더니즘 소설과 비교해 한 걸음만 나아간 보기를 고른다.<\/li><li><b>정답(C) have more traditional narrative arcs<\/b>: 제임스의 플롯은 \"relentless pace\"로 전진하고 대단원이 \"at the end\"(관습적 위치)에서 발생 → 모더니즘 소설(\"nothing happens\")보다 전통적 서사구조를 지님.<\/li><\/ul>", "wrong": "<ul><li><b>오답 A<\/b>(더 예상치 못한 플롯 반전): \"new and unexpected\"는 플롯 반전이 아니라 <em>의식 탐구<\/em>를 가리킨다. 플롯 자체는 오히려 관습적.<\/li><li><b>오답 B<\/b>(인물 내면에 더 집중): 내면 집중은 <em>모더니즘 소설<\/em>의 특징 — 방향이 뒤집혔다.<\/li><li><b>오답 D<\/b>(문학적 정통을 덜 보임): 제임스는 정통을 오히려 <em>더<\/em> 따른다(\"literary orthodoxies\").<\/li><li><b>오답 E<\/b>(상당히 더 길다): 길이 비교 진술 없음. \"dozen or more novels\"는 편수(量)일 뿐 분량이 아니다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>denouement<\/td><td>n.<\/td><td>(플롯의) 대단원, 결말<\/td><td>resolution, conclusion<\/td><td>관습적으로 '끝'에 위치<\/td><\/tr><tr><td>relentless<\/td><td>adj.<\/td><td>가차 없는, 수그러들지 않는<\/td><td>unremitting, inexorable<\/td><td>플롯의 빠른 전진<\/td><\/tr><tr><td>orthodoxy<\/td><td>n.<\/td><td>정통, 통설<\/td><td>conventionality, conformity<\/td><td>↔ heterodoxy<\/td><\/tr><tr><td>naturalistic<\/td><td>adj.<\/td><td>사실적인, 실제 말투 같은<\/td><td>realistic, lifelike<\/td><td>대화의 성격 — 사조 Naturalism 아님<\/td><\/tr><tr><td>high-flown<\/td><td>adj.<\/td><td>과장된, 거창한<\/td><td>grandiloquent, bombastic<\/td><td>대화가 때로 과장됨<\/td><\/tr><tr><td>interiority<\/td><td>n.<\/td><td>내면성<\/td><td>inwardness<\/td><td>모더니즘 기획의 특징<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q6": {"html": true, "interp": "<p>언뜻 보면 모더니즘 작가들 사이에서 <b>헨리 제임스<\/b>의 위치는 다소 <b>문제적(problematic)<\/b>이다. 그가 쓴 열두 편 이상의 소설과 수십 편의 단편은 고전적 규칙을 따른다. 등장인물의 내면에 초점을 맞춰 \"아무 일도 일어나지 않는다\"는 비평가들의 불평을 자아낸 모더니즘 소설과 <b>달리<\/b>, 제임스의 플롯은 <b>가차 없는(relentless)<\/b> 속도로 전진하며 <b>대단원(denouement)<\/b>은 관습이 놓아둔 자리, 즉 <em>끝<\/em>에서 일어난다. 작품 속 대화는 때로 과장될지언정 <b>사실적(naturalistic — 실제 말투 같은)<\/b>이고, 작가는 전지(全知)적 존재로 등장한다. 그러나 이런 문학적 <b>정통(orthodoxy)에도 불구하고<\/b>, 제임스의 작품—<b>특히 후기 소설<\/b>—은 놀랍도록 새롭고 예상치 못한 무언가를 보여준다. 그의 <b>의식(consciousness)<\/b> 탐구는 어떤 복잡성 앞에서도 위축되지 않으며, 다른 면에서는 관습적인 그의 소설에 소설 분야의 모더니즘 기획을 특징짓는 <b>내면성(interiority)<\/b>을 부여한다.<\/p>", "strat": "<p><b>질문 2 — 동의비동의 RC-03<\/b><\/p><p><b>주제 문장 = S1 «At first glance, the place of Henry James among Modernist writers remains somewhat problematic.»<\/b> — 난이 표현(problematic, 자리매김이 어렵다)을 내건 제목 문장이다. S2~S4는 «문제적»인 까닭(고전적 형식)이고, S5 <em>Despite … though<\/em> 뒤 S5·S6은 제목에 대한 저자의 답(내면성 탐구의 모더니즘)이다. 요약 = 모더니즘 작가 사이에서 헨리 제임스의 위치(S1) — 형식은 고전적이지만(S2~S4) 의식·내면성 탐구에서 모더니즘적(S5·S6)이라는 이중성.<\/p><p>통념 대비 구조다. 표면(관습적 형식: 빠른 플롯·끝의 대단원·사실적 대화·전지적 화자)에서 제임스는 모더니즘과 거리가 있어 그의 위치가 \"problematic\"하다. 그러나 <code>Despite ~ though<\/code> 역접 뒤가 저자의 진짜 논지 — 후기작의 <b>의식·내면성 탐구<\/b>가 그를 모더니즘 기획에 잇는다. 즉 <em>형식은 고전적이나 내면성에서 모더니즘적<\/em>이라는 이중성이 글 전체의 축이다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: agree의 주어는 저자다. 보기 3개를 하나씩 따로, 저자의 축 — 형식은 고전적이라 «problematic», 후기작의 내면성 탐구는 모더니즘적 — 에 맞는지 판정한다.<\/li><li><b>정답(A)<\/b>: 저자는 제임스의 위치가 \"problematic\"인 이유를 그가 플롯을 유지(고전적 형식)하기 때문으로 본다. 만약 제임스가 플롯을 의식 탐구에 <em>종속<\/em>시켰다면(모더니즘식 \"nothing happens\"), 그는 더 명백히 모더니즘에 속했을 것 — 저자 논지와 정합.<\/li><li><b>정답(C)<\/b>: \"especially his late novels, show something amazingly new\" → 후기작이 모더니즘적 내면성을 더 많이 드러냄 → 초기작보다 후기작이 모더니즘과 공통점이 크다. 타당한 추론.<\/li><\/ul>", "wrong": "<ul><li><b>오답(B)<\/b>: 앞부분(내면성 공유)은 옳으나 \"관습적 서사 구조를 <em>뒤엎어(upending)<\/em> 모더니즘과 갈라진다\"가 오류. 제임스는 관습 구조를 <em>따름으로써<\/em> 모더니즘과 갈라진다 — 뒤엎는 게 아니라 지킨다. 정반대.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>denouement<\/td><td>n.<\/td><td>(플롯의) 대단원, 결말<\/td><td>resolution, conclusion<\/td><td>관습적으로 '끝'에 위치<\/td><\/tr><tr><td>relentless<\/td><td>adj.<\/td><td>가차 없는, 수그러들지 않는<\/td><td>unremitting, inexorable<\/td><td>플롯의 빠른 전진<\/td><\/tr><tr><td>orthodoxy<\/td><td>n.<\/td><td>정통, 통설<\/td><td>conventionality, conformity<\/td><td>↔ heterodoxy<\/td><\/tr><tr><td>naturalistic<\/td><td>adj.<\/td><td>사실적인, 실제 말투 같은<\/td><td>realistic, lifelike<\/td><td>대화의 성격 — 사조 Naturalism 아님<\/td><\/tr><tr><td>high-flown<\/td><td>adj.<\/td><td>과장된, 거창한<\/td><td>grandiloquent, bombastic<\/td><td>대화가 때로 과장됨<\/td><\/tr><tr><td>interiority<\/td><td>n.<\/td><td>내면성<\/td><td>inwardness<\/td><td>모더니즘 기획의 특징<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q7": {"html": true, "interp": "<p>많은 고생물학자는 척추동물 골격의 기원을 <em>방어 필요성<\/em>과 연결해 왔다. 이 가설에 따르면, 캄브리아기 바다에 살던 몸이 무른(soft-bodied) 최초의 척추동물은 수많은 육식성 무척추동물(carnivores)의 포식 때문에 뼈 비늘이나 판으로 된 광범위한 덮개를 진화시키기 시작했다. 이빨은 입으로 이동한 그 판들로부터 수백만 년에 걸쳐 진화한 <em>이차적<\/em> 특징으로 여겨진다. 그러나 또 다른 가설은, 한 쌍을 이룬 눈(paired eyes) 같은 척추동물의 결정적 특징 다수가 최초의 척추동물이 <em>포식성이 아니었다면<\/em> 진화하지 않았으리라고 주장한다(contends).<\/p><p>코노돈트(conodonts)라 불리는, 뱀장어를 닮은 작은 동물에서 나온 작고 가시 돋친 캄브리아기 화석은 이 논쟁에 중요한 함의를 갖는다. 이 화석들이 코노돈트의 <em>입에서 나온 이빨<\/em>임이 밝혀졌는데, 코노돈트는 최초의 척추동물 축에 들었을 수 있으며 이빨 외에는(otherwise) 광물화된 골격이 전혀 없었다. 만약 이빨이 외부 판보다 더 원시적이라면, 척추동물 골격은 <em>방어<\/em>를 돕는 적응이 아니라 <em>포식<\/em>을 돕는 적응에서 진화했을 수 있다.<\/p>", "strat": "<p><b>질문 1 — 유형 RC-06/select-the-sentence<\/b><\/p><p>구조: \"가설① 골격=방어 기원(이빨은 판에서 파생된 이차적) ↔ However 가설② 포식 기원(짝눈 등은 포식 전제) → 코노돈트 화석: 이빨이 판보다 먼저(골격은 이빨뿐) → 이빨이 더 원시적이면 골격은 <em>포식<\/em> 적응에서 기원\". FAC: 마지막 문장이 화석 발견의 <em>함의(결론)<\/em>. 태도: 두 가설 사이 증거의 의미를 짚음.<\/p>", "correct": "<ul><li><b>정답(클릭할 문장)<\/b>: <em>\"If teeth are more primitive than external plates, then the vertebrate skeleton may have evolved from adaptations to facilitate predation rather than from adaptations to facilitate protection.\"<\/em><\/li><li>근거: 앞 문장이 <em>발견<\/em>(코노돈트 화석=이빨)을 제시하고, 이 마지막 문장이 그 발견의 <em>의의<\/em>(포식 기원 가설 지지)를 명시한다.<\/li><\/ul>", "wrong": "<p>문장 선택형 문항이라 보기가 따로 없습니다. 위 정답 근거를 확인하세요.<\/p>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>contend<\/td><td>v.<\/td><td>주장하다; 다투다<\/td><td>maintain, assert<\/td><td>(거만어 외) · 이 문제 sense=주장<\/td><\/tr><tr><td>predation<\/td><td>n.<\/td><td>포식<\/td><td>hunting, preying<\/td><td>predate<\/td><\/tr><tr><td>primitive<\/td><td>adj.<\/td><td>원시적인, 초기의<\/td><td>primordial, early<\/td><td>(거만어 외)<\/td><\/tr><tr><td>mineralized<\/td><td>adj.<\/td><td>광물화된<\/td><td>calcified<\/td><td>(거만어 외)<\/td><\/tr><tr><td>remonstrate<\/td><td>v.<\/td><td>항의하다<\/td><td>protest, object<\/td><td>오답 보기<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q8": {"html": true, "interp": "<p>많은 고생물학자는 척추동물 골격의 기원을 <em>방어 필요성<\/em>과 연결해 왔다. 이 가설에 따르면, 캄브리아기 바다에 살던 몸이 무른(soft-bodied) 최초의 척추동물은 수많은 육식성 무척추동물(carnivores)의 포식 때문에 뼈 비늘이나 판으로 된 광범위한 덮개를 진화시키기 시작했다. 이빨은 입으로 이동한 그 판들로부터 수백만 년에 걸쳐 진화한 <em>이차적<\/em> 특징으로 여겨진다. 그러나 또 다른 가설은, 한 쌍을 이룬 눈(paired eyes) 같은 척추동물의 결정적 특징 다수가 최초의 척추동물이 <em>포식성이 아니었다면<\/em> 진화하지 않았으리라고 주장한다(contends).<\/p><p>코노돈트(conodonts)라 불리는, 뱀장어를 닮은 작은 동물에서 나온 작고 가시 돋친 캄브리아기 화석은 이 논쟁에 중요한 함의를 갖는다. 이 화석들이 코노돈트의 <em>입에서 나온 이빨<\/em>임이 밝혀졌는데, 코노돈트는 최초의 척추동물 축에 들었을 수 있으며 이빨 외에는(otherwise) 광물화된 골격이 전혀 없었다. 만약 이빨이 외부 판보다 더 원시적이라면, 척추동물 골격은 <em>방어<\/em>를 돕는 적응이 아니라 <em>포식<\/em>을 돕는 적응에서 진화했을 수 있다.<\/p>", "strat": "<p><b>질문 2 — 유형 RC-03<\/b><\/p><p>구조: \"가설① 골격=방어 기원(이빨은 판에서 파생된 이차적) ↔ However 가설② 포식 기원(짝눈 등은 포식 전제) → 코노돈트 화석: 이빨이 판보다 먼저(골격은 이빨뿐) → 이빨이 더 원시적이면 골격은 <em>포식<\/em> 적응에서 기원\". FAC: 마지막 문장이 화석 발견의 <em>함의(결론)<\/em>. 태도: 두 가설 사이 증거의 의미를 짚음.<\/p>", "correct": "<p>보기 3개 → select-all. <em>방어<\/em> 기원을 주장하는 학자들이 \"carnivores\"에 대해 동의할 것.<\/p><ul><li><b>정답: A<\/b><\/li><li><b>A. 광물화된 이빨이 없었다<\/b> — O. 그 carnivores는 <em>무척추(invertebrate)<\/em> 동물 — 광물 골격(이빨 포함)은 척추동물의 특징이므로, 무척추 육식동물에겐 광물화된 이빨이 없었다고 동의할 것.<\/li><\/ul>", "wrong": "<ul><li><b>B. 뼈 비늘·판으로 덮여 있었다<\/b> — X. 비늘·판을 진화시킨 것은 포식당한 <em>척추동물<\/em>이지 포식자(carnivores)가 아니다.<\/li><li><b>C. 포식을 위해 짝눈을 진화시켰다<\/b> — X. 짝눈을 포식과 연결한 것은 <em>반대 가설<\/em>(포식 기원). 방어 기원 학자의 견해가 아니다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>contend<\/td><td>v.<\/td><td>주장하다; 다투다<\/td><td>maintain, assert<\/td><td>(거만어 외) · 이 문제 sense=주장<\/td><\/tr><tr><td>predation<\/td><td>n.<\/td><td>포식<\/td><td>hunting, preying<\/td><td>predate<\/td><\/tr><tr><td>primitive<\/td><td>adj.<\/td><td>원시적인, 초기의<\/td><td>primordial, early<\/td><td>(거만어 외)<\/td><\/tr><tr><td>mineralized<\/td><td>adj.<\/td><td>광물화된<\/td><td>calcified<\/td><td>(거만어 외)<\/td><\/tr><tr><td>remonstrate<\/td><td>v.<\/td><td>항의하다<\/td><td>protest, object<\/td><td>오답 보기<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q9": {"html": true, "interp": "<p>많은 고생물학자는 척추동물 골격의 기원을 <em>방어 필요성<\/em>과 연결해 왔다. 이 가설에 따르면, 캄브리아기 바다에 살던 몸이 무른(soft-bodied) 최초의 척추동물은 수많은 육식성 무척추동물(carnivores)의 포식 때문에 뼈 비늘이나 판으로 된 광범위한 덮개를 진화시키기 시작했다. 이빨은 입으로 이동한 그 판들로부터 수백만 년에 걸쳐 진화한 <em>이차적<\/em> 특징으로 여겨진다. 그러나 또 다른 가설은, 한 쌍을 이룬 눈(paired eyes) 같은 척추동물의 결정적 특징 다수가 최초의 척추동물이 <em>포식성이 아니었다면<\/em> 진화하지 않았으리라고 주장한다(contends).<\/p><p>코노돈트(conodonts)라 불리는, 뱀장어를 닮은 작은 동물에서 나온 작고 가시 돋친 캄브리아기 화석은 이 논쟁에 중요한 함의를 갖는다. 이 화석들이 코노돈트의 <em>입에서 나온 이빨<\/em>임이 밝혀졌는데, 코노돈트는 최초의 척추동물 축에 들었을 수 있으며 이빨 외에는(otherwise) 광물화된 골격이 전혀 없었다. 만약 이빨이 외부 판보다 더 원시적이라면, 척추동물 골격은 <em>방어<\/em>를 돕는 적응이 아니라 <em>포식<\/em>을 돕는 적응에서 진화했을 수 있다.<\/p>", "strat": "<p><b>질문 3 — 유형 RC-09<\/b><\/p><p>구조: \"가설① 골격=방어 기원(이빨은 판에서 파생된 이차적) ↔ However 가설② 포식 기원(짝눈 등은 포식 전제) → 코노돈트 화석: 이빨이 판보다 먼저(골격은 이빨뿐) → 이빨이 더 원시적이면 골격은 <em>포식<\/em> 적응에서 기원\". FAC: 마지막 문장이 화석 발견의 <em>함의(결론)<\/em>. 태도: 두 가설 사이 증거의 의미를 짚음.<\/p>", "correct": "<p>보기 5개 → 단일선택.<\/p><ul><li><b>정답: C<\/b><\/li><li><b>C. maintains(주장하다)<\/b> — O. 여기 <code>contends<\/code>는 \"또 다른 가설이 ~라고 <em>주장한다<\/em>\"의 의미.<\/li><\/ul>", "wrong": "<ul><li><b>A. competes(경쟁하다) / E. struggles(분투하다)<\/b>: contend의 다른 사전 뜻이나 문맥(주장)과 안 맞음.<\/li><li><b>B. disputes(반박하다)<\/b>: 가설이 무엇을 <em>반박<\/em>하는 게 아니라 <em>내세운다<\/em>. 함정.<\/li><li><b>D. remonstrates(항의하다)<\/b>: 의미 동떨어짐.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>contend<\/td><td>v.<\/td><td>주장하다; 다투다<\/td><td>maintain, assert<\/td><td>(거만어 외) · 이 문제 sense=주장<\/td><\/tr><tr><td>predation<\/td><td>n.<\/td><td>포식<\/td><td>hunting, preying<\/td><td>predate<\/td><\/tr><tr><td>primitive<\/td><td>adj.<\/td><td>원시적인, 초기의<\/td><td>primordial, early<\/td><td>(거만어 외)<\/td><\/tr><tr><td>mineralized<\/td><td>adj.<\/td><td>광물화된<\/td><td>calcified<\/td><td>(거만어 외)<\/td><\/tr><tr><td>remonstrate<\/td><td>v.<\/td><td>항의하다<\/td><td>protest, object<\/td><td>오답 보기<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q10": {"html": true, "interp": "<p>왕의 책은 중국의 자서전을 별개의 독립된 장르(a separate / a discrete)로 정의하려는 최초의 시도다. 곧, 1911년 청 왕조의 붕괴 이후 유행한 다른 자기표현 서사 양식들과 구별되는 장르로 규정하려는 것이다.<\/p><p><b>해석 노트:<\/b> <b>discrete<\/b>는 ‘서로 구별되는, 별개의’라는 뜻이다. ‘신중한’을 뜻하는 <b>discreet<\/b>와 구별한다. «popular after …»는 다른 서사 양식들이 유행한 시기를 설명하며, 자서전의 탄생 시기를 확정하지 않는다.<\/p>", "strat": "<ol><li><b>5 Zones — 빈칸 뒤의 재진술을 확인한다.<\/b><br>핵심은 «one distinct from other narrative modes»이다. 자서전을 다른 서사 양식들과 <b>구별되는 장르<\/b>로 정의한다는 뜻이다.<\/li><li><b>동격 설명으로 빈칸의 의미를 확정한다.<\/b><br>«that is» 뒤의 «one»은 앞의 «genre»를 다시 받는다. trigger-04의 동격 설명에 따라 앞뒤가 같은 내용을 나타내야 한다. 따라서 빈칸은 «distinct»를 바꾸어 표현한 말이다.<\/li><li><b>SE 짝 논리 — 독립적으로 구별되는 성격을 찾는다.<\/b><br><b>a separate–a discrete<\/b>는 모두 다른 것들과 구별되는 별개의 장르라는 뜻을 만든다. 영향력이 크다는 뜻의 짝은 뒤의 정의와 맞지 않는다.<\/li><li><b>문장 전체를 확인한다.<\/b><br>책의 시도는 중국 자서전의 영향력을 평가하는 것이 아니라, 다른 자기표현 양식들과 구별하여 하나의 장르로 규정하는 것이다.<\/li><\/ol>", "correct": "<ul><li><b>a separate<\/b>(별개의): 다른 서사 양식과 구별된다는 «distinct from»의 설명을 그대로 반영한다.<\/li><li><b>a discrete<\/b>(독립적으로 구별되는): 자서전을 별도의 범주로 규정한다는 뜻에서 <b>a separate<\/b>와 동등한 문장을 만든다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Wang's book is the first attempt to define Chinese autobiography as <b>a separate<\/b> genre, that is, one distinct from other narrative modes of self-representation popular after the fall of the Qing dynasty in 1911.<\/p><p>Wang's book is the first attempt to define Chinese autobiography as <b>a discrete<\/b> genre, that is, one distinct from other narrative modes of self-representation popular after the fall of the Qing dynasty in 1911.<\/p>", "wrong": "<ul><li><b>an imported<\/b>(외부에서 도입된): 자서전이 외국에서 유입되었다는 근거가 없다.<\/li><li><b>an influential<\/b>(영향력 있는): <b>★가장 매력적인 오답.<\/b> <b>a consequential<\/b>과 의미상 짝을 이룰 수 있다. 그러나 뒤 절은 영향력이 아니라 장르 간 구별을 설명한다.<\/li><li><b>an archetypal<\/b>(전형적인, 원형이 되는): 다른 서사 양식의 전형이나 원형이라는 뜻은 그들과 구별되는 별개 장르라는 뜻과 다르다.<\/li><li><b>a consequential<\/b>(중요한, 영향이 큰): 장르의 중요성을 평가하는 말이다. «distinct»의 재진술이 되지 않는다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>separate<\/td><td>형용사<\/td><td>별개의, 분리된<\/td><td>distinct, independent<\/td><td>(거만어 외)<\/td><\/tr><tr><td>discrete<\/td><td>형용사<\/td><td>독립적으로 구별되는<\/td><td>separate, distinct<\/td><td>거만어<\/td><\/tr><tr><td>import → imported<\/td><td>형용사<\/td><td>외부에서 도입된<\/td><td>introduced from abroad<\/td><td>거만어<\/td><\/tr><tr><td>influential<\/td><td>형용사<\/td><td>영향력 있는<\/td><td>powerful, consequential<\/td><td>(거만어 외)<\/td><\/tr><tr><td>archetypal<\/td><td>형용사<\/td><td>전형적인, 원형이 되는<\/td><td>prototypical, quintessential<\/td><td>(거만어 외)<\/td><\/tr><tr><td>consequential<\/td><td>형용사<\/td><td>중요한, 영향이 큰<\/td><td>significant, important<\/td><td>거만어<\/td><\/tr><tr><td>autobiography<\/td><td>명사<\/td><td>자서전<\/td><td>personal memoir<\/td><td>(거만어 외)<\/td><\/tr><tr><td>self-representation<\/td><td>명사<\/td><td>자기표현, 자기 재현<\/td><td>portrayal of oneself<\/td><td>(거만어 외)<\/td><\/tr><tr><td>distinct<\/td><td>형용사<\/td><td>구별되는, 별개의<\/td><td>different, separate<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q11": {"html": true, "interp": "<p>일부 산악인들은 알프스에서의 수정(crystal) 채집을, 통상적 등반(conventional Alpinism)이 속도를 앞세우는 풍조에 대한 해독제라며 칭송한다(hail). 그들이 한탄하듯, 그 속도 편중은 여유로운 관찰(leisurely observation)을 흔히 가로막는다.<\/p><p><b>해석 노트:<\/b> antidote는 본래 독을 중화하는 약이므로, 속도 편중을 일종의 병폐로 보는 원문의 함의를 살려 '해독제'로 그대로 옮겼다. the emphasis placed on speed를 '속도에 두는 강조'로 직역하면 번역기투가 되므로 '속도를 앞세우는 풍조'로 풀었다. hail은 단순한 평가가 아니라 환호에 가까운 상찬이라 '칭송한다'로 받았고, 문장 한가운데 끼어든 삽입절 they lament는 우리말에 그대로 끼우면 흐름이 끊기므로 뒤 문장 앞으로 빼 '그들이 한탄하듯'으로 처리했다. 나머지 정답 a corrective to를 넣으면 '바로잡는 교정 수단'이 되어 비유가 의학에서 교정으로 옮겨갈 뿐 뜻은 같다.<\/p>", "strat": "<p><code>hail A as 빈칸 the emphasis on speed<\/code>(속도 강조에 대한 빈칸으로 칭송) — 빈칸은 <code>an antidote to/a corrective to the emphasis<\/code>라는 <b>명사구<\/b>다. 산악인들은 속도 강조를 <em>한탄(lament)<\/em>하므로, 수정 채집을 그 속도주의의 <b>해독제·교정책<\/b>으로 본다. 즉 빈칸 = \"~에 대한 해결책·바로잡음\". 수정 채집(느긋한 활동)이 속도주의의 폐해를 <em>바로잡는다<\/em>는 긍정적 대비. 이 대비는 hail↔lament와 FAC 의미 구조(4Rules)가 끄는 것이고 SE이므로 이 의미의 <b>동의어 두 개<\/b>를 고른다.<\/p>", "correct": "<p><b>an antidote to(~에 대한 해독제·해결책)<\/b> 와 <b>a corrective to(~에 대한 교정책·바로잡는 것)<\/b> — 둘은 \"어떤 폐해를 바로잡는 처방\"이라는 뜻에서 통하며, \"속도주의를 한탄하며 칭송한다\"는 긍정적 대비에 맞는다. 각각 넣어도 뜻이 동등하다(SE 요건).<\/p><p><b>완성 문장<\/b><\/p><p>Some mountaineers hail crystal hunting in the Alps as <b>an antidote to<\/b> the emphasis placed on speed in conventional Alpinism which, they lament, often precludes leisurely observation.<\/p>", "wrong": "<ul><li><b>an outgrowth of(~의 산물·파생물)<\/b> / <b>a product of(~의 산물)<\/b> — 둘끼리 \"~에서 나온 것\" 쪽 동의어쌍이지만, 수정 채집은 속도주의의 <em>산물<\/em>이 아니라 그에 <em>맞서는<\/em> 것. 방향 반대(SE 함정).<\/li><li><b>an example of(~의 한 예)<\/b> — 수정 채집이 속도 강조의 <em>예<\/em>라면, hail/lament(칭송하며 한탄)의 대비 논리와 모순.<\/li><li><b>a threat to(~에 대한 위협)<\/b> — \"위협\"은 부정어. \"칭송한다(hail)\"의 긍정 맥락과 안 맞고, 정답 쌍(해독제)과도 다르다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>antidote<\/td><td>n.<\/td><td>해독제, (폐해의) 해결책<\/td><td>remedy, cure, counteragent<\/td><td>(거만어). 정답①<\/td><\/tr><tr><td>corrective<\/td><td>n.<\/td><td>교정책, 바로잡는 것<\/td><td>remedy, counterbalance<\/td><td>(거만어 외). 정답②<\/td><\/tr><tr><td>outgrowth<\/td><td>n.<\/td><td>산물, 파생물, 자연스러운 결과<\/td><td>byproduct, offshoot<\/td><td>(거만어 외). 오답(방향 반대)<\/td><\/tr><tr><td>hail<\/td><td>v.<\/td><td>칭송하다, 환호하다<\/td><td>acclaim, extol, applaud<\/td><td>(거만어). 본문 긍정 단서<\/td><\/tr><tr><td>preclude<\/td><td>v.<\/td><td>막다, 못 하게 하다<\/td><td>prevent, rule out, obviate<\/td><td>(거만어). 본문 \"precludes observation\"<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q12": {"html": true, "interp": "<p>과학자들은 성인의 뇌가 한때 믿었던 것보다 훨씬 더 잘 빚어지는 기관임을 알아 가고 있다. 우리의 행동과 환경이 뇌의 배선을 상당 부분 다시 깔고, 기능들과 그 기능이 놓이는 자리까지 새로 짜 놓을 수 있는 것이다.<\/p><p><b>해석 노트:<\/b> malleable은 본래 금속이 망치질에 따라 펴지는 성질을 가리키므로 '유연한'보다 '잘 빚어지는'이 원의에 가깝고, 뒤에 나오는 '다시 깔고 새로 짜는'이라는 능동적 개조와도 결이 맞는다. rewiring은 회로를 다시 배선한다는 비유이므로 '재배선'이라는 술어 대신 '배선을 다시 깔다'로 풀어 비유를 눈에 보이게 했다. where they are located는 직역하면 '그것들이 위치한 곳'이 되어 문장이 늘어지므로 '그 기능이 놓이는 자리'로 줄이고 앞의 reorganization과 하나로 묶었다. 콜론은 앞 진술의 근거를 대는 자리이므로 '~인 것이다'로 마감해 부연 관계를 표시했다.<\/p>", "strat": "<ul><li>결정 신호는 <b>콜론(:)<\/b>(trigger-05)이다. 콜론은 바로 앞을 노골적으로 부연하므로, 콜론 뒤 내용이 곧 빈칸의 정의가 된다.<\/li><li>콜론 뒤: 행동과 환경이 뇌의 <b>substantial rewiring<\/b>(대대적 재배선)과 <b>reorganization of its functions<\/b>(기능 재조직)을 일으킨다 → 성인의 뇌가 <b>바뀔 수 있다·고쳐 짜일 수 있다<\/b>는 성질. 즉 빈칸 = <b>변형 가능성<\/b>.<\/li><li><b><code>than they once thought<\/code><\/b>(trigger-17 — once가 만드는 turning point)가 방향을 못 박는다. 예전에는 성인 뇌가 굳어 있다고 보았는데 지금은 아니다 → 빈칸은 '고정'이 아니라 '가변' 쪽. 신경과학의 <b>neuroplasticity<\/b>(신경가소성)를 그대로 옮긴 문장이다.<\/li><li>SE이므로 조건은 두 가지다 — (1) 서로 <b>동의어 짝<\/b>을 이루고, (2) 그 뜻이 <b>'잘 변하는'<\/b>이어야 한다. 둘 다 만족하는 짝은 <b>malleable · plastic<\/b>뿐이다.<\/li><li><code>heterogeneous · variegated<\/code>는 <b>동의어 짝<\/b>(이질적인/다채로운)이지만 뜻이 '다양성'이라 콜론 뒤의 '변형'과 축이 다르다. 짝만 보고 고르면 걸린다.<\/li><li><code>plastic<\/code>은 명사 '플라스틱'이 아니라 형용사 <b>'가소성 있는, 성형 가능한'<\/b>의 뜻이다. 이 단어의 학술적 용법을 아는지가 사실상의 관문이다.<\/li><\/ul>", "correct": "<p><b>malleable, plastic<\/b><\/p><ul><li><b>malleable<\/b> = (금속처럼) 잘 펴지는 → 비유적으로 '외부 영향에 따라 잘 바뀌는'. 콜론 뒤 rewiring·reorganization과 정확히 대응.<\/li><li><b>plastic<\/b> = 가소성 있는, 성형 가능한 → neuroplasticity(신경가소성)의 그 plastic. malleable과 같은 뜻.<\/li><li>두 단어를 각각 넣어도 \"성인의 뇌가 생각보다 훨씬 잘 바뀐다\"라는 문장 뜻이 동일하게 성립한다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Scientists are finding that the adult brain is far more <b>malleable<\/b> than they once thought: our behavior and environment can cause substantial rewiring of the brain or a reorganization of its functions and where they are located.<\/p>", "wrong": "<ul><li><b>heterogeneous · variegated<\/b>: '이질적인'과 '다채로운'으로 서로 <b>동의어 짝을 이루긴 하나<\/b>, 뜻이 '구성의 다양함'이지 '변형 가능성'이 아니다. 콜론 뒤는 뇌가 여러 요소로 이루어졌다는 말이 아니라 뇌가 <b>바뀐다<\/b>는 말이다. SE의 전형적 함정 — 짝은 맞아도 <b>의미 조건<\/b> 불충족.<\/li><li><b>reparable<\/b>: '수리 가능한'. 손상을 전제로 한 복구의 어휘라, 손상 이야기가 전혀 없는 이 문장과 어긋난다. 짝을 이룰 상대도 없다.<\/li><li><b>complex<\/b>: '복잡한'. 뇌가 복잡하다는 것은 이미 아는 사실이라 <code>than they once thought<\/code>가 만드는 통념 전복이 성립하지 않고, 콜론 뒤의 '변화'와도 축이 다르다. 짝도 없다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>malleable<\/td><td>adj.<\/td><td>잘 펴지는, 영향에 따라 잘 바뀌는<\/td><td>pliable, adaptable<\/td><td>정답<\/td><\/tr><tr><td>plastic<\/td><td>adj.<\/td><td>가소성 있는, 성형 가능한<\/td><td>moldable, malleable<\/td><td>정답<\/td><\/tr><tr><td>heterogeneous<\/td><td>adj.<\/td><td>이질적인, 잡다한<\/td><td>diverse, motley<\/td><td>함정 동의어짝<\/td><\/tr><tr><td>variegated<\/td><td>adj.<\/td><td>다채로운, 여러 빛깔의<\/td><td>diversified, varied<\/td><td>함정 동의어짝<\/td><\/tr><tr><td>reparable<\/td><td>adj.<\/td><td>수리·복구 가능한<\/td><td>fixable, remediable<\/td><td>오답 (손상 전제)<\/td><\/tr><tr><td>complex<\/td><td>adj.<\/td><td>복잡한<\/td><td>intricate, complicated<\/td><td>오답 (짝 없음)<\/td><\/tr><tr><td>rewiring<\/td><td>n.<\/td><td>배선을 다시 깜, 회로 재구성<\/td><td>reconfiguration<\/td><td>빈칸의 근거어<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q13": {"html": true, "interp": "<p>스탠턴에서는 자동차 사고 1건당 평균 부상자 수가, 택시가 연루된 사고 쪽이 택시가 연루되지 않은 사고 쪽보다 일관되게 높다. 스탠턴의 모든 택시에는 승객용 안전벨트가 갖춰져 있지만, 택시 기사들은 승객들이 그것을 잘 쓰지 않는다고 보고한다. 따라서 택시 승객에게 안전벨트 착용을 의무화하면, 택시의 사고 1건당 부상자 수도 곧 다른 차량보다 높지 않게 될 가능성이 크다.<\/p>", "strat": "<p><b>질문 1 — 유형 CR-04<\/b><\/p><ul><li>사실(q): 택시 사고의 1건당 부상자 수가 더 많다 + 택시 승객은 벨트를 잘 안 맨다.<\/li><li>결론(r): 그러므로 벨트를 의무화하면 택시의 1건당 부상자 수가 다른 차 수준으로 떨어질 것.<\/li><li>비약(q⇒r): \"택시의 더 많은 부상자 = 벨트 미착용 <b>때문<\/b>\"이라고 전제한다. 그러나 택시가 부상자가 많은 다른 이유(예: <b>차에 탄 사람 수 자체가 더 많음<\/b>)가 있다면, 벨트를 매도 1건당 부상자 수는 여전히 높을 수 있다(CR-04 해법 = q와 r 사이 비약 공격, 전제 부정).<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (D)<\/b>: \"운전자를 포함해 차량에 탑승하는 사람 수가 일반적으로 택시가 다른 차량보다 더 많다.\" → 택시의 부상자가 많은 것이 벨트 미착용이 아니라 <b>탑승 인원이 많기 때문<\/b>일 수 있음을 보여준다. 그렇다면 벨트를 의무화해도 1건당 부상자 수는 여전히 높게 남을 수 있어, \"벨트만 매면 같아진다\"는 결론이 약화된다(숨은 전제를 부정).<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A: 사고 건수가 줄고 있다 — 1건당 부상자 수(비율)와 무관.<\/li><li>B: 택시는 연주행거리가 길어 사고 확률이 높다 — 사고 '빈도'이지 1건당 부상자 '수'가 아님(논점 다름).<\/li><li>C: 택시 대수 비율이 높다 — 전체 분포일 뿐 1건당 부상자 수와 무관.<\/li><li>E: 다른 차량 승객도 벨트를 다 매는 건 아니다 — 오히려 양쪽 조건을 비슷하게 만들어 결론을 흔들지 않음(약화 아님).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>weaken<\/td><td>v.<\/td><td>약화시키다, 논박하다<\/td><td>undermine, cast doubt on<\/td><td>질문어(CR-04 신호). (거만어 외)<\/td><\/tr><tr><td>occupy<\/td><td>v.<\/td><td>(자리를) 차지하다, 탑승하다<\/td><td>take up, inhabit<\/td><td>보기어. (거만어 외)<\/td><\/tr><tr><td>consistently<\/td><td>adv.<\/td><td>일관되게<\/td><td>steadily, uniformly<\/td><td>본문어. (거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q14": {"html": true, "interp": "<p>지난 두 세기 동안 저자와 출판사들은 \"회고록(memoir)\"이라는 명칭을 <b>상당히 다른 종류의 글쓰기<\/b>에 붙여 왔다. 줄리 랙(Julie Rak)은 자신의 논문 \"회고록은 자서전인가?\"에서 그 용어의 <b>계보(genealogy)<\/b>를 추적하며, 그 용어의 <b>근본적 불안정성(radical instability)<\/b>을 부각한다 — \"회고록\"은 1인칭 서술과 3인칭 서술 모두에, 그리고 사적·공적, 비공식·공식적 생애 기록 모두에 쓰여 왔다는 것이다. 주목할 점은 문학 비평가들이 흔히 \"회고록\"을 \"자서전\"의 <b>하위 장르<\/b>로 여겨 왔다는 것인데, 이 구분의 근거는 다소 일관되지 않았지만(inconstant) 구분 자체는 변함없이 유지되어 왔다: \"회고록\"은 사소하고 문학에 못 미치는(subliterary) 형식으로 <b>평가절하(devalue)<\/b>되어 온 반면, \"자서전\"은 문학적 지위를 누려 왔다. 그러나 최근 회고록에 대한 관심이 커지면서 작가와 출판사들이 비평가들을 <b>앞질러(outflank)<\/b> 버렸다: 이제 \"회고록\"이 더 <b>권위 있는(prestige)<\/b> 용어가 되었다.<\/p>", "strat": "<p><b>질문 1 — 주제/구성 RC-01<\/b><\/p><p><b>주제 문장 = S1<\/b> «The label \"memoir\" has been attached by authors and publishers to quite different kinds of writing over the past two centuries.» — 글의 틀이다. S3 While 문장은 그 안의 옛 구분 소개, S4 Recently, however는 위계의 역전(후반 전개)이다. 요약 = «memoir»라는 명칭이 두 세기 동안 서로 다른 글에 붙어 오며 뜻과 지위가 변해 왔다는 글(S1) — Rak의 논문(S2), autobiography와의 옛 위계(S3), 최근의 역전(S4).<\/p><p>첫 문장이 주제다: \"memoir\"라는 명칭이 두 세기에 걸쳐 서로 다른 종류의 글에 붙어 왔다는 것 — 즉 용어의 의미·용법이 시대에 따라 변해왔다. Rak의 논문은 이 주장을 뒷받침하는 <b>예시<\/b>로 도입되어 용어의 '불안정성'을 확증한다. 이어 비평가들이 memoir를 autobiography 하위로 평가절하해 온 오랜 구분을 소개한 뒤, 마지막 문장에서 그 위계가 역전(memoir가 이제 prestige)되었음을 밝혀 '용어의 지위·정의가 어떻게 바뀌어 왔는가'를 전체적으로 서술한다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: 주제 문장 첫 문장(«memoir»라는 명칭이 서로 다른 글에 붙어 왔다) 중심으로 요약한다. Rak의 논문(둘째 문장)은 예시, 셋째 문장의 옛 위계와 넷째 문장 however의 역전은 변화의 단계이므로, 한 용어가 바뀌어 온 과정을 담은 보기를 고른다.<\/li><li><b>정답(B) describe how the definition of a literary term has changed<\/b>: 지문은 처음부터 끝까지 \"memoir\"라는 한 문학 용어가 무엇을 가리키고 어떤 지위를 지녔는지가 시대에 따라 어떻게 변해왔는지(다양한 글 → 평가절하 → prestige)를 서술한다. 곧 '한 용어의 정의·용법 변화 서술'이 전체를 관통한다.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>:<\/li><li>A. identify the origins of a particular distinction: 지문은 memoir/autobiography 구분의 '기원'을 규명하지 않는다. 구분의 근거는 오히려 '일관되지 않았다(inconstant)'고만 말한다. 범위 축소.<\/li><li>C. correct a misunderstanding: 저자가 어떤 오해를 바로잡는 것이 아니라 변화를 기술할 뿐. 없는 내용.<\/li><li>D. evaluate competing definitions: 경합하는 정의들을 저울질·평가하지 않는다. 변화를 서술할 뿐 우열 판정 없음.<\/li><li>E. account for a recent change in literary preferences: 마지막 문장(memoir가 prestige가 됨)만을 포착한 '부분'이며, 게다가 그 변화의 '원인 설명(account for)'도 아니다(관심 증가로 앞질렀다는 서술뿐). 지문 전체 목적이 아님.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>genealogy<\/td><td>n.<\/td><td>계보, 유래의 추적<\/td><td>lineage, provenance<\/td><td>용어의 역사를 추적<\/td><\/tr><tr><td>instability<\/td><td>n.<\/td><td>불안정성<\/td><td>volatility, inconstancy<\/td><td>용어가 여러 뜻으로 흔들림<\/td><\/tr><tr><td>inconstant<\/td><td>adj.<\/td><td>일관되지 않은, 변덕스러운<\/td><td>variable, fickle<\/td><td>구분 '근거'가 일정치 않음<\/td><\/tr><tr><td>devalue<\/td><td>v.<\/td><td>평가절하하다<\/td><td>belittle, disparage<\/td><td>memoir를 minor form으로<\/td><\/tr><tr><td>outflank<\/td><td>v.<\/td><td>(측면으로) 앞지르다, 능가하다<\/td><td>outmaneuver, surpass<\/td><td>작가·출판사가 비평가를 앞섬<\/td><\/tr><tr><td>prestige<\/td><td>n.<\/td><td>권위, 위신 (있는)<\/td><td>esteem, cachet<\/td><td>이제 memoir가 prestige 용어<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q15": {"html": true, "interp": "<p>지난 두 세기 동안 저자와 출판사들은 \"회고록(memoir)\"이라는 명칭을 <b>상당히 다른 종류의 글쓰기<\/b>에 붙여 왔다. 줄리 랙(Julie Rak)은 자신의 논문 \"회고록은 자서전인가?\"에서 그 용어의 <b>계보(genealogy)<\/b>를 추적하며, 그 용어의 <b>근본적 불안정성(radical instability)<\/b>을 부각한다 — \"회고록\"은 1인칭 서술과 3인칭 서술 모두에, 그리고 사적·공적, 비공식·공식적 생애 기록 모두에 쓰여 왔다는 것이다. 주목할 점은 문학 비평가들이 흔히 \"회고록\"을 \"자서전\"의 <b>하위 장르<\/b>로 여겨 왔다는 것인데, 이 구분의 근거는 다소 일관되지 않았지만(inconstant) 구분 자체는 변함없이 유지되어 왔다: \"회고록\"은 사소하고 문학에 못 미치는(subliterary) 형식으로 <b>평가절하(devalue)<\/b>되어 온 반면, \"자서전\"은 문학적 지위를 누려 왔다. 그러나 최근 회고록에 대한 관심이 커지면서 작가와 출판사들이 비평가들을 <b>앞질러(outflank)<\/b> 버렸다: 이제 \"회고록\"이 더 <b>권위 있는(prestige)<\/b> 용어가 되었다.<\/p>", "strat": "<p><b>질문 2 — 언급목적 RC-08<\/b><\/p><p><b>주제 문장 = S1<\/b> «The label \"memoir\" has been attached by authors and publishers to quite different kinds of writing over the past two centuries.» — 글의 틀이다. S3 While 문장은 그 안의 옛 구분 소개, S4 Recently, however는 위계의 역전(후반 전개)이다. 요약 = «memoir»라는 명칭이 두 세기 동안 서로 다른 글에 붙어 오며 뜻과 지위가 변해 왔다는 글(S1) — Rak의 논문(S2), autobiography와의 옛 위계(S3), 최근의 역전(S4).<\/p><p>첫 문장이 주제다: \"memoir\"라는 명칭이 두 세기에 걸쳐 서로 다른 종류의 글에 붙어 왔다는 것 — 즉 용어의 의미·용법이 시대에 따라 변해왔다. Rak의 논문은 이 주장을 뒷받침하는 <b>예시<\/b>로 도입되어 용어의 '불안정성'을 확증한다. 이어 비평가들이 memoir를 autobiography 하위로 평가절하해 온 오랜 구분을 소개한 뒤, 마지막 문장에서 그 위계가 역전(memoir가 이제 prestige)되었음을 밝혀 '용어의 지위·정의가 어떻게 바뀌어 왔는가'를 전체적으로 서술한다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: article이 든 문장을 해석하고 앞 문장 첫 문장의 keyword를 support하는지 본다. 논문이 용어의 radical instability를 부각한다고 했으므로, 첫 문장의 용어에 관한 주장을 뒷받침한다는 방향의 보기를 고른다.<\/li><li><b>정답(E) illustrate a claim about a particular term<\/b>: 첫 문장의 주장 — \"memoir\"라는 용어가 매우 다른 글들에 붙어 왔다(=용어가 불안정하다) — 를 뒷받침하려고 Rak의 논문을 든다. 논문이 \"용어의 radical instability를 부각한다\"고 명시되어, 논문은 곧 그 용어에 관한 주장을 <b>예시·확증<\/b>하는 장치다.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>:<\/li><li>A. show how a particular distinction has become blurred: memoir/autobiography 구분이 흐려졌다는 이야기가 아니라, 하나의 용어가 여러 대상에 쓰였다는 이야기. 대상 혼동.<\/li><li>B. cite an argument that challenges a widespread view: 논문은 저자의 주장을 반박·도전하는 것이 아니라 뒷받침한다. 방향 반대.<\/li><li>C. demonstrate that a change has occurred over time: 논문이 강조하는 것은 시간적 '변화'가 아니라 용어의 '불안정성(동시에 여러 뜻으로 쓰임)'이다. 변화는 마지막 문장의 몫.<\/li><li>D. note an example of a scholarly controversy: 학문적 논쟁을 예시하는 것이 아니다. 논문 하나만 인용될 뿐 대립 구도가 없다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>genealogy<\/td><td>n.<\/td><td>계보, 유래의 추적<\/td><td>lineage, provenance<\/td><td>용어의 역사를 추적<\/td><\/tr><tr><td>instability<\/td><td>n.<\/td><td>불안정성<\/td><td>volatility, inconstancy<\/td><td>용어가 여러 뜻으로 흔들림<\/td><\/tr><tr><td>inconstant<\/td><td>adj.<\/td><td>일관되지 않은, 변덕스러운<\/td><td>variable, fickle<\/td><td>구분 '근거'가 일정치 않음<\/td><\/tr><tr><td>devalue<\/td><td>v.<\/td><td>평가절하하다<\/td><td>belittle, disparage<\/td><td>memoir를 minor form으로<\/td><\/tr><tr><td>outflank<\/td><td>v.<\/td><td>(측면으로) 앞지르다, 능가하다<\/td><td>outmaneuver, surpass<\/td><td>작가·출판사가 비평가를 앞섬<\/td><\/tr><tr><td>prestige<\/td><td>n.<\/td><td>권위, 위신 (있는)<\/td><td>esteem, cachet<\/td><td>이제 memoir가 prestige 용어<\/td><\/tr><\/table>", "uncertain": false}}, "source": "GRE Verbal Vault · 최근 1년(2025-11~2026-10) Part별 출제 점유 배분 · ETS 순서"};
