d>n.<\/td><td>방벽, 보루, 의지가 되는 것<\/td><td>rampart, safeguard, mainstay<\/td><td><b>정답<\/b>. <code>bulwark against ~<\/code> 연어<\/td><\/tr><tr><td>import<\/td><td>n.<\/td><td>중요성 (importance)<\/td><td>significance<\/td><td>본문 importance<\/td><\/tr><tr><td>paradigm<\/td><td>n.<\/td><td>전형, 모범, 패러다임<\/td><td>model, exemplar<\/td><td>(거만어 외) <b>최대 함정<\/b> — 범주어라 역할 자리에 못 들어감<\/td><\/tr><tr><td>aberration<\/td><td>n.<\/td><td>일탈, 비정상<\/td><td>anomaly, deviation<\/td><td>(거만어 외) 부정 극성<\/td><\/tr><tr><td>novelty<\/td><td>n.<\/td><td>신기함, 새로움<\/td><td>innovation<\/td><td>(거만어 외)<\/td><\/tr><tr><td>exception<\/td><td>n.<\/td><td>예외<\/td><td>anomaly<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q2": {"html": true, "interp": "<p>파킨슨(Parkinson)의 이론들은 검증(verification)을 자청하기는커녕, 모든 것을 아우르는 데다 시험해 보기도 어려워서, 더 경험적인 접근을 선호하던 동료들을 답답하게 했다.<\/p><p><b>해석 노트:<\/b> invite는 '초래하다'보다 '스스로 불러들이다'라는 자발성이 핵심이어서 '검증을 자청하기는커녕'으로 옮겨 Far from의 부정 강세를 앞세웠다. frustrate는 '좌절시키다'로 받으면 감정의 크기가 과해지므로, 검증할 길이 막혀 답답해하는 동료들의 처지에 맞추어 '답답하게 했다'로 처리했다. thereby가 이끄는 분사구문은 한국어에서 별도 절로 떼기보다 '~어서'라는 원인·결과 연결어미로 잇는 편이 자연스러워 그렇게 재구성했고, 관계절 who preferred는 앞으로 당겨 '더 경험적인 접근을 선호하던 동료들'로 압축했다.<\/p>", "strat": "<ul><li><b>(i)<\/b>: <code>Far from inviting (i)[…]<\/code>(trigger-13 부정어: \"~을 끌어들이기는커녕\")는, 이론이 (i)를 부르지 <b>않는다<\/b>는 뜻이다. 뒤에 \"이론이 <b>검증하기 어렵다(difficult to test)<\/b>\"고 했으므로, 끌어들이지 못한 (i) = <b>검증(verification)<\/b>이다.<\/li><li><b>(ii)<\/b>: \"모든 것을 아우르고 검증 불가\"한 이론은, <b>경험적 접근을 선호하는<\/b> 동료들을 답답하게 만든다 → <b>좌절시키다(frustrating)<\/b>.<\/li><li>trigger-13 부정어 «Far from»(카드 «부정어들: less than, far from»): «<b>Far from<\/b> inviting (i)빈칸, Parkinson's theories were all-embracing» — 기대와 반대 방향으로 튼다.<\/li><\/ul>", "correct": "<ul><li><b>(i) verification(검증, 입증)<\/b> — 검증하기 어려운 이론이라 끌어들이지 못하는 것.<\/li><li><b>(ii) frustrating(좌절시키는, 애태우는)<\/b> — 경험적 동료들을 답답하게 함.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Far from inviting <b>verification<\/b>, Parkinson's theories were all-embracing and difficult to test, thereby <b>frustrating<\/b> her colleagues who preferred a more empirical approach.<\/p>", "wrong": "<ul><li>(i) speculation(추측) / amplification(증폭·부연) — 뒤의 \"difficult to test(검증 곤란)\"와 대응하는 것은 verification이다.<\/li><li>(ii) stimulating(자극하는) / gratifying(흡족하게 하는) — 검증 불가한 이론이 경험주의 동료에게 주는 것은 만족·자극이 아니라 <b>좌절<\/b>이다. 정반대.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>verification<\/td><td>명<\/td><td>검증, 입증<\/td><td>confirmation, validation<\/td><td>(거만어 외) 정답 (i)<\/td><\/tr><tr><td>frustrating<\/td><td>형<\/td><td>좌절시키는, 애태우는<\/td><td>exasperating, vexing<\/td><td>(거만어 외) 정답 (ii)<\/td><\/tr><tr><td>gratify<\/td><td>동<\/td><td>흡족하게 하다<\/td><td>please, satisfy<\/td><td>거만어. 오답 (ii, 반대)<\/td><\/tr><tr><td>embrace<\/td><td>동<\/td><td>아우르다, 포괄하다<\/td><td>encompass, include<\/td><td>거만어. all-embracing<\/td><\/tr><tr><td>empirical<\/td><td>형<\/td><td>경험적인, 실증적인<\/td><td>experiential, observational<\/td><td>거만어. empirical approach<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q3": {"html": true, "interp": "<p>식량 생산 이외의 용도로 토지를 쓰라는 압력(pressure)이 커지면서, 현재 경작되지 않는 땅으로 농업을 넓혀 가는 길은 아예 막혀 버린다(precludes). 그러므로 늘어나는 세계 식량 수요를 감당하려면 더 효율적인 작물 생산 방법을 찾아내야 한다.<\/p><p><b>해석 노트:<\/b> preclude는 결과를 약화시키는 것이 아니라 가능성 자체를 사전에 봉쇄하는 말이라 '가로막는다'보다 '아예 막혀 버린다'로 옮겨 차단의 절대성을 드러냈다. Increasing pressure는 명사구지만 한국어에서는 '압력이 커지면서'처럼 절로 풀어야 자연스러워 주어를 서술로 전환했다. 수동 구문 must be found는 행위자를 세우지 않는 한국어 어법에 맞춰 '찾아내야 한다'는 당위 어미로 처리했다.<\/p>", "strat": "<p><code>Therefore<\/code>(trigger-02 인과)가 결론(효율적 방법이 필요)을 끌어낸다. 결론이 성립하려면 앞 문장은 \"농지를 <em>못 늘린다<\/em>\"여야 한다(못 늘리니 효율을 올려야 함).<\/p><ul><li><b>(i)<\/b>: \"식량 외 용도로 땅을 쓰라는 ___이 <em>증가<\/em>\" → 땅을 다른 데 쓰라는 <em>압력<\/em>. → <code>pressure<\/code>.<\/li><li><b>(ii)<\/b>: 그 압력이 \"미경작지로의 농업 확장을 ___\" → 확장을 <em>막는다<\/em>. 그래야 <code>Therefore<\/code> 뒤 \"효율적 생산이 필요\"가 도출됨. → <code>precludes<\/code>(가로막다, 배제하다).<\/li><\/ul>", "correct": "<ul><li>(i) <b>pressure(압력)<\/b> — 땅을 다른 용도로 쓰라는 압력 증가.<\/li><li>(ii) <b>precludes(가로막는다)<\/b> — 농지 확장을 차단 → <code>Therefore<\/code> 효율 제고 필요로 연결.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Increasing <b>pressure<\/b> to use land for purposes other than food production <b>precludes<\/b> expanding agriculture into currently uncultivated lands. Therefore, in order to meet growing global demand for food, more efficient means of crop production must be found.<\/p>", "wrong": "<ul><li>(i) <b>reluctance(꺼림)·failure(실패)<\/b> — \"다른 용도로 쓰라는 <em>꺼림/실패<\/em>가 증가\"는 (ii)·결론 논리와 호응 약함(reluctance면 오히려 농지 확장 가능).<\/li><li>(ii) <b>encourages(촉진한다)·underestimates(과소평가한다)<\/b> — \"농지 확장을 <em>촉진<\/em>\"하면 효율 제고가 굳이 필요 없어 <code>Therefore<\/code> 결론과 모순.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>preclude<\/td><td>v.<\/td><td>가로막다, 배제하다<\/td><td>prevent, rule out<\/td><td>(거만어 외)<\/td><\/tr><tr><td>pressure<\/td><td>n.<\/td><td>압력, 압박<\/td><td>strain, demand<\/td><td>(거만어 외)<\/td><\/tr><tr><td>reluctance<\/td><td>n.<\/td><td>꺼림, 주저<\/td><td>unwillingness<\/td><td>(거만어 외)<\/td><\/tr><tr><td>uncultivated<\/td><td>adj.<\/td><td>미경작의<\/td><td>untilled, fallow<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q4": {"html": true, "interp": "<p>해슬러 특유의 <b>직설<\/b>이 안일함에 굳어 버린 조직을 <b>쿡쿡 찔러<\/b> 방식을 바꾸게 하는 데 더러 쓸모가 있기는 하다. 그러나 그 퉁명스러움은 더 자주 역효과를 낳아, 사람들의 <b>마음이 떠나게<\/b> 만들곤 한다.<\/p><p><b>해석 노트:<\/b> bluntness를 '무뚝뚝함'으로 옮기면 성격 묘사에 그치므로, 말하는 방식이라는 결이 살도록 '직설'로 했다. <code>prodding … into changing<\/code>은 '변화하도록 자극하기'가 무난하나 bluntness와의 결을 살려 '쿡쿡 찔러'로 구체화했다. <code>entrenched in complacency<\/code>는 '안주에 뿌리내린'이 직역이나 참호(trench)에 박혀 꿈쩍 않는 그림이 살도록 '굳어 버린'으로 받았다. alienate는 '소외시키다'가 사전적이나 여기서는 사람들이 등을 돌린다는 뜻이므로 '마음이 떠나게'로 풀었다.<\/p>", "strat": "<p>빈칸 3개. <b>이 문제는 (i)이 가장 쉽다<\/b> — 지문이 답을 대놓고 알려 주기 때문이다.<\/p><p><b>(i) — <code>such brusqueness<\/code>가 (i)을 되받는다.<\/b> 주절의 <code><b>such brusqueness<\/b> is more often counterproductive<\/code>에서 <code>such + 명사<\/code>는 <b>앞에 나온 것을 다른 말로 다시 집는 장치<\/b>다(trigger-06 지시어·반복). 여기서 다시 집힌 것은 (i)뿐이다. 그러므로 <b>(i) = brusqueness(퉁명스러움)의 동의어 = bluntness<\/b>. 다른 두 후보는 이 되받음을 견디지 못한다 — <code>unconcern<\/code>(무관심)도 <code>charisma<\/code>(카리스마)도 brusqueness라 부를 수 없다.<\/p><p><b>(iii) — <code>While<\/code>과 분사구문이 함께 정한다.<\/b><\/p><ul><li><code><b>While<\/b> … is sometimes useful …, such brusqueness is more often <b>counterproductive<\/b><\/code> — trigger-10(역접의 부사절 접속사 while). 「가끔은 유용하지만 대개는 역효과」.<\/li><li><code>counterproductive, <b>tending to<\/b> (iii)빈칸 people<\/code> — trigger-03(분사구문). 문미 분사구문은 주절을 노골적으로 풀어 주는 자리이므로, (iii)은 <b>counterproductive의 내용<\/b>이어야 한다. 퉁명함이 낳는 역효과는 <b>사람을 등 돌리게 하는 것<\/b> → <b>alienate<\/b>.<\/li><li><code>energize<\/code>(활력을 준다)·<code>ingratiate<\/code>(환심을 산다)는 둘 다 <b>좋은 결과<\/b>라 counterproductive와 정면으로 충돌한다.<\/li><\/ul><p><b>(ii) — 남은 자리를 구문과 어조가 함께 채운다.<\/b><\/p><ul><li>구문: <code>useful in (ii)빈칸 an institution … <b>into<\/b> changing its ways<\/code> — 「X를 ~하도록 몰아간다」는 <b><code>동사 + 목적어 + into ~ing<\/code><\/b> 꼴이다. 세 후보 모두 이 틀에 들어갈 수는 있다.<\/li><li>어조가 가른다: (i)이 <b>bluntness<\/b>로 확정된 이상, 그 수단은 부드러운 설득일 수 없다. <code>charming<\/code>(매력으로 홀리기)·<code>wheedling<\/code>(감언으로 구슬리기)은 <b>퉁명함과 양립하지 않는다.<\/b> 남는 것은 <b>prodding<\/b>(찔러 대기) — 퉁명한 말로 쿡쿡 찔러 움직이게 한다는 뜻이라 bluntness와 결이 같다.<\/li><li><code>an institution <b>entrenched in complacency<\/b><\/code>(안일함에 파묻힌 조직)도 이를 뒷받침한다. 굳어 버린 것은 구슬려서가 아니라 <b>찔러야<\/b> 움직인다.<\/li><\/ul><p>★<b>이 문제의 설계<\/b> — 보기 표가 행마다 그럴듯하게 짜여 있다(unconcern→charming→energize, charisma→wheedling→ingratiate). 그러나 <b><code>such brusqueness<\/code> 한 마디가 (i)을 못 박는 순간 나머지 두 열이 연쇄로 결정된다.<\/b> TC 다빈칸은 «가장 확실한 빈칸부터» 치는 것이 원칙이고, 이 문제는 그 원칙의 표본이다.<\/p>", "correct": "<ul><li><b>(i) bluntness(직설, 퉁명함)<\/b>: 주절의 <code>such brusqueness<\/code>가 되받는 대상. 이 되받음이 정답을 단독으로 확정한다.<\/li><li><b>(ii) prodding(찔러 움직이기)<\/b>: <code>prod A into B-ing<\/code> 구문에 맞고, bluntness라는 수단의 성격과 일치한다.<\/li><li><b>(iii) alienate(멀어지게 하다)<\/b>: <code>counterproductive<\/code>를 분사구문이 풀어 준 내용.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>While Hassler's trademark <b>bluntness<\/b> is sometimes useful in <b>prodding<\/b> an institution entrenched in complacency into changing its ways, such brusqueness is more often counterproductive, tending to <b>alienate<\/b> people.<\/p>", "wrong": "<ul><li><b>(i) unconcern(무관심)<\/b> · <b>charisma(카리스마)<\/b>: <code>such brusqueness<\/code>로 되받을 수 없다. 되받음 검사 하나로 탈락한다.<\/li><li><b>(ii) charming(매력으로 사로잡기)<\/b> · <b>wheedling(감언으로 구슬리기)<\/b>: 문법 틀에는 들어가지만 <b>부드러운 수단<\/b>이라 bluntness와 양립하지 않는다.<\/li><li><b>(iii) energize(활력을 주다)<\/b> · <b>ingratiate(환심을 사다)<\/b>: 둘 다 긍정적 결과라 <code>counterproductive<\/code>와 정면 충돌한다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>bluntness<\/td><td>n.<\/td><td>직설적임, 퉁명함<\/td><td>brusqueness, curtness<\/td><td>blunt 계열 · 정답<\/td><\/tr><tr><td>prod<\/td><td>v.<\/td><td>쿡 찌르다, 재촉하다<\/td><td>goad, spur, nudge<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>alienate<\/td><td>v.<\/td><td>멀어지게 하다, 소외시키다<\/td><td>estrange, antagonize<\/td><td>(거만어) 정답<\/td><\/tr><tr><td>brusqueness<\/td><td>n.<\/td><td>퉁명스러움<\/td><td>curtness, abruptness<\/td><td>(거만어 외) ★(i)을 되받는 열쇠<\/td><\/tr><tr><td>complacency<\/td><td>n.<\/td><td>안일, 자기만족<\/td><td>smugness, self-satisfaction<\/td><td>complacent 계열<\/td><\/tr><tr><td>entrench<\/td><td>v.<\/td><td>단단히 자리 잡게 하다<\/td><td>embed, ingrain<\/td><td>(거만어 외)<\/td><\/tr><tr><td>wheedle<\/td><td>v.<\/td><td>감언으로 구슬리다<\/td><td>cajole, coax<\/td><td>(거만어) 오답<\/td><\/tr><tr><td>ingratiate<\/td><td>v.<\/td><td>환심을 사다<\/td><td>curry favor<\/td><td>(거만어 외) 오답<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q5": {"html": true, "interp": "<p>약 180만 년 전에 등장한 <b>아슐리안(Acheulean)<\/b> 도구 제작 기술의 <b>작업 복잡성<\/b>(공정 중의 단계 수와 내려진 결정의 수)은 그보다 이른 <b>올도완(Oldowan)<\/b> 유물의 그것을 훨씬 능가하며, 일부 연구자에게 이는 도구 제작자의 <b>인지 능력<\/b>이 크게 증대했음을 시사한다. <b>그러나<\/b> 더 정교한 제작 기술이 언제나 더 복잡하리라고 가정해서는 안 된다. 더 나은 계획이나 문제 해결이 더 복잡한 해법이 아니라 오히려 <b>더 단순하고 효율적인 해법<\/b>으로 이어질 수도 있다. 예컨대 <b>콤베와(Kombewa)형<\/b>이라 불리는 후기 아슐리안 격지 도구는 몸돌(boulder core)에서 크고 날카로운 격지를 떼어내는 방식으로 만들어졌다. 이런 도구는 전형적인 아슐리안 주먹도끼(hand axe)를 만드는 데 드는 수천 단계 없이도 클리버 같은 도구를 만들어내는 <b>우아하지만 단순한<\/b> 해법이다.<\/p>", "strat": "<p><b>질문 1 — 추론 RC-02<\/b><\/p><p>통념(some researchers): '아슐리안이 올도완보다 작업 복잡성이 크다 → 인지 능력이 크게 늘었다.' 저자의 반박(However): 정교함이 곧 복잡함은 아니며, 뛰어난 계획은 오히려 더 단순한 해법을 낳을 수 있다. Kombewa는 이 반박을 뒷받침하는 <b>예시(For instance)<\/b> — 정교한 판단이 단순한 도구를 낳은 사례다. ★ 이 예는 올도완과 아슐리안을 견주는 예가 <b>아니다<\/b>. <code>late Acheulean<\/code> Kombewa와 <code>typical Acheulean<\/code> 주먹도끼, 곧 <b>같은 아슐리안 사람들<\/b>이 만든 두 산물을 나란히 놓는다. 같은 사람들이 한쪽은 수천 단계로, 다른 쪽은 몇 단계로 비슷한 목적의 도구를 만들었으니, «단계 수 = 인지 능력»이라는 잣대는 아슐리안 안에서부터 어긋난다. 따라서 '복잡성=인지능력'이라는 통념의 추론 고리 자체가 약해진다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: 질문의 본문 단어 Oldowan artifacts를 주어로 재구성한다. 작업 복잡성은 괄호 안에서 «number of steps and decisions»로 정의되고 아슐리안이 올도완을 훨씬 능가한다 — 그러므로 올도완 제작에는 결정이 더 적었다는 데까지가 비약 없는 결론이다.<\/li><li><b>정답(C)<\/b>: 작업 복잡성은 '단계와 결정의 수'로 정의되고, 아슐리안이 올도완을 훨씬 능가한다. 주먹도끼는 '전형적 아슐리안' 도구이므로, 올도완 유물의 제작에는 아슐리안 주먹도끼 제작보다 <b>더 적은 결정<\/b>이 필요했다는 추론이 곧바로 성립한다.<\/li><\/ul>", "wrong": "<ul><li><b>오답 A<\/b>: 올도완과 Kombewa의 '사용 기간'은 본문에서 전혀 비교되지 않았다(범위 밖).<\/li><li><b>오답 B<\/b>: 올도완이 아슐리안 석기와 '겉모습이 동일'하다는 언급 없음(근거 없는 비약).<\/li><li><b>오답 D<\/b>: 올도완이 '너무 조잡해 아슐리안기의 작업에 쓸 수 없었다'는 진술 없음. 본문은 복잡성 차이만 말할 뿐 유용성·조잡함을 논하지 않는다.<\/li><li><b>오답 E<\/b>: 올도완의 '용도 판별 난이도'를 Kombewa와 비교한 바 없다(범위 밖).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>sophisticated<\/td><td>adj<\/td><td>정교한, 세련된<\/td><td>refined, advanced<\/td><td>통념의 '정교한 기술'<\/td><\/tr><tr><td>cognitive<\/td><td>adj<\/td><td>인지의<\/td><td>mental, intellectual<\/td><td>논점의 핵심(인지 능력)<\/td><\/tr><tr><td>elegant<\/td><td>adj<\/td><td>우아한, 간결·효율적인<\/td><td>graceful, neat<\/td><td>Kombewa의 '우아하지만 단순'<\/td><\/tr><tr><td>artifact<\/td><td>n<\/td><td>(인공)유물, 가공물<\/td><td>relic, object<\/td><td>올도완 유물<\/td><\/tr><tr><td>crude<\/td><td>adj<\/td><td>조잡한, 투박한<\/td><td>rough, unrefined<\/td><td>오답 D의 crudely<\/td><\/tr><tr><td>utility<\/td><td>n<\/td><td>유용성, 효용<\/td><td>usefulness, value<\/td><td>오답 C의 함정어<\/td><\/tr><tr><td>late (Acheulean)<\/td><td>adj<\/td><td>후기의 — Kombewa의 시기 표지<\/td><td>later-period<\/td><td>★ 예의 등장인물은 후기 아슐리안뿐(올도완 아님)<\/td><\/tr><tr><td>typical (hand axe)<\/td><td>adj<\/td><td>전형적인 — 비교 상대 표지<\/td><td>standard, representative<\/td><td>★ Kombewa와 견주는 것은 같은 아슐리안의 주먹도끼<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q6": {"html": true, "interp": "<p>약 180만 년 전에 등장한 <b>아슐리안(Acheulean)<\/b> 도구 제작 기술의 <b>작업 복잡성<\/b>(공정 중의 단계 수와 내려진 결정의 수)은 그보다 이른 <b>올도완(Oldowan)<\/b> 유물의 그것을 훨씬 능가하며, 일부 연구자에게 이는 도구 제작자의 <b>인지 능력<\/b>이 크게 증대했음을 시사한다. <b>그러나<\/b> 더 정교한 제작 기술이 언제나 더 복잡하리라고 가정해서는 안 된다. 더 나은 계획이나 문제 해결이 더 복잡한 해법이 아니라 오히려 <b>더 단순하고 효율적인 해법<\/b>으로 이어질 수도 있다. 예컨대 <b>콤베와(Kombewa)형<\/b>이라 불리는 후기 아슐리안 격지 도구는 몸돌(boulder core)에서 크고 날카로운 격지를 떼어내는 방식으로 만들어졌다. 이런 도구는 전형적인 아슐리안 주먹도끼(hand axe)를 만드는 데 드는 수천 단계 없이도 클리버 같은 도구를 만들어내는 <b>우아하지만 단순한<\/b> 해법이다.<\/p>", "strat": "<p><b>질문 2 — 언급 목적 RC-08<\/b><\/p><p>통념(some researchers): '아슐리안이 올도완보다 작업 복잡성이 크다 → 인지 능력이 크게 늘었다.' 저자의 반박(However): 정교함이 곧 복잡함은 아니며, 뛰어난 계획은 오히려 더 단순한 해법을 낳을 수 있다. Kombewa는 이 반박을 뒷받침하는 <b>예시(For instance)<\/b> — 정교한 판단이 단순한 도구를 낳은 사례다. ★ 이 예는 올도완과 아슐리안을 견주는 예가 <b>아니다<\/b>. <code>late Acheulean<\/code> Kombewa와 <code>typical Acheulean<\/code> 주먹도끼, 곧 <b>같은 아슐리안 사람들<\/b>이 만든 두 산물을 나란히 놓는다. 같은 사람들이 한쪽은 수천 단계로, 다른 쪽은 몇 단계로 비슷한 목적의 도구를 만들었으니, «단계 수 = 인지 능력»이라는 잣대는 아슐리안 안에서부터 어긋난다. 따라서 '복잡성=인지능력'이라는 통념의 추론 고리 자체가 약해진다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: Kombewa가 든 문장을 해석하고 앞 문장 keyword를 support하는지 본다. 앞의 However 문장은 «정교한 기술이 언제나 더 복잡한 것은 아니다»이고, Kombewa는 For instance로 그 반박을 뒷받침하는 예다. late와 typical이라는 두 단어로 비교 대상을 정확히 잡고, 일부 연구자의 추론 방법을 겨냥한 보기를 고른다.<\/li><li><b>정답(D)<\/b>: 저자가 맞서는 것은 '작업 복잡성이 크다 → 인지 능력이 크게 늘었다'는 일부 연구자의 <b>추론 방법<\/b>(단계 수를 인지의 잣대로 쓰기)이다. Kombewa는 그 잣대가 틀렸음을 보이는 예다. 핵심은 두 단어 — Kombewa는 <b><code>late<\/code> Acheulean<\/b>(후기 아슐리안) 도구이고, 비교 상대는 <b><code>typical<\/code> Acheulean<\/b> 주먹도끼다. 즉 올도완과의 비교가 아니라 <b>같은 아슐리안 사람들<\/b>이 만든 두 도구의 비교다. 같은 사람들이 한쪽은 수천 단계로, 다른 쪽은 몸돌에서 큰 격지 하나를 떼는 몇 단계로 클리버 같은 도구를 만들었다. 연구자들의 잣대대로라면 Kombewa 제작자는 주먹도끼 제작자보다 인지가 낮아야 하는데, 실제로는 같은 집단이고 오히려 «더 나은 계획»의 산물이다. 잣대가 같은 집단 안에서도 어긋나니, «올도완보다 복잡하다»는 사실에서 «인지가 크게 늘었다»를 끌어낼 근거가 사라진다. 그래서 D — 두 집단이 같았다는 주장이 아니라, <b>일부가 믿는 만큼(as some believe) 다르지는 않았을 수 있다(may not)<\/b>는 유보적 결론이다. S1의 «suggests to some researchers»를 그대로 되받는 표현이다.<\/li><\/ul><p><b>★ 학생이 놓치기 쉬운 두 단어 — <code>late<\/code>와 <code>typical<\/code><\/b>: 이 예를 읽고 «아슐리안 사람들은 정교한 것을 만들 만큼 인지가 뛰어나서 작업을 단순화했다»고 정리하면 정확하다. 그런데 거기서 «그러면 아슐리안이 올도완보다 인지가 뛰어났다는 말이니 D는 틀렸다»로 건너뛰기 쉽다. 그 비약을 막아 주는 것이 <code>late Acheulean<\/code>과 <code>typical Acheulean hand axe<\/code>다. 예 안에 올도완은 없다. 등장인물은 <b>후기 아슐리안 사람들<\/b>뿐이고, 그들이 만든 <b>전형적인 주먹도끼(수천 단계)<\/b>와 <b>Kombewa(몇 단계)<\/b>가 대조된다. 저자는 이 대조로 «단계 수가 많다 = 인지가 높다»는 등식을 깬다 — 등식이 맞다면 같은 사람들이 만든 Kombewa는 주먹도끼보다 열등한 지능의 산물이어야 하니까. 등식이 깨지면 S1의 «올도완보다 단계가 훨씬 많다 → 인지가 크게 늘었다»는 추론도 근거를 잃는다. Kombewa가 뛰어난 인지의 산물이라는 사실은 D를 흔드는 것이 아니라, <b>복잡성으로 인지를 재는 방법이 틀렸다<\/b>는 저자의 논지를 세우는 데 쓰인 것이다. 읽을 때 «예가 누구와 누구를 견주는가»를 먼저 확인하는 습관이 이런 함정을 피하게 한다.<\/p>", "wrong": "<ul><li><b>오답 A<\/b>: '클리버형 도구가 다른 도구보다 더 신중한 계획을 요했다'는 도구 종류 간 계획량 비교인데, 본문에 없다. 예의 요점은 '같은 목적을 더 단순하게'이지 '더 많은 계획'이 아니다.<\/li><li><b>오답 B<\/b>: 올도완이 '생각보다 훨씬 정교했다'는 주장을 위한 예가 아니다. Kombewa는 아슐리안 도구라 올도완을 직접 말하지 않고, 저자도 올도완의 정교함을 주장하지 않는다 — 잣대를 부술 뿐이다.<\/li><li><b>오답 C<\/b>: 초점은 '유용성(utility) 증가'가 아니라 '인지 능력 추론의 허점'이다. utility는 본문의 논점이 아니며 'tends to'는 과일반화.<\/li><li><b>오답 E<\/b>: 아슐리안기 내내 기술이 '별로 안 변했다'는 주장이 아니다. Kombewa는 오히려 후기의 다른 접근을 보여준다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>sophisticated<\/td><td>adj<\/td><td>정교한, 세련된<\/td><td>refined, advanced<\/td><td>통념의 '정교한 기술'<\/td><\/tr><tr><td>cognitive<\/td><td>adj<\/td><td>인지의<\/td><td>mental, intellectual<\/td><td>논점의 핵심(인지 능력)<\/td><\/tr><tr><td>elegant<\/td><td>adj<\/td><td>우아한, 간결·효율적인<\/td><td>graceful, neat<\/td><td>Kombewa의 '우아하지만 단순'<\/td><\/tr><tr><td>artifact<\/td><td>n<\/td><td>(인공)유물, 가공물<\/td><td>relic, object<\/td><td>올도완 유물<\/td><\/tr><tr><td>crude<\/td><td>adj<\/td><td>조잡한, 투박한<\/td><td>rough, unrefined<\/td><td>오답 D의 crudely<\/td><\/tr><tr><td>utility<\/td><td>n<\/td><td>유용성, 효용<\/td><td>usefulness, value<\/td><td>오답 C의 함정어<\/td><\/tr><tr><td>late (Acheulean)<\/td><td>adj<\/td><td>후기의 — Kombewa의 시기 표지<\/td><td>later-period<\/td><td>★ 예의 등장인물은 후기 아슐리안뿐(올도완 아님)<\/td><\/tr><tr><td>typical (hand axe)<\/td><td>adj<\/td><td>전형적인 — 비교 상대 표지<\/td><td>standard, representative<\/td><td>★ Kombewa와 견주는 것은 같은 아슐리안의 주먹도끼<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q7": {"html": true, "interp": "<p>1970년부터 1997년까지, 캐나다와 미국의 여성운동은 정도의 차이는 있으나(albeit) <em>당파적 정치 과정<\/em>에 관여했다. 어느 쪽도 특정 정당과 영구적·배타적 관계를 맺지는 않았지만, 둘 다 정당과 유대를 키웠다. 시간이 지나며 이 당파적 관여에 <em>이의를 제기하는 목소리<\/em>가 양쪽 운동 내부에서 커졌고, 일부 조직은 <em>대안적 정치 참여 경로<\/em>를 만들려 했다. 그러나 이 시도는, 여성운동(이른바 새 운동)이 <em>본래 공식 정치 과정에서 멀어지는 성향을 지닌다<\/em>는 <b>신사회운동 이론가들(theorists)<\/b>의 주장을 <em>뒷받침하지 않는다<\/em>. 이들은 여성운동이 정당 특유의 <em>실용적 거래와 표몰이(vote chasing)<\/em>를 <em>혐오(aversion)<\/em>한다는 점은 정확히 짚지만, <em>당파적 선거 정치의 똑같이 강력한 매력(lure)<\/em>은 포착하지 못한다. 이 모순된 충동은 운동 내 당파적 관여와 비(非)당파적 전략의 <em>공존<\/em>으로 나타난다.<\/p><p>이 모순된 관계 속에서, 미국과 캐나다의 여성운동은 크게 <em>갈라진 궤적(divergent trajectories)<\/em>을 걸었다. 미국 운동은 점점 당파적 선거 정치에 더 깊이 관여한 반면, 캐나다 운동의 1980년대 정당 동맹은 1990년대 초 대체로 <em>비당파적 지향<\/em>으로 진화했다. 캐나다 여성운동 내 <em>급진 페미니즘의 상대적 강세<\/em>가 그 운동의 정치 영역 관여 정도를 <em>제약(constrained)<\/em>했다.<\/p>", "strat": "<p><b>질문 1 — 유형 RC-06<\/b><\/p><ul><li>통념(theorists): 새 사회운동(여성운동)은 공식 정치에서 멀어지도록 <em>예정<\/em>됨.<\/li><li>저자 반박: 그 이론은 <em>혐오<\/em>는 맞게 봤으나, <em>당파 정치의 매력<\/em>은 놓침. 실제론 두 충동이 <em>공존<\/em>.<\/li><li>두 나라 분기: 미국 = 당파 관여 심화 / 캐나다 = 비당파로 진화(급진 페미니즘 강세 탓).<\/li><\/ul>", "correct": "<ul><li><b>정답 C<\/b>: 저자는 이론가들이 \"<em>전통적 당파 정치가 여성운동에 끌렸던 정도를 과소평가했다<\/em>\"고 본다. 본문 <code>what they fail to capture is the equally powerful lure of partisan electoral politics<\/code>(당파 정치의 매력을 놓침)의 직접 진술.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(혐오를 <em>과대<\/em>강조 — 본문은 혐오는 \"정확히 짚었다\"고 함) / B(혐오 <em>이유<\/em>를 오해 — 이유를 오해한다는 진술 없음) / D(배타적 관계 안 맺은 사실을 무시 — 그건 본문 사실 진술이지 이론가 비판점 아님) / E(대안 경로 노력을 모른다 — 그 점이 비판의 핵심이 아님; 핵심은 <em>매력 간과<\/em>).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>partisan<\/td><td>adj.<\/td><td>당파적인, 편파적인<\/td><td>factional, biased<\/td><td>본문 핵심<\/td><\/tr><tr><td>aversion<\/td><td>n.<\/td><td>혐오, 기피<\/td><td>antipathy, repugnance<\/td><td>본문<\/td><\/tr><tr><td>lure<\/td><td>n.<\/td><td>매력, 유혹<\/td><td>allure, enticement<\/td><td>본문<\/td><\/tr><tr><td>divergent<\/td><td>adj.<\/td><td>갈라지는, 상이한<\/td><td>differing, diverging<\/td><td>본문<\/td><\/tr><tr><td>constrain<\/td><td>v.<\/td><td>제약하다, 억제하다<\/td><td>restrict, curb<\/td><td>본문<\/td><\/tr><tr><td>albeit<\/td><td>conj.<\/td><td>비록 ~이지만<\/td><td>although<\/td><td>본문<\/td><\/tr><tr><td>alienate<\/td><td>v.<\/td><td>소외시키다, 멀어지게 하다<\/td><td>estrange<\/td><td>보기 3C<\/td><\/tr><tr><td>align<\/td><td>v.<\/td><td>제휴하다, 정렬하다<\/td><td>ally, line up<\/td><td>보기 2C aligning<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q8": {"html": true, "interp": "<p>1970년부터 1997년까지, 캐나다와 미국의 여성운동은 정도의 차이는 있으나(albeit) <em>당파적 정치 과정<\/em>에 관여했다. 어느 쪽도 특정 정당과 영구적·배타적 관계를 맺지는 않았지만, 둘 다 정당과 유대를 키웠다. 시간이 지나며 이 당파적 관여에 <em>이의를 제기하는 목소리<\/em>가 양쪽 운동 내부에서 커졌고, 일부 조직은 <em>대안적 정치 참여 경로<\/em>를 만들려 했다. 그러나 이 시도는, 여성운동(이른바 새 운동)이 <em>본래 공식 정치 과정에서 멀어지는 성향을 지닌다<\/em>는 <b>신사회운동 이론가들(theorists)<\/b>의 주장을 <em>뒷받침하지 않는다<\/em>. 이들은 여성운동이 정당 특유의 <em>실용적 거래와 표몰이(vote chasing)<\/em>를 <em>혐오(aversion)<\/em>한다는 점은 정확히 짚지만, <em>당파적 선거 정치의 똑같이 강력한 매력(lure)<\/em>은 포착하지 못한다. 이 모순된 충동은 운동 내 당파적 관여와 비(非)당파적 전략의 <em>공존<\/em>으로 나타난다.<\/p><p>이 모순된 관계 속에서, 미국과 캐나다의 여성운동은 크게 <em>갈라진 궤적(divergent trajectories)<\/em>을 걸었다. 미국 운동은 점점 당파적 선거 정치에 더 깊이 관여한 반면, 캐나다 운동의 1980년대 정당 동맹은 1990년대 초 대체로 <em>비당파적 지향<\/em>으로 진화했다. 캐나다 여성운동 내 <em>급진 페미니즘의 상대적 강세<\/em>가 그 운동의 정치 영역 관여 정도를 <em>제약(constrained)<\/em>했다.<\/p>", "strat": "<p><b>질문 2 — 유형 RC-02<\/b><\/p><ul><li>통념(theorists): 새 사회운동(여성운동)은 공식 정치에서 멀어지도록 <em>예정<\/em>됨.<\/li><li>저자 반박: 그 이론은 <em>혐오<\/em>는 맞게 봤으나, <em>당파 정치의 매력<\/em>은 놓침. 실제론 두 충동이 <em>공존<\/em>.<\/li><li>두 나라 분기: 미국 = 당파 관여 심화 / 캐나다 = 비당파로 진화(급진 페미니즘 강세 탓).<\/li><\/ul>", "correct": "<ul><li><b>정답 E<\/b>: \"미국 여성운동이 캐나다보다 급진 페미니즘의 영향을 <em>덜<\/em> 받았기 때문.\" → 본문 <code>The relative strength of radical feminism within the Canadian women's movement constrained … engagement<\/code>(캐나다는 급진 페미니즘 강세가 관여를 제약). 대우(對偶)로 미국은 그 제약이 약해 더 관여.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(미국 선거 정치가 무당파 조직에 더 수용적 — 근거 없음) / B(미국 급진 페미니스트가 당파 과정에 더 관심 — 본문은 급진 페미니즘이 관여를 <em>제약<\/em>한다 함, 반대) / C(주류 정당 제휴가 이득이 됨을 발견 — 본문에 그런 <em>발견<\/em> 진술 없음) / D(캐나다 정당이 페미니즘 목표에 덜 우호적 — 근거 없음; 차이는 급진 페미니즘 강세 탓).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>partisan<\/td><td>adj.<\/td><td>당파적인, 편파적인<\/td><td>factional, biased<\/td><td>본문 핵심<\/td><\/tr><tr><td>aversion<\/td><td>n.<\/td><td>혐오, 기피<\/td><td>antipathy, repugnance<\/td><td>본문<\/td><\/tr><tr><td>lure<\/td><td>n.<\/td><td>매력, 유혹<\/td><td>allure, enticement<\/td><td>본문<\/td><\/tr><tr><td>divergent<\/td><td>adj.<\/td><td>갈라지는, 상이한<\/td><td>differing, diverging<\/td><td>본문<\/td><\/tr><tr><td>constrain<\/td><td>v.<\/td><td>제약하다, 억제하다<\/td><td>restrict, curb<\/td><td>본문<\/td><\/tr><tr><td>albeit<\/td><td>conj.<\/td><td>비록 ~이지만<\/td><td>although<\/td><td>본문<\/td><\/tr><tr><td>alienate<\/td><td>v.<\/td><td>소외시키다, 멀어지게 하다<\/td><td>estrange<\/td><td>보기 3C<\/td><\/tr><tr><td>align<\/td><td>v.<\/td><td>제휴하다, 정렬하다<\/td><td>ally, line up<\/td><td>보기 2C aligning<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q9": {"html": true, "interp": "<p>1970년부터 1997년까지, 캐나다와 미국의 여성운동은 정도의 차이는 있으나(albeit) <em>당파적 정치 과정<\/em>에 관여했다. 어느 쪽도 특정 정당과 영구적·배타적 관계를 맺지는 않았지만, 둘 다 정당과 유대를 키웠다. 시간이 지나며 이 당파적 관여에 <em>이의를 제기하는 목소리<\/em>가 양쪽 운동 내부에서 커졌고, 일부 조직은 <em>대안적 정치 참여 경로<\/em>를 만들려 했다. 그러나 이 시도는, 여성운동(이른바 새 운동)이 <em>본래 공식 정치 과정에서 멀어지는 성향을 지닌다<\/em>는 <b>신사회운동 이론가들(theorists)<\/b>의 주장을 <em>뒷받침하지 않는다<\/em>. 이들은 여성운동이 정당 특유의 <em>실용적 거래와 표몰이(vote chasing)<\/em>를 <em>혐오(aversion)<\/em>한다는 점은 정확히 짚지만, <em>당파적 선거 정치의 똑같이 강력한 매력(lure)<\/em>은 포착하지 못한다. 이 모순된 충동은 운동 내 당파적 관여와 비(非)당파적 전략의 <em>공존<\/em>으로 나타난다.<\/p><p>이 모순된 관계 속에서, 미국과 캐나다의 여성운동은 크게 <em>갈라진 궤적(divergent trajectories)<\/em>을 걸었다. 미국 운동은 점점 당파적 선거 정치에 더 깊이 관여한 반면, 캐나다 운동의 1980년대 정당 동맹은 1990년대 초 대체로 <em>비당파적 지향<\/em>으로 진화했다. 캐나다 여성운동 내 <em>급진 페미니즘의 상대적 강세<\/em>가 그 운동의 정치 영역 관여 정도를 <em>제약(constrained)<\/em>했다.<\/p>", "strat": "<p><b>질문 3 — 유형 RC-02<\/b><\/p><ul><li>통념(theorists): 새 사회운동(여성운동)은 공식 정치에서 멀어지도록 <em>예정<\/em>됨.<\/li><li>저자 반박: 그 이론은 <em>혐오<\/em>는 맞게 봤으나, <em>당파 정치의 매력<\/em>은 놓침. 실제론 두 충동이 <em>공존<\/em>.<\/li><li>두 나라 분기: 미국 = 당파 관여 심화 / 캐나다 = 비당파로 진화(급진 페미니즘 강세 탓).<\/li><\/ul>", "correct": "<ul><li><b>정답 D<\/b>: \"이 시도는 결국 <em>캐나다<\/em> 여성운동에 더 전형적이 된 접근을 대표한다.\" → 본문: 캐나다는 1990년대 초 <em>비당파적<\/em> 지향으로 진화 = 대안 경로 지향과 합치. 미국은 당파 심화.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(실제로 대안 경로가 거의 안 만들어짐 — 근거 없음) / B(전통적 참여 선호자들이 이 시도를 지지 — 근거 없음, 오히려 <em>이의 제기<\/em> 측의 시도) / C(전통 정당을 <em>소외(alienate)<\/em>시킴 — 근거 없음) / E(미국 운동의 전통적 참여를 <em>감소<\/em>시킴 — 미국은 오히려 당파 관여 <em>심화<\/em>).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>partisan<\/td><td>adj.<\/td><td>당파적인, 편파적인<\/td><td>factional, biased<\/td><td>본문 핵심<\/td><\/tr><tr><td>aversion<\/td><td>n.<\/td><td>혐오, 기피<\/td><td>antipathy, repugnance<\/td><td>본문<\/td><\/tr><tr><td>lure<\/td><td>n.<\/td><td>매력, 유혹<\/td><td>allure, enticement<\/td><td>본문<\/td><\/tr><tr><td>divergent<\/td><td>adj.<\/td><td>갈라지는, 상이한<\/td><td>differing, diverging<\/td><td>본문<\/td><\/tr><tr><td>constrain<\/td><td>v.<\/td><td>제약하다, 억제하다<\/td><td>restrict, curb<\/td><td>본문<\/td><\/tr><tr><td>albeit<\/td><td>conj.<\/td><td>비록 ~이지만<\/td><td>although<\/td><td>본문<\/td><\/tr><tr><td>alienate<\/td><td>v.<\/td><td>소외시키다, 멀어지게 하다<\/td><td>estrange<\/td><td>보기 3C<\/td><\/tr><tr><td>align<\/td><td>v.<\/td><td>제휴하다, 정렬하다<\/td><td>ally, line up<\/td><td>보기 2C aligning<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q10": {"html": true, "interp": "<p>충분히 숙고하고 고치는 과정 없이 진정으로 좋은 시가 나오는 일은 극히 드물다고 굳게 믿었기에, 그 시인은 창작 수업의 학생들에게 아주 꼼꼼하고 까다로운 태도(fastidious / finicky)를 갖추라고 당부했다.<\/p><p><b>해석 노트:<\/b> <b>finicky<\/b>는 흔히 사소한 것까지 지나치게 따지는 태도를 나타낸다. 여기서는 시의 표현을 엄격히 검토하라는 조언에 쓰였다. «very few»는 ‘극히 드물다’이므로, 예외가 전혀 없다는 뜻으로 옮기지 않는다.<\/p>", "strat": "<ol><li><b>5 Zones — 시인의 믿음과 조언을 연결한다.<\/b><br>앞부분의 핵심은 «a great deal of deliberation and revision»이다. 좋은 시를 쓰려면 많이 생각하고 여러 차례 고쳐야 한다는 믿음이 학생들에게 하는 조언의 근거다.<\/li><li><b>분사구문과 주절을 같은 방향으로 읽는다.<\/b><br>«Believing …»은 주절의 주어 «the poet»에 연결되는 분사구문이다(trigger-03). 시인이 가진 믿음에 맞는 창작 태도가 빈칸에 들어가야 한다.<br>특히 «very few … without …»은 숙고와 수정 없이 좋은 시가 나오는 경우가 극히 드물다는 뜻이다. 숙고와 수정이 필요 없다는 뜻으로 뒤집지 않는다.<\/li><li><b>SE 짝 논리 — 세부를 꼼꼼히 따지는 태도를 찾는다.<\/b><br>충분히 숙고하고 수정하라는 조언은 표현을 쉽게 받아들이지 말고 엄격하게 점검하라는 뜻이다. <b>fastidious–finicky<\/b>는 모두 세부에 까다롭고 꼼꼼한 태도를 나타낸다.<\/li><li><b>문장 전체를 확인한다.<\/b><br>좋은 시는 치밀한 검토와 수정에서 나온다는 믿음 때문에 학생들에게 까다로울 만큼 세심하라고 당부한다. 믿음과 조언이 일치한다.<\/li><\/ol>", "correct": "<ul><li><b>fastidious<\/b>(세심하고 까다로운): 높은 기준으로 세부를 점검하는 태도다. 충분한 숙고와 수정을 중시하는 시인의 믿음에 맞는다.<\/li><li><b>finicky<\/b>(작은 것까지 까다롭게 따지는): 표현의 세부를 쉽게 넘기지 않는다는 점에서 <b>fastidious<\/b>와 동등한 문장을 만든다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Believing fervently that very few truly good poems are written without a great deal of deliberation and revision, the poet urged her creative-writing students to be extremely <b>fastidious<\/b>.<\/p><p>Believing fervently that very few truly good poems are written without a great deal of deliberation and revision, the poet urged her creative-writing students to be extremely <b>finicky<\/b>.<\/p>", "wrong": "<ul><li><b>imaginative<\/b>(상상력이 풍부한): <b>★가장 매력적인 오답.<\/b> <b>inventive<\/b>와 짝이며 시 창작에도 어울린다. 그러나 문장이 강조하는 것은 상상력보다 숙고와 수정이다.<\/li><li><b>inventive<\/b>(창의적인): 새로운 것을 만들어 내는 능력이다. 세부를 검토하고 고치는 태도와는 다르다.<\/li><li><b>intuitive<\/b>(직관적인): 숙고보다 직접적인 감각이나 직관에 의존하는 태도다. 제시된 조언의 근거와 맞지 않는다.<\/li><li><b>spontaneous<\/b>(즉흥적인, 자연스럽게 나오는): 사전 숙고 없이 나오는 성격을 나타낸다. 충분한 숙고와 수정을 강조하는 방향과 어긋난다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>fastidious<\/td><td>형용사<\/td><td>세심하고 까다로운<\/td><td>meticulous, exacting<\/td><td>거만어<\/td><\/tr><tr><td>finicky<\/td><td>형용사<\/td><td>세부까지 까다롭게 따지는<\/td><td>fussy, particular<\/td><td>거만어<\/td><\/tr><tr><td>imaginative<\/td><td>형용사<\/td><td>상상력이 풍부한<\/td><td>creative, inventive<\/td><td>(거만어 외)<\/td><\/tr><tr><td>inventive<\/td><td>형용사<\/td><td>창의적인<\/td><td>ingenious, creative<\/td><td>(거만어 외)<\/td><\/tr><tr><td>intuitive<\/td><td>형용사<\/td><td>직관적인<\/td><td>instinctive<\/td><td>(거만어 외)<\/td><\/tr><tr><td>spontaneous<\/td><td>형용사<\/td><td>즉흥적인, 자발적인<\/td><td>unpremeditated, impulsive<\/td><td>거만어<\/td><\/tr><tr><td>fervently<\/td><td>부사<\/td><td>열렬히, 굳게<\/td><td>ardently, passionately<\/td><td>(거만어 외)<\/td><\/tr><tr><td>deliberation<\/td><td>명사<\/td><td>숙고, 신중한 검토<\/td><td>consideration, reflection<\/td><td>(거만어 외)<\/td><\/tr><tr><td>revision<\/td><td>명사<\/td><td>수정, 개정<\/td><td>amendment, reworking<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q11": {"html": true, "interp": "<p>소프트웨어 제작사는 대개 자사 제품을 사용해 생긴 어떤 부정적 결과에 대해서도 책임을 지지 않는다는 라이선스 계약서를 쓴다. 그러나 컴퓨터가 자동차에서 의료기기까지 모든 것에 내장되어 감에 따라, 그런 입장은 더는 지탱될 수 없게(untenable) 될 것이다.<\/p><p><b>해석 노트:<\/b> untenable은 진지(陣地)를 더는 지켜낼 수 없다는 군사적 비유에서 온 말이라 '부당하다'로 뭉개지 않고 '더는 지탱될 수 없게 될 것'으로 옮겨 방어선이 무너지는 결을 남겼다. as절은 원인과 비례를 함께 담으므로 '~되어 감에 따라'로 처리해 진행 중인 변화의 상(相)을 살렸고, disclaiming 이하의 긴 분사구는 관계절로 늘어뜨리는 대신 '책임을 지지 않는다는'이라는 인용식 수식으로 앞당겨 문장을 짧게 끊었다. 다른 정답 indefensible을 넣어도 '변호할 여지가 없게 될 것'이라는 같은 취지가 되어, 그 입장을 더는 고수할 수 없다는 뜻은 동일하다.<\/p>", "strat": "<p><code>but<\/code>(trigger-10 역접)이 앞뒤를 대조한다. 앞 절 = 제작사는 <em>책임을 부인<\/em>해 왔다(과거·현재의 관행). <code>but<\/code> + 미래 조건(컴퓨터가 생명·안전 장비에 들어감) → 그 책임 회피 입장은 더 이상 <em>지탱될 수 없게<\/em> 된다.<\/p><ul><li>SE이므로 같은 뜻 pair. \"책임 회피가 이제 통하지 않는다\" = \"변호·유지할 수 없다\". → <code>untenable<\/code>(지지될 수 없는), <code>indefensible<\/code>(변호할 수 없는). 둘 다 \"더는 옹호 불가\"로 동의.<\/li><\/ul>", "correct": "<ul><li><b>untenable(지지·유지될 수 없는)<\/b> + <b>indefensible(변호할 수 없는, 옹호 불가)<\/b> — <code>but<\/code> + 안전 핵심 영역으로의 통합이 만드는 \"책임 회피가 더는 통하지 않는다\"와 일치. 같은 의미 pair.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Software makers typically write licensing agreements disclaiming responsibility for any negative consequences of using their products, but as computers become integrated into everything from cars to medical devices, that stance will become <b>untenable<\/b>.<\/p>", "wrong": "<ul><li><b>ambiguous(모호한)·unwarranted(부당한·근거 없는)<\/b> — pair 안 됨. ambiguous는 \"모호\"(옹호 불가와 다름), unwarranted는 단독으로는 가능해 보이나 untenable/indefensible과 더 강한 동의쌍을 못 이룸.<\/li><li><b>disfavored(선호되지 않는)<\/b> — pair 없음. \"인기 없다\"는 강도가 약하고 논리 핵심(지탱 불가)과 어긋남.<\/li><li><b>gratuitous(불필요한, 까닭 없는)<\/b> — 문맥 무관(과도함이 아니라 정당성 상실 문제).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>untenable<\/td><td>adj.<\/td><td>(입장이) 지지될 수 없는<\/td><td>indefensible, unsustainable<\/td><td><\/td><\/tr><tr><td>indefensible<\/td><td>adj.<\/td><td>변호·옹호할 수 없는<\/td><td>untenable, unjustifiable<\/td><td>(거만어 외) tenable의 반대축<\/td><\/tr><tr><td>unwarranted<\/td><td>adj.<\/td><td>부당한, 근거 없는<\/td><td>unjustified, baseless<\/td><td><\/td><\/tr><tr><td>gratuitous<\/td><td>adj.<\/td><td>불필요한, 까닭 없는<\/td><td>unwarranted, uncalled-for<\/td><td><\/td><\/tr><tr><td>ambiguous<\/td><td>adj.<\/td><td>모호한, 중의적인<\/td><td>equivocal, vague<\/td><td><\/td><\/tr><\/table>", "uncertain": false}, "S2-Q12": {"html": true, "interp": "<p>브로드웨이 무대에 오른 『컬러 퍼플』에는 처음부터 끝까지 어떤 화려함이 흐르는데, 그것은 앨리스 워커 소설 초반부의 참혹한 황량함과는 좀처럼 닿지 않지만, 영화판의 그 즐겁고 촌스러운 영화적 호사스러움만큼은 분명히 떠올리게 한다.<\/p><p><b>해석 노트:<\/b> splendor는 '광채'로도 옮길 수 있으나 여기서는 무대 연출의 규모와 치장을 가리키므로 '화려함'으로 잡았고, 뒤의 lavishness는 씀씀이의 후함까지 담은 말이라 '호사스러움'으로 달리 옮겨 두 단어가 같은 축의 다른 결임을 드러냈다. hardly true to는 '충실하지 않다'는 부정 서술인데 hardly의 완곡함을 살려 '좀처럼 닿지 않는다'로 풀었다. 강조 조동사 does는 한국어에 대응 형태가 없으므로 '만큼은 분명히'라는 부사구로 그 힘을 옮겼다. hokey는 유치하고 촌스럽다는 뜻이지만 enjoyable과 나란히 놓여 애정 섞인 흠으로 쓰였으므로 '즐겁고 촌스러운'이라는 병렬을 그대로 두었다.<\/p>", "strat": "<ul><li>뼈대는 <code>There's 빈칸 … that … does bring to mind … lavishness<\/code>. 빈칸(선행사)을 설명하는 것은 관계대명사 <code>that<\/code>절인데, 콜론이나 대시 같은 강조 부호 없이 <b>관계사절 구조만으로 등장한 Zone5<\/b>다. <code>There's 빈칸 that … does bring to mind …<\/code> — that의 선행사가 빈칸이고 그 동사가 does bring to mind이므로, <b>이 구조가 보이면 답이 보인다<\/b>.<\/li><li>그 that절 안에 <code>while<\/code>(trigger-10 역접·양보)이 들어 있어 판단 근거가 둘로 갈리고, <b>둘 다 같은 답을 가리킨다<\/b>.<\/li><li><b>양보절<\/b>: <code>while hardly true to the harrowing bleakness of the early chapters<\/code>(소설 초반의 참혹한 황량함과는 거리가 멀다) → 빈칸은 bleakness의 <b>반대편<\/b>.<\/li><li><b>주절(핵심)<\/b>: <code>does bring to mind the enjoyable hokey cinematic lavishness of the film version<\/code>(영화판의 즐겁고 촌스러운 영화적 호사스러움을 떠올리게 한다) → 빈칸은 lavishness의 <b>동의어<\/b>. 강조 조동사 <code>does<\/code>가 이쪽에 힘을 실어 주므로 여기가 결정적 근거다.<\/li><li>두 근거를 합치면 빈칸 = <b>\"화려함·호사스러움\"<\/b>.<\/li><li>SE 조건: 동의어 짝 + 뜻이 lavishness. → <b>a splendor · a sumptuousness<\/b>.<\/li><li>(보기가 모두 관사를 달고 제시된 것은 <code>There's<\/code> 뒤 단수 명사구로 형태를 맞추기 위한 장치일 뿐, 의미 판정에는 영향이 없다.)<\/li><\/ul>", "correct": "<p><b>a splendor, a sumptuousness<\/b><\/p><ul><li><b>splendor<\/b> = (눈부신) 화려함, 장려함.<\/li><li><b>sumptuousness<\/b> = 호사스러움, 값비싼 풍성함.<\/li><li>어느 쪽을 넣어도 \"무대판은 소설의 황량함이 아니라 영화판의 호화로움을 닮았다\"는 같은 평이 된다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>There's <b>a splendor<\/b> throughout the Broadway adaptation of The Color Purple that, while hardly true to the harrowing bleakness of the early chapters of Alice Walker's novel, does bring to mind the enjoyable hokey cinematic lavishness of the film version.<\/p>", "wrong": "<ul><li><b>a starkness · an austerity<\/b>: '황량함 / 꾸밈없는 간소함'으로 <b>동의어 짝을 이루는 함정<\/b>이다. 그러나 이 뜻은 while절이 \"그렇지 <b>않다<\/b>\"고 못박은 <code>harrowing bleakness<\/code> 쪽이다. 부정된 항을 정답으로 집어 드는 전형적 오독 — 역접 문제에서 가장 흔한 실수다.<\/li><li><b>a gravity<\/b>(엄숙함, 무게감): 역시 harrowing·bleakness 쪽 어감이라 lavishness와 이어지지 않고, 짝도 없다.<\/li><li><b>a frivolousness<\/b>(경박함): <code>hokey<\/code>(촌스러운)에 이끌리기 쉬운 매력적 오답이다. 그러나 축이 다르다 — frivolousness는 <b>무게가 없음<\/b>(진지하지 않음)이고, 빈칸이 요구하는 것은 <b>볼거리가 넘침<\/b>(시각적 호사)이다. that절의 목적어는 lavishness이지 silliness가 아니며, 무엇보다 짝을 이룰 동의어가 보기에 없다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>splendor<\/td><td>n.<\/td><td>화려함, 장려함<\/td><td>magnificence, sumptuousness<\/td><td>정답<\/td><\/tr><tr><td>sumptuousness<\/td><td>n.<\/td><td>호사스러움, 값비싼 풍성함<\/td><td>lavishness, opulence<\/td><td>정답 (형용사형 sumptuous)<\/td><\/tr><tr><td>starkness<\/td><td>n.<\/td><td>황량함, 삭막함<\/td><td>bleakness, barrenness<\/td><td>부정된 항 함정 (형용사형 stark)<\/td><\/tr><tr><td>austerity<\/td><td>n.<\/td><td>간소함, 엄격함<\/td><td>severity, plainness<\/td><td>부정된 항 함정 (형용사형 austere)<\/td><\/tr><tr><td>frivolousness<\/td><td>n.<\/td><td>경박함, 시시함<\/td><td>levity, silliness<\/td><td>축이 다른 오답 (형용사형 frivolous)<\/td><\/tr><tr><td>gravity<\/td><td>n.<\/td><td>엄숙함, 무게감<\/td><td>solemnity, seriousness<\/td><td>방향 반대 오답 (형용사형 grave)<\/td><\/tr><tr><td>lavish<\/td><td>adj.<\/td><td>호화로운, 아낌없는<\/td><td>sumptuous, opulent<\/td><td>빈칸의 기준어 (명사형 lavishness)<\/td><\/tr><tr><td>bleak<\/td><td>adj.<\/td><td>황량한, 암울한<\/td><td>desolate, stark<\/td><td>부정된 기준어 (명사형 bleakness)<\/td><\/tr><tr><td>harrow<\/td><td>v.<\/td><td>몹시 괴롭히다<\/td><td>torment, distress<\/td><td>harrowing = 참혹한<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q13": {"html": true, "interp": "<p>수 세기 전 중앙아메리카의 마야인은 돌에 정교하고 깊게 파낸 조각을 만들었다. 그 조각에는 단단한 돌이나 금속으로 된 절삭 도구가 필요했을 것이다. 철광석 광상은 중앙아메리카 전역에 있지만, 마야인은 그것을 이용할 기술을 결코 개발하지 못한 듯하고, 마야인이 사용한 것으로 알려진 금속인 구리와 금은 충분히 단단하지 않았을 것이다. 따라서 마야인은 이 조각을 만드는 데 돌 도구를 사용했음이 틀림없다.<\/p>", "strat": "<p><b>질문 1 — 유형 CR-04<\/b><\/p><ul><li><b>논증(P→Q→R)<\/b>:<\/li><li>근거1: 조각엔 단단한 돌 또는 금속 도구가 필요.<\/li><li>근거2: 마야인은 철 제련 기술이 없었고, 쓰던 금속(구리·금)은 무름.<\/li><li>결론: ∴ 돌 도구를 썼음이 틀림없다.<\/li><li><b>숨은 가정<\/b>: \"단단한 금속을 못 만들었다 → 금속 도구는 없었다.\" 그런데 <b>제련 없이도<\/b> 단단한 철(예: 운철)을 얻는 경로가 있다면 이 가정이 깨진다.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (A)<\/b>: \"세계 여러 곳에서, 광석으로 철을 만들지 못한 문명이 <b>운석에서 나온 철 조각<\/b>으로 도구를 만들었다.\" 마야인도 제련 없이 운철로 단단한 금속 도구를 만들었을 가능성을 열어 준다 → \"철 제련 기술이 없으니 금속 도구가 없었다 → 돌 도구\"라는 결론을 <b>약화<\/b>. 결론의 핵심 가정(제련 불가=단단한 금속 도구 불가)에 반례.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>B(발견된 마야 금속 유물이 모두 조각용으로 너무 무름) — 오히려 \"쓰던 금속이 무르다\"는 근거를 <b>강화<\/b>(약화 아님).<\/li><li>C(이 조각의 돌이 다른 부족의 돌보다 단단함) — 도구가 아니라 조각된 재료 얘기라 결론과 무관.<\/li><li>D(금 제련 기법을 철 추출에 쉽게 적용 못 함) — \"철 기술이 없었다\"는 근거를 보강(약화 아님).<\/li><li>E(돌 도구 용도에 대한 고고학자 이견) — 모호할 뿐 결론을 직접 약화하지 못함.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>smelt<\/td><td>v.<\/td><td>(광석을) 제련하다<\/td><td>refine, fuse<\/td><td>(거만어 외) 본문 \"smelt gold\"(보기 D)<\/td><\/tr><tr><td>meteorite<\/td><td>n.<\/td><td>운석(땅에 떨어진 것)<\/td><td>—<\/td><td>(거만어 외) 정답(A) \"iron from meteorites\" · meteor(유성, falling star·shooting star)는 대기 중의 빛줄기 — 구별<\/td><\/tr><tr><td>artifact<\/td><td>n.<\/td><td>(인공) 유물<\/td><td>relic, artefact<\/td><td>(거만어 외) 오답 보기(B) \"Mayan artifacts\"<\/td><\/tr><tr><td>deposit<\/td><td>n.<\/td><td>광상, 매장층<\/td><td>lode, seam<\/td><td>(거만어 외) 본문 \"iron-ore deposits\"<\/td><\/tr><tr><td>elaborate<\/td><td>adj.<\/td><td>정교한, 공들인<\/td><td>intricate, ornate<\/td><td>(거만어 외) 본문 \"elaborate carvings\"<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q14": {"html": true, "interp": "<p>대륙사면(대륙붕 가장자리에서 해저 바닥으로 이어지는 하강부)이 <b>왜 더 가파르지 않은가<\/b> 하는 물음은 해양지질학자들을 계속 <b>당혹스럽게(perplex)<\/b> 한다. 오직 <b>중력만<\/b> 작용할 때, 물속에 쌓인 <b>퇴적물(sediment)<\/b>은 15도 이상의 안정적인 경사를 쉽게 유지할 수 있다. 그런데 모든 대륙사면의 <b>약 80퍼센트가 8도 미만<\/b>으로 완만하게 내려간다. 육지에서 침식되어 끊임없이 <b>유입되는(influx)<\/b> 퇴적물이 단독으로 작용한다면 시간이 지나며 경사를 더 가파르게 만들 것이므로, <b>분명히 하나 이상의 자연력<\/b>이 이 사면들을 완만하게 유지하고 있는 것이다. 일부 과학자들은 그 주된 요인이 <b>내부 조석<\/b>이라고 본다. 즉 대체로 눈에 띄지 않은 채, 통상적인 달 조석과 똑같이 하루 두 번의 주기로 대양 내부를 관통하며 맥동하는 <b>물속에 잠긴 파도<\/b>라는 것이다.<\/p>", "strat": "<p><b>질문 1 — 문장 기능 RC-07<\/b><\/p><p><b>주제 문장 = S1<\/b> «The question of why the continental slope [the descent from the edge of the continental shelf to the ocean bottom] is not any steeper continues to perplex marine geologists.» — S1 «perplex»(당황 = 제목) — 대륙 사면이 왜 더 가파르지 않은가라는 의문이 제목이고, S2~S4 의문의 근거, S5 내부 조석이라는 설명. 요약 = 대륙 사면이 왜 더 가파르지 않은가라는 의문(S1)에 대한 글 — 중력만으로는 15도 이상(S2), 실제는 8도 이하(S3), 다른 힘이 있다(S4)와 내부 조석 가설(S5).<\/p><p>주제는 첫 문장의 <b>미해결 물음<\/b>(\"왜 대륙사면이 더 가파르지 않은가\")이다. 저자는 이어서 <b>퍼즐(모순)<\/b>을 세운다 — 중력만으로도 15도 이상이 유지 가능하고(문장2), 게다가 퇴적물 유입은 경사를 <em>더<\/em> 가파르게 만들어야 하는데(문장4 전반), 실제로는 80%가 8도 미만(문장3)이다. 이 기대와 사실의 충돌이 곧 물음의 정체다. 저자는 이 충돌로부터 \"하나 이상의 자연력이 사면을 낮게 유지한다\"고 <b>추론<\/b>하고, 그 요인 후보로 일부 과학자들이 지목하는 <b>내부 조석<\/b>을 제시하며 끝맺는다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: 강조 문장 둘째 문장을 해석하고 주제 문장 첫 문장의 keyword «perplex»를 support하는지 본다. 중력만으로 15도 이상이 가능하다는 기준이 있어야 셋째 문장의 8도 미만이 수수께끼가 되므로, 의문이 왜 생기는지를 뒷받침한다는 방향의 보기를 고른다.<\/li><\/ul><p>강조된 문장은 문장2 \"When only gravity acts on them, sediments... can easily maintain stable slopes of 15 degrees or more\"이다. 이 문장의 역할은 <b>왜 낮은 경사가 당혹스러운 현상인지를 설명해 줄 정보를 제공<\/b>하는 것이다. 중력만으로도 15도 이상이 안정적으로 유지된다는 사실이 깔려 있어야, 실제 사면이 8도 미만이라는 점(문장3)이 비로소 <em>퍼즐<\/em>이 된다.<\/p><ul><li><b>정답(B)<\/b>: provide information that explains why a phenomenon is puzzling — 15도 이상 가능이라는 기준선을 제시해 낮은 경사가 왜 수수께끼인지를 성립시킨다.<\/li><\/ul>", "wrong": "<ul><li><b>오답 A<\/b>: 이 문장은 \"검증하기 어려운 현상\"을 지목하는 것이 아니라 확립된 사실(퇴적물 거동)을 진술한다.<\/li><li><b>오답 C<\/b>: 가설의 결함을 인정하는 내용이 전혀 없다.<\/li><li><b>오답 D<\/b>: 문제의 <em>예시<\/em>가 아니라, 문제를 성립시키는 <b>전제 정보<\/b>다(\"example\" 오독 유도).<\/li><li><b>오답 E<\/b>: 이 사실(15도 유지)은 뒤에서 반박·의문시되지 않는다. 오히려 계속 유효한 전제로 쓰인다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>perplex<\/td><td>v.<\/td><td>당혹스럽게 하다<\/td><td>baffle, bewilder, puzzle<\/td><td>문장1, 물음의 성격<\/td><\/tr><tr><td>sediment<\/td><td>n.<\/td><td>퇴적물<\/td><td>deposit, silt<\/td><td>사면을 이루는 물질<\/td><\/tr><tr><td>influx<\/td><td>n.<\/td><td>유입<\/td><td>inflow, inpouring<\/td><td>경사를 가파르게 할 요인<\/td><\/tr><tr><td>erode<\/td><td>v.<\/td><td>침식하다<\/td><td>wear away, abrade<\/td><td>eroded from the land<\/td><\/tr><tr><td>submerged<\/td><td>adj.<\/td><td>물에 잠긴<\/td><td>underwater, sunken<\/td><td>내부 조석=submerged waves<\/td><\/tr><tr><td>lunar<\/td><td>adj.<\/td><td>달의<\/td><td>of the moon<\/td><td>tides<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q15": {"html": true, "interp": "<p>대륙사면(대륙붕 가장자리에서 해저 바닥으로 이어지는 하강부)이 <b>왜 더 가파르지 않은가<\/b> 하는 물음은 해양지질학자들을 계속 <b>당혹스럽게(perplex)<\/b> 한다. 오직 <b>중력만<\/b> 작용할 때, 물속에 쌓인 <b>퇴적물(sediment)<\/b>은 15도 이상의 안정적인 경사를 쉽게 유지할 수 있다. 그런데 모든 대륙사면의 <b>약 80퍼센트가 8도 미만<\/b>으로 완만하게 내려간다. 육지에서 침식되어 끊임없이 <b>유입되는(influx)<\/b> 퇴적물이 단독으로 작용한다면 시간이 지나며 경사를 더 가파르게 만들 것이므로, <b>분명히 하나 이상의 자연력<\/b>이 이 사면들을 완만하게 유지하고 있는 것이다. 일부 과학자들은 그 주된 요인이 <b>내부 조석<\/b>이라고 본다. 즉 대체로 눈에 띄지 않은 채, 통상적인 달 조석과 똑같이 하루 두 번의 주기로 대양 내부를 관통하며 맥동하는 <b>물속에 잠긴 파도<\/b>라는 것이다.<\/p>", "strat": "<p><b>질문 2 — 언급목적 RC-08<\/b><\/p><p><b>주제 문장 = S1<\/b> «The question of why the continental slope [the descent from the edge of the continental shelf to the ocean bottom] is not any steeper continues to perplex marine geologists.» — S1 «perplex»(당황 = 제목) — 대륙 사면이 왜 더 가파르지 않은가라는 의문이 제목이고, S2~S4 의문의 근거, S5 내부 조석이라는 설명. 요약 = 대륙 사면이 왜 더 가파르지 않은가라는 의문(S1)에 대한 글 — 중력만으로는 15도 이상(S2), 실제는 8도 이하(S3), 다른 힘이 있다(S4)와 내부 조석 가설(S5).<\/p><p>주제는 첫 문장의 <b>미해결 물음<\/b>(\"왜 대륙사면이 더 가파르지 않은가\")이다. 저자는 이어서 <b>퍼즐(모순)<\/b>을 세운다 — 중력만으로도 15도 이상이 유지 가능하고(문장2), 게다가 퇴적물 유입은 경사를 <em>더<\/em> 가파르게 만들어야 하는데(문장4 전반), 실제로는 80%가 8도 미만(문장3)이다. 이 기대와 사실의 충돌이 곧 물음의 정체다. 저자는 이 충돌로부터 \"하나 이상의 자연력이 사면을 낮게 유지한다\"고 <b>추론<\/b>하고, 그 요인 후보로 일부 과학자들이 지목하는 <b>내부 조석<\/b>을 제시하며 끝맺는다.<\/p>", "correct": "<ul><li><b>★해법<\/b>: one or more forces가 든 넷째 문장을 해석한다. 퇴적물 유입만 작용하면 사면이 가팔라져야 하는데 그렇지 않으므로, 자연력은 «일어나야 할 일이 일어나지 않는 이유»를 대려고 도입된 것이다 — 이 관계를 담은 보기를 고른다.<\/li><\/ul><p>\"one or more (natural) forces\"는 문장4에서 등장한다. 저자는 이 자연력을 <b>왜<\/b> 끌어들이는가? 퇴적물 유입만 작용하면 경사가 <em>가팔라져야<\/em> 하는데 그 일이 일어나지 않으니(사면은 낮게 유지됨), 그 <b>일어나지 않는 현상(경사가 가팔라지는 일)을 설명<\/b>하기 위해 자연력을 도입한다.<\/p><ul><li><b>정답(A)<\/b>: explain why a certain phenomenon does not occur — 유입만으로는 예상되는 \"경사의 가팔라짐\"이 실제로는 일어나지 않는 이유를 대는 장치다.<\/li><\/ul>", "wrong": "<ul><li><b>오답 B<\/b>: 자연력은 물음을 <em>복잡하게 만드는<\/em> 요인이 아니라, 물음에 대한 <b>해답 방향<\/b>이다(역할 정반대).<\/li><li><b>오답 C<\/b>: 특정 이론의 근거가 되는 증거를 대는 것이 아니다. 내부 조석 가설은 그 뒤 문장에서 별도로 소개된다.<\/li><li><b>오답 D<\/b>: 향후 연구 방향 제시가 아니다.<\/li><li><b>오답 E<\/b>: 제시된 가설의 타당성을 의문시하지 않는다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>perplex<\/td><td>v.<\/td><td>당혹스럽게 하다<\/td><td>baffle, bewilder, puzzle<\/td><td>문장1, 물음의 성격<\/td><\/tr><tr><td>sediment<\/td><td>n.<\/td><td>퇴적물<\/td><td>deposit, silt<\/td><td>사면을 이루는 물질<\/td><\/tr><tr><td>influx<\/td><td>n.<\/td><td>유입<\/td><td>inflow, inpouring<\/td><td>경사를 가파르게 할 요인<\/td><\/tr><tr><td>erode<\/td><td>v.<\/td><td>침식하다<\/td><td>wear away, abrade<\/td><td>eroded from the land<\/td><\/tr><tr><td>submerged<\/td><td>adj.<\/td><td>물에 잠긴<\/td><td>underwater, sunken<\/td><td>내부 조석=submerged waves<\/td><\/tr><tr><td>lunar<\/td><td>adj.<\/td><td>달의<\/td><td>of the moon<\/td><td>tides<\/td><\/tr><\/table>", "uncertain": false}}, "source": "GRE Verbal Vault · 최근 1년(2025-11~2026-10) Part별 출제 점유 배분 · ETS 순서"};

const TYPE_LABELS={CR:'Critical Reasoning',RC_SINGLE:'Reading Comprehension',RC_MULTI:'Reading Comprehension',RC_SELECT:'Reading Comprehension',TC:'Text Completion',SE:'Sentence Equivalence'};
const ROMAN={i:'(i)',ii:'(ii)',iii:'(iii)'};
const CODE_API='';
const CODE_ALPHABET='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const state={screen:'start',sectionIdx:0,questionIdx:0,answers:{},timer:null,timeRemaining:0,sectionLocked:[],timerExpired:[],endExpired:false,expanded:{},marked:{},save:null};

function curSection(){return examData.sections[state.sectionIdx];}
function curQ(){return curSection().questions[state.questionIdx];}
function totalQ(){return examData.sections.reduce((s,x)=>s+x.questions.length,0);}
function fmt(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function isAnswered(id){const a=state.answers[id];return Array.isArray(a)&&a.filter(x=>x!==undefined&&x!=='').length>0;}
function arrEq(a,b){if(!a||!b||a.length!==b.length)return false;const x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i]);}
function normSent(s){if(typeof s!=='string')return '';return s.replace(/<[^>]+>/g,' ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();}
const _ABBR=['Mr.','Mrs.','Ms.','Dr.','St.','Jr.','Sr.','vs.','etc.','e.g.','i.e.','U.S.','U.K.','No.','Prof.','Inc.','Ltd.','Co.'];
function splitSentences(text){let t=text;_ABBR.forEach((a,i)=>{t=t.split(a).join('__A'+i+'__');});t=t.replace(/([A-Z])\.(?=\s[A-Z])/g,'$1__D__');
  return t.split(/(?<=[.!?])\s+(?=[A-Z"“(])/).map(p=>{let s=p;_ABBR.forEach((a,i)=>{s=s.split('__A'+i+'__').join(a);});return s.replace(/__D__/g,'.').trim();}).filter(s=>s.length>0);}
function trunc(s,n){s=s||'';return s.length>n?s.slice(0,n)+'…':s;}
function isCorrect(q){const u=state.answers[q.id];if(!isAnswered(q.id))return false;
  if(q.type==='RC_SELECT')return q.answer.length>0&&normSent(u[0])===normSent(q.answer[0]);
  if(q.type==='TC'){if(u.length!==q.answer.length)return false;return u.every((v,i)=>v===q.answer[i]);}
  return arrEq(u.filter(x=>x!==undefined&&x!==''),q.answer);}
function labelText(q,label){
  if(q.type==='TC'){for(const bl of q.blanks){const c=bl.choices.find(c=>c.label===label);if(c)return c.text;}return label;}
  const c=(q.choices||[]).find(c=>c.label===label);return c?c.text:label;}
function myAnswerDisplay(q){const u=state.answers[q.id];if(!isAnswered(q.id))return '<span class="mark-skip">미응답</span>';
  if(q.type==='RC_SELECT')return '“'+trunc(u[0],46)+'”';
  if(q.type==='TC')return u.map(l=>l?labelText(q,l):'—').join(' / ');
  if(q.type==='SE')return u.map(l=>labelText(q,l)).join(', ');
  return u.join(', ');}
function correctDisplay(q){
  if(q.type==='RC_SELECT')return q.answer.length?('“'+trunc(q.answer[0],46)+'”'):'<span class="exp-uncertain">검수 필요</span>';
  if(q.type==='TC'||q.type==='SE')return (q.answerText||q.answer).join(q.type==='TC'?' / ':', ');
  return q.answer.join(', ');}

/* ---- timer ---- */
function startTimer(){if(state.timer)clearInterval(state.timer);state.timeRemaining=curSection().timeLimit*60;state.deadline=Date.now()+state.timeRemaining*1000;updTimer();
  state.timer=setInterval(()=>{state.timeRemaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));updTimer();if(state.timeRemaining<=0){clearInterval(state.timer);state.timer=null;state.timerExpired[state.sectionIdx]=true;onExpire();}},1000);}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null;}}
function updTimer(){const el=document.getElementById('timer');if(el){el.textContent=fmt(Math.max(0,state.timeRemaining));el.classList.toggle('warning',state.timeRemaining<=60);}}
function onExpire(){state.endExpired=true;state.screen='sectionEnd';render();}

/* ---- modal ---- */
function showModal(o){document.getElementById('modal-title').textContent=o.title;document.getElementById('modal-message').innerHTML=o.message;
  const cf=document.getElementById('modal-confirm'),cc=document.getElementById('modal-cancel');
  cf.textContent=o.confirmText||'확인';cc.textContent=o.cancelText||'취소';cc.style.display=o.showCancel===false?'none':'inline-block';
  cf.onclick=()=>{if(o.onConfirm)o.onConfirm();};cc.onclick=()=>{if(o.onCancel)o.onCancel();hideModal();};
  document.getElementById('modal').classList.add('show');}
function hideModal(){document.getElementById('modal').classList.remove('show');}

/* ---- render ---- */
function render(){const app=document.getElementById('app');
  if(state.screen==='start')renderStart(app);
  else if(state.screen==='sectionIntro')renderSectionIntro(app);
  else if(state.screen==='question')renderQuestion(app);
  else if(state.screen==='sectionEnd')renderSectionEnd(app);
  else if(state.screen==='results')renderResults(app);
  else if(state.screen==='review')renderReviewScreen(app);
  if(!state.keepScroll)window.scrollTo(0,0);state.keepScroll=false;}

      ${examData.sections.map(s=>`<div class="row"><span class="k">Section ${s.number}</span><span class="v">${s.questions.length}문항 · ${s.timeLimit}분</span></div>`).join('')}
      ${!examData.diag?`<div class="row"><span class="k">환산 점수(추정)</span><span class="v">round(${sf.multiplier} × 정답수) + ${sf.base}</span></div>`
        :examData.diag.score==='diag'?`<div class="row"><span class="k">진단 점수</span><span class="v">130 + 2 × 정답수 (GRE 점수 예측 아님)</span></div>`
        :`<div class="row"><span class="k">결과</span><span class="v">${totalQ()}문항 중 맞힌 수 · 다시 외울 문항</span></div>`}
    </div>
    <div class="intro-note"><ul>
      <li>${examData.sections.length>1?'각 섹션은 독립 타이머로 진행되며, 섹션을 완료하면 답안을 수정할 수 없습니다.':'제한 시간 안에 풀고, 완료하면 답안을 수정할 수 없습니다.'}</li>
      <li>Sentence Equivalence는 정확히 2개를 선택합니다. 채점 후 문항별 해설을 제공합니다.</li>
      <li>실제 시험처럼 <b>Mark</b>로 문항을 표시하고, <b>Review</b>에서 섹션 전체의 응답 상태를 확인하며 원하는 문항으로 이동할 수 있습니다.</li>
    </ul></div>
    <button class="btn btn-primary btn-large" onclick="handleStart()">시험 시작하기</button>
  </div>`;}

function renderSectionIntro(app){const s=curSection();
  app.innerHTML=`<div class="card-center">
    <div class="num">Section ${s.number} of ${examData.sections.length}</div>
    <h2>${examData.sections.length===1?'시험을 시작합니다':state.sectionIdx===0?'첫 번째 섹션을 시작합니다':'두 번째 섹션을 시작합니다'}</h2>
    <div class="meta"><strong>${s.questions.length}개 문항</strong> · 제한 시간 <strong>${s.timeLimit}분</strong><br>시작 버튼을 누르면 타이머가 작동합니다.</div>
    <button class="btn btn-primary btn-large" onclick="handleSectionStart()">Section ${s.number} 시작</button>
  </div>`;}

function renderQuestion(app){const q=curQ(),s=curSection(),tot=s.questions.length;
  const isLast=state.questionIdx===tot-1,pct=((state.questionIdx+1)/tot)*100;
  const isRC=['CR','RC_SINGLE','RC_MULTI','RC_SELECT'].includes(q.type);
  let body='';
  if(q.directions)body+=`<div class="directions">${q.directions}</div>`;
  body+=`<div class="question-text">${q.questionText}</div>`;
  body+=renderChoices(q);
  if(q.type==='SE')body+=`<div class="se-warning" id="se-warning"></div>`;
  app.innerHTML=`<div class="topbar"><div class="topbar-left"><span class="label">Section</span><span class="value">${s.number}</span>
      <span style="margin:0 10px;color:var(--line);">·</span><span class="label">Question</span><span class="value">${state.questionIdx+1} / ${tot}</span></div>
      <div class="tb-right"><button class="tb-btn ${state.marked[q.id]?'marked':''}" onclick="toggleMark()">${state.marked[q.id]?'★ Marked':'☆ Mark'}</button><button class="tb-btn" onclick="openReview()">Review</button><div class="timer" id="timer">${fmt(state.timeRemaining)}</div></div></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <main><div class="question-meta"><span class="qtype">${TYPE_LABELS[q.type]}</span><span>${q.poolId}</span></div>
    ${isRC?`<div class="layout-rc">
        <div class="passage" id="passage-box"><span class="passage-label">${q.rangeLabel||'Passage'}</span>${renderPassageHTML(q)}</div>
        <div class="question-body">${body}</div></div>`
       :`<div class="question-body"><span class="qnum-badge">${q.id.replace('-',' ')}</span>${body}</div>`}
    </main>
    <div class="footer-nav"><div class="nav-group"><button class="btn" onclick="handlePrev()" ${state.questionIdx===0?'disabled':''}>← 이전</button></div>
      <div class="nav-group">${isLast?`<button class="btn btn-finish" onclick="goSectionEnd()">섹션 종료 →</button>`:`<button class="btn btn-primary" onclick="handleNext()">다음 →</button>`}</div></div>`;
  updTimer();attachListeners();}

function mk(){return '<span class="mk"></span>';}
function renderPassageHTML(q){
  if(q.type!=='RC_SELECT')return q.passage.split(/\n\n+/).map(p=>`<p>${p}</p>`).join('');
  const u=state.answers[q.id]||[];const selN=u[0]?normSent(u[0]):null;
  return q.passage.split(/\n\n+/).map(para=>{const ss=splitSentences(para.replace(/<[^>]+>/g,''));
    return '<p>'+ss.map(s=>{const sel=selN&&normSent(s)===selN;return `<span class="sentence ${sel?'sel':''}" tabindex="0" data-text="${s.replace(/"/g,'&quot;')}">${s}</span>`;}).join(' ')+'</p>';}).join('');}
function renderChoices(q){const u=state.answers[q.id]||[];
  if(q.type==='RC_SELECT')
    return `<div class="directions">지문에서 정답에 해당하는 문장을 클릭하세요. (한 문장만 선택)</div>`;
  if(q.type==='CR'||q.type==='RC_SINGLE')
    return `<ul class="choices">${q.choices.map(c=>`<li class="choice oval ${u.includes(c.label)?'selected':''}" data-mode="single" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='RC_MULTI')
    return `<ul class="choices">${q.choices.map(c=>`<li class="choice square ${u.includes(c.label)?'selected':''}" data-mode="multi" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='SE')
    return `<div class="se-hint">정확히 2개를 선택하세요.</div><ul class="choices">${q.choices.map(c=>`<li class="choice square ${u.includes(c.label)?'selected':''}" data-mode="se" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='TC'){
    if(q.blanks.length===1){const bl=q.blanks[0];
      return `<table class="tc-table single"><tbody>${bl.choices.map(c=>`<tr><td data-blank="0" data-value="${c.label}" class="${u[0]===c.label?'selected':''}">${c.text}</td></tr>`).join('')}</tbody></table>`;}
    const n=q.blanks.length,rows=q.blanks[0].choices.length;
    let html=`<table class="tc-table"><thead><tr>${q.blanks.map(b=>`<th>Blank ${ROMAN[b.id]||'('+b.id+')'}</th>`).join('')}</tr></thead><tbody>`;
    for(let r=0;r<rows;r++){html+='<tr>'+q.blanks.map((b,ci)=>{const c=b.choices[r];return `<td data-blank="${ci}" data-value="${c.label}" class="${u[ci]===c.label?'selected':''}">${c.text}</td>`;}).join('')+'</tr>';}
    html+='</tbody></table>';return html;}
  return '';}

function attachListeners(){
  document.querySelectorAll('.choice').forEach(li=>li.addEventListener('click',()=>onChoice(li)));
  document.querySelectorAll('.tc-table td').forEach(td=>td.addEventListener('click',()=>onTC(td)));
  const q=curQ();
  if(q&&q.type==='RC_SELECT'){document.querySelectorAll('.passage .sentence').forEach(sp=>{
    const pick=()=>{const txt=sp.dataset.text;const cur=state.answers[q.id]||[];const is=cur[0]&&normSent(cur[0])===normSent(txt);
      state.answers[q.id]=is?[]:[txt];document.querySelectorAll('.passage .sentence').forEach(x=>x.classList.remove('sel'));if(!is)sp.classList.add('sel');};
    sp.addEventListener('click',pick);sp.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();pick();}});});}}
function onChoice(li){const q=curQ(),mode=li.dataset.mode,val=li.dataset.value;
  if(mode==='single'){state.answers[q.id]=[val];document.querySelectorAll('.choice[data-mode="single"]').forEach(x=>x.classList.remove('selected'));li.classList.add('selected');}
  else if(mode==='multi'){let cur=state.answers[q.id]||[];if(cur.includes(val)){cur=cur.filter(v=>v!==val);li.classList.remove('selected');}else{cur=[...cur,val];li.classList.add('selected');}state.answers[q.id]=cur;}
  else if(mode==='se'){let cur=state.answers[q.id]||[];const w=document.getElementById('se-warning');
    if(cur.includes(val)){cur=cur.filter(v=>v!==val);li.classList.remove('selected');}
    else{if(cur.length>=2){w.textContent='정확히 2개까지만 선택할 수 있습니다.';w.classList.add('show');setTimeout(()=>w.classList.remove('show'),1800);return;}cur=[...cur,val];li.classList.add('selected');}
    state.answers[q.id]=cur;}}
function onTC(td){const q=curQ(),bi=+td.dataset.blank,val=td.dataset.value;
  let cur=state.answers[q.id]||new Array(q.blanks.length).fill(undefined);cur=[...cur];cur[bi]=val;state.answers[q.id]=cur;
  document.querySelectorAll(`.tc-table td[data-blank="${bi}"]`).forEach(x=>x.classList.remove('selected'));td.classList.add('selected');}

function renderResults(app){let totalCorrect=0;
  const stats=examData.sections.map(s=>{let c=0;s.questions.forEach(q=>{if(isCorrect(q))c++;});totalCorrect+=c;return{num:s.number,correct:c,total:s.questions.length};});
  const tq=totalQ();const score=Math.round(examData.scoringFormula.multiplier*totalCorrect)+examData.scoringFormula.base;
  /* 진단고사(계약 v1.0 §1·§5): score 'diag' = min(170,130+2×정답) «진단 점수», 'none' = 점수 없이 «20문항 중 N개». «환산» 표기 금지 */

    :D.score==='diag'?`<div class="score-cell"><div class="label">진단 점수</div><div class="value">${Math.min(170,130+2*totalCorrect)}</div><div class="sub">130 + 2 × ${totalCorrect}</div></div>`
    :`<div class="score-cell"><div class="label">다시 외울 문항</div><div class="value">${tq-totalCorrect}<span class="total">개</span></div><div class="sub">${tq}문항 중 ${totalCorrect}개 정답</div></div>`;
  const diagNote=D&&D.note?`<div class="diag-note">${D.note}</div>`:'';
  let rows='';
  examData.sections.forEach(s=>{
    rows+=`<tr class="section-divider"><td colspan="7">Section ${s.number}</td></tr>`;
    s.questions.forEach(q=>{const ok=isCorrect(q);const mark=ok?'<span class="mark-correct">✓</span>':'<span class="mark-wrong">✗</span>';
      rows+=`<tr><td>${q.id}</td><td><div class="m-pool">${q.poolId}${q.part?' · '+q.part:''}</div>${tierBadge(q.frequency)}</td><td style="color:var(--ink-mute);font-size:12px;">${shortType(q.type)}</td>
        <td>${myAnswerDisplay(q)}</td><td><strong>${correctDisplay(q)}</strong></td>
        <td style="text-align:center;font-size:17px;">${mark}</td>
        <td><button class="exp-toggle" onclick="toggleExp('${q.id}')">${state.expanded[q.id]?'해설 닫기 ▲':'▶ 해설'}</button></td></tr>`;
      if(state.expanded[q.id])rows+=`<tr class="exp-row"><td colspan="7"><div class="exp-wrap">${renderExplanation(q)}</div></td></tr>`;});
  });
  app.innerHTML=`<main class="results">
    <div class="results-header"><div class="eyebrow">Test Complete</div><h2>채점 결과</h2></div>
    <div class="score-card">
      <div class="score-cell"><div class="label">총 정답</div><div class="value">${totalCorrect}<span class="total"> / ${tq}</span></div><div class="sub">${stats.map(s=>'S'+s.num+': '+s.correct+'/'+s.total).join(' · ')}</div></div>
      <div class="score-cell"><div class="label">정답률</div><div class="value">${Math.round(totalCorrect/tq*100)}<span class="total">%</span></div><div class="sub">${totalCorrect} of ${tq}</div></div>
      ${scoreCell}
    </div>
    ${diagNote}
    ${renderPromo()}
    <div class="meta-notice">※ 각 해설 첫 줄의 <b>총 출제 횟수</b>·<b>출제 연월</b>·<b>교재 Part</b>는 송종옥 선생님의 시험 후기 기록(GRE Verbal Vault) 기준입니다.<br>※ 같은 달에 여러 번 출제된 문제는 출제 연월보다 출제 횟수가 많을 수 있습니다.${D?'':' 환산 점수는 정답 수 기반 추정치입니다.'}</div>
    <div class="exp-controls"><button class="btn" onclick="expandAll(true)">모두 펼치기</button><button class="btn" onclick="expandAll(false)">모두 접기</button></div>
    <div class="tier-legend"><span>빈출 등급(출제 횟수):</span><span class="tier tier-top">★★★ 최상위</span>8회↑<span class="tier tier-high">★★ 상위</span>4–7회<span class="tier tier-mid">★ 중위</span>2–3회<span class="tier tier-low">☆ 저빈도</span>1회</div>
    <div class="results-table"><table><thead><tr><th style="width:70px;">번호</th><th style="width:172px;">모모집 · 빈출 등급</th><th>유형</th><th>내 답</th><th>정답</th><th style="width:52px;text-align:center;">결과</th><th style="width:88px;">해설</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="results-actions" style="text-align:center;display:flex;gap:12px;justify-content:center;">
      <button class="btn" onclick="window.print()">결과 인쇄</button><button class="btn btn-primary" onclick="location.reload()">다시 풀기</button><a class="btn" href="./">다른 회차 보기</a></div>
  </main>`;}
function renderPromo(){return `<section class="promo" aria-labelledby="promo-title">

    <div class="promo-row"><a class="btn btn-primary" href="https://greverbal.com/" target="_blank" rel="noopener">greverbal.com 바로가기 →</a><a class="btn" href="https://open.kakao.com/o/s0ifxj1f" target="_blank" rel="noopener">카카오톡으로 물어보기</a></div>
  </section>`;}
function shortType(t){return t==='RC_SINGLE'?'RC':t==='RC_MULTI'?'RC·다':t==='RC_SELECT'?'RC·문장':t;}
function tierBadge(f){const M={'최상위':['tier-top','★★★'],'상위':['tier-high','★★'],'중위':['tier-mid','★'],'저빈도':['tier-low','☆']};const t=M[f.bucket]||['tier-low','☆'];return `<span class="tier ${t[0]}">${t[1]} ${f.bucket} · ${f.count}회</span>`;}
function toggleExp(id){state.expanded[id]=!state.expanded[id];render();}
function expandAll(v){examData.sections.forEach(s=>s.questions.forEach(q=>state.expanded[q.id]=v));render();}
/* ── 내 기록 코드 저장 (Portal «기록 코드» 연동, 2026-11-06) ──
   결과 화면에 들어선 순간 attempt_id·taken_at을 한 번 만들고, 해설 펼침 등으로 다시 그려도 유지한다. */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function newAttemptId(){try{if(crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});}
function initSave(){if(state.save)return;const saved=lsGet('mycode');
  state.save={attempt:newAttemptId(),takenAt:new Date().toISOString(),code:saved||'',remember:!!saved,busy:false,done:false,msg:'',cls:''};}
function normCode(v){return(v||'').replace(/[\s-]+/g,'').toUpperCase();}
function fmtCode(c){return c.length>4?c.slice(0,4)+' '+c.slice(4):c;}
function escAttr(t){return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function renderCodeSave(){initSave();const v=state.save;const dis=(v.busy||v.done)?' disabled':'';
  return `<section class="code-save" aria-labelledby="cs-title">
    <h3 id="cs-title">이 결과를 내 기록에 담기</h3>
    <div class="cs-desc">${examData.codeContract?'코드를 넣어야 누적 결과에 남습니다.':'코드를 넣으면 이 회차 점수가 내 기록에 쌓입니다. 비워 두면 저장되지 않습니다.'}</div>
    <div class="cs-row"><input type="text" id="cs-code" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="11" placeholder="ABCD EFGH" aria-label="내 코드 8자" value="${escAttr(fmtCode(v.code))}" oninput="state.save.code=normCode(this.value)" onkeydown="if(event.key==='Enter')saveToCode()"${dis}>
      <button class="btn btn-primary" id="cs-btn" onclick="saveToCode()"${dis}>${v.busy?'저장 중…':v.done?'저장됨':'저장'}</button></div>
    <label class="cs-remember"><input type="checkbox" id="cs-remember" ${v.remember?'checked':''} onchange="state.save.remember=this.checked;if(!this.checked)lsSet('mycode',null)"> 이 기기에서 코드 기억하기</label>
    <div class="cs-msg ${v.cls}" role="status" aria-live="polite">${v.msg}</div>
    <div class="cs-foot">${examData.codeContract?'고른 보기도 함께 저장됩니다. /me/에서 언제든 지울 수 있습니다.<br>':''}이름·연락처·IP는 받지 않습니다. 코드를 가진 사람만 이 기록을 볼 수 있습니다.</div>
  </section>`;}
function setSaveMsg(msg,cls){const v=state.save;v.msg=msg;v.cls=cls||'';
  const box=document.querySelector('.code-save');if(!box){render();return;}
  const tmp=document.createElement('div');tmp.innerHTML=renderCodeSave();box.replaceWith(tmp.firstElementChild);}
async function saveToCode(){const v=state.save;if(!v||v.busy||v.done)return;
  const inp=document.getElementById('cs-code');if(inp)v.code=normCode(inp.value);const c=v.code;
  if(!c){setSaveMsg('코드를 넣어 주세요.','err');return;}
  if(/[0O1I]/.test(c)){setSaveMsg('이 코드는 0·O·1·I를 쓰지 않습니다.','err');return;}
  if(c.length!==8||[...c].some(ch=>!CODE_ALPHABET.includes(ch))){setSaveMsg('코드는 8자입니다. 다시 확인해 주세요.','err');return;}
  let correct=0;const items=[];const V1=!!examData.codeContract;
  examData.sections.forEach(s=>s.questions.forEach(q=>{const ok=isCorrect(q);if(ok)correct++;const it={n:q.id,pool:q.poolId,ok:ok};
    if(V1){it.a=isAnswered(q.id);const p=pickOf(q);if(p!==null)it.pick=p;}items.push(it);}));
  const body={code:c,attempt_id:v.attempt,exam:examData.round,taken_at:v.takenAt,correct:correct,total:totalQ(),items:items};
  if(V1)body.map_rev=examData.mapRev||1;
  v.busy=true;setSaveMsg('저장 중…','');
  /* 계약 v1.0 §2-4: 완료는 200(ok·dup)뿐. 429는 Retry-After, 503은 2·4·8·16초 지수 대기(최대 5회), 409 conflict·507 full은 재전송 안 함 */
  let st=0,j=null,tries=0;
  while(true){
    try{const r=await fetch(CODE_API,{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      st=r.status;j=null;try{j=await r.json();}catch(e){}
      if(st===429&&tries<5){tries++;const ra=Math.min(60,Math.max(1,parseInt(r.headers.get('Retry-After')||'5',10)||5));setSaveMsg('요청이 몰려 '+ra+'초 뒤 다시 보냅니다…','');await new Promise(res=>setTimeout(res,ra*1000));continue;}
      if(st===503&&tries<5){const w=2**(tries+1);tries++;setSaveMsg('서버가 잠시 바빠 '+w+'초 뒤 다시 보냅니다…','');await new Promise(res=>setTimeout(res,w*1000));continue;}
    }catch(e){v.busy=false;setSaveMsg('연결이 되지 않았습니다. 잠시 뒤 다시 시도해 주세요.','err');return;}
    break;}
  v.busy=false;
  if(st===200&&j&&j.ok){v.done=true;lsSet('mycode',v.remember?c:null);setSaveMsg(j.dup?'이미 저장된 응시입니다 ✓ 내 기록에서 볼 수 있습니다':'저장했어요 ✓ 내 기록에서 볼 수 있습니다','ok');return;}
  const err=j&&j.error;
  if(st===404)setSaveMsg('코드가 맞지 않습니다.','err');
  else if(st===400&&!V1)setSaveMsg('코드가 맞지 않습니다.','err');
  else if(st===400)setSaveMsg('결과 형식이 맞지 않아 저장하지 못했습니다. 선생님께 알려 주세요. ('+(err||'bad-request')+')','err');
  else if(st===507||err==='full')setSaveMsg('저장 공간이 찼습니다. 내 기록(/me/)에서 오래된 기록을 지운 뒤 다시 저장해 주세요.','err');
  else if(st===409){v.done=true;setSaveMsg('이 응시에는 이미 다른 결과가 저장돼 있습니다.','err');}
  else setSaveMsg('잠시 뒤 다시 시도해 주세요.','err');}
/* 계약 v1.0 §2-3 pick: TC는 빈칸 순서대로(무응답 칸 '-'), SE·RCM은 알파벳 오름차순, RC1·CR은 0~1개.
   RCS(문장 선택)는 문장 배열 고정 전까지 보내지 않는다(null = 필드 생략). */
function pickOf(q){const u=state.answers[q.id]||[];
  if(q.type==='RC_SELECT')return null;
  if(q.type==='TC'){if(!isAnswered(q.id))return [];return q.blanks.map((b,i)=>u[i]?u[i]:'-');}
  return u.filter(x=>x!==undefined&&x!=='').slice().sort();}


function renderReview(q){const u=state.answers[q.id]||[];const isRC=['CR','RC_SINGLE','RC_MULTI'].includes(q.type);
  let h='';
  if(q.type==='RC_SELECT'){const selN=u[0]?normSent(u[0]):null,corN=q.answer.length?normSent(q.answer[0]):null;
    h+='<div class="rev-passage">'+q.passage.split(/\n\n+/).map(para=>{const ss=splitSentences(para.replace(/<[^>]+>/g,''));
      return '<p>'+ss.map(s=>{const n=normSent(s);let c=(corN&&n===corN)?'rev-sent-correct':((selN&&n===selN)?'rev-sent-wrong':'');return c?`<span class="${c}">${s}</span>`:s;}).join(' ')+'</p>';}).join('')+'</div>';
    h+=`<div class="rev-stem">${q.questionText}</div><div style="font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);">초록 = 정답 문장 · 빨강 = 내가 고른 문장${corN?'':' · ⚠️ 정답 문장 매핑 검수 필요'}</div>`;
    return h;}
  if(isRC){h+=`<div class="rev-passage">${q.passage.split(/\n\n+/).map(p=>'<p>'+p+'</p>').join('')}</div>`;
    if(q.directions)h+=`<div class="directions">${q.directions}</div>`;
    h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.choices.map(c=>{const correct=q.answer.includes(c.label),mine=u.includes(c.label);
      let cls=correct?'is-correct':(mine?'is-wrong':'');let tag='';
      if(correct)tag='<span class="rev-tag t-correct">정답</span>';else if(mine)tag='<span class="rev-tag t-mine">내 선택</span>';
      const m=q.type==='RC_SINGLE'||q.type==='CR'?'oval':'square';
      return `<div class="rev-choice ${cls}"><span class="rc-let">${c.label}</span><div>${c.text}</div>${tag}</div>`;}).join('');
  }else if(q.type==='SE'){h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.choices.map(c=>{const correct=q.answer.includes(c.label),mine=u.includes(c.label);
      let cls=correct?'is-correct':(mine?'is-wrong':'');let tag=correct?'<span class="rev-tag t-correct">정답</span>':(mine?'<span class="rev-tag t-mine">내 선택</span>':'');
      return `<div class="rev-choice ${cls}"><div>${c.text}</div>${tag}</div>`;}).join('');
  }else{ // TC
    h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.blanks.map((bl,i)=>{const correct=q.answer[i],mine=u[i];const ct=labelText(q,correct);const mt=mine?labelText(q,mine):'미응답';const ok=mine===correct;
      return `<div class="rev-blank"><span class="bl">Blank ${bl.id==='i'?'(i)':bl.id==='ii'?'(ii)':'(iii)'}</span><br>정답: <span class="ans-ok">${ct}</span> · 내 답: <span class="${ok?'ans-ok':'ans-no'}">${mt}${mine&&!ok?' ✗':''}</span></div>`;}).join('');
  }
  return h;}

function renderExplanation(q){const e=examData.explanations[q.id]||{};const f=q.frequency;const ok=isCorrect(q);
  const months=f.months.join(', ');
  const myDisp=isAnswered(q.id)?myAnswerDisplay(q):'<span class="mark-skip">미응답</span>';
  let wrong='';
  if(e.wrong&&typeof e.wrong==='object'){wrong=Object.keys(e.wrong).map(L=>{const t=labelText(q,L);return `<li><b>(${L}) ${t?'<i>'+t+'</i>':''}</b> — ${e.wrong[L]}</li>`;}).join('');}
  return `<div class="exp-grid">
    <div class="exp-left"><div class="exp-col-title">▣ 풀이 다시보기</div>${renderReview(q)}</div>
    <div class="exp-right"><div class="exp-col-title">▤ 해설</div>
      <div class="exp-meta">
        <span class="m-id">모모집 ${q.poolId}</span>${q.part?`<span class="m-part">${q.part}</span>`:''}<span class="m-cnt">출제 ${f.count}회</span> ${tierBadge(f)}${q.ets?`<span class="m-ets">ETS 모의고사</span>`:''}
        <div class="m-row">출제 연월: ${months}${f.recent?` · 최근 1년 ${f.recent}회`:''}</div>
        ${q.link?`<div class="m-row"><a href="${q.link}" target="_blank" rel="noopener">전체 해설 보기 ↗</a></div>`:''}
        <div class="m-row m-ans">정답: <span class="ans-c">${correctDisplay(q)}</span> · 내 선택: <span class="ans-m ${ok?'':'mark-wrong'}">${myDisp}${ok?' ✓':' ✗'}</span></div>
      </div>
      ${e.html?`
      <div class="exp-sec"><h4>【해석】</h4><div class="md">${e.interp||''}</div></div>
      <div class="exp-sec"><h4>【유형·해법】</h4><div class="md">${e.strat||''}</div></div>
      <div class="exp-sec"><h4>【정답 근거】</h4><div class="md">${e.correct||''}</div></div>
      <div class="exp-sec"><h4>【오답 이유】</h4><div class="md">${e.wrong||''}</div></div>
      ${e.vocab?`<div class="exp-sec"><h4>【핵심 어휘】</h4><div class="md">${e.vocab}</div></div>`:''}`:`
      <div class="exp-sec"><h4>【해석】</h4><p>${e.interp||''}</p></div>
      <div class="exp-sec"><h4>【유형·해법】</h4><p>${e.strat||''}</p></div>
      <div class="exp-sec"><h4>【정답 근거】</h4><p>${e.correct||''}</p></div>
      <div class="exp-sec"><h4>【오답 이유】</h4><ul>${wrong}</ul></div>`}
      ${e.uncertain?'<div class="exp-uncertain">⚠️ 근거 불확실 — 검수 필요</div>':''}
    </div></div>`;}

/* ---- handlers ---- */
function handleStart(){state.screen='sectionIntro';render();}
function handleSectionStart(){state.screen='question';state.questionIdx=0;startTimer();render();}
function handlePrev(){if(state.questionIdx>0){state.questionIdx--;render();}}
function handleNext(){if(state.questionIdx<curSection().questions.length-1){state.questionIdx++;render();}}
document.addEventListener('DOMContentLoaded',render);render();

</script>
