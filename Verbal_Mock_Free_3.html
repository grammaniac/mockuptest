<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Verbal 빈출 문제 모의고사 — 무료 공개 3회</title>
<style>
:root{
  --bg:#f7f5f0; --paper:#fff; --ink:#1a1a1a; --ink-soft:#555; --ink-mute:#888;
  --line:#d8d4ca; --line-soft:#e8e5dd; --accent:#1f3a5f; --accent-soft:#e8eef5;
  --correct:#2d6a4f; --wrong:#b03a2e; --warn:#c0392b; --highlight:#fff3a8;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
  --ui:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --serif:'Iowan Old Style','Palatino','Georgia','Noto Serif KR',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;}
body{background-image:radial-gradient(circle at 20% 10%,rgba(31,58,95,.03) 0,transparent 50%),radial-gradient(circle at 80% 90%,rgba(31,58,95,.03) 0,transparent 50%);}
.ui{font-family:var(--ui);}

/* topbar */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;font-family:var(--ui);}
.topbar-left{font-size:13px;color:var(--ink-soft);}
.topbar-left .label{color:var(--ink-mute);margin-right:6px;} .topbar-left .value{color:var(--ink);font-weight:600;}
.timer{font-family:'SF Mono','Menlo',monospace;font-size:21px;font-weight:600;color:var(--accent);letter-spacing:.05em;padding:5px 13px;background:var(--accent-soft);border-radius:4px;min-width:104px;text-align:center;}
.timer.warning{color:var(--warn);background:#fdecea;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.progress-bar{height:3px;background:var(--line-soft);} .progress-fill{height:100%;background:var(--accent);transition:width .3s;}

main{max-width:1120px;margin:0 auto;padding:30px 26px 120px;}

/* buttons */
.btn{font-family:var(--ui);font-size:14px;font-weight:500;padding:11px 22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;transition:all .15s;}
.btn:hover:not(:disabled){border-color:var(--ink);background:#fafaf7;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover:not(:disabled){background:#15294a;border-color:#15294a;}
.btn-finish{background:var(--correct);color:#fff;border-color:var(--correct);}
.btn-finish:hover:not(:disabled){background:#1d4d39;}
.btn-large{font-size:16px;padding:14px 38px;}

/* ===== INTRO (1-viewport) ===== */
.intro{max-width:640px;margin:34px auto;text-align:center;}
.intro-eyebrow{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px;}
.intro-title{font-family:var(--serif);font-size:2.2em;font-weight:700;line-height:1.3;letter-spacing:-.01em;}
.intro-round{font-size:1.1em;font-style:italic;color:var(--ink-soft);margin-top:4px;}
.main-copy{background:linear-gradient(180deg,#fbfaf6,#f3f0e8);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 24px;margin:20px auto;max-width:560px;font-size:1.18em;font-weight:600;line-height:1.5;color:var(--accent);}
.author{font-size:1.05em;font-weight:500;color:var(--ink-soft);margin-bottom:18px;letter-spacing:.02em;white-space:pre-wrap;}
.intro-info{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 26px;max-width:600px;margin:0 auto 16px;text-align:left;box-shadow:var(--shadow);}
.intro-info .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-family:var(--ui);font-size:14px;}
.intro-info .row:last-child{border-bottom:none;}
.intro-info .k{color:var(--ink-mute);} .intro-info .v{color:var(--ink);font-weight:500;}
.intro-note{max-width:600px;margin:0 auto 18px;text-align:left;font-family:var(--ui);font-size:.92em;color:var(--ink-soft);line-height:1.7;}
.intro-note ul{padding-left:20px;} .intro-note li{margin-bottom:3px;}

/* section intro / end */
.card-center{max-width:580px;margin:54px auto;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:46px 44px;box-shadow:var(--shadow);}
.card-center .num{font-family:var(--ui);font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:16px;}
.card-center h2{font-family:var(--serif);font-size:2.1em;font-weight:700;margin-bottom:20px;}
.card-center .meta{font-family:var(--ui);font-size:15px;color:var(--ink-soft);margin-bottom:30px;line-height:1.8;}
.card-center .meta strong{color:var(--ink);}
.warn-box{background:#fdf6ec;border:1px solid #f0d9b5;border-radius:8px;padding:16px 18px;margin:0 auto 26px;max-width:460px;font-family:var(--ui);font-size:14px;color:#92400e;line-height:1.7;}
.end-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* question */
.question-meta{font-family:var(--ui);font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.14em;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.question-meta .qtype{background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:3px;font-size:11px;}
.layout-rc{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:start;}
.passage{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:24px 28px;font-size:15.5px;line-height:1.82;box-shadow:var(--shadow);}
@media(min-width:769px){.passage{position:sticky;top:82px;max-height:calc(100vh - 108px);overflow-y:auto;}}
.passage::-webkit-scrollbar{width:8px;} .passage::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.passage-label{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;margin-bottom:14px;}
.qnum-badge{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;margin-bottom:16px;}
.passage p{margin-bottom:12px;text-align:justify;} .passage p:last-child{margin-bottom:0;}
.highlighted{background:var(--highlight);padding:1px 2px;border-radius:2px;}
.passage .sentence{cursor:pointer;padding:0 1px;border-radius:2px;transition:background .12s;}
.passage .sentence:hover{background:rgba(31,58,95,.12);}
.passage .sentence:focus{outline:2px solid var(--accent);outline-offset:1px;}
.passage .sentence.sel{background:#bcd6f0;box-shadow:inset 0 -2px 0 var(--accent);}
.rev-sent-correct{background:#cde8d8;padding:0 1px;border-radius:2px;} .rev-sent-wrong{background:#f6cfca;padding:0 1px;border-radius:2px;}
.question-body{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 32px;box-shadow:var(--shadow);}
.question-text{font-size:16.5px;line-height:1.7;margin-bottom:22px;font-weight:500;}
.directions{font-family:var(--ui);font-size:13.5px;color:var(--ink-soft);font-style:italic;margin-bottom:16px;}

/* choices markers */
.choices{list-style:none;}
.choice{display:flex;gap:13px;align-items:flex-start;padding:9px 6px;margin-bottom:2px;border:none;border-radius:0;cursor:pointer;transition:background .12s;font-size:15.5px;line-height:1.55;}
.choice:hover{background:#faf9f4;}
.choice .mk{flex-shrink:0;margin-top:3px;border:2px solid var(--ink-mute);background:#fff;transition:all .12s;}
.choice.oval .mk{width:24px;height:15px;border-radius:50%;}
.choice.square .mk{width:16px;height:16px;border-radius:3px;}
.choice.selected{background:var(--accent-soft);border-radius:6px;}
.choice.selected .mk{border-color:var(--accent);background:var(--accent);}
.se-hint{font-family:var(--ui);font-size:13px;color:var(--ink-mute);margin-bottom:10px;}
.se-warning{font-family:var(--ui);font-size:13px;color:var(--warn);margin-top:12px;padding:8px 12px;background:#fdecea;border-radius:4px;display:none;}
.se-warning.show{display:block;}

/* TC table */
.tc-table{border-collapse:collapse;margin-top:6px;width:100%;max-width:560px;}
.tc-table th{font-family:var(--ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;border:1px solid var(--line);padding:9px 8px;background:#fafaf7;text-align:center;}
.tc-table td{border:1px solid var(--line);padding:12px 16px;cursor:pointer;font-size:15px;transition:all .1s;}
.tc-table td:hover{background:#faf9f4;}
.tc-table td.selected{background:var(--accent-soft);font-weight:600;box-shadow:inset 0 0 0 2px var(--accent);}
.tc-table.single{max-width:430px;}

/* footer nav */
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;z-index:5;box-shadow:0 -2px 10px rgba(0,0,0,.03);}
.footer-nav .nav-group{display:flex;gap:10px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--paper);border-radius:8px;padding:34px 38px;max-width:460px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);}
.modal h3{font-size:20px;margin-bottom:14px;font-weight:600;}
.modal p{font-family:var(--ui);font-size:14.5px;color:var(--ink-soft);margin-bottom:26px;line-height:1.6;}
.modal .modal-actions{display:flex;gap:10px;justify-content:center;}

/* results */
.results{max-width:1000px;margin:0 auto;}
.results-header{text-align:center;margin-bottom:34px;}
.results-header .eyebrow{font-family:var(--ui);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px;}
.results-header h2{font-family:var(--serif);font-size:2.2em;font-weight:700;}
.score-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:34px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;text-align:center;box-shadow:var(--shadow);}
.score-cell .label{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px;}
.score-cell .value{font-size:46px;font-weight:300;color:var(--accent);line-height:1;}
.score-cell .value .total{font-size:21px;color:var(--ink-mute);}
.score-cell .sub{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
/* 내 기록 코드 저장 (Portal «기록 코드», 2026-11-06) */
.code-save{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);font-family:var(--ui);}
.code-save h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.code-save .cs-desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.55;}
.code-save .cs-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.code-save input[type=text]{font-family:'SF Mono','Menlo',monospace;font-size:17px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:6px;width:13ch;min-width:0;}
.code-save input[type=text]:disabled{background:var(--line-soft);}
.code-save .cs-remember{font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;margin-top:10px;}
.code-save .cs-msg{font-size:13.5px;margin-top:10px;min-height:1em;}
.code-save .cs-msg.ok{color:var(--correct);font-weight:600;} .code-save .cs-msg.err{color:var(--wrong);}
.code-save .cs-foot{font-size:12px;color:var(--ink-mute);margin-top:10px;}
.diag-note{border-left:3px solid var(--accent);background:#f4f7fb;padding:10px 14px;font-family:var(--ui);font-size:.95em;color:var(--ink);line-height:1.6;margin:-6px 0 18px;border-radius:0 6px 6px 0;}
.meta-notice{background:#fafaf7;border:1px solid var(--line-soft);border-radius:8px;padding:12px 16px;font-family:var(--ui);font-size:.9em;color:var(--ink-soft);line-height:1.6;margin-bottom:18px;}
.exp-controls{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px;}
.results-table{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px;box-shadow:var(--shadow);}
.results-table table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px;}
.results-table th{background:#fafaf7;padding:13px 14px;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;border-bottom:1px solid var(--line);}
.results-table td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
.results-table tr.section-divider td{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.mark-correct{color:var(--correct);font-weight:700;} .mark-wrong{color:var(--wrong);font-weight:700;} .mark-skip{color:var(--ink-mute);}
.exp-toggle{font-family:var(--ui);font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;}
.exp-toggle:hover{background:var(--accent-soft);}
.m-pool{font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.tier{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.tier-top{background:#b8860b;color:#fff;} .tier-high{background:var(--accent);color:#fff;}
.tier-mid{background:#6b7a8f;color:#fff;} .tier-low{background:#e8e5dd;color:var(--ink-soft);}
.tier-legend{font-family:var(--ui);font-size:12px;color:var(--ink-soft);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}

/* explanation 2-col */
.exp-row td{padding:0 !important;background:#fbfaf6;border-bottom:2px solid var(--line);}
.exp-wrap{padding:22px 22px;}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
.exp-col-title{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:12px;border-bottom:1px solid var(--line-soft);padding-bottom:6px;}
.rev-passage{background:#fff;border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:6px;padding:16px 18px;font-size:14.5px;line-height:1.75;margin-bottom:14px;}
.rev-stem{font-size:15px;font-weight:600;margin-bottom:12px;line-height:1.6;}
.rev-choice{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line-soft);border-radius:6px;margin-bottom:6px;font-size:14px;line-height:1.5;}
.rev-choice .rc-let{font-family:var(--ui);font-weight:700;color:var(--ink-mute);min-width:18px;}
.rev-choice.is-correct{background:#eaf5ef;border-color:var(--correct);}
.rev-choice.is-wrong{background:#fdeeec;border-color:var(--wrong);}
.rev-tag{font-family:var(--ui);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:auto;white-space:nowrap;}
.rev-tag.t-correct{background:var(--correct);color:#fff;} .rev-tag.t-mine{background:var(--wrong);color:#fff;}
.rev-blank{font-size:14px;margin-bottom:8px;padding:8px 12px;border:1px solid var(--line-soft);border-radius:6px;}
.rev-blank .bl{font-family:var(--ui);font-weight:700;color:var(--ink-mute);font-size:12px;}
.ans-ok{color:var(--correct);font-weight:600;} .ans-no{color:var(--wrong);font-weight:600;}

.exp-meta{background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-family:var(--ui);font-size:13px;line-height:1.7;}
.exp-meta .m-id{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.02em;}
.exp-meta .m-cnt{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:1px 9px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta .m-row{margin-top:6px;color:var(--ink-soft);}
.exp-meta .m-ans .ans-c{color:var(--correct);font-weight:700;} .exp-meta .m-ans .ans-m{font-weight:700;}
.exp-sec{margin-bottom:13px;}
.exp-sec h4{font-family:var(--ui);font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.02em;}
.exp-sec p,.exp-sec li{font-size:14px;line-height:1.65;color:var(--ink);}
.exp-sec ul{padding-left:4px;list-style:none;} .exp-sec li{margin-bottom:5px;}
.exp-sec li b{color:var(--ink);}
.exp-uncertain{color:var(--warn);font-weight:700;font-family:var(--ui);font-size:12.5px;margin-top:6px;}

/* v2: Mark / Review (ETS) */
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-btn{font-family:var(--ui);font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;}
.tb-btn:hover{border-color:var(--ink);}
.tb-btn.marked{background:#fff6d6;border-color:#b8860b;color:#7a5a00;}
.review-wrap{max-width:760px;margin:0 auto;}
.review-wrap h2{font-family:var(--serif);font-size:1.7em;margin-bottom:6px;}
.review-wrap .sub{font-family:var(--ui);font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
.review-table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
.review-table th{background:#fafaf7;text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);border-bottom:1px solid var(--line);}
.review-table td{padding:10px 14px;border-bottom:1px solid var(--line-soft);}
.review-table tr.rv-row{cursor:pointer;} .review-table tr.rv-row:hover td{background:var(--accent-soft);}
.review-table tr.rv-cur td{background:#eef3f9;font-weight:600;}
.st-ans{color:var(--correct);font-weight:600;} .st-not{color:var(--wrong);font-weight:600;} .st-inc{color:#b8860b;font-weight:600;}
.mk-flag{color:#b8860b;font-weight:700;}
/* v2: Vault 해설 */
.exp-sec .md p{margin-bottom:6px;} .exp-sec .md ul{padding-left:18px;list-style:disc;} .exp-sec .md li{margin-bottom:4px;}
.exp-sec .md table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:12.5px;margin-top:4px;}
.exp-sec .md th,.exp-sec .md td{border:1px solid var(--line-soft);padding:4px 6px;text-align:left;vertical-align:top;}
.exp-sec .md th{background:#f3f0e8;}
.exp-sec .md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--ink-soft);margin:6px 0;}
.exp-sec .md h5{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);margin:8px 0 3px;}
.exp-meta .m-part{display:inline-block;background:#fff;border:1px solid var(--accent);color:var(--accent);font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta .m-ets{display:inline-block;background:#1f3a5f;color:#fff;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta a{color:var(--accent);font-weight:600;}
@media(max-width:768px){
  .layout-rc{grid-template-columns:1fr;}
  .passage{position:static !important;max-height:none !important;overflow-y:visible !important;top:auto !important;}
  .score-card{grid-template-columns:1fr;gap:18px;}
  .exp-grid{grid-template-columns:1fr;gap:18px;}
  main{padding:22px 14px 120px;} .intro-title{font-size:1.8em;}
}
@media print{.footer-nav,.topbar,.exp-controls,.results-actions,.code-save{display:none;}body{background:#fff;}}

/* 공개판: greverbal.com 안내 (build_pub.py) */
.promo{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);font-family:var(--ui);}
.promo h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.promo p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px;}
.promo .promo-row{display:flex;gap:8px;flex-wrap:wrap;}
a.btn{text-decoration:none;display:inline-block;}
@media print{.promo{display:none;}}
</style>

s much more __________ than the eye: only the ear can tell a source that oscillates 30 times a second from one that oscillates 60 times a second.", "choices": [{"label": "A", "text": "stable"}, {"label": "B", "text": "efficient"}, {"label": "C", "text": "durable"}, {"label": "D", "text": "discerning"}, {"label": "E", "text": "accurate"}, {"label": "F", "text": "tenacious"}], "answer": ["D", "E"], "answerText": ["discerning", "accurate"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S1-Q10", "poolId": "RCCR 16", "frequency": {"count": 16, "months": ["2022-12", "2023-05", "2023-09", "2023-10", "2024-04", "2024-10", "2024-11", "2024-12", "2025-01", "2025-04", "2025-08", "2025-09", "2025-11", "2025-12", "2026-06", "2026-08"], "bucket": "최상위", "recent": 4}, "part": "Part I", "ets": false, "passage": "The revival of mural painting that has occurred in San Francisco since the 1970s, especially among the Chicano population of the city’s Mission District, has marked differences from its social realist forerunner in Mexico and the United States some 40 years earlier. Rather than being government sponsored and limited to murals on government buildings, the contemporary mural movement sprang from the people themselves, with murals appearing on community buildings and throughout college campuses. Perhaps the biggest difference, however, is the process. In earlier twentieth-century Mexico, murals resulted from the vision of individual artists. But today’s murals are characteristically the products of artists working with local residents on design and creation.\n\nSuch community engagement is characteristic of the Chicano art movement as a whole, which evolved from the same foundations as the Chicano civil rights movement of the mid-1960s. Both were a direct response to the needs of Chicanos in the United States, who were fighti ion.\n\nSuch community engagement is characteristic of the Chicano art movement as a whole, which evolved from the same foundations as the Chicano civil rights movement of the mid-1960s. Both were a direct response to the needs of Chicanos in the United States, who were fighting for the right to adequate education, political empowerment, and decent working conditions. Artists joined other cultural workers in making political statements and played a key role in taking these statements to the public. They developed collectives and established <strong><span class=\"highlighted\">cultural centers<\/span><\/strong> that functioned as the public-relations arm of the Chicano sociopolitical movement.", "passageGroupId": "G_16", "rangeLabel": "S1 Q10-Q12", "questionText": "According to the passage, which of the following statements about the “cultural centers” is true?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "They were the venue where many later leaders of the Chicano civil rights movement first became politically active."}, {"label": "B", "text": "Though later widespread, they originated in the San Francisco area."}, {"label": "C", "text": "Springing up in a number of communities, they initially had largely apolitical goals centered on art instruction."}, {"label": "D", "text": "They constituted the nucleus from which the Chicano civil rights movement originated."}, {"label": "E", "text": "Founded by artists, they provided support for the Chicano civil rights movement."}], "answer": ["E"]}, {"id": "S1-Q12", "poolId": "RCCR 16", "frequency": {"count": 16, "months": ["2022-12", "2023-05", "2023-09", "2023-10", "2024-04", "2024-10", "2024-11", "2024-12", "2025-01", "2025-04", "2025-08", "2025-09", "2025-11", "2025-12", "2026-06", "2026-08"], "bucket": "최상위", "recent": 4}, "part": "Part I", "ets": false, "passage": "The revival of mural painting that has occurred in San Francisco since the 1970s, especially among the Chicano population of the city’s Mission District, has marked differences from its social realist forerunner in Mexico and the United States some 40 years earlier. Rather than being government sponsored and limited to murals on government buildings, the contemporary mural movement sprang from the people themselves, with murals appearing on community buildings and throughout college campuses. Perhaps the biggest difference, however, is the process. In earlier twentieth-century Mexico, murals resulted from the vision of individual artists. But today’s murals are characteristically the products of artists working with local residents on design and creation.\n\nSuch community engagement is characteristic of the Chicano art movement as a whole, which evolved from the same foundations as the Chicano civil rights movement of the mid-1960s. Both were a direct response to the needs of Chicanos in the United States, who were fighting for the right to adequate education, political empowerment, and decent working conditions. Artists joined other cultural workers in making political statements and played a key role in taking these statements to the public. They developed collectives and established cultural centers that functioned as the public-relations arm of the Chicano sociopolitical movement.", "passageGroupId": "G_16", "rangeLabel": "S1 Q10-Q12", "questionText": "Which of the following best describes the relationship between the first paragraph and the second paragraph of the passage?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "The first focuses on the mural artists as individuals; the second, on their actions as a group."}, {"label": "B", "text": "The first compares the mural revival with an earlier artistic movement; the second describes the context contemporary to the revival."}, {"label": "C", "text": "The first defines the revival by distinguishing it from an earlier artistic movement; the second addresses the political goals of both the revival and its forerunner."}, {"label": "D", "text": "The H"], "answerText": ["bluntness", "prodding", "alienate"], "directions": "For each blank select one entry from the corresponding column of choices. Fill all blanks in the way that best completes the text."}, {"id": "S2-Q5", "poolId": "RCCR 1047", "frequency": {"count": 3, "months": ["2024-04", "2026-04", "2026-10"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "The operational complexity (number of steps and decisions made during a process) of Acheulean tool production technologies emerging around 1.8 million years ago far exceeds that of the earlier <span class=\"highlighted\">Oldowan artifacts<\/span> and suggests to some researchers a significant increase in toolmakers' cognitive capacity. However, we should not assume that a more sophisticated production technology will always be more complex: it is possible that better planning or problem solving leads to simpler, more efficient solutions rather than to more complex ones. For instance, late Acheulean flake tools known as the Kombewa type were made by removing large sharp flakes from a boulder core. Such tools are an elegant but simple solution to the problem of producing a cleaver-like tool without the thousands of steps involved in making a typical Acheulean hand axe.", "passageGroupId": "G_1047", "rangeLabel": "S2 Q5-Q6", "questionText": "Which of the following can be inferred about the \"Oldowan artifacts\" mentioned in the passage?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "They were most likely in use for a shorter period of time than were Kombewa flake tools."}, {"label": "B", "text": "They are identical in appearance to Acheulean stone tools but were made by a different method."}, {"label": "C", "text": "Their construction required fewer decisions than did the construction of Acheulean hand axes."}, {"label": "D", "text": "They were too crudely designed to be of use in the more sophisticated operations of the Acheulean period."}, {"label": "E", "text": "Their intended purposes are more difficult to determine than are the purposes of Kombewa flake tools."}], "answer": ["C"]}, {"id": "S2-Q6", "poolId": "RCCR 1047", "frequency": {"count": 3, "months": ["2024-04", "2026-04", "2026-10"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "The operational complexity (number of steps and decisions made during a process) of Acheulean tool production technologies emerging around 1.8 million years ago far exceeds that of the earlier Oldowan artifacts and suggests to some researchers a significant increase in toolmakers' cognitive capacity. However, we should not assume that a more sophisticated production technology will always be more complex: it is possible that better planning or problem solving leads to simpler, more efficient solutions rather than to more complex ones. For instance, late Acheulean <span class=\"highlighted\">flake tools<\/span> known as the Kombewa type were made by removing large sharp flakes from a boulder core. Such tools are an elegant but simple solution to the problem of producing a cleaver-like tool without the thousands of steps involved in making a typical Acheulean hand axe.", "passageGroupId": "G_1047", "rangeLabel": "S2 Q5-Q6", "questionText": "The author mentions Kombewa \"flake tools\" most likely in order to argue that", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "the production of cleaver-like tools required more careful planning than did the production of other kinds of tools"}, {"label": "B", "text": "Oldowan artifacts were much more sophisticated than previously thought"}, {"label": "C", "text": "reducing the operational complexity of tool production methods tends to increase the utility of the tools produced"}, {"label": "D", "text": "Acheulean and Oldowan toolmakers may not have been as cognitively different as some believe"}, {"label": "E", "text": "tool production technology did not change much throughout the Acheulean period"}], "answer": ["D"]}, {"id": "S2-Q7", "poolId": "RCCR 710", "frequency": {"count": 5, "months": ["2021-07", "2022-11", "2024-09", "2026-02", "2026-03"], "bucket": "상위", "recent": 2}, "part": "Part II", "ets": false, "passage": "From 1970 to 1997, both the Canadian and the United States women's movements engaged with the partisan political process, albeit to varying degrees. Neither entered into a permanent, exclusive relationship with a political party, but both fostered ties with parties. Over time, voices contesting this partisan engagement grew stronger inside both movements, prompting some movement organizations to try to establish alternative routes for political engagement. This attempt, however, does not support the contention by <strong><span class=\"highlighted\">theorists<\/span><\/strong> of new social movements that women's movements, as so-called new movements, are predisposed away from the formal political process. Though these accurately identify the aversion of women's movements to the pragmatic deal making and vote chasing that characterize political parties, what they fail to capture is the equally powerful lure of partisan electoral politics. These contradictory impulses are manifested by the coexistence of partisan engagements and apartisan strategies within the movements.\n\nWithin the context of this contradictory relationship, United States and Canadian women's movements followed widely divergent trajectories. In the United States, the women's movement became increasingly involved in partisan electoral politics, while the Canadian movement's party alliances of the 1980s evolved into a largely apartisan orientation in the early 1990s. The relative strength of radical feminism within the Canadian women's movement constrained the extent of the movement's engagement in political arenas.", "passageGroupId": "G_710", "rangeLabel": "S2 Q7-Q9", "questionText": "The author of the passage makes which of the following claims about the \"theorists\"?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "They have overemphasized the aversion of the Canadian and United States women's movements to pragmatic deal making."}, {"label": "B", "text": "They misunderstand why the Canadian and United States women's movements tended to be put off by vote chasing."}, {"label": "C", "text": "They have underestimated the extent to which traditional partisan politics appealed to the Canadian and United States women's movements."}, {"label": "D", "text": "They have ignored the fact that neither the Canadian nor the United States women's movements entered into an exclusive relationship with a political party."}, {"label": "E", "text": "They remain unaware of the efforts by some individuals in the Canadian and United States women's movements to establish alternative routes for political engagement."}], "answer": ["C"]}, {"id": "S2-Q8", "poolId": "RCCR 710", "frequency": {"count": 5, "months": ["2021-07", "2022-11", "2024-09", "2026-02", "2026-03"], "bucket": "상위", "recent": 2}, "part": "Part II", "ets": false, "passage": "From 1970 to 1997, both the Canadian and the United States women's movements engaged with the partisan political process, albeit to varying degrees. Neither entered into a permanent, exclusive relationship with a political party, but both fostered ties with parties. Over time, voices contesting this partisan engagement grew stronger inside both movements, prompting some movement organizations to try to establish alternative routes for political engagement. This attempt, however, does not support the contention by theorists of new social movements that women's movements, as so-called new movements, are predisposed away from the formal political process. Though these accurately identify the aversion of women's movements to the pragmatic deal making and vote chasing that characterize political parties, what they fail to capture is the equally powerful lure of partisan electoral politics. These contradictory impulses are manifested by the coexistence of partisan engagements and apartisan strategies within the movements.\n\nWithin the context of this contradictory relationship, United States and Canadian women's movements followed widely divergent trajectories. In the United States, the women's movement became increasingly involved in partisan electoral politics, while the Canadian movement's party alliances of the 1980s evolved into a largely apartisan orientation in the early 1990s. The relative strength of radical feminism within the Canadian women's movement constrained the extent of the movement's engagement in political arenas.", "passageGroupId": "G_710", "rangeLabel": "S2 Q7-Q9", "questionText": "The passage suggests that one reason the United States women's movement became more involved in electoral politics than did the Canadian women's movement was that", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "electoral politics in the United States tended to be more receptive to political organizations that remained unaffiliated with any major party"}, {"label": "B", "text": "radical feminists in the United States were more interested in engaging with the partisan political process than were radical feminists in Canada"}, {"label": "C", "text": "the women's movement in the United States found that it benefited from aligning itself with mainstream political parties"}, {"label": "D", "text": "the major political parties in Canada tended to be less sympathetic to feminist goals than were the major political parties in the United States"}, {"label": "E", "text": "the women's movement in the United States was less influenced by radical feminism than was the women's movement in Canada"}], "answer": ["E"]}, {"id": "S2-Q9", "poolId": "RCCR 710", "frequency": {"count": 5, "months": ["2021-07", "2022-11", "2024-09", "2026-02", "2026-03"], "bucket": "상위", "recent": 2}, "part": "Part II", "ets": false, "passage": "From 1970 to 1997, both the Canadian and the United States women's movements engaged with the partisan political process, albeit to varying degrees. Neither entered into a permanent, exclusive relationship with a political party, but both fostered ties with parties. Over time, voices contesting this partisan engagement grew stronger inside both movements, prompting some movement organizations to try to establish alternative routes for political engagement. This attempt, however, does not support the contention by theorists of new social movements that women's movements, as so-called new movements, are predisposed away from the formal political process. Though these accurately identify the aversion of women's movements to the pragmatic deal making and vote chasing that characterize political parties, what they fail to capture is the equally powerful lure of partisan electoral politics. These contradictory impulses are manifested by the coexistence of partisan engagements and apartisan strategies within the movements.\n\nWithin the context of this contradictory relationship, United States and Canadian women's movements followed widely divergent trajectories. In the United States, the women's movement became increasingly involved in partisan electoral politics, while the Canadian movement's party alliances of the 1980s evolved into a largely apartisan orientation in the early 1990s. The relative strength of radical feminism within the Canadian women's movement constrained the extent of the movement's engagement in political arenas.", "passageGroupId": "G_710", "rangeLabel": "S2 Q7-Q9", "questionText": "Which of the following can be inferred from the passage about attempts by some in the women's movement to establish alternative routes for political engagement?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "Very few alternative political routes were actually established in Canada or the United States as a result of such attempts."}, {"label": "B", "text": "In both Canada and the United States, women who favored traditional forms of political engagement were generally supportive of these attempts."}, {"label": "C", "text": "These attempts alienated traditional political parties in both Canada and the United States."}, {"label": "D", "text": "These attempts represented an approach that eventually became more typical of the Canadian women's movement than of the United States women's movement."}, {"label": "E", "text": "These attempts diminished the extent to which the United States women's movement ultimately participated in traditional forms of political engagement."}], "answer": ["D"]}, {"id": "S2-Q10", "poolId": "TCSE 3699", "frequency": {"count": 1, "months": ["2026-10"], "bucket": "저빈도", "recent": 1}, "part": "Part V", "ets": false, "type": "SE", "questionText": "Believing fervently that very few truly good poems are written without a great deal of deliberation and revision, the poet urged her creative-writing students to be extremely __________.", "choices": [{"label": "A", "text": "imaginative"}, {"label": "B", "text": "fastidious"}, {"label": "C", "text": "inventive"}, {"label": "D", "text": "finicky"}, {"label": "E", "text": "intuitive"}, {"label": "F", "text": "spontaneous"}], "answer": ["B", "D"], "answerText": ["fastidious", "finicky"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q11", "poolId": "TCSE 2529", "frequency": {"count": 7, "months": ["2025-04", "2025-05", "2025-07", "2025-08", "2025-09", "2025-12", "2026-05"], "bucket": "상위", "recent": 2}, "part": "Part III", "ets": false, "type": "SE", "questionText": "Software makers typically write licensing agreements disclaiming responsibility for any negative consequences of using their products, but as computers become integrated into everything from cars to medical devices, that stance will become __________.", "choices": [{"label": "A", "text": "ambiguous"}, {"label": "B", "text": "untenable"}, {"label": "C", "text": "disfavored"}, {"label": "D", "text": "indefensible"}, {"label": "E", "text": "unwarranted"}, {"label": "F", "text": "gratuitous"}], "answer": ["B", "D"], "answerText": ["untenable", "indefensible"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q12", "poolId": "TCSE 3490", "frequency": {"count": 5, "months": ["2024-02", "2025-04", "2025-07", "2026-02", "2026-03"], "bucket": "상위", "recent": 2}, "part": "Part IV", "ets": false, "type": "SE", "questionText": "There's __________ throughout the Broadway adaptation of The Color Purple that, while hardly true to the harrowing bleakness of the early chapters of Alice Walker's novel, does bring to mind the enjoyable hokey cinematic lavishness of the film version.", "choices": [{"label": "A", "text": "a starkness"}, {"label": "B", "text": "a splendor"}, {"label": "C", "text": "an austerity"}, {"label": "D", "text": "a sumptuousness"}, {"label": "E", "text": "a frivolousness"}, {"label": "F", "text": "a gravity"}], "answer": ["B", "D"], "answerText": ["a splendor", "a sumptuousness"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q13", "poolId": "RCCR 17", "frequency": {"count": 6, "months": ["2023-03", "2025-04", "2025-06", "2025-09", "2025-12", "2026-06"], "bucket": "상위", "recent": 2}, "part": "Part I", "ets": false, "passage": "Centuries ago, the Maya of Central America produced elaborate, deeply cut carvings in stone. The carvings would have required a cutting tool of hard stone or metal. Iron-ore deposits exist throughout Central America, but apparently the Maya never developed the technology to use them and the metals the Maya are known to have used, copper and gold, would not have been hard enough. Therefore, the Maya must have used stone tools to make these carvings.", "passageGroupId": "G_17", "rangeLabel": "S2 Q13", "questionText": "Which of the following, if true, most seriously weakens the argument?", "type": "CR", "choices": [{"label": "A", "text": "In various parts of the world, civilizations that could not make iron from ore fashioned tools out of fragments of iron from meteorites."}, {"label": "B", "text": "All the metallic Mayan artifacts that have been found by archaeologists are made of metals that are too soft for carving stone."}, {"label": "C", "text": "The stone out of which these carvings were made is harder than the stone used by other Central American peoples."}, {"label": "D", "text": "The technique that the Maya used to smelt gold and some other metals could not have been easily applied to the task of extracting iron from iron ore."}, {"label": "E", "text": "Archaeologists disagree about how certain stone tools that have been found among Mayan ruins were used."}], "answer": ["A"], "stimulus": "Centuries ago, the Maya of Central America produced elaborate, deeply cut carvings in stone. The carvings would have required a cutting tool of hard stone or metal. Iron-ore deposits exist throughout Central America, but apparently the Maya never developed the technology to use them and the metals the Maya are known to have used, copper and gold, would not have been hard enough. Therefore, the Maya must have used stone tools to make these carvings."}, {"id": "S2-Q14", "poolId": "RCCR 1049", "frequency": {"count": 2, "months": ["2025-12", "2026-04"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "The question of why the continental slope [the descent from the edge of the continental shelf to the ocean bottom] is not any steeper continues to perplex marine geologists. <span class=\"highlighted\">When only gravity acts on them, sediments piled underwater can easily maintain stable slopes of 15 degrees or more.<\/span> Yet some 80 percent of all continental slopes dip downward at less than 8 degrees. Acting alone, the constant influx of sediments eroded from the land would, over time, steepen the grade, so, clearly, one or more natural forces are ensuring that these slopes remain low. Some scientists believe that a primary factor is internal tides: submerged waves, largely hidden from view, that pulse through the body of the ocean with the same twice-daily period as normal lunar tides.", "passageGroupId": "G_1049", "rangeLabel": "S2 Q14-Q15", "questionText": "The highlighted sentence serves primarily to", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "identify a phenomenon that has proven difficult for scientists to verify"}, {"label": "B", "text": "provide information that explains why a phenomenon is puzzling"}, {"label": "C", "text": "acknowledge a flaw in the hypothesis presented in the passage"}, {"label": "D", "text": "illustrate with an example the problem posed in the passage"}, {"label": "E", "text": "state a scientific fact that is questioned later in the passage"}], "answer": ["B"]}, {"id": "S2-Q15", "poolId": "RCCR 1049", "frequency": {"count": 2, "months": ["2025-12", "2026-04"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "The question of why the continental slope [the descent from the edge of the continental shelf to the ocean bottom] is not any steeper continues to perplex marine geologists. When only gravity acts on them, sediments piled underwater can easily maintain stable slopes of 15 degrees or more. Yet some 80 percent of all continental slopes dip downward at less than 8 degrees. Acting alone, the constant influx of sediments eroded from the land would, over time, steepen the grade, so, clearly, <span class=\"highlighted\">one or more natural forces<\/span> are ensuring that these slopes remain low. Some scientists believe that a primary factor is internal tides: submerged waves, largely hidden from view, that pulse through the body of the ocean with the same twice-daily period as normal lunar tides.", "passageGroupId": "G_1049", "rangeLabel": "S2 Q14-Q15", "questionText": "The author of the passage mentions “one or more natural forces” primarily to", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "explain why a certain phenomenon does not occur"}, {"label": "B", "text": "cite a factor that complicates a posed question"}, {"label": "C", "text": "provide evidence on which a theory is based"}, {"label": "D", "text": "suggest a direction for future research"}, {"label": "E", "text": "question the validity of a proposed hypothesis"}], "answer": ["A"]}]}], "passageGroups": {"G_859": {"appliedTo": ["S1-Q4", "S1-Q5"], "range": "S1 Q4-Q5"}, "G_16": {"appliedTo": ["S1-Q10", "S1-Q11", "S1-Q12"], "range": "S1 Q10-Q12"}, "G_1047": {"appliedTo": ["S2-Q5", "S2-Q6"], "range": "S2 Q5-Q6"}, "G_710": {"appliedTo": ["S2-Q7", "S2-Q8", "S2-Q9"], "range": "S2 Q7-Q9"}, "G_17": {"appliedTo": ["S2-Q13"], "range": "S2 Q13"}, "G_1049": {"appliedTo": ["S2-Q14", "S2-Q15"], "range": "S2 Q14-Q15"}}, "explanations": {"S1-Q1": {"html": true, "interp": "<p>빅토리아 시대 사람들의 역설은, 그들이 자기 세계에 갇혀 편협하면서도 제국 전역에 걸쳐서는 국제적(cosmopolitan)이었다는 점이다.<\/p><p><b>해석 노트:<\/b> insular는 어원이 '섬(insula)'이라 바깥과 단절된 좁은 세계에 갇혀 있다는 그림이 살아 있는 말이고, 섬나라 영국 사람들을 두고 쓴 것이 이 역설의 묘미입니다. 다만 본문 해석에는 원문에 없는 비유를 덧붙이지 않도록 '자기 세계에 갇혀 편협하면서도'로 담백하게 옮겼습니다. both A and B는 '~하면서도'로 풀어 역설(paradox)의 긴장을 어미에 담았고, cosmopolitan은 대비되는 핵심어라 한글 뒤에 원어를 병기했습니다. It is a paradox … that의 가주어 구문은 직역하면 늘어지므로 '~의 역설은 …라는 점이다'로 주제를 앞으로 당겨 재구성했습니다.<\/p>", "strat": "<p><code>paradox<\/code>(역설 — 역접 유도어 trigger-10) + <code>both A and B<\/code>(both ~ and로 두 상반된 성질을 묶음). 역설이므로 빈칸과 <code>cosmopolitan<\/code>은 <b>반대 방향<\/b>이어야 한다.<\/p><ul><li><code>cosmopolitan<\/code>(세계 곳곳에 열린, 국제적인)의 반대 = <b>편협한·자기 안에 갇힌<\/b>. 따라서 빈칸 = \"insular(편협한, 섬처럼 고립된)\".<\/li><\/ul>", "correct": "<ul><li><b>insular(편협한, 섬처럼 고립된)<\/b>: <code>cosmopolitan<\/code>(국제적·개방적)의 정확한 반대. \"역설\"이 요구하는 대조축(닫힘 ↔ 열림)을 충족.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>It is a paradox of the Victorians that they were both <b>insular<\/b> and, throughout the empire, cosmopolitan.<\/p>", "wrong": "<ul><li>capricious(변덕스러운): cosmopolitan과 대조축이 아님 — \"변덕\"은 \"개방성\"의 반대가 아니다.<\/li><li>mercenary(돈만 밝히는): 금전 동기 — 대조축 무관.<\/li><li>idealistic(이상주의적인): cosmopolitan의 반대 아님.<\/li><li>intransigent(고집스러운, 비타협적인): \"완강함\"이지 \"편협·고립\"이 아님 — cosmopolitan과 직접 대조되지 않음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>insular<\/td><td>adj.<\/td><td>편협한, 섬처럼 고립된<\/td><td>parochial, narrow-minded<\/td><td>↔ cosmopolitan<\/td><\/tr><tr><td>cosmopolitan<\/td><td>adj.<\/td><td>국제적인, 세계주의적인<\/td><td>worldly, urbane<\/td><td>(거만어 외)<\/td><\/tr><tr><td>capricious<\/td><td>adj.<\/td><td>변덕스러운<\/td><td>fickle, mercurial<\/td><td><\/td><\/tr><tr><td>mercenary<\/td><td>adj.<\/td><td>돈만 밝히는<\/td><td>venal, money-grubbing<\/td><td><\/td><\/tr><tr><td>intransigent<\/td><td>adj.<\/td><td>비타협적인, 완강한<\/td><td>obstinate, unyielding<\/td><td><\/td><\/tr><\/table>", "uncertain": false}, "S1-Q2": {"html": true, "interp": "<p>유기 폐기물을 퇴비로 만드는 방법들은 부패로 향하는 자연의 성향을 앞당기는 데 목적이 있다. 그런데 부패라는 이 과정은 안타깝게도 매립지(landfill)에서 종종 가로막히고 만다. 그곳에서는 유기물이 지나치게 빽빽이 다져져 있어 분해(decomposition)에 필요한 산소가 좀처럼 닿지 못하기 때문이다.<\/p><p><b>해석 노트:<\/b> precipitate는 언젠가 일어날 일을 재촉해 앞당긴다는 뜻이라 '촉진하다'보다 '앞당기다'로 옮겨, 부패가 본래 자연의 성향(tendency)으로 진행되던 것임을 드러냈다. impeded는 완전한 차단이 아니라 진행이 막혀 더뎌짐이므로 '가로막히고 만다'로 옮겨 unfortunately의 안타까움까지 어미에 실었다. 대시로 이어진 동격구와 where 관계절을 직역하면 한 문장이 지나치게 길어지므로 세 문장으로 끊었고, they have little access to the oxygen은 무생물 주어의 소유 구문이라 한국어 어순에 맞게 '산소가 좀처럼 닿지 못한다'로 시점을 뒤집었다.<\/p>", "strat": "<p>대시(-) 뒤 <code>a process …<\/code> 동격 부연(trigger-04 — 앞의 decay를 받음) + <code>unfortunately<\/code>(trigger-13 역접/부정 뉘앙스 — 매립지에서는 반대 상황).<\/p><ul><li>(i): 퇴비화는 자연의 부패를 <b>촉진·앞당기는<\/b> 것이 목표(분해를 돕는 게 퇴비화). 빈칸 = \"촉진하다\".<\/li><li>(ii): <code>unfortunately<\/code>로 매립지는 정반대 — 산소가 부족해 분해가 <b>방해됨<\/b>(퇴비화의 촉진 ↔ 매립지의 방해 — 이 대조는 <code>unfortunately<\/code>가 이끈다). 빈칸 = \"방해된, 막힌\".<\/li><li><code>so … that<\/code>(trigger-02 정도-결과, 보조): «so tightly that … little oxygen»이 (ii)의 직접 원인이다.<\/li><\/ul>", "correct": "<ul><li>(i) <code>precipitate<\/code>(촉진하다, 앞당기다) — 퇴비화가 부패·분해를 빠르게.<\/li><li>(ii) <code>impeded<\/code>(방해된, 막힌) — 매립지에서 산소 부족으로 분해가 막힘.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>The methods for composting organic waste aim to <b>precipitate<\/b> nature’s tendency toward decay—a process unfortunately often <b>impeded<\/b> in landfills, where organic materials are packed so tightly that they have little access to the oxygen necessary for decomposition.<\/p>", "wrong": "<ul><li>(i) <code>obviate<\/code>(불필요하게 하다, 없애다)·<code>ameliorate<\/code>(개선하다) — 퇴비화는 부패를 \"없애는\" 게 아니라 \"촉진\"하는 것. obviate면 분해를 막는 셈이라 모순.<\/li><li>(ii) <code>expedited<\/code>(촉진된)·<code>manifested<\/code>(드러난) — unfortunately + 산소 부족(분해 어려움)과 모순. 분해가 \"방해\"라야 함.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>precipitate<\/td><td>v.<\/td><td>촉진하다, 앞당기다<\/td><td>hasten, accelerate<\/td><td>(i)정답<\/td><\/tr><tr><td>impeded<\/td><td>v.(p.p.)<\/td><td>방해된, 막힌<\/td><td>hindered, obstructed<\/td><td>(거만어 외) (ii)정답<\/td><\/tr><tr><td>obviate<\/td><td>v.<\/td><td>불필요하게 하다, 없애다<\/td><td>preclude, avert<\/td><td>(i)오답<\/td><\/tr><tr><td>ameliorate<\/td><td>v.<\/td><td>개선하다<\/td><td>improve, mitigate<\/td><td>(i)오답<\/td><\/tr><tr><td>decompose<\/td><td>v.<\/td><td>분해되다, 부패하다<\/td><td>decay, rot<\/td><td>(거만어 외) 본문 (decomposition)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q3": {"html": true, "interp": "<p>문학·문화 연구에서 혁신적인 작업은 흔히 병치(juxtaposition)를 통해 이루어진다. 해석자는 두 대상을 나란히 놓는데, 하나는 으레 알려져 있는 것이고 다른 하나는 그 논의에 처음 들어오는 것이다. 그러고는 이 둘이 어떻게 서로를 비추는지를 보여 준다. 천재성의 절반은 뜻밖이면서도 우아한 연결이라는, 그 단순한 행위에 있다.<\/p><p><b>해석 노트:<\/b> juxtaposition은 '나란히 던져 놓음'이라는 어원 그대로 두 대상을 맞세우는 행위이므로 '병치'로 옮기고 원어를 병기해 뒤의 place side by side와 이어지게 했다. usually known은 '늘 알려진'이 아니라 통상 그 분야에서 이미 익숙한 쪽이라는 뜻이라 '으레 알려져 있는'으로 처리해, entirely new(논의에 처음 들어오는)와의 낯익음-낯섦 대비가 드러나게 했다. connection은 결과로서의 '관련성'이 아니라 이어 붙이는 몸짓을 가리키므로 '연결'로 두되 act를 '행위'로 받아 행위성을 살렸고, 콜론과 대시로 길게 이어진 원문은 한국어에서 네 마디로 끊어 읽기 흐름을 세웠다.<\/p>", "strat": "<p>콜론(:)(trigger-05 부연)이 (i)을 노골적으로 설명한다. 콜론 뒤: \"두 대상을 <b>나란히 놓는다<\/b>(places two objects side by side)\" → (i) = \"병치(juxtaposition)\".<\/p><ul><li>(ii): <code>one (ii), the other entirely new<\/code>(trigger-10 대조 — one A, the other B) — 한쪽이 \"완전히 새로운(entirely new)\"의 반대 = \"이미 알려진(usually known)\".<\/li><li>(iii): 대시 뒤 \"둘을 잇는(mutually illuminate)\" 행위의 요약(trigger-18 빈칸 관계 — (i) juxtaposition과 호응) = \"연결(connection)\".<\/li><\/ul>", "correct": "<ul><li>(i) <code>juxtaposition<\/code>(병치, 나란히 둠) — side by side의 명사형.<\/li><li>(ii) <code>usually known<\/code>(보통 알려진) — entirely new와 대조.<\/li><li>(iii) <code>connection<\/code>(연결) — 두 대상을 잇는 행위.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Innovative work in literary and cultural studies often proceeds by means of <b>juxtaposition<\/b>: the interpreter places two objects side by side, one <b>usually known<\/b>, the other entirely new to the conversation, and demonstrates how they mutually illuminate one another—half the genius lies in the simple act of unexpected, elegant <b>connection<\/b>.<\/p>", "wrong": "<ul><li>(i) <code>circumlocution<\/code>(에둘러 말하기)·<code>substitution<\/code>(대체) — \"나란히 놓음\"과 무관.<\/li><li>(ii) <code>wholly unfamiliar<\/code>(전혀 낯선)·<code>boldly original<\/code>(대담하게 독창적인) — \"entirely new\"와 같은 방향이라 대조(one A vs the other new)가 깨짐. 한쪽은 \"기존(known)\"이라야 함.<\/li><li>(iii) <code>amalgamation<\/code>(융합)·<code>elision<\/code>(생략) — 두 대상을 \"녹여 합침/지움\"이 아니라 \"잇는(connection)\" 것. juxtaposition(나란히 둠)은 합치는 게 아님.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>juxtaposition<\/td><td>n.<\/td><td>병치, 나란히 둠<\/td><td>placing side by side<\/td><td>(i)정답<\/td><\/tr><tr><td>circumlocution<\/td><td>n.<\/td><td>에둘러 말하기<\/td><td>verbosity, periphrasis<\/td><td>(i)오답<\/td><\/tr><tr><td>amalgamation<\/td><td>n.<\/td><td>융합, 합병<\/td><td>merger, fusion<\/td><td>(거만어 외) (iii)오답<\/td><\/tr><tr><td>elision<\/td><td>n.<\/td><td>생략<\/td><td>omission<\/td><td>(거만어 외) (iii)오답<\/td><\/tr><tr><td>illuminate<\/td><td>v.<\/td><td>비추다, 밝히다<\/td><td>clarify, elucidate<\/td><td>(거만어 외) 본문<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q4": {"html": true, "interp": "<p>예술과 건축의 유사성 때문에 일부 학자들은 한때 중앙아메리카 마야 문화가 동남아 크메르(Khmer) 문화에서 부분적으로 유래했다고 주장했다. Baksei Chamkrong 같은 크메르 사원-피라미드가 마야의 대응물(counterparts)과 놀랄 만큼 닮았지만, 이 구조물들의 <em>연대<\/em>를 면밀히 살피면(closer scrutiny of the dating) 그런 환태평양 전파(transpacific diffusion) 이론은 설득력이 없어진다(implausible). 특징적 계단식 사원-피라미드와 거대 도시가 마야 저지대에 이미 기원전 200년에 지어지고 있었는데, 그때 동남아 대부분은 말뚝 주거의 단순한 원형 마을 정도밖에 없었다. <span class=\"highlighted\">크메르 왕 자야바르만 2세의 행동이 고전 크메르기를 연 서기 802년 무렵, 고전 마야 문명은 이미 가파른 쇠퇴기에 있었고 이후 한 세기 안에 완전히 붕괴했다.<\/span><\/p>", "strat": "<p><b>질문 1 — 유형 RC-07<\/b><\/p><p>FAC 흐름: ①논박 대상: \"마야 ← 크메르 전파설\"(유사성 근거). ②저자 반박(but, FAC7): 연대를 보면 전파설은 <em>설득력 없음<\/em>. ③근거1(Fact): 마야 계단식 피라미드·도시 = 기원전 200년 ↔ 그때 동남아는 원시적. ④근거2(하이라이트): 크메르 고전기 시작(802년)엔 마야는 이미 쇠퇴·곧 붕괴. 핵심 = <em>시간 순서<\/em>가 전파 방향(크메르→마야)을 불가능하게 만든다(마야가 훨씬 앞섬).<\/p>", "correct": "<ul><li><b>★해법<\/b>: 강조 문장을 해석하고 앞 문장과의 관계를 본다. 앞에서 «연대를 보면 전파설은 설득력이 없다»고 했으므로, 802년 무렵 마야가 이미 쇠퇴했다는 이 문장은 그 반박을 support하는 근거다. 전파의 방향(크메르→마야)을 바르게 잡은 보기를 고르고 방향이 뒤집힌 보기는 버린다.<\/li><li><b>정답 근거 (B. 고전 크메르 문명이 고전 마야 문명에 <em>영향<\/em>을 주었다는 데 반대하는 증거를 제공)<\/b>: 하이라이트 문장은 \"크메르 고전기 시작(802년) 때 마야는 이미 쇠퇴\" → 크메르가 마야에 영향을 줄 수 <em>없었음<\/em>(마야가 먼저 끝남). 곧 \"크메르→마야 전파설\" 반박 증거.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: A(마야가 크메르에 영향 줬다는 데 반대) — 방향이 거꾸로. 본문이 반박하는 것은 <em>크메르→마야<\/em>설이다. C(크메르가 자야바르만 2세 말기에 쇠퇴 중이었다는 증거) — 본문은 802년이 크메르 고전기의 <em>시작<\/em>이라 함, 모순. D(크메르기 동안 환태평양 여행이 불가능했다는 증거) — 여행 가능성이 아니라 <em>연대<\/em> 문제. E(마야·크메르 문화의 유사성 증거) — 유사성은 ①②에서 언급, 이 문장은 <em>연대 반증<\/em>.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>counterpart<\/td><td>n.<\/td><td>상응물, 대응 상대<\/td><td>equivalent, analogue<\/td><td>본문 — Mayan counterparts<\/td><\/tr><tr><td>steep<\/td><td>adj.<\/td><td>가파른; 급격한<\/td><td>sharp, precipitous<\/td><td>본문 — steep decline(다의어)<\/td><\/tr><tr><td>diffusion<\/td><td>n.<\/td><td>전파, 확산<\/td><td>dissemination, spread<\/td><td>(거만어 외) transpacific diffusion=환태평양 전파<\/td><\/tr><tr><td>implausible<\/td><td>adj.<\/td><td>설득력 없는, 있을 법하지 않은<\/td><td>unconvincing, far-fetched<\/td><td>본문 — 전파설 평가<\/td><\/tr><tr><td>scrutiny<\/td><td>n.<\/td><td>면밀한 조사<\/td><td>examination, inspection<\/td><td>(거만어 외) closer scrutiny=면밀히 살핌<\/td><\/tr><tr><td>postdate<\/td><td>v.<\/td><td>~보다 나중이다<\/td><td>come after<\/td><td>(거만어 외) 질문 2 C — postdates A.D. 800<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q5": {"html": true, "interp": "<p>예술과 건축의 유사성 때문에 일부 학자들은 한때 중앙아메리카 마야 문화가 동남아 크메르(Khmer) 문화에서 부분적으로 유래했다고 주장했다. Baksei Chamkrong 같은 크메르 사원-피라미드가 마야의 대응물(counterparts)과 놀랄 만큼 닮았지만, 이 구조물들의 <em>연대<\/em>를 면밀히 살피면(closer scrutiny of the dating) 그런 환태평양 전파(transpacific diffusion) 이론은 설득력이 없어진다(implausible). 특징적 계단식 사원-피라미드와 거대 도시가 마야 저지대에 이미 기원전 200년에 지어지고 있었는데, 그때 동남아 대부분은 말뚝 주거의 단순한 원형 마을 정도밖에 없었다. <span class=\"highlighted\">크메르 왕 자야바르만 2세의 행동이 고전 크메르기를 연 서기 802년 무렵, 고전 마야 문명은 이미 가파른 쇠퇴기에 있었고 이후 한 세기 안에 완전히 붕괴했다.<\/span><\/p>", "strat": "<p><b>질문 2 — 유형 RC-02 · select-all<\/b><\/p><p>FAC 흐름: ①논박 대상: \"마야 ← 크메르 전파설\"(유사성 근거). ②저자 반박(but, FAC7): 연대를 보면 전파설은 <em>설득력 없음<\/em>. ③근거1(Fact): 마야 계단식 피라미드·도시 = 기원전 200년 ↔ 그때 동남아는 원시적. ④근거2(하이라이트): 크메르 고전기 시작(802년)엔 마야는 이미 쇠퇴·곧 붕괴. 핵심 = <em>시간 순서<\/em>가 전파 방향(크메르→마야)을 불가능하게 만든다(마야가 훨씬 앞섬).<\/p>", "correct": "<ul><li><b>★해법<\/b>: Baksei Chamkrong을 주어로 본문을 재구성하되 보기마다 따로 판정한다. Khmer temple-pyramids such as Baksei Chamkrong … similar to their Mayan counterparts와 «고전 크메르기 = 802년 시작»에서 한 걸음만 나아간 보기만 남기고, 동남아 일반 마을 묘사를 끌어온 보기는 버린다.<\/li><\/ul><blockquote>지시문: consider each of the choices separately and select all that apply.<\/blockquote><ul><li><b>B (○) 계단식 사원-피라미드다<\/b>: \"Khmer temple-pyramids such as Baksei Chamkrong are strikingly similar to their Mayan counterparts\" + 마야의 것이 \"characteristic stepped form\" → Baksei Chamkrong도 계단식 사원-피라미드. 정답.<\/li><li><b>C (○) 서기 800년 이후의 것이다(postdates A.D. 800)<\/b>: Baksei Chamkrong은 <em>고전 크메르<\/em> 사원-피라미드이고, 고전 크메르기는 802년에 시작 → 800년 이후. 정답.<\/li><li><b>정답: B, C<\/b><\/li><\/ul>", "wrong": "<ul><li><b>A (✗) 말뚝 주거(pile dwellings)로 둘러싸여 있다<\/b>: 말뚝 주거는 <em>동남아 일반 마을<\/em>을 묘사한 것이지 Baksei Chamkrong(크메르 <em>사원-피라미드<\/em>)을 둘러쌌다는 근거 없음. 오답.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>counterpart<\/td><td>n.<\/td><td>상응물, 대응 상대<\/td><td>equivalent, analogue<\/td><td>본문 — Mayan counterparts<\/td><\/tr><tr><td>steep<\/td><td>adj.<\/td><td>가파른; 급격한<\/td><td>sharp, precipitous<\/td><td>본문 — steep decline(다의어)<\/td><\/tr><tr><td>diffusion<\/td><td>n.<\/td><td>전파, 확산<\/td><td>dissemination, spread<\/td><td>(거만어 외) transpacific diffusion=환태평양 전파<\/td><\/tr><tr><td>implausible<\/td><td>adj.<\/td><td>설득력 없는, 있을 법하지 않은<\/td><td>unconvincing, far-fetched<\/td><td>본문 — 전파설 평가<\/td><\/tr><tr><td>scrutiny<\/td><td>n.<\/td><td>면밀한 조사<\/td><td>examination, inspection<\/td><td>(거만어 외) closer scrutiny=면밀히 살핌<\/td><\/tr><tr><td>postdate<\/td><td>v.<\/td><td>~보다 나중이다<\/td><td>come after<\/td><td>(거만어 외) 질문 2 C — postdates A.D. 800<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q6": {"html": true, "interp": "<p>여성을 어머니와 주부의 이미지로 다루는 데 치중한 주류 출판물과 달리, 세피아(Sepia)는 1940년대 창간 때부터 여성을 여러 갈래의 역할 속에서 그려냈고, 아프리카계 미국인 직업여성과 연예인의 이야기를 자주 실었다.<\/p><p><b>해석 노트:<\/b> varied는 '다양한'이라는 한 낱말보다 '서로 다른 것이 여럿 있다'는 결이 강해 '여러 갈래의 역할'로 옮겼다. centered on은 '~에 중심을 두었다'는 직역이 뻣뻣해 '~하는 데 치중한'으로 풀어 앞뒤 대조를 또렷하게 했고, featured stories of는 잡지의 지면 행위이므로 '이야기를 실었다'로 옮겼다. from its inception은 창간이라는 시점을 가리키므로 '창간 때부터'로 당겨 읽었다. 다른 정답 diverse를 넣어도 '역할의 폭이 넓다'는 같은 뜻이 되어 해석은 달라지지 않는다.<\/p>", "strat": "<p><code>Unlike mainstream publications, which centered on ... mothers and housewives<\/code>(trigger-10/trigger-15 Unlike 비교 — 대비 대상은 반대말). 주류는 여성을 \"어머니·주부\"라는 <b>틀에 박힌 단일<\/b> 역할로 그렸다. Sepia는 그와 <b>반대<\/b>이므로, 빈칸 = \"다양한, 여러\" 역할. 뒤의 <code>career women and entertainers<\/code>(직업여성·연예인)가 \"어머니·주부\"를 넘어선 여러 역할을 구체화하여 빈칸을 뒷받침한다.<\/p>", "correct": "<p>SE — \"다양한\" 방향 동의어 둘.<\/p><ul><li><code>varied<\/code>(다양한, 가지각색의) — 주부·어머니의 단일 틀과 대비되는 여러 역할.<\/li><li><code>diverse<\/code>(다양한) — varied와 거의 같은 뜻, 명확한 pair.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Unlike mainstream publications, which centered on images of women as mothers and housewives, Sepia, from its inception in the 1940s, depicted women in <b>varied<\/b> roles and often featured stories of African American career women and entertainers.<\/p>", "wrong": "<ul><li><code>powerful<\/code>(강력한) — 단일 vs 다양 논점이 아님. pair 없음.<\/li><li><code>unconventional<\/code>(관습에 얽매이지 않는) — 의미가 비슷해 보이나, \"다양함\"이 아니라 \"관습 이탈\"이라 정답 pair(varied/diverse)와 의미가 어긋남.<\/li><li><code>well-established<\/code>(확립된) — 주류 쪽 성격이라 정반대.<\/li><li><code>traditional<\/code>(전통적인) — \"어머니·주부\" 주류 쪽, 정반대.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>varied<\/td><td>adj.<\/td><td>다양한, 가지각색의<\/td><td>diverse, assorted<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>diverse<\/td><td>adj.<\/td><td>다양한<\/td><td>varied, manifold<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>unconventional<\/td><td>adj.<\/td><td>관습에 얽매이지 않는<\/td><td>unorthodox, atypical<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>traditional<\/td><td>adj.<\/td><td>전통적인<\/td><td>conventional, customary<\/td><td>(거만어 외) 오답 (주류 쪽)<\/td><\/tr><tr><td>inception<\/td><td>n.<\/td><td>시작, 발단<\/td><td>beginning, outset<\/td><td>(거만어 외) 본문<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q7": {"html": true, "interp": "<p>1964년, 여섯 번의 실패를 겪은 끝에 달에서 전송된 첫 사진을 마침내 받아 들었을 때, 공학자들은 평소의 점잖음을 벗어던지고 펄쩍 뛰며 환호했다.<\/p><p><b>해석 노트:<\/b> decorousness는 자리에 맞는 예의와 품위를 지키는 태도이므로 '점잖음'으로 옮겼고, in a departure from은 평소의 그 태도에서 이탈했다는 뜻이라 '벗어던지고'로 받아 뒤의 격한 행동과 대비시켰다. 다른 정답 sobriety(감정을 드러내지 않는 진중함)를 넣어도 같은 뜻이 된다. 영어의 긴 when절을 뒤에 그대로 두면 읽기 어려우므로 시간 정보를 문장 앞으로 당겨 한국어 어순으로 재배치했고, jumped and shouted in celebration은 두 동작을 '펄쩍 뛰며 환호했다'로 묶어 축하의 성격을 동사에 실었다.<\/p>", "strat": "<p>결정 신호는 역접전치사구 <b><code>In a departure from their customary …<\/code><\/b>(trigger-11)이다. \"departure from\"은 \"~에서 벗어나 / ~와는 달리\"라는 뜻으로, 빈칸(평소의 태도)과 실제 행동을 <b>대조<\/b>시킨다.<\/p><ul><li>실제 행동 = \"jumped and shouted in celebration\" = 감정을 격하게 표출하는 격정·흥분.<\/li><li>따라서 빈칸(평소 태도) = 그 반대, 즉 <b>절제되고 근엄하며 품위 있는 몸가짐<\/b>.<\/li><li>SE(동의어)이므로 이 뜻을 공유하는 <b>두 단어의 쌍<\/b>을 찾는다 → decorousness(품위·예의바름·절제된 태도)와 sobriety(근엄·진지·절제).<\/li><\/ul>", "correct": "<p><b>decorousness / sobriety<\/b><\/p><ul><li>두 단어 모두 \"격정을 드러내지 않는 절제되고 근엄·품위 있는 태도\"를 뜻해 동의어 쌍을 이루며, \"환호하며 뛰고 소리침\"이 그것에서의 이탈(departure)이라는 문맥에 정확히 맞는다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>In a departure from their customary <b>decorousness<\/b>, the engineers jumped and shouted in celebration when, after six failed attempts, they finally received the first photographs transmitted from the Moon in 1964.<\/p>", "wrong": "<ul><li><b>congeniality / gregariousness<\/b>: 둘은 서로 '사교성·붙임성'이라는 동의어 쌍을 이루지만, 뛰고 소리치며 환호하는 것은 오히려 <b>활달·사교적<\/b> 행동이므로 그것에서 \"벗어남\"이 성립하지 않는다(문맥 반대). 함정 쌍.<\/li><li><b>superciliousness<\/b>: '오만·거만'. 짝이 될 동의어가 없고 문맥과 무관.<\/li><li><b>facetiousness<\/b>: '경박·농담조'. 짝이 될 동의어가 없고, 환호가 '농담기에서 벗어난 것'이라 보기 어렵다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>decorousness<\/td><td>n.<\/td><td>품위·예의바름·절제된 몸가짐<\/td><td>propriety, sobriety, gravity<\/td><td>정답<\/td><\/tr><tr><td>sobriety<\/td><td>n.<\/td><td>근엄·진지·절제<\/td><td>seriousness, gravity, restraint<\/td><td>정답<\/td><\/tr><tr><td>gregariousness<\/td><td>n.<\/td><td>사교성·붙임성<\/td><td>congeniality, sociability<\/td><td>함정 동의어 쌍<\/td><\/tr><tr><td>congeniality<\/td><td>n.<\/td><td>상냥함·친화성<\/td><td>affability, geniality<\/td><td>함정 동의어 쌍<\/td><\/tr><tr><td>superciliousness<\/td><td>n.<\/td><td>오만·거만<\/td><td>haughtiness, disdain<\/td><td>짝 없음<\/td><\/tr><tr><td>facetiousness<\/td><td>n.<\/td><td>경박함·농담조<\/td><td>flippancy, jocularity<\/td><td>짝 없음<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q8": {"html": true, "interp": "<p>개인과 정부와 기업은 현재의 조건에 근거해 목표를 세워 놓고, 그 조건이 급격히 달라진 뒤에도 그 목표를 맹목적으로 따름으로써, 스스로 제 다리 힘줄을 끊어 놓는(hamstring) 능력만은 넉넉히 보여 준다.<\/p><p><b>해석 노트:<\/b> hamstring은 본래 오금의 힘줄을 끊어 걷지 못하게 만든다는 뜻이므로, \"약화시킨다\"로 뭉개지 않고 \"스스로 제 다리 힘줄을 끊어 놓는다\"로 그 신체적 비유를 살렸다. 다른 정답 impair를 넣어도 \"스스로를 무력하게 만든다\"는 같은 뜻이 되며, 다만 impair는 비유 없이 손상·저해라는 중립적 결로 읽힌다. ample ability는 칭찬이 아니라 반어이므로 \"능력만은 넉넉히\"로 옮겨 어조를 드러냈고, even when those conditions change drastically는 양보의 시간절로 보아 \"급격히 달라진 뒤에도\"로 앞당겨 읽어 문장 뒤끝이 무거워지지 않게 했다.<\/p>", "strat": "<p>빈칸 뒤 분사구가 빈칸의 의미를 설명한다(trigger-02 by ~ing = 수단). 목적어 themselves — 빈칸의 동작이 주어 자신에게 돌아온다. \"조건이 바뀌었는데도 옛 목표를 <em>맹목적으로<\/em> 고수\" → 스스로에게 <em>해를 입히는·발목 잡는<\/em> 행위. 따라서 빈칸은 <b>자해·약화<\/b>.<\/p><p>SE이므로 \"약화시키다·발목 잡다\"라는 의미축의 두 동사.<\/p>", "correct": "<ul><li><b>hamstring (무력화하다, 발목을 잡다)<\/b>: 변한 조건을 무시한 맹목적 고수 = 스스로 <em>옴짝달싹 못 하게<\/em> 함.<\/li><li><b>impair (손상시키다, 약화시키다)<\/b>: hamstring과 동의 — 자기 능력을 <em>깎아먹음<\/em>. pair.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Individuals, governments, and companies show ample ability to <b>hamstring<\/b> themselves by setting goals based on current conditions and then blindly following them even when those conditions change drastically.<\/p>", "wrong": "<ul><li><b>reinvent (재창조하다) / revitalize (활력을 되살리다) / invigorate (활기를 불어넣다)<\/b>: 모두 <em>긍정<\/em> — \"맹목적 고수로 자신을 해친다\"는 부정 흐름과 정반대. (이 셋은 서로 비슷하나 문맥 반대.)<\/li><li><b>promote (촉진하다)<\/b>: 역시 긍정 — 자해 맥락과 충돌.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>hamstring<\/td><td>v.<\/td><td>무력화하다, 발목 잡다<\/td><td>cripple, undermine<\/td><td>정답<\/td><\/tr><tr><td>impair<\/td><td>v.<\/td><td>손상·약화시키다<\/td><td>damage, weaken<\/td><td>정답·pair<\/td><\/tr><tr><td>invigorate<\/td><td>v.<\/td><td>활기를 불어넣다<\/td><td>energize, revitalize<\/td><td>오답 (반대)<\/td><\/tr><tr><td>reinvent<\/td><td>v.<\/td><td>재창조하다<\/td><td>overhaul, remake<\/td><td>(거만어 외) 오답 (반대)<\/td><\/tr><tr><td>blindly<\/td><td>adv.<\/td><td>맹목적으로<\/td><td>heedlessly<\/td><td>(거만어 외) 본문(자해 단서)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q9": {"html": true, "interp": "<p>귀는 눈보다 훨씬 더 분별력이 뛰어나다(discerning). 초당 30번 진동하는 음원과 초당 60번 진동하는 음원을 갈라낼 수 있는 것은 오직 귀뿐이기 때문이다.<\/p><p><b>해석 노트:<\/b> discerning을 '분별력이 뛰어나다'로 옮겨, 단순한 예민함이 아니라 미세한 차이를 가려내는 안목이라는 결을 살렸다. 콜론은 앞 명제의 근거를 대는 자리이므로 마침표로 끊고 '…때문이다'로 받아, 한 문장에 밀어 넣었을 때 생기는 늘어짐을 피했다. only the ear는 '…것은 오직 귀뿐'이라는 한국어 강조 구문으로 재구성해 원문의 배타적 강조를 보존했고, tell A from B는 '구별하다'의 관용 표현이므로 '갈라낸다'로 옮겼다. 다른 정답 accurate를 넣어도 '귀가 눈보다 훨씬 더 정밀하다'가 되어 같은 뜻이 된다.<\/p>", "strat": "<p><code>The ear is much more 빈칸 than the eye<\/code>에 <code>more 빈칸 than<\/code>(비교 대상 <code>the eye<\/code> 명시) 정규 비교 구문(trigger-15 — 귀↔눈 비교)이 있고, 콜론(<code>:<\/code>, trigger-05)이 빈칸(Zone 2)을 노골적으로 설명한다. 콜론 뒤 = \"<b>오직<\/b> 귀만이(only the ear) 미세하게 다른 두 진동수를 <b>구별해낸다<\/b>\". <code>only<\/code>(trigger-16)는 귀의 변별 능력을 강조한다. 즉 빈칸 = \"(미세한 차이를) <b>잘 분별하는 / 정밀한<\/b>\". SE이므로 이 방향의 두 단어를 고른다.<\/p>", "correct": "<p>discerning, accurate — \"분별력 있는 / 정밀한\". 콜론 뒤 \"30번과 60번 진동을 구별한다\"는 설명이 곧 \"더 잘 분별하고 더 정확하다\"의 예시다. 이 문제에서 두 단어는 사전적 동의어는 아니지만, 완성된 문장의 의미(\"귀가 더 미세하게 잘 가려낸다\")가 같아지는 SE 정답쌍이다.<\/p><p><b>완성 문장<\/b><\/p><p>The ear is much more <b>discerning<\/b> than the eye: only the ear can tell a source that oscillates 30 times a second from one that oscillates 60 times a second.<\/p>", "wrong": "<ul><li>stable: \"안정적인\". 변별력과 무관(근거 없음).<\/li><li>efficient: \"효율적인\". 속도·자원 축이지 \"미세 구별\" 축이 아님.<\/li><li>durable: \"내구성 있는\". 물리적 견고함 — 무관.<\/li><li>tenacious: \"끈질긴\". 지속성 축 — 무관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>discerning<\/td><td>adj.<\/td><td>분별력 있는, 안목 있는<\/td><td>perceptive, discriminating<\/td><td>정답. 거만어 discerning<\/td><\/tr><tr><td>accurate<\/td><td>adj.<\/td><td>정확한, 정밀한<\/td><td>precise, exact<\/td><td>정답. (거만어 외)<\/td><\/tr><tr><td>tenacious<\/td><td>adj.<\/td><td>끈질긴, 집요한<\/td><td>persistent, dogged<\/td><td>오답. 거만어 tenacious<\/td><\/tr><tr><td>durable<\/td><td>adj.<\/td><td>내구성 있는<\/td><td>sturdy, long-lasting<\/td><td>오답. (거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q10": {"html": true, "interp": "<p>1970년대 이후 샌프란시스코, 특히 미션 디스트릭트의 치카노 주민들 사이에서 일어난 벽화 부흥은, 그보다 40년쯤 앞서 멕시코와 미국에 있었던 사회적 사실주의(social realist) 선행 운동과는 뚜렷이 다르다. 오늘날의 벽화 운동은 정부의 후원을 받거나 관공서 건물 벽화에 국한되지 않고 사람들 자신에게서 비롯되어, 지역사회 건물과 대학 캠퍼스 곳곳에 벽화가 등장했다. 그러나 아마 가장 큰 차이는 만들어지는 과정일 것이다. 20세기 전반 멕시코에서 벽화는 개별 예술가의 구상에서 나왔다. 그러나 오늘날의 벽화는 대체로 예술가가 지역 주민과 함께 도안하고 제작한 결과물이다.<\/p><p>이런 공동체 참여는 치카노 예술 운동 전반의 특징인데, 이 운동은 1960년대 중반 치카노 시민권 운동과 같은 토대에서 자라났다. 둘 다 적절한 교육, 정치적 권한, 온당한 노동 조건에 대한 권리를 얻으려 싸우던 미국 내 치카노들의 요구에 직접 응답한 것이었다. 예술가들은 다른 문화 활동가들과 함께 정치적 발언을 했고, 그 발언을 대중에게 전하는 데 핵심 역할을 했다. 그들은 집단(collective)을 꾸리고, 치카노 사회정치 운동의 홍보 창구 역할을 하는 <b>문화센터<\/b>를 세웠다.<\/p>", "strat": "<p><b>질문 1 — 유형 RC-01<\/b><\/p><ul><li><b>주제 문장 = S6<\/b> — 둘째 단락 첫 문장. 첫 단락이 짚은 차이(특히 주민과 함께하는 창작)를 Such로 받아 치카노 예술 운동 전체와 그 역사적 뿌리로 넓히고, S7~S9가 그 맥락을 풀어 준다.<\/li><li><b>1단락<\/b>: 현대 벽화 부흥을 40년 전 선구자와 <b>대비<\/b>(후원 주체·장소·창작 과정의 차이).<\/li><li><b>2단락<\/b>: 그 공동체 참여를 치카노 예술 운동 전반·시민권 운동의 맥락에 놓고, 문화센터의 역할 설명.<\/li><li>저자 태도: 설명적·역사적 맥락화.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (E)<\/b>: 글은 벽화 부흥(예술 운동)을 그 <b>역사적 맥락<\/b>(선구자와의 대비 + 치카노 시민권 운동과의 연계)에 위치시킨다 → \"한 예술 운동을 그 역사적 맥락 속에 놓는다.\"<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A(한 양식의 우월성 주장) — 우열을 논하지 않고 차이·맥락을 설명.<\/li><li>B(예술 운동의 영향 고찰) — 영향보다 기원·맥락이 초점.<\/li><li>C(특정 작품의 정치적 내용 기술) — 개별 작품 분석이 아님.<\/li><li>D(양식의 특징 상술) — 양식보다 운동의 사회·역사적 성격이 중심.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>mural<\/td><td>n.<\/td><td>벽화<\/td><td>wall painting, fresco<\/td><td>(거만어 외) 본문 핵심<\/td><\/tr><tr><td>revival<\/td><td>n.<\/td><td>부흥, 부활<\/td><td>renaissance, resurgence<\/td><td>(거만어 외) 본문 \"mural revival\"<\/td><\/tr><tr><td>forerunner<\/td><td>n.<\/td><td>선구자, 전신<\/td><td>precursor, antecedent<\/td><td>(거만어 외) 본문 \"social realist forerunner\"<\/td><\/tr><tr><td>collective<\/td><td>n.<\/td><td>(협동) 집단, 공동체<\/td><td>cooperative, commune<\/td><td>(거만어 외) 본문 \"developed collectives\"<\/td><\/tr><tr><td>empowerment<\/td><td>n.<\/td><td>권한 부여, 역량 강화<\/td><td>enablement<\/td><td>(거만어 외) 본문 \"political empowerment\"<\/td><\/tr><tr><td>sponsor<\/td><td>v.<\/td><td>후원하다<\/td><td>fund, back<\/td><td>(거만어 외) 본문 \"government sponsored\"<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q11": {"html": true, "interp": "<p>1970년대 이후 샌프란시스코, 특히 미션 디스트릭트의 치카노 주민들 사이에서 일어난 벽화 부흥은, 그보다 40년쯤 앞서 멕시코와 미국에 있었던 사회적 사실주의(social realist) 선행 운동과는 뚜렷이 다르다. 오늘날의 벽화 운동은 정부의 후원을 받거나 관공서 건물 벽화에 국한되지 않고 사람들 자신에게서 비롯되어, 지역사회 건물과 대학 캠퍼스 곳곳에 벽화가 등장했다. 그러나 아마 가장 큰 차이는 만들어지는 과정일 것이다. 20세기 전반 멕시코에서 벽화는 개별 예술가의 구상에서 나왔다. 그러나 오늘날의 벽화는 대체로 예술가가 지역 주민과 함께 도안하고 제작한 결과물이다.<\/p><p>이런 공동체 참여는 치카노 예술 운동 전반의 특징인데, 이 운동은 1960년대 중반 치카노 시민권 운동과 같은 토대에서 자라났다. 둘 다 적절한 교육, 정치적 권한, 온당한 노동 조건에 대한 권리를 얻으려 싸우던 미국 내 치카노들의 요구에 직접 응답한 것이었다. 예술가들은 다른 문화 활동가들과 함께 정치적 발언을 했고, 그 발언을 대중에게 전하는 데 핵심 역할을 했다. 그들은 집단(collective)을 꾸리고, 치카노 사회정치 운동의 홍보 창구 역할을 하는 <b>문화센터<\/b>를 세웠다.<\/p>", "strat": "<p><b>질문 2 — 유형 RC-06<\/b><\/p><ul><li><b>주제 문장 = S6<\/b> — 둘째 단락 첫 문장. 첫 단락이 짚은 차이(특히 주민과 함께하는 창작)를 Such로 받아 치카노 예술 운동 전체와 그 역사적 뿌리로 넓히고, S7~S9가 그 맥락을 풀어 준다.<\/li><li><b>1단락<\/b>: 현대 벽화 부흥을 40년 전 선구자와 <b>대비<\/b>(후원 주체·장소·창작 과정의 차이).<\/li><li><b>2단락<\/b>: 그 공동체 참여를 치카노 예술 운동 전반·시민권 운동의 맥락에 놓고, 문화센터의 역할 설명.<\/li><li>저자 태도: 설명적·역사적 맥락화.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (E)<\/b>: 문화센터는 \"예술가들이 세웠고(established)\", \"치카노 사회정치 운동의 홍보 부문 역할\"을 했다 → \"예술가가 설립했고 치카노 시민권 운동을 지원했다\" → E. 본문 직접 진술.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A(후일 지도자들이 처음 정치 활동한 장소) — 근거 없음.<\/li><li>B(샌프란시스코 지역에서 기원) — 벽화는 샌프란시스코지만 문화센터의 발상지가 거기라는 언급은 없음.<\/li><li>C(처음엔 미술 교육 중심의 비정치적 목표) — 본문은 처음부터 정치적 역할(홍보 부문)을 말함. 정반대.<\/li><li>D(시민권 운동이 거기서 발원) — 둘은 \"같은 토대에서 진화\"했지, 문화센터가 시민권 운동의 발원 핵이라고 하지 않음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>mural<\/td><td>n.<\/td><td>벽화<\/td><td>wall painting, fresco<\/td><td>(거만어 외) 본문 핵심<\/td><\/tr><tr><td>revival<\/td><td>n.<\/td><td>부흥, 부활<\/td><td>renaissance, resurgence<\/td><td>(거만어 외) 본문 \"mural revival\"<\/td><\/tr><tr><td>forerunner<\/td><td>n.<\/td><td>선구자, 전신<\/td><td>precursor, antecedent<\/td><td>(거만어 외) 본문 \"social realist forerunner\"<\/td><\/tr><tr><td>collective<\/td><td>n.<\/td><td>(협동) 집단, 공동체<\/td><td>cooperative, commune<\/td><td>(거만어 외) 본문 \"developed collectives\"<\/td><\/tr><tr><td>empowerment<\/td><td>n.<\/td><td>권한 부여, 역량 강화<\/td><td>enablement<\/td><td>(거만어 외) 본문 \"political empowerment\"<\/td><\/tr><tr><td>sponsor<\/td><td>v.<\/td><td>후원하다<\/td><td>fund, back<\/td><td>(거만어 외) 본문 \"government sponsored\"<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q12": {"html": true, "interp": "<p>1970년대 이후 샌프란시스코, 특히 미션 디스트릭트의 치카노 주민들 사이에서 일어난 벽화 부흥은, 그보다 40년쯤 앞서 멕시코와 미국에 있었던 사회적 사실주의(social realist) 선행 운동과는 뚜렷이 다르다. 오늘날의 벽화 운동은 정부의 후원을 받거나 관공서 건물 벽화에 국한되지 않고 사람들 자신에게서 비롯되어, 지역사회 건물과 대학 캠퍼스 곳곳에 벽화가 등장했다. 그러나 아마 가장 큰 차이는 만들어지는 과정일 것이다. 20세기 전반 멕시코에서 벽화는 개별 예술가의 구상에서 나왔다. 그러나 오늘날의 벽화는 대체로 예술가가 지역 주민과 함께 도안하고 제작한 결과물이다.<\/p><p>이런 공동체 참여는 치카노 예술 운동 전반의 특징인데, 이 운동은 1960년대 중반 치카노 시민권 운동과 같은 토대에서 자라났다. 둘 다 적절한 교육, 정치적 권한, 온당한 노동 조건에 대한 권리를 얻으려 싸우던 미국 내 치카노들의 요구에 직접 응답한 것이었다. 예술가들은 다른 문화 활동가들과 함께 정치적 발언을 했고, 그 발언을 대중에게 전하는 데 핵심 역할을 했다. 그들은 집단(collective)을 꾸리고, 치카노 사회정치 운동의 홍보 창구 역할을 하는 <b>문화센터<\/b>를 세웠다.<\/p>", "strat": "<p><b>질문 3 — 유형 RC-07<\/b><\/p><ul><li><b>주제 문장 = S6<\/b> — 둘째 단락 첫 문장. 첫 단락이 짚은 차이(특히 주민과 함께하는 창작)를 Such로 받아 치카노 예술 운동 전체와 그 역사적 뿌리로 넓히고, S7~S9가 그 맥락을 풀어 준다.<\/li><li><b>1단락<\/b>: 현대 벽화 부흥을 40년 전 선구자와 <b>대비<\/b>(후원 주체·장소·창작 과정의 차이).<\/li><li><b>2단락<\/b>: 그 공동체 참여를 치카노 예술 운동 전반·시민권 운동의 맥락에 놓고, 문화센터의 역할 설명.<\/li><li>저자 태도: 설명적·역사적 맥락화.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거 (B)<\/b>: 1단락은 벽화 부흥을 <b>이전 예술 운동(선구자)과 비교<\/b>하고, 2단락은 그 부흥과 <b>동시대 맥락<\/b>(치카노 운동)을 기술한다 → B.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A(1단락=개인 예술가, 2단락=집단 행동) — 1단락은 개인 vs 공동체 과정을 대비할 뿐, \"개인으로서의 예술가\"에 초점이 아님. 부분적·부정확.<\/li><li>C(둘 다의 정치적 목표를 다룸) — 2단락은 부흥의 맥락을 다루지 \"선구자의 정치 목표\"까지 다루진 않음.<\/li><li>D(그럴듯한 설명 제시 후 의문 제기) — 2단락이 1단락을 반박하지 않음.<\/li><li>E(1=예술적 목표, 2=정치적 의의) — 1단락은 예술적 야망이 아니라 선구자와의 차이를 다룸. 부정확.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>mural<\/td><td>n.<\/td><td>벽화<\/td><td>wall painting, fresco<\/td><td>(거만어 외) 본문 핵심<\/td><\/tr><tr><td>revival<\/td><td>n.<\/td><td>부흥, 부활<\/td><td>renaissance, resurgence<\/td><td>(거만어 외) 본문 \"mural revival\"<\/td><\/tr><tr><td>forerunner<\/td><td>n.<\/td><td>선구자, 전신<\/td><td>precursor, antecedent<\/td><td>(거만어 외) 본문 \"social realist forerunner\"<\/td><\/tr><tr><td>collective<\/td><td>n.<\/td><td>(협동) 집단, 공동체<\/td><td>cooperative, commune<\/td><td>(거만어 외) 본문 \"developed collectives\"<\/td><\/tr><tr><td>empowerment<\/td><td>n.<\/td><td>권한 부여, 역량 강화<\/td><td>enablement<\/td><td>(거만어 외) 본문 \"political empowerment\"<\/td><\/tr><tr><td>sponsor<\/td><td>v.<\/td><td>후원하다<\/td><td>fund, back<\/td><td>(거만어 외) 본문 \"government sponsored\"<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q1": {"html": true, "interp": "<p>배기가스를 줄이는 촉매 변환기(catalytic converter)의 구성 요소로서 지니는 중요성 덕분에, 백금과 팔라듐, 로듐은 모두 대기오염과의 싸움에서 든든한 방벽이 되었다.<\/p><p><b>해석 노트:<\/b> bulwark는 성벽의 '보루'에서 온 말로 '막아 주는 것'이라는 그림이 살아 있어 '방벽'으로 옮기고, <code>have all become<\/code>의 완료가 주는 안착감을 '든든한'으로 받았다. <code>the fight against air pollution<\/code>은 '대기오염과의 싸움'으로 직역해 원문의 전투 은유를 살렸다 — 이 은유가 곧 정답의 근거이므로 흐리면 안 된다. Thanks to는 '덕분에'로 살려 긍정적 어조를 유지했고, 관계절 that reduce vehicle emissions는 뒤에서 풀면 늘어지므로 '배기가스를 줄이는'으로 앞으로 당겨 수식했다.<\/p>", "strat": "<p><code>Thanks to<\/code>가 만드는 <b>인과<\/b>가 전부다(trigger-02 — 근거→결론, 앞뒤가 같은 방향).<\/p><ul><li><b>근거<\/b>: 세 금속이 배기가스를 <em>줄이는<\/em> 촉매 변환기의 <b>중요한 부품<\/b>이다.<\/li><li><b>결론<\/b>: 그래서 대기오염과의 싸움에서 […]이 되었다.<\/li><\/ul><p>빈칸은 <code>have all become<\/code>의 <b>주격보어<\/b>이고, 뒤의 <code>in the fight against air pollution<\/code>이 그 보어와 <b>한 덩어리<\/b>를 이룬다. 이 구조가 답을 가른다 — <code>in the fight against ~<\/code>는 <b>그 싸움에서 무슨 역할을 하는가<\/b>를 묻지, 무슨 부류인가를 묻지 않는다. 즉 빈칸에는 <b>역할어<\/b>가 와야 한다.<\/p><p><code>fight<\/code>(싸움)라는 전투 은유 안에서 오염을 막아 주는 것 = <b>방벽·보루<\/b>. → <code>bulwarks<\/code>.<\/p>", "correct": "<ul><li><b>bulwarks(방벽, 보루)<\/b> — <code>fight<\/code>가 깔아 놓은 전투 은유 안에서 오염을 <b>막아 주는 역할<\/b>. <code>bulwark against ~<\/code>는 사전 표제 연어다(예문: <code>a bulwark against the breakdown of society<\/code>). 근거가 \"배기가스를 <em>줄이는<\/em> 부품\"이라는 <b>기능<\/b>이므로 결론도 <b>기능<\/b>으로 받아야 인과가 맞물린다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Thanks to their importance as components in the catalytic converters that reduce vehicle emissions, platinum, palladium, and rhodium have all become <b>bulwarks<\/b> in the fight against air pollution.<\/p>", "wrong": "<ul><li><b>paradigms(전형, 모범)<\/b> ★가장 매력적인 함정 — 긍정 방향이라 함정 3개를 걸러낸 뒤 손이 가기 쉽다. 그러나 <b>방향이 맞다고 답이 되는 게 아니라 들어갈 자리가 맞아야 한다.<\/b><\/li><li><b>전치사가 안 맞는다<\/b>: '전형'이라면 <code>paradigms <b>of<\/b> pollution control<\/code>이어야 자연스럽다. 원문은 <code><b>in<\/b> the fight against<\/code> — 투쟁 안에서의 <em>역할<\/em>을 요구하는 자리다.<\/li><li><b>본보기가 될 수 없다<\/b>: paradigm은 남들이 모방·추종할 <b>본보기<\/b>여야 성립한다. 백금·팔라듐·로듐은 화학 원소라 다른 금속이 이들을 본받을 수 없다. (<code>촉매변환기 기술<\/code>이라면 패러다임이 될 수 있으나 주어는 기술이 아니라 금속이다.)<\/li><li><b>범주어 vs 역할어<\/b>: paradigm은 \"무슨 부류인가\"(범주), bulwark는 \"무슨 일을 하는가\"(역할). 빈칸이 부르는 것은 역할이다.<\/li><li><b>aberrations(일탈, 비정상)·novelties(신기한 것)·exceptions(예외)<\/b> — 셋 다 \"이례적·희귀\"라는 <b>한 축에 몰린 함정 무리<\/b>. <code>Thanks to their <b>importance<\/b><\/code>가 만드는 긍정·보편 방향과 정반대라 한 묶음으로 떨어진다. 어조를 오독한 학생을 잡으려는 배치.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>bulwark<\/td><t
