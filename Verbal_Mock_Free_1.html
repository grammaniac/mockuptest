 지문은 직접 발생이 \"가혹한 환경 조건에서 <b>흔하다(common)<\/b>\"고 한다. 정반대.<\/li><li>C(거의 즉시 먹이를 찾기 시작한다) — 부화 후 섭식 행동에 대한 언급은 없다. 근거 없음.<\/li><li>D(빠르게 일련의 <b>유생 단계를 거친다<\/b>) — 직접 발생은 유생 단계를 <b>건너뛴다<\/b>. 정반대.<\/li><li>E(다른 유형의 부화체보다 <b>더 많은 보호가 필요하다<\/b>) — 완전히 장비를 갖춰 부화하므로, 오히려 보호 필요가 덜하다는 방향이다. 근거 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>hospitable<\/td><td>형<\/td><td>(조건이) 우호적인, 알맞은<\/td><td>favorable, conducive<\/td><td>거만어. hospitable time to evolve<\/td><\/tr><tr><td>forage<\/td><td>동<\/td><td>먹이를 찾다, 뒤지다<\/td><td>scavenge, hunt for food<\/td><td>거만어. 오답 C의 \"forage\"<\/td><\/tr><tr><td>hatchling<\/td><td>명<\/td><td>갓 부화한 새끼<\/td><td>newborn<\/td><td>(거만어 외) 직접 발생의 산물<\/td><\/tr><tr><td>juvenile<\/td><td>형/명<\/td><td>유생의; 어린 것<\/td><td>immature, larval<\/td><td>(거만어 외) juvenile stages<\/td><\/tr><tr><td>embryo<\/td><td>명<\/td><td>배아<\/td><td>germ<\/td><td>(거만어 외) embryos resemble adults<\/td><\/tr><tr><td>resemblance<\/td><td>명<\/td><td>닮음, 유사성<\/td><td>likeness, similarity<\/td><td>(거만어 외) 정답 A의 근거<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q6": {"html": true, "interp": "<p><b>캄브리아 폭발(Cambrian explosion)<\/b>은 대부분의 주요 동물문(門)이 단단한 외부 구조를 갖추게 된, 비교적 짧은 진화적 사건이다. 이에 대해 제안된 한 설명은 캄브리아기가 단지 동물이 진화하기에 우호적인(hospitable) 시기였다는 것이다. 그러나 최근 발견들은 캄브리아기 해파리와 강모충(bristle worm)의 알이 그 조상들의 알보다 크다는 것을 보여 준다. 이 점과 <b>배아가 성체 형태와 매우 닮았다는 점<\/b>은, 이들이 일련의 유생(juvenile) 단계를 거치지 않고 <b>환경에 곧바로 나설 채비를 온전히 갖춘 채 부화<\/b>했다는 단서다. <b>직접 발생(direct development)<\/b>으로 알려진 이 전략은 가혹한 환경 조건에서 흔하지만, 고도로 발달한 상태로 부화한 새끼는 부모에게 큰 에너지 비용을 지우기 때문에 통상적인 발생 방법은 아니다.<\/p>", "strat": "<p><b>질문 2 — 주제·목적<\/b><\/p><p><b>주제 문장 = S4<\/b> «This strategy, known as direct development, is common under harsh environmental conditions but is not the usual method of development because a highly developed hatchling comes with a high energy cost to its parent.» — 논박 구조의 글이다(설명문이 아니다).<\/p><ul><li><b>S1(논박 대상)<\/b>: 캄브리아 폭발에 대한 한 설명 — «그 시기가 그저 동물이 진화하기 좋은(hospitable) 때였다».<\/li><li><b>S2(However, 증거)<\/b>: 최근 발견 — 캄브리아기 해파리·갯지렁이의 알이 조상보다 크다.<\/li><li><b>S3(해석)<\/b>: 큰 알 + 성체를 닮은 배아 = 유생 단계를 건너뛰고 완전히 갖춰 부화하는 <b>직접 발생<\/b>의 단서.<\/li><li><b>S4(논박 = 주제)<\/b>: 직접 발생은 <b>가혹한 환경에서 흔한<\/b> 전략이고, 비용이 커서 통상적 방식은 아니다 → 캄브리아기가 «살기 좋은 때»였다는 설명과 어긋난다. 질문 2(주제·목적)의 답 D «설명의 타당성에 의문 제기»가 여기서 나온다.<\/li><\/ul><p>S2·S3만으로는 «우호적 시기» 설명과 충돌하지 않고, S4에 이르러서야 논박이 완성된다 — 마지막 문장이 주제인 예외 사례. S4의 «but is not the usual method»는 문장 안 양보 대비다.<\/p><ul><li><b>구조의 이름 — 논박 대상 → 그러나 근거(Fact) → 전제(assumption) → 결론<\/b>: S1 논박 대상 → S2 However에서 Fact(증거) → S3에서 그 해석(= 전제, assumption) → S4에서 첫 문장을 뒤집는 결론. 이 «논박 대상·그러나 근거·전제·결론» 구조는 주로 CR에서 보이는 구조이며, 이 구조에서는 마지막 문장(결론)이 전체 주제가 된다.<\/li><\/ul>", "correct": "<ul><li><b>★해법<\/b>: 주제 문장 중심으로 요약한다. 첫 문장(논박 대상: 살기 좋은 시기였다) → 둘째 문장 However 증거 → 셋째 문장 해석 → 넷째 문장 결론(직접 발생은 «가혹한 환경에서 흔한» 전략)으로 이어지는 논박 구조이므로, 마지막 문장 넷째 문장이 주제다. «한 설명을 반박한다»는 목적에 가장 가까운 보기를 고른다.<\/li><li><b>정답 D<\/b> — \"어떤 현상에 대한 <b>설명의 타당성에 의문을 제기<\/b>한다.\"<\/li><li><b>정답 근거<\/b>: 지문은 캄브리아 폭발의 한 설명(\"단지 동물이 진화하기에 우호적인 시기였다\") 을 세운 뒤, \"<b>However<\/b>, recent discoveries indicate…\"로 직접 발생(direct development)의 단서를 들어 그 설명을 흔든다. 즉 하나의 현상(캄브리아 폭발)에 대한 <b>설명의 타당성을 의심<\/b>하는 것이 글의 목적이다. D. 풀이 절차: 주된 목적은 <b>주제 문장(S4) 중심으로 요약<\/b>한다 — S1 남의 설명(논박 대상) → S2 However에서 Fact(증거) → S3 해석(= 전제, assumption) → S4 결론이 첫 문장을 뒤집는다. 이 구조가 곧 목적이므로 «설명의 타당성에 의문 제기»(D)다.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: A(사건을 설명할 <b>새 이론을 도입<\/b>) — 저자는 대안 이론을 제시하기보다 기존 설명에 의문을 던진다. B(기존 가설을 뒷받침할 <b>새 증거를 제공<\/b>) — 오히려 반대 방향. C(자연에서 관찰되는 <b>발달 전략을 기술<\/b>) — 직접 발생 설명은 논지를 위한 수단이지 글의 주목적이 아니다. E(새 가설을 지지하는 <b>증거를 반박<\/b>) — 새 가설을 반박하는 구도가 아니다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>hospitable<\/td><td>형<\/td><td>(조건이) 우호적인, 알맞은<\/td><td>favorable, conducive<\/td><td>거만어. hospitable time to evolve<\/td><\/tr><tr><td>forage<\/td><td>동<\/td><td>먹이를 찾다, 뒤지다<\/td><td>scavenge, hunt for food<\/td><td>거만어. 오답 C의 \"forage\"<\/td><\/tr><tr><td>hatchling<\/td><td>명<\/td><td>갓 부화한 새끼<\/td><td>newborn<\/td><td>(거만어 외) 직접 발생의 산물<\/td><\/tr><tr><td>juvenile<\/td><td>형/명<\/td><td>유생의; 어린 것<\/td><td>immature, larval<\/td><td>(거만어 외) juvenile stages<\/td><\/tr><tr><td>embryo<\/td><td>명<\/td><td>배아<\/td><td>germ<\/td><td>(거만어 외) embryos resemble adults<\/td><\/tr><tr><td>resemblance<\/td><td>명<\/td><td>닮음, 유사성<\/td><td>likeness, similarity<\/td><td>(거만어 외) 정답 A의 근거<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q7": {"html": true, "interp": "<p>게일 존스(Gayl Jones)의 소설은 상당한 비평적 주목을 받았지만, 비교적 조용하되 만만찮은(formidable) 그녀의 시(poetry) 전집(corpus)은 학자들에게 사실상 무시되어 왔다. 의미심장하게도, 존스가 처음 발표한 글은 운문(verse)이었고, 1969년부터 1980년대 초까지 내놓은 작품에는 단편소설과 거의 맞먹는 수의 시가 들어 있다 — 시에 대한 관심이 초창기부터 일관되게 이어졌음을 무심코 드러내는 대목이다. 존스가 시인으로서 비평적 인정을 못 받은 것은 적어도 부분적으로 <em>장르 경계와 예술가 정체성에 대해 기록으로 남아 있는 그녀 자신의 양가성(ambivalence)<\/em>에 기인한다: \"나는 나를 시인으로 여긴 적이 없다. 내가 시라 부르는 것을 써 왔지만 늘 나 자신을 일차적으로 <em>소설가<\/em>로 생각했고, 그래서 <em>이야기꾼의 관점과 관심<\/em>에서 시를 쓴다.\" 이 자기 개념화와 일관되게, 다른 시인의 작품에 대한 존스의 비평적 관찰은 흔히 <em>전통적으로 소설 창작과 결부되어 온 기법<\/em>에 초점을 맞춘다. 서사와 그것을 풀어내는 방식이 운율(prosody)·형식 같은 여러 시적 관습보다 대체로 더 무겁게 다뤄지는 것으로 보인다. 스털링 브라운(Sterling Brown)의 작품을 평하며 존스는 <em>시에서 자신이 주로 끌리는 것의 체크리스트<\/em>를 제시한다: 인물 묘사와 서사적 목소리가 전경화(foregrounded)되고, 극적 형식·장면 같은 소설의 구조적 관심이 뒤따르는데, 이 모두가 합쳐져 효과적 <em>스토리텔링의 시학<\/em>을 세우는 데 일차적 관심을 둔 감수성을 드러낸다.<\/p>", "strat": "<p><b>질문 1 — 유형 RC-06<\/b><\/p><ul><li>핵심: 존스의 시는 무시됨 → 부분 원인 = 그녀 <em>스스로<\/em> \"나는 소설가\"라 규정(장르 양가성).<\/li><li>그녀의 시 비평·취향이 모두 <em>서사·스토리텔링<\/em> 중심 → 시를 <em>이야기꾼의 시선<\/em>으로 봄.<\/li><\/ul>", "correct": "<ul><li>신호: <code>According to the passage, the \"checklist\" provides a record of which<\/code>(질문) → 내용 파악(→RC-06).<\/li><li><b>정답 E<\/b>: 체크리스트 = \"<em>시에서 존스가 주로 끌리는 것<\/em>\"(인물·서사 목소리 등). \"The qualities in poetry that most interest Jones.\" 본문 직접.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(<em>브라운 시의 고유한<\/em> 특징 — 브라운 고유가 아니라 <em>존스의 취향<\/em>) / B(시와 소설을 <em>구별하는<\/em> 기법 — 구별이 아니라 끌리는 요소) / C(자신을 다른 시인과 <em>구별하려는 노력<\/em> — 아님) / D(존스가 브라운에게 준 <em>영향<\/em> — 아님).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>formidable<\/td><td>adj.<\/td><td>만만찮은, 가공할<\/td><td>impressive, daunting<\/td><td>본문<\/td><\/tr><tr><td>corpus<\/td><td>n.<\/td><td>(작품) 전집, 집성<\/td><td>body of work<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>ambivalence<\/td><td>n.<\/td><td>양가감정, 모순된 태도<\/td><td>uncertainty, equivocation<\/td><td>(거만어 외) 본문(원인)<\/td><\/tr><tr><td>prosody<\/td><td>n.<\/td><td>운율(법), 작시법<\/td><td>metrics, versification<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>foreground<\/td><td>v.<\/td><td>전경화하다, 부각하다<\/td><td>emphasize, highlight<\/td><td>본문<\/td><\/tr><tr><td>render<\/td><td>v.<\/td><td>표현하다, ~로 만들다<\/td><td>depict, represent<\/td><td>본문(its rendering)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q8": {"html": true, "interp": "<p>게일 존스(Gayl Jones)의 소설은 상당한 비평적 주목을 받았지만, 비교적 조용하되 만만찮은(formidable) 그녀의 시(poetry) 전집(corpus)은 학자들에게 사실상 무시되어 왔다. 의미심장하게도, 존스가 처음 발표한 글은 운문(verse)이었고, 1969년부터 1980년대 초까지 내놓은 작품에는 단편소설과 거의 맞먹는 수의 시가 들어 있다 — 시에 대한 관심이 초창기부터 일관되게 이어졌음을 무심코 드러내는 대목이다. 존스가 시인으로서 비평적 인정을 못 받은 것은 적어도 부분적으로 <em>장르 경계와 예술가 정체성에 대해 기록으로 남아 있는 그녀 자신의 양가성(ambivalence)<\/em>에 기인한다: \"나는 나를 시인으로 여긴 적이 없다. 내가 시라 부르는 것을 써 왔지만 늘 나 자신을 일차적으로 <em>소설가<\/em>로 생각했고, 그래서 <em>이야기꾼의 관점과 관심<\/em>에서 시를 쓴다.\" 이 자기 개념화와 일관되게, 다른 시인의 작품에 대한 존스의 비평적 관찰은 흔히 <em>전통적으로 소설 창작과 결부되어 온 기법<\/em>에 초점을 맞춘다. 서사와 그것을 풀어내는 방식이 운율(prosody)·형식 같은 여러 시적 관습보다 대체로 더 무겁게 다뤄지는 것으로 보인다. 스털링 브라운(Sterling Brown)의 작품을 평하며 존스는 <em>시에서 자신이 주로 끌리는 것의 체크리스트<\/em>를 제시한다: 인물 묘사와 서사적 목소리가 전경화(foregrounded)되고, 극적 형식·장면 같은 소설의 구조적 관심이 뒤따르는데, 이 모두가 합쳐져 효과적 <em>스토리텔링의 시학<\/em>을 세우는 데 일차적 관심을 둔 감수성을 드러낸다.<\/p>", "strat": "<p><b>질문 2 — 유형 RC-02<\/b><\/p><ul><li>핵심: 존스의 시는 무시됨 → 부분 원인 = 그녀 <em>스스로<\/em> \"나는 소설가\"라 규정(장르 양가성).<\/li><li>그녀의 시 비평·취향이 모두 <em>서사·스토리텔링<\/em> 중심 → 시를 <em>이야기꾼의 시선<\/em>으로 봄.<\/li><\/ul>", "correct": "<ul><li>신호: <code>Which of the following can be inferred … regarding the nature of Jones's poetry<\/code>(질문) → 추론.<\/li><li><b>정답 A<\/b>: 존스는 \"이야기꾼의 관점·관심에서 시를 쓴다\"고 직접 말함 → 그녀의 시는 <em>이야기꾼이라는 자기 정체성을 반영<\/em>한다. \"reflects her self-identification as a teller of stories.\" 비약 없음.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: B(시가 그녀의 시 <em>비평보다 더 단정적<\/em> — 근거 없음) / C(<em>실제 시보다 스토리텔링으로 더 호평<\/em> — 본문은 그녀 시가 <em>무시됐다<\/em>고 함, 호평 비교 근거 없음) / D(극적 형식·장면을 <em>전례 없이<\/em> 사용 — 근거 없음; 그건 브라운 평의 체크리스트 항목) / E(서사 목소리에 대한 관심이 <em>그 시기 대부분 소설보다 크다<\/em> — 비교 근거 없음).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>formidable<\/td><td>adj.<\/td><td>만만찮은, 가공할<\/td><td>impressive, daunting<\/td><td>본문<\/td><\/tr><tr><td>corpus<\/td><td>n.<\/td><td>(작품) 전집, 집성<\/td><td>body of work<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>ambivalence<\/td><td>n.<\/td><td>양가감정, 모순된 태도<\/td><td>uncertainty, equivocation<\/td><td>(거만어 외) 본문(원인)<\/td><\/tr><tr><td>prosody<\/td><td>n.<\/td><td>운율(법), 작시법<\/td><td>metrics, versification<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>foreground<\/td><td>v.<\/td><td>전경화하다, 부각하다<\/td><td>emphasize, highlight<\/td><td>본문<\/td><\/tr><tr><td>render<\/td><td>v.<\/td><td>표현하다, ~로 만들다<\/td><td>depict, represent<\/td><td>본문(its rendering)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q9": {"html": true, "interp": "<p>게일 존스(Gayl Jones)의 소설은 상당한 비평적 주목을 받았지만, 비교적 조용하되 만만찮은(formidable) 그녀의 시(poetry) 전집(corpus)은 학자들에게 사실상 무시되어 왔다. 의미심장하게도, 존스가 처음 발표한 글은 운문(verse)이었고, 1969년부터 1980년대 초까지 내놓은 작품에는 단편소설과 거의 맞먹는 수의 시가 들어 있다 — 시에 대한 관심이 초창기부터 일관되게 이어졌음을 무심코 드러내는 대목이다. 존스가 시인으로서 비평적 인정을 못 받은 것은 적어도 부분적으로 <em>장르 경계와 예술가 정체성에 대해 기록으로 남아 있는 그녀 자신의 양가성(ambivalence)<\/em>에 기인한다: \"나는 나를 시인으로 여긴 적이 없다. 내가 시라 부르는 것을 써 왔지만 늘 나 자신을 일차적으로 <em>소설가<\/em>로 생각했고, 그래서 <em>이야기꾼의 관점과 관심<\/em>에서 시를 쓴다.\" 이 자기 개념화와 일관되게, 다른 시인의 작품에 대한 존스의 비평적 관찰은 흔히 <em>전통적으로 소설 창작과 결부되어 온 기법<\/em>에 초점을 맞춘다. 서사와 그것을 풀어내는 방식이 운율(prosody)·형식 같은 여러 시적 관습보다 대체로 더 무겁게 다뤄지는 것으로 보인다. 스털링 브라운(Sterling Brown)의 작품을 평하며 존스는 <em>시에서 자신이 주로 끌리는 것의 체크리스트<\/em>를 제시한다: 인물 묘사와 서사적 목소리가 전경화(foregrounded)되고, 극적 형식·장면 같은 소설의 구조적 관심이 뒤따르는데, 이 모두가 합쳐져 효과적 <em>스토리텔링의 시학<\/em>을 세우는 데 일차적 관심을 둔 감수성을 드러낸다.<\/p>", "strat": "<p><b>질문 3 — 유형 RC-02<\/b><\/p><ul><li>핵심: 존스의 시는 무시됨 → 부분 원인 = 그녀 <em>스스로<\/em> \"나는 소설가\"라 규정(장르 양가성).<\/li><li>그녀의 시 비평·취향이 모두 <em>서사·스토리텔링<\/em> 중심 → 시를 <em>이야기꾼의 시선<\/em>으로 봄.<\/li><\/ul>", "correct": "<ul><li>신호: <code>The passage suggests which … regarding critics of Jones's work<\/code>(질문) → 추론.<\/li><li><b>정답 C<\/b>: 존스가 시인으로 인정 못 받은 것이 <em>그녀 자신의 (소설가) 자기 규정<\/em>에 부분적으로 기인 → 비평가의 <em>초점이 존스 자신의 자기 성격 규정에 영향받았다<\/em>. \"the nature of their focus on Jones has been influenced by Jones's own characterizations of her work.\" 본문 인과의 직접 함의.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A(시 <em>생산량 규모를 몰라서<\/em> 무관심 — 본문은 <em>양가성<\/em> 탓이라 함; 무지 탓 아님) / B(존스 작품을 <em>동시대 장르 정의<\/em>로 판단 — 근거 없음) / D(존스의 시인 평을 <em>편협하다고 일축<\/em> — 근거 없음) / E(<em>운율·형식<\/em>을 전경화하며 서사 관심을 무시 — 본문은 비평가가 그녀를 <em>무시<\/em>했다고 할 뿐, 운율·형식을 전경화했다는 근거 없음).<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>formidable<\/td><td>adj.<\/td><td>만만찮은, 가공할<\/td><td>impressive, daunting<\/td><td>본문<\/td><\/tr><tr><td>corpus<\/td><td>n.<\/td><td>(작품) 전집, 집성<\/td><td>body of work<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>ambivalence<\/td><td>n.<\/td><td>양가감정, 모순된 태도<\/td><td>uncertainty, equivocation<\/td><td>(거만어 외) 본문(원인)<\/td><\/tr><tr><td>prosody<\/td><td>n.<\/td><td>운율(법), 작시법<\/td><td>metrics, versification<\/td><td>(거만어 외) 본문<\/td><\/tr><tr><td>foreground<\/td><td>v.<\/td><td>전경화하다, 부각하다<\/td><td>emphasize, highlight<\/td><td>본문<\/td><\/tr><tr><td>render<\/td><td>v.<\/td><td>표현하다, ~로 만들다<\/td><td>depict, represent<\/td><td>본문(its rendering)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q10": {"html": true, "interp": "<p>근세 일본의 시나노 지방에서는 정치적 체제가 유난히 변화가 많고 유동적이었다(variable / fluid). 즉, 중앙 정부는 다른 지역에서보다 시나노의 정치적 역할을 더 빠르게 재편했다.<\/p><p><b>해석 노트:<\/b> 콜론은 앞 절의 평가를 뒤 절이 구체적으로 설명하는 부연 관계이므로 ‘때문이다’로 옮기지 않고 ‘즉’으로 이었다. <b>political arrangements<\/b>는 정치적 역할과 권한이 배분된 체제를 가리킨다. <b>reshuffled<\/b>는 이를 ‘재편했다’로 옮겼다. <b>fluid<\/b>는 여기서 물리적으로 흐른다는 뜻이 아니라 체제가 고정되어 있지 않다는 뜻이다. <b>variable<\/b> 역시 지역마다 서로 달랐다는 의미보다, 시나노 내부의 체제가 계속 바뀌었다는 의미로 읽는다.<\/p>", "strat": "<ol><li><b>5 Zones — 핵심 서술부와 콜론 뒤에서 근거를 찾는다.<\/b> 앞 절의 핵심은 «political arrangements … were unusually […]»이다. 정치적 체제의 성격을 묻는다. 콜론 뒤의 «reshuffled political roles»는 중앙 정부가 정치적 역할을 재편했다는 뜻이다. trigger-05에 따라 이 내용이 빈칸을 구체적으로 설명한다.<\/li><li><b>비교의 대상과 비교하는 속성을 확인한다.<\/b> «more rapidly than elsewhere»는 trigger-15의 비교 구문이다. 시나노와 다른 지역을 <b>정치적 역할의 재편 속도<\/b>로 비교한다. 시나노에서 재편이 더 빠르게 이루어졌으므로 정치적 체제도 유난히 잘 바뀌었다고 읽는다. 비교의 초점은 갈등이나 복잡성이 아니라 변화의 속도다.<\/li><li><b>SE 짝 논리 — ‘고정되어 있지 않고 잘 바뀌는’ 두 단어를 고른다.<\/b> <b>variable–fluid<\/b>가 짝이다. <b>variable<\/b>은 변화가 많은 성격을, <b>fluid<\/b>는 고정되지 않고 계속 바뀌는 상태를 나타낸다. 두 단어 모두 잦은 재편이라는 뒤 절의 설명과 연결된다.<\/li><li><b>문장 전체를 확인한다.<\/b> 중앙 정부가 다른 지역보다 빠르게 정치적 역할을 재편했으므로, 시나노의 정치적 체제는 유난히 변화가 많고 유동적이었다. 구체적인 재편 양상이 앞 절의 평가를 뒷받침한다.<\/li><\/ol>", "correct": "<ul><li><b>variable<\/b>(변화가 많은, 가변적인): 정치적 역할이 빠르게 재편되었다는 사실을 체제의 변화가 많았다는 말로 요약한다.<\/li><li><b>fluid<\/b>(유동적인, 고정되지 않은): 정치적 역할이 계속 재편되어 체제가 고정되어 있지 않았음을 나타낸다. 이 문맥에서 <b>variable<\/b>과 동등한 문장을 만든다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>During early modern times, political arrangements in the Japanese province of Shinano were unusually <b>variable<\/b>: the central government reshuffled political roles in Shinano more rapidly than elsewhere.<\/p><p>During early modern times, political arrangements in the Japanese province of Shinano were unusually <b>fluid<\/b>: the central government reshuffled political roles in Shinano more rapidly than elsewhere.<\/p>", "wrong": "<ul><li><b>antagonistic<\/b>(적대적인, 대립적인): 정치적 역할의 재편이 집단 간 적대 관계를 뜻하지는 않는다. 갈등의 주체나 대립 양상이 제시되지 않았다.<\/li><li><b>convoluted<\/b>(복잡하게 얽힌): <b>★가장 매력적인 오답.<\/b> 역할을 자주 재편하면 체제가 복잡해졌을 것이라고 생각하기 쉽다. 그러나 이는 추측이다. 뒤 절이 직접 설명하는 것은 재편의 속도이며, 체제의 복잡성은 아니다.<\/li><li><b>contentious<\/b>(논쟁을 일으키는, 다툼이 많은): <b>antagonistic<\/b>과 갈등이라는 의미축에서 짝처럼 보인다. 그러나 두 단어 모두 빠른 재편을 설명하지 못한다. 비슷한 뜻의 보기라도 문장의 근거와 맞아야 한다.<\/li><li><b>ineffective<\/b>(효과가 없는, 실효성이 없는): 재편이 빨랐다는 사실만으로 정치적 체제가 제 기능을 못했다고 판단할 수 없다. 정책의 성과나 통치 효과에 관한 근거가 없다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>variable<\/td><td>형용사<\/td><td>변화가 많은, 가변적인<\/td><td>changeable, fluctuating<\/td><td>거만어<\/td><\/tr><tr><td>antagonistic<\/td><td>형용사<\/td><td>적대적인, 대립적인<\/td><td>hostile, opposed<\/td><td>(거만어 외)<\/td><\/tr><tr><td>convoluted<\/td><td>형용사<\/td><td>복잡하게 얽힌<\/td><td>intricate, complicated<\/td><td>거만어<\/td><\/tr><tr><td>fluid<\/td><td>형용사<\/td><td>유동적인, 고정되지 않은<\/td><td>changeable, unsettled<\/td><td>거만어<\/td><\/tr><tr><td>contentious<\/td><td>형용사<\/td><td>논쟁을 일으키는, 다툼이 많은<\/td><td>controversial, quarrelsome<\/td><td>거만어<\/td><\/tr><tr><td>ineffective<\/td><td>형용사<\/td><td>효과가 없는<\/td><td>ineffectual, unsuccessful<\/td><td>(거만어 외)<\/td><\/tr><tr><td>political arrangements<\/td><td>명사구<\/td><td>정치적 체제, 정치적 역할의 배분 방식<\/td><td>political structures<\/td><td>(거만어 외)<\/td><\/tr><tr><td>reshuffle<\/td><td>동사<\/td><td>재편하다, 재배치하다<\/td><td>reorganize, rearrange<\/td><td>(거만어 외)<\/td><\/tr><tr><td>province<\/td><td>명사<\/td><td>지방, 행정 구역<\/td><td>region, district<\/td><td>(거만어 외)<\/td><\/tr><tr><td>elsewhere<\/td><td>부사<\/td><td>다른 곳에서<\/td><td>in other places<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q11": {"html": true, "interp": "<p>강력한 기초과학 프로그램은 상당한 수익을 낳을 수 있다. 기초과학에 투자된 자본의 수익률이 응용 연구·개발에 투자된 자본의 수익률의 약 세 배이기 때문이다.<\/p><p><b>해석 노트:<\/b> remunerative는 보수가 되는이라는 직역보다 투자에서 돌아오는 이익이라는 문맥에 맞추어 상당한 수익을 낳을 수 있다로 옮겼다. 또 다른 정답 lucrative를 넣어도 수익성이 높다는 같은 뜻이 된다. 콜론은 앞 진술의 근거를 대는 자리이므로 ~때문이다로 인과를 드러냈고, 반복을 피하려 쓴 대용어 that of는 한국어에서 그대로 생략하면 비교 대상이 흐려지므로 수익률을 한 번 더 살려 옮겼다.<\/p>", "strat": "<p>콜론(<code>:<\/code>)이 빈칸을 부연한다(trigger-05). 콜론 뒤 = \"기초과학 투자 수익률이 응용 연구의 약 3배\". 핵심어 = <b>rate of return / capital invested<\/b>(자본 수익률). 즉 기초과학은 \"돈이 되는·수익성 높은\" 것. 빈칸 = \"수익성 있는\". SE이므로 이 의미의 <b>동의어 두 개<\/b>.<\/p>", "correct": "<p><b>remunerative(수익이 되는·돈벌이가 되는)<\/b> 와 <b>lucrative(수익성 높은·이익이 많은)<\/b> — 둘은 \"돈이 되는\"의 동의어이며, 콜론 뒤 \"수익률 3배\"를 정확히 받는다. 각각 넣어도 뜻이 동등하다(SE 요건).<\/p><p><b>완성 문장<\/b><\/p><p>A strong basic science program can be <b>remunerative<\/b>: the rate of return on capital invested in basic science is about three times that of capital invested in applied research and development.<\/p>", "wrong": "<ul><li><b>idealistic(이상주의적인)<\/b> — 수익(돈)과 무관. 콜론 뒤 <em>수익률<\/em> 근거와 안 맞음.<\/li><li><b>transcendent(초월적인·탁월한)<\/b> — \"뛰어남\"이지 \"수익성\"이 아니다. 짝도 없다.<\/li><li><b>feasible(실현 가능한)<\/b> — 콜론 뒤는 <em>수익성<\/em>을 말하지 <em>실현 가능성<\/em>을 말하지 않는다. 소재 다름.<\/li><li><b>radical(급진적인)<\/b> — 근거 없음. 수익률과 무관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>remunerative<\/td><td>adj.<\/td><td>수익이 되는, 돈벌이가 되는<\/td><td>profitable, lucrative, gainful<\/td><td>(거만어). 정답①. 동사 remunerate<\/td><\/tr><tr><td>lucrative<\/td><td>adj.<\/td><td>수익성 높은, 이익이 많은<\/td><td>profitable, remunerative, moneymaking<\/td><td>(거만어). 정답②<\/td><\/tr><tr><td>feasible<\/td><td>adj.<\/td><td>실현 가능한, 실행할 수 있는<\/td><td>viable, practicable, workable<\/td><td>(거만어). 오답(소재 무관)<\/td><\/tr><tr><td>transcendent<\/td><td>adj.<\/td><td>초월적인, 탁월한<\/td><td>surpassing, supreme<\/td><td>(거만어 외). 오답<\/td><\/tr><tr><td>radical<\/td><td>adj.<\/td><td>급진적인, 근본적인<\/td><td>extreme, fundamental<\/td><td>(거만어). 오답<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q12": {"html": true, "interp": "<p>특허는 오직 새로운 착상에만 주어져야 한다. 어떤 개념이 그 분야 종사자들에게는 이미 뻔히 보이는 것이거나, 어떤 형태로든 앞서 공표된 적이 있다면, 그 사실만으로 출원은 무효가 되어야 한다.<\/p><p><b>해석 노트:<\/b> manifest는 '명시적인'이라는 문서적 뉘앙스로 오해되기 쉬우나 여기서는 '보면 바로 알 수 있는'이라는 뜻이므로 '이미 뻔히 보이는 것'으로 옮겨, 뒤의 '공표된 적이 있다'와 서로 <b>다른 두 경로<\/b>임이 드러나게 했다. in almost any fashion은 '거의 어떤 방식으로든'이 직역이지만 published와 묶으면 늘어지므로 '어떤 형태로든'으로 줄여 문장의 호흡을 지켰다. that fact should invalidate the application은 무생물 주어 구문이라 '그 사실이 출원을 무효화해야 한다'로 직역하면 어색해 '그 사실만으로 출원은 무효가 되어야 한다'로 바꾸었다. 다른 정답 obvious를 넣어도 '그 분야 사람들 눈에는 빤한 것'이라는 같은 뜻이 된다.<\/p>", "strat": "<ul><li>세미콜론(;)이 trigger-05 부연 신호다. 세미콜론은 앞 문장 <b>전체<\/b>를 받아 설명하므로, 뒷문장은 앞문장의 주제어인 <code>Only novel ideas<\/code>(오직 새로운 것만)를 풀어 쓴 것이어야 한다.<\/li><li><code>Only<\/code>는 trigger-16이다. <code>only A → B<\/code>는 대우로 <code>not A → not B<\/code>가 된다. \"새로운 것만 특허\" = <b>\"새롭지 않으면 특허 불가\"<\/b>. 세미콜론 뒤는 바로 그 \"새롭지 않은 경우\"를 <code>or<\/code>로 두 갈래 열거하고, 그 결과로 <code>that fact should invalidate the application<\/code>(출원 무효)을 붙인다.<\/li><li>두 갈래는 모두 \"이미 알려져 있음\"의 사례여야 한다. 뒷 갈래가 <code>has previously been published<\/code>(이미 공표된 바 있다)이므로, 앞 갈래인 빈칸은 <b>공표라는 경로와는 다른 경로<\/b>로 이미 알려진 상태 — 즉 \"굳이 발표되지 않았어도 그 바닥 사람에게는 뻔히 보이는·자명한\"이어야 한다. (특허법의 신규성/자명성 요건 그대로다.)<\/li><li>SE 조건: (1) 동의어 짝 + (2) 뜻이 \"자명한\". → <b>manifest · obvious<\/b>.<\/li><\/ul>", "correct": "<p><b>manifest, obvious<\/b><\/p><ul><li><b>manifest<\/b> = (보면 바로 알 수 있게) 명백한, 자명한.<\/li><li><b>obvious<\/b> = 명백한, 뻔한.<\/li><li>어느 쪽을 넣어도 \"발표된 적이 없어도 업계 사람에겐 이미 빤한 개념 → 신규성 없음 → 출원 무효\"라는 같은 문장이 된다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Only novel ideas should be awarded patents; if a concept is <b>manifest<\/b> to practitioners in a given field or has previously been published in almost any fashion, that fact should invalidate the application.<\/p>", "wrong": "<ul><li><b>lucrative · rewarding<\/b>: '수익성 있는 / 수지맞는'으로 <b>동의어 짝을 이루는 함정<\/b>이다. SE의 전형적 덫 — 짝은 맞지만 문장이 요구하는 축(신규성 여부)과 무관하다. 돈이 된다는 이유로 특허 출원이 무효가 될 까닭은 없다.<\/li><li><b>presented · described<\/b>: 이 둘도 '제시된 / 기술된'으로 짝처럼 보인다. 그러나 (1) <code>be presented/described to practitioners<\/code>는 \"누군가가 종사자들에게 내보였다\"는 <b>공표 행위<\/b>를 뜻하므로 or 뒤의 has previously been published와 내용이 겹쳐, 두 갈래로 나눠 열거한 의미가 사라진다. (2) manifest/obvious가 말하는 \"공표된 적이 없어도 그 분야에서는 자명하다\"는 핵심을 놓친다. 문장이 or로 <b>서로 다른 두 경우<\/b>를 구별해 든다는 점이 이 짝을 배제하는 결정적 근거다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>manifest<\/td><td>adj.<\/td><td>(보면 알 수 있게) 명백한<\/td><td>obvious, evident, patent<\/td><td>정답<\/td><\/tr><tr><td>obvious<\/td><td>adj.<\/td><td>명백한, 뻔한<\/td><td>manifest, apparent<\/td><td>정답<\/td><\/tr><tr><td>lucrative<\/td><td>adj.<\/td><td>수익성 있는<\/td><td>profitable, remunerative<\/td><td>짝 함정 오답<\/td><\/tr><tr><td>rewarding<\/td><td>adj.<\/td><td>보람 있는, 수지맞는<\/td><td>gratifying, profitable<\/td><td>짝 함정 오답<\/td><\/tr><tr><td>presented<\/td><td>v.(p.p.)<\/td><td>제시된, 내보여진<\/td><td>exhibited, shown<\/td><td>뒤 절과 중복 오답<\/td><\/tr><tr><td>described<\/td><td>v.(p.p.)<\/td><td>기술된<\/td><td>depicted, delineated<\/td><td>뒤 절과 중복 오답<\/td><\/tr><tr><td>novel<\/td><td>adj.<\/td><td>새로운, 신규한<\/td><td>original, unprecedented<\/td><td>문장의 주제어<\/td><\/tr><tr><td>invalidate<\/td><td>v.<\/td><td>무효로 만들다<\/td><td>nullify, void<\/td><td>결과 진술<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q13": {"html": true, "interp": "<p>보통 <em>에멘안테 펜둘리플로라(E. penduliflora)<\/em>의 씨앗은 여러 해 동안 휴면(dormant)하며, <em>불(fire)<\/em>이 서식지를 휩쓸 때만 발아한다. 연기 속 <em>이산화질소(NO₂)<\/em>가 발아를 유도한다. 불은 덤불을 치워, 발아한 씨앗이 자라는 데 필요한 <em>햇빛<\/em>을 받게 한다. 식물은 빠르게 성숙해 씨앗을 맺고 죽는다. 그러나 자동차 통행이 많은 지역에서는, 불 없이도 <em>자동차 배기가스<\/em>가 필요한 이산화질소를 공급해 씨앗이 발아한다.<\/p>", "strat": "<p><b>질문 1 — 추론 CR-08<\/b><\/p><ul><li>FACT: ① 발아엔 NO₂ 필요(불의 연기 or 배기가스), ② 성장엔 <em>불이 덤불을 치워 만든 햇빛<\/em> 필요.<\/li><li>핵심 비대칭: 배기가스는 <em>NO₂(발아 조건)<\/em>만 공급할 뿐, <em>불이 하던 덤불 제거·햇빛 확보<\/em>는 못 한다 → 배기가스로 발아한 씨앗은 <em>햇빛(성장 조건)<\/em>을 못 받아 그늘에서 못 자랄 수 있다.<\/li><\/ul>", "correct": "<ul><li><b>정답 근거<\/b>: E \"발아한 <em>E. penduliflora<\/em> 씨앗이 <em>그늘에서 생존<\/em>할 수 없다면, 자동차 배기가스는 통행 많은 지역에서 이 식물의 <em>장기 생존을 위협<\/em>한다.\" 배기가스는 발아만 유도할 뿐 <em>불이 하던 덤불 제거(햇빛)<\/em>는 못 한다 → 불 없이 발아한 씨앗은 그늘에서 못 자라 죽고, 씨앗만 <em>헛되이 소진<\/em>된다. 본문 사실들이 비약 없이 이 결론을 뒷받침.<\/li><li><b>정답: E.<\/b><\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>A \"가장 강한 불에서도 씨앗이 완전히 파괴되지 않는다\" — 불의 <em>씨앗 파괴 여부<\/em>는 본문에 없음. 근거 없음.<\/li><li>B \"배기가스의 NO₂가 <em>발아 후<\/em> 식물을 해치지 않는다\" — 발아 후 NO₂ 영향은 본문에 없음. 비약.<\/li><li>C \"불을 줄이면 배기가스가 식물 번성 조건을 <em>복제<\/em>할 수 있다\" — 정반대. 배기가스는 <em>햇빛(성장 조건)<\/em>을 복제 못 함. 본문과 모순.<\/li><li>D \"통행 많은 지역에 <em>자연 화재가 더 빈번<\/em>하다\" — 화재 빈도와 통행량의 관계는 본문에 없음. 무관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>dormant<\/td><td>adj.<\/td><td>휴면 중인, 잠복한<\/td><td>inactive, quiescent<\/td><td>(거만어 외) 본문 핵심<\/td><\/tr><tr><td>germinate<\/td><td>v.<\/td><td>발아하다<\/td><td>sprout, bud<\/td><td>(거만어 외) 본문 핵심<\/td><\/tr><tr><td>exhaust<\/td><td>n.<\/td><td>배기가스<\/td><td>emissions, fumes<\/td><td>(거만어 외) 본문<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q14": {"html": true, "interp": "<p>비평가들은 전통적으로 미국 작가 William Wells Brown의 소설 <b>Clotel<\/b>(1853)의 구조에 <b>양가적<\/b>(ambivalence) 반응을 보여, 예컨대 이 책이 '소설 열두 편 분량의 소재를 담고 있다'고 지적해 왔다. 이 논평은 소설의 풍부함을 <b>과장되게<\/b>(hyperbolically) 짚었다는 점에서는 정확하지만, 그 <b>부정적 함의<\/b>(connotation)는 재해석되어야 한다. 이 방대한 소재는 결함이 아니라 사실 Brown <b>미학<\/b>(aesthetic)의 결정적·의도적 요소다. Brown의 서사 전략은 노예제의 압도적이고 부조리하며(absurd) 잔혹하고 불확실한 성질을 지면 위에 재현하고, 나아가 독자가 (비록 완화된 형태로나마) 그것을 직접 겪게 만드는, 정교하게 조율된 문학적 도구다. Brown은 소설의 바로 그 구조 속에, 자기 인물들의 삶에 <b>본질적으로 내재한<\/b>(endemic) 불확실성과 제한된 통제력을 그대로 비춘다.<\/p>", "strat": "<p><b>질문 1 — 사실확인 RC-06<\/b><\/p><p><b>주제 문장 = S3<\/b> «Rather than a shortcoming, … is in fact …» — 문장완성 trigger-12 구조다. 원래는 앞에 부정문이 오고 가운데에 on the contrary·rather·instead·in fact·indeed가 오는데, 여기서는 <b>Rather than이 부정어 역할<\/b>을 하고 in fact가 더 센 말을 이끈다. <b>S1은 논박 대상이므로 주제가 아니다<\/b>(첫 문장이어서가 아니라 통념 소개이기 때문; for instance는 noting 앞 주절의 예시). 통념(비평가들의 양가적 반응: '소재 과잉=결함')을 제시한 뒤, 저자는 그 부정적 함의를 뒤집는다(Rather than a shortcoming…). 소재의 풍부함은 결함이 아니라 <b>의도된 미학적 장치<\/b>이며, 그 형식(구조) 자체가 노예제의 성질과 인물 삶의 불확실성을 재현한다는 것이 논지다. 즉 '형식이 곧 내용을 반영한다'는 저자의 주장이 핵심.<\/p>", "correct": "<ul><li><b>★해법<\/b>: 거기에 답이 있다 — 서사 전략(narrative strategies)이 든 문장을 찾는다. 서사 전략이 «노예제의 성질을 재현하는 도구»이고 구조가 인물 삶의 불확실성을 반영한다는 진술을 바꿔 쓴 보기를 고른다.<\/li><\/ul><p>신호어는 According to이지만, 정답이 본문 직접진술의 패러프레이즈이므로 사실확인으로 본다.<\/p><ul><li><b>정답(D) are directly related to the novel's subject matter<\/b>: 본문은 서사 전략이 '노예제의 성질을 재현하는 도구'이며 구조가 '인물 삶의 불확실성을 반영한다'고 명시한다. 소재(노예제)와 서사 전략이 직결됨을 그대로 진술.<\/li><\/ul>", "wrong": "<ul><li><b>오답(A)<\/b>: 'Brown의 소설 전반의 특징'이라는 확대 진술. 본문은 이 소설(Clotel)의 미학적 요소만 말한다. 범위 초과.<\/li><li><b>오답(B)<\/b>: 서사 전략이 주제와 '상충'한다 — 정반대. 전략은 주제(노예제의 불확실성)를 반영·강화한다.<\/li><li><b>오답(C)<\/b>: '극적 결말을 예고' — 결말(resolution)에 대한 언급 자체가 없다.<\/li><li><b>오답(E)<\/b>: '19세기 초 미국 작가들의 관습에 기반' — 본문은 Brown 고유의 의도적 전략이라 하며, 관습 차용을 말하지 않는다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>ambivalence<\/td><td>n.<\/td><td>양가감정, 상반된 태도<\/td><td>equivocation, vacillation<\/td><td>비평가의 이중적 반응<\/td><\/tr><tr><td>hyperbolically<\/td><td>adv.<\/td><td>과장되게<\/td><td>exaggeratedly<\/td><td>hyperbole의 부사형<\/td><\/tr><tr><td>connotation<\/td><td>n.<\/td><td>(내포된) 함의·뉘앙스<\/td><td>implication, undertone<\/td><td>부정적 함의의 재해석<\/td><\/tr><tr><td>aesthetic<\/td><td>n./adj.<\/td><td>미학, 미적 원리<\/td><td>artistic sensibility<\/td><td>의도적 미학 요소<\/td><\/tr><tr><td>endemic<\/td><td>adj.<\/td><td>고유한, 본질적으로 내재한<\/td><td>inherent, intrinsic<\/td><td>인물 삶에 내재<\/td><\/tr><tr><td>absurd<\/td><td>adj.<\/td><td>부조리한, 터무니없는<\/td><td>preposterous, irrational<\/td><td>노예제의 성질<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q15": {"html": true, "interp": "<p>비평가들은 전통적으로 미국 작가 William Wells Brown의 소설 <b>Clotel<\/b>(1853)의 구조에 <b>양가적<\/b>(ambivalence) 반응을 보여, 예컨대 이 책이 '소설 열두 편 분량의 소재를 담고 있다'고 지적해 왔다. 이 논평은 소설의 풍부함을 <b>과장되게<\/b>(hyperbolically) 짚었다는 점에서는 정확하지만, 그 <b>부정적 함의<\/b>(connotation)는 재해석되어야 한다. 이 방대한 소재는 결함이 아니라 사실 Brown <b>미학<\/b>(aesthetic)의 결정적·의도적 요소다. Brown의 서사 전략은 노예제의 압도적이고 부조리하며(absurd) 잔혹하고 불확실한 성질을 지면 위에 재현하고, 나아가 독자가 (비록 완화된 형태로나마) 그것을 직접 겪게 만드는, 정교하게 조율된 문학적 도구다. Brown은 소설의 바로 그 구조 속에, 자기 인물들의 삶에 <b>본질적으로 내재한<\/b>(endemic) 불확실성과 제한된 통제력을 그대로 비춘다.<\/p>", "strat": "<p><b>질문 2 — 문장·단락 기능 RC-07<\/b><\/p><p><b>주제 문장 = S3<\/b> «Rather than a shortcoming, … is in fact …» — 문장완성 trigger-12 구조다. 원래는 앞에 부정문이 오고 가운데에 on the contrary·rather·instead·in fact·indeed가 오는데, 여기서는 <b>Rather than이 부정어 역할<\/b>을 하고 in fact가 더 센 말을 이끈다. <b>S1은 논박 대상이므로 주제가 아니다<\/b>(첫 문장이어서가 아니라 통념 소개이기 때문; for instance는 noting 앞 주절의 예시). 통념(비평가들의 양가적 반응: '소재 과잉=결함')을 제시한 뒤, 저자는 그 부정적 함의를 뒤집는다(Rather than a shortcoming…). 소재의 풍부함은 결함이 아니라 <b>의도된 미학적 장치<\/b>이며, 그 형식(구조) 자체가 노예제의 성질과 인물 삶의 불확실성을 재현한다는 것이 논지다. 즉 '형식이 곧 내용을 반영한다'는 저자의 주장이 핵심.<\/p>", "correct": "<ul><li><b>★해법<\/b>: 표시 문장을 해석하고 앞 문장과의 관계를 본다. 앞 문장이 «서사 전략 = 노예제를 재현하는 도구»라는 일반 명제를 세우고, 표시 문장은 부정 연결어 없이 이어지며 그것을 구조 차원에서 구체화한다. 이어지는 문장은 support하므로 «앞 생각을 부연한다»는 보기를 고른다.<\/li><\/ul><p>강조 문장(마지막 문장, 'Brown mirrors in the very structure…')의 기능을 묻는 전형적 기능 문제.<\/p><ul><li><b>정답(D) It elaborates upon an idea expressed in the previous sentence<\/b>: 앞 문장이 '서사 전략은 노예제의 성질을 재현하는 문학적 도구'라는 일반 명제를 세우고, 강조 문장은 그것을 '소설의 구조 차원에서 인물 삶의 불확실성을 반영한다'고 구체화·부연한다.<\/li><\/ul>", "wrong": "<ul><li><b>오답(A)<\/b>: qualify(제한·완화)한다 — 강조 문장은 주장을 제한하지 않고 오히려 발전시킨다.<\/li><li><b>오답(B)<\/b>: 전통적 비판을 '입증'한다 — 본문 전체가 그 비판을 뒤집는 방향이므로 정반대.<\/li><li><b>오답(C)<\/b>: 다른 동시대 작품과 '비교' — 비교 대상이 등장하지 않는다.<\/li><li><b>오답(E)<\/b>: 특정 성질이 결함으로 여겨질 수 있음을 '인정' — 저자는 결함론을 배격한다. 양보 아님.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>ambivalence<\/td><td>n.<\/td><td>양가감정, 상반된 태도<\/td><td>equivocation, vacillation<\/td><td>비평가의 이중적 반응<\/td><\/tr><tr><td>hyperbolically<\/td><td>adv.<\/td><td>과장되게<\/td><td>exaggeratedly<\/td><td>hyperbole의 부사형<\/td><\/tr><tr><td>connotation<\/td><td>n.<\/td><td>(내포된) 함의·뉘앙스<\/td><td>implication, undertone<\/td><td>부정적 함의의 재해석<\/td><\/tr><tr><td>aesthetic<\/td><td>n./adj.<\/td><td>미학, 미적 원리<\/td><td>artistic sensibility<\/td><td>의도적 미학 요소<\/td><\/tr><tr><td>endemic<\/td><td>adj.<\/td><td>고유한, 본질적으로 내재한<\/td><td>inherent, intrinsic<\/td><td>인물 삶에 내재<\/td><\/tr><tr><td>absurd<\/td><td>adj.<\/td><td>부조리한, 터무니없는<\/td><td>preposterous, irrational<\/td><td>노예제의 성질<\/td><\/tr><\/table>", "uncertain": false}}, "source": "GRE Verbal Vault · 최근 1년(2025-11~2026-10) Part별 출제 점유 배분 · ETS 순서"};

const TYPE_LABELS={CR:'Critical Reasoning',RC_SINGLE:'Reading Comprehension',RC_MULTI:'Reading Comprehension',RC_SELECT:'Reading Comprehension',TC:'Text Completion',SE:'Sentence Equivalence'};
const ROMAN={i:'(i)',ii:'(ii)',iii:'(iii)'};
const CODE_API='';
const CODE_ALPHABET='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const state={screen:'start',sectionIdx:0,questionIdx:0,answers:{},timer:null,timeRemaining:0,sectionLocked:[],timerExpired:[],endExpired:false,expanded:{},marked:{},save:null};

function curSection(){return examData.sections[state.sectionIdx];}
function curQ(){return curSection().questions[state.questionIdx];}
function totalQ(){return examData.sections.reduce((s,x)=>s+x.questions.length,0);}
function fmt(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function isAnswered(id){const a=state.answers[id];return Array.isArray(a)&&a.filter(x=>x!==undefined&&x!=='').length>0;}
function arrEq(a,b){if(!a||!b||a.length!==b.length)return false;const x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i]);}
function normSent(s){if(typeof s!=='string')return '';return s.replace(/<[^>]+>/g,' ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();}
const _ABBR=['Mr.','Mrs.','Ms.','Dr.','St.','Jr.','Sr.','vs.','etc.','e.g.','i.e.','U.S.','U.K.','No.','Prof.','Inc.','Ltd.','Co.'];
function splitSentences(text){let t=text;_ABBR.forEach((a,i)=>{t=t.split(a).join('__A'+i+'__');});t=t.replace(/([A-Z])\.(?=\s[A-Z])/g,'$1__D__');
  return t.split(/(?<=[.!?])\s+(?=[A-Z"“(])/).map(p=>{let s=p;_ABBR.forEach((a,i)=>{s=s.split('__A'+i+'__').join(a);});return s.replace(/__D__/g,'.').trim();}).filter(s=>s.length>0);}
function trunc(s,n){s=s||'';return s.length>n?s.slice(0,n)+'…':s;}
function isCorrect(q){const u=state.answers[q.id];if(!isAnswered(q.id))return false;
  if(q.type==='RC_SELECT')return q.answer.length>0&&normSent(u[0])===normSent(q.answer[0]);
  if(q.type==='TC'){if(u.length!==q.answer.length)return false;return u.every((v,i)=>v===q.answer[i]);}
  return arrEq(u.filter(x=>x!==undefined&&x!==''),q.answer);}
function labelText(q,label){
  if(q.type==='TC'){for(const bl of q.blanks){const c=bl.choices.find(c=>c.label===label);if(c)return c.text;}return label;}
  const c=(q.choices||[]).find(c=>c.label===label);return c?c.text:label;}
function myAnswerDisplay(q){const u=state.answers[q.id];if(!isAnswered(q.id))return '<span class="mark-skip">미응답</span>';
  if(q.type==='RC_SELECT')return '“'+trunc(u[0],46)+'”';
  if(q.type==='TC')return u.map(l=>l?labelText(q,l):'—').join(' / ');
  if(q.type==='SE')return u.map(l=>labelText(q,l)).join(', ');
  return u.join(', ');}
function correctDisplay(q){
  if(q.type==='RC_SELECT')return q.answer.length?('“'+trunc(q.answer[0],46)+'”'):'<span class="exp-uncertain">검수 필요</span>';
  if(q.type==='TC'||q.type==='SE')return (q.answerText||q.answer).join(q.type==='TC'?' / ':', ');
  return q.answer.join(', ');}

/* ---- timer ---- */
function startTimer(){if(state.timer)clearInterval(state.timer);state.timeRemaining=curSection().timeLimit*60;state.deadline=Date.now()+state.timeRemaining*1000;updTimer();
  state.timer=setInterval(()=>{state.timeRemaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));updTimer();if(state.timeRemaining<=0){clearInterval(state.timer);state.timer=null;state.timerExpired[state.sectionIdx]=true;onExpire();}},1000);}
function stopTimer(){if(state.timer){clearInterval(state.timer);state.timer=null;}}
function updTimer(){const el=document.getElementById('timer');if(el){el.textContent=fmt(Math.max(0,state.timeRemaining));el.classList.toggle('warning',state.timeRemaining<=60);}}
function onExpire(){state.endExpired=true;state.screen='sectionEnd';render();}

/* ---- modal ---- */
function showModal(o){document.getElementById('modal-title').textContent=o.title;document.getElementById('modal-message').innerHTML=o.message;
  const cf=document.getElementById('modal-confirm'),cc=document.getElementById('modal-cancel');
  cf.textContent=o.confirmText||'확인';cc.textContent=o.cancelText||'취소';cc.style.display=o.showCancel===false?'none':'inline-block';
  cf.onclick=()=>{if(o.onConfirm)o.onConfirm();};cc.onclick=()=>{if(o.onCancel)o.onCancel();hideModal();};
  document.getElementById('modal').classList.add('show');}
function hideModal(){document.getElementById('modal').classList.remove('show');}

/* ---- render ---- */
function render(){const app=document.getElementById('app');
  if(state.screen==='start')renderStart(app);
  else if(state.screen==='sectionIntro')renderSectionIntro(app);
  else if(state.screen==='question')renderQuestion(app);
  else if(state.screen==='sectionEnd')renderSectionEnd(app);
  else if(state.screen==='results')renderResults(app);
  else if(state.screen==='review')renderReviewScreen(app);
  if(!state.keepScroll)window.scrollTo(0,0);state.keepScroll=false;}

function renderStart(app){const I=examData.intro,sf=examData.scoringFormula;
  app.innerHTML=`<div class="intro">
    <div class="intro-eyebrow">${I.label}</div>
    <div class="intro-title">${I.title}</div>
    <div class="intro-round">${I.roundLabel}</div>
    <div class="main-copy">${I.mainCopy.join('<br>')}</div>
    <div class="author">${I.author}</div>
    <div class="intro-info">
      <div class="row"><span class="k">구성</span><span class="v">${examData.sections.length} Section${examData.sections.length>1?'s':''} · 총 ${totalQ()}문항</span></div>
      ${examData.sections.map(s=>`<div class="row"><span class="k">Section ${s.number}</span><span class="v">${s.questions.length}문항 · ${s.timeLimit}분</span></div>`).join('')}
      ${!examData.diag?`<div class="row"><span class="k">환산 점수(추정)</span><span class="v">round(${sf.multiplier} × 정답수) + ${sf.base}</span></div>`
        :examData.diag.score==='diag'?`<div class="row"><span class="k">진단 점수</span><span class="v">130 + 2 × 정답수 (GRE 점수 예측 아님)</span></div>`
        :`<div class="row"><span class="k">결과</span><span class="v">${totalQ()}문항 중 맞힌 수 · 다시 외울 문항</span></div>`}
    </div>

      <li>${examData.sections.length>1?'각 섹션은 독립 타이머로 진행되며, 섹션을 완료하면 답안을 수정할 수 없습니다.':'제한 시간 안에 풀고, 완료하면 답안을 수정할 수 없습니다.'}</li>
      <li>Sentence Equivalence는 정확히 2개를 선택합니다. 채점 후 문항별 해설을 제공합니다.</li>
      <li>실제 시험처럼 <b>Mark</b>로 문항을 표시하고, <b>Review</b>에서 섹션 전체의 응답 상태를 확인하며 원하는 문항으로 이동할 수 있습니다.</li>
    </ul></div>
    <button class="btn btn-primary btn-large" onclick="handleStart()">시험 시작하기</button>
  </div>`;}

function renderSectionIntro(app){const s=curSection();
  app.innerHTML=`<div class="card-center">
    <div class="num">Section ${s.number} of ${examData.sections.length}</div>
    <h2>${examData.sections.length===1?'시험을 시작합니다':state.sectionIdx===0?'첫 번째 섹션을 시작합니다':'두 번째 섹션을 시작합니다'}</h2>
    <div class="meta"><strong>${s.questions.length}개 문항</strong> · 제한 시간 <strong>${s.timeLimit}분</strong><br>시작 버튼을 누르면 타이머가 작동합니다.</div>
    <button class="btn btn-primary btn-large" onclick="handleSectionStart()">Section ${s.number} 시작</button>
  </div>`;}

function renderQuestion(app){const q=curQ(),s=curSection(),tot=s.questions.length;
  const isLast=state.questionIdx===tot-1,pct=((state.questionIdx+1)/tot)*100;
  const isRC=['CR','RC_SINGLE','RC_MULTI','RC_SELECT'].includes(q.type);
  let body='';
  if(q.directions)body+=`<div class="directions">${q.directions}</div>`;
  body+=`<div class="question-text">${q.questionText}</div>`;
  body+=renderChoices(q);
  if(q.type==='SE')body+=`<div class="se-warning" id="se-warning"></div>`;
  app.innerHTML=`<div class="topbar"><div class="topbar-left"><span class="label">Section</span><span class="value">${s.number}</span>
      <span style="margin:0 10px;color:var(--line);">·</span><span class="label">Question</span><span class="value">${state.questionIdx+1} / ${tot}</span></div>
      <div class="tb-right"><button class="tb-btn ${state.marked[q.id]?'marked':''}" onclick="toggleMark()">${state.marked[q.id]?'★ Marked':'☆ Mark'}</button><button class="tb-btn" onclick="openReview()">Review</button><div class="timer" id="timer">${fmt(state.timeRemaining)}</div></div></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <main><div class="question-meta"><span class="qtype">${TYPE_LABELS[q.type]}</span><span>${q.poolId}</span></div>
    ${isRC?`<div class="layout-rc">
        <div class="passage" id="passage-box"><span class="passage-label">${q.rangeLabel||'Passage'}</span>${renderPassageHTML(q)}</div>
        <div class="question-body">${body}</div></div>`
       :`<div class="question-body"><span class="qnum-badge">${q.id.replace('-',' ')}</span>${body}</div>`}
    </main>
    <div class="footer-nav"><div class="nav-group"><button class="btn" onclick="handlePrev()" ${state.questionIdx===0?'disabled':''}>← 이전</button></div>
      <div class="nav-group">${isLast?`<button class="btn btn-finish" onclick="goSectionEnd()">섹션 종료 →</button>`:`<button class="btn btn-primary" onclick="handleNext()">다음 →</button>`}</div></div>`;
  updTimer();attachListeners();}

function mk(){return '<span class="mk"></span>';}
function renderPassageHTML(q){
  if(q.type!=='RC_SELECT')return q.passage.split(/\n\n+/).map(p=>`<p>${p}</p>`).join('');
  const u=state.answers[q.id]||[];const selN=u[0]?normSent(u[0]):null;
  return q.passage.split(/\n\n+/).map(para=>{const ss=splitSentences(para.replace(/<[^>]+>/g,''));
    return '<p>'+ss.map(s=>{const sel=selN&&normSent(s)===selN;return `<span class="sentence ${sel?'sel':''}" tabindex="0" data-text="${s.replace(/"/g,'&quot;')}">${s}</span>`;}).join(' ')+'</p>';}).join('');}
function renderChoices(q){const u=state.answers[q.id]||[];
  if(q.type==='RC_SELECT')
    return `<div class="directions">지문에서 정답에 해당하는 문장을 클릭하세요. (한 문장만 선택)</div>`;
  if(q.type==='CR'||q.type==='RC_SINGLE')
    return `<ul class="choices">${q.choices.map(c=>`<li class="choice oval ${u.includes(c.label)?'selected':''}" data-mode="single" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='RC_MULTI')
    return `<ul class="choices">${q.choices.map(c=>`<li class="choice square ${u.includes(c.label)?'selected':''}" data-mode="multi" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='SE')
    return `<div class="se-hint">정확히 2개를 선택하세요.</div><ul class="choices">${q.choices.map(c=>`<li class="choice square ${u.includes(c.label)?'selected':''}" data-mode="se" data-value="${c.label}">${mk()}<div>${c.text}</div></li>`).join('')}</ul>`;
  if(q.type==='TC'){
    if(q.blanks.length===1){const bl=q.blanks[0];
      return `<table class="tc-table single"><tbody>${bl.choices.map(c=>`<tr><td data-blank="0" data-value="${c.label}" class="${u[0]===c.label?'selected':''}">${c.text}</td></tr>`).join('')}</tbody></table>`;}
    const n=q.blanks.length,rows=q.blanks[0].choices.length;
    let html=`<table class="tc-table"><thead><tr>${q.blanks.map(b=>`<th>Blank ${ROMAN[b.id]||'('+b.id+')'}</th>`).join('')}</tr></thead><tbody>`;
    for(let r=0;r<rows;r++){html+='<tr>'+q.blanks.map((b,ci)=>{const c=b.choices[r];return `<td data-blank="${ci}" data-value="${c.label}" class="${u[ci]===c.label?'selected':''}">${c.text}</td>`;}).join('')+'</tr>';}
    html+='</tbody></table>';return html;}
  return '';}

function attachListeners(){
  document.querySelectorAll('.choice').forEach(li=>li.addEventListener('click',()=>onChoice(li)));
  document.querySelectorAll('.tc-table td').forEach(td=>td.addEventListener('click',()=>onTC(td)));
  const q=curQ();
  if(q&&q.type==='RC_SELECT'){document.querySelectorAll('.passage .sentence').forEach(sp=>{
    const pick=()=>{const txt=sp.dataset.text;const cur=state.answers[q.id]||[];const is=cur[0]&&normSent(cur[0])===normSent(txt);
      state.answers[q.id]=is?[]:[txt];document.querySelectorAll('.passage .sentence').forEach(x=>x.classList.remove('sel'));if(!is)sp.classList.add('sel');};
    sp.addEventListener('click',pick);sp.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();pick();}});});}}
function onChoice(li){const q=curQ(),mode=li.dataset.mode,val=li.dataset.value;
  if(mode==='single'){state.answers[q.id]=[val];document.querySelectorAll('.choice[data-mode="single"]').forEach(x=>x.classList.remove('selected'));li.classList.add('selected');}
  else if(mode==='multi'){let cur=state.answers[q.id]||[];if(cur.includes(val)){cur=cur.filter(v=>v!==val);li.classList.remove('selected');}else{cur=[...cur,val];li.classList.add('selected');}state.answers[q.id]=cur;}
  else if(mode==='se'){let cur=state.answers[q.id]||[];const w=document.getElementById('se-warning');
    if(cur.includes(val)){cur=cur.filter(v=>v!==val);li.classList.remove('selected');}
    else{if(cur.length>=2){w.textContent='정확히 2개까지만 선택할 수 있습니다.';w.classList.add('show');setTimeout(()=>w.classList.remove('show'),1800);return;}cur=[...cur,val];li.classList.add('selected');}
    state.answers[q.id]=cur;}}
function onTC(td){const q=curQ(),bi=+td.dataset.blank,val=td.dataset.value;
  let cur=state.answers[q.id]||new Array(q.blanks.length).fill(undefined);cur=[...cur];cur[bi]=val;state.answers[q.id]=cur;
  document.querySelectorAll(`.tc-table td[data-blank="${bi}"]`).forEach(x=>x.classList.remove('selected'));td.classList.add('selected');}

/* ---- v2: Mark / Review ---- */
function toggleMark(){const q=curQ();state.marked[q.id]=!state.marked[q.id];state.keepScroll=true;
  const pb=document.getElementById('passage-box');const ps=pb?pb.scrollTop:0;render();const nb=document.getElementById('passage-box');if(nb)nb.scrollTop=ps;}
function openReview(){state.screen='review';render();}
function qStatus(q){const u=state.answers[q.id]||[];const n=u.filter(x=>x!==undefined&&x!=='').length;
  if(n===0)return['st-not','Not Answered'];
  if(q.type==='SE'&&n<2)return['st-inc','Incomplete'];
  if(q.type==='TC'&&n<q.blanks.length)return['st-inc','Incomplete'];
  return['st-ans','Answered'];}
function renderReviewScreen(app){const s=curSection();
  const rows=s.questions.map((q,i)=>{const st=qStatus(q);return `<tr class="rv-row ${i===state.questionIdx?'rv-cur':''}" onclick="goToQ(${i})"><td>${i+1}</td><td>${shortType(q.type)}</td><td class="${st[0]}">${st[1]}</td><td>${state.marked[q.id]?'<span class="mk-flag">★ Marked</span>':''}</td></tr>`;}).join('');
  app.innerHTML=`<div class="topbar"><div class="topbar-left"><span class="label">Section</span><span class="value">${s.number}</span><span style="margin:0 10px;color:var(--line);">·</span><span class="value">Review</span></div>
      <div class="tb-right"><div class="timer" id="timer">${fmt(state.timeRemaining)}</div></div></div>
    <main><div class="review-wrap"><h2>Review — Section ${s.number}</h2>
      <div class="sub">문항을 클릭하면 해당 문항으로 이동합니다. 시간은 계속 흐릅니다.</div>
      <table class="review-table"><thead><tr><th style="width:80px;">Question</th><th style="width:110px;">Type</th><th>Status</th><th style="width:120px;">Marked</th></tr></thead><tbody>${rows}</tbody></table>
      <div style="text-align:center;margin-top:18px;"><button class="btn btn-primary" onclick="backToQuestions()">Return to Question ${state.questionIdx+1}</button></div>
    </div></main>`;

function goToQ(i){state.questionIdx=i;state.screen='question';render();}

/* ---- section end ---- */
function goSectionEnd(){state.endExpired=false;state.screen='sectionEnd';render();}
function renderSectionEnd(app){const s=curSection();const used=s.timeLimit*60-Math.max(0,state.timeRemaining);
  let ans=0;s.questions.forEach(q=>{if(isAnswered(q.id))ans++;});
  const last=state.sectionIdx===examData.sections.length-1;
  app.innerHTML=`<div class="card-center">
    <div class="num">Section ${s.number} 풀이 완료</div>

    <div class="warn-box">⚠️ "${last?'완료하고 채점':'완료하고 다음 섹션'}" 버튼을 누르면 Section ${s.number}의 답안은 <br>더 이상 수정할 수 없습니다.${state.endExpired?'<br><br>제한 시간이 종료되었습니다.':'<br><br>남은 시간이 있으니 풀이로 돌아가 검토할 수 있습니다.'}</div>
    <div class="end-actions">
      ${state.endExpired?'':`<button class="btn" onclick="backToQuestions()">← 풀이 화면으로</button>`}
      <button class="btn btn-finish" onclick="finishSection()">${last?'완료하고 채점 →':'완료하고 다음 섹션 →'}</button>
    </div></div>`;
  updTimer();}
function backToQuestions(){state.screen='question';render();}
function finishSection(){stopTimer();state.sectionLocked[state.sectionIdx]=true;
  if(state.sectionIdx<examData.sections.length-1){state.sectionIdx++;state.questionIdx=0;state.endExpired=false;state.screen='sectionIntro';}
  else{state.screen='results';}render();}

/* ---- results + explanations ---- */
function renderResults(app){let totalCorrect=0;
  const stats=examData.sections.map(s=>{let c=0;s.questions.forEach(q=>{if(isCorrect(q))c++;});totalCorrect+=c;return{num:s.number,correct:c,total:s.questions.length};});
  const tq=totalQ();const score=Math.round(examData.scoringFormula.multiplier*totalCorrect)+examData.scoringFormula.base;
  /* 진단고사(계약 v1.0 §1·§5): score 'diag' = min(170,130+2×정답) «진단 점수», 'none' = 점수 없이 «20문항 중 N개». «환산» 표기 금지 */
  const D=examData.diag||null;
  const scoreCell=!D?`<div class="score-cell"><div class="label">환산 점수</div><div class="value">${score}</div><div class="sub">round(${examData.scoringFormula.multiplier} × ${totalCorrect}) + ${examData.scoringFormula.base}</div></div>`
    :D.score==='diag'?`<div class="score-cell"><div class="label">진단 점수</div><div class="value">${Math.min(170,130+2*totalCorrect)}</div><div class="sub">130 + 2 × ${totalCorrect}</div></div>`
    :`<div class="score-cell"><div class="label">다시 외울 문항</div><div class="value">${tq-totalCorrect}<span class="total">개</span></div><div class="sub">${tq}문항 중 ${totalCorrect}개 정답</div></div>`;
  const diagNote=D&&D.note?`<div class="diag-note">${D.note}</div>`:'';
  let rows='';
  examData.sections.forEach(s=>{
    rows+=`<tr class="section-divider"><td colspan="7">Section ${s.number}</td></tr>`;
    s.questions.forEach(q=>{const ok=isCorrect(q);const mark=ok?'<span class="mark-correct">✓</span>':'<span class="mark-wrong">✗</span>';
      rows+=`<tr><td>${q.id}</td><td><div class="m-pool">${q.poolId}${q.part?' · '+q.part:''}</div>${tierBadge(q.frequency)}</td><td style="color:var(--ink-mute);font-size:12px;">${shortType(q.type)}</td>
        <td>${myAnswerDisplay(q)}</td><td><strong>${correctDisplay(q)}</strong></td>
        <td style="text-align:center;font-size:17px;">${mark}</td>
        <td><button class="exp-toggle" onclick="toggleExp('${q.id}')">${state.expanded[q.id]?'해설 닫기 ▲':'▶ 해설'}</button></td></tr>`;
      if(state.expanded[q.id])rows+=`<tr class="exp-row"><td colspan="7"><div class="exp-wrap">${renderExplanation(q)}</div></td></tr>`;});
  });
  app.innerHTML=`<main class="results">
    <div class="results-header"><div class="eyebrow">Test Complete</div><h2>채점 결과</h2></div>
    <div class="score-card">
      <div class="score-cell"><div class="label">총 정답</div><div class="value">${totalCorrect}<span class="total"> / ${tq}</span></div><div class="sub">${stats.map(s=>'S'+s.num+': '+s.correct+'/'+s.total).join(' · ')}</div></div>
      <div class="score-cell"><div class="label">정답률</div><div class="value">${Math.round(totalCorrect/tq*100)}<span class="total">%</span></div><div class="sub">${totalCorrect} of ${tq}</div></div>
      ${scoreCell}
    </div>
    ${diagNote}
    ${renderPromo()}
    <div class="meta-notice">※ 각 해설 첫 줄의 <b>총 출제 횟수</b>·<b>출제 연월</b>·<b>교재 Part</b>는 송종옥 선생님의 시험 후기 기록(GRE Verbal Vault) 기준입니다.<br>※ 같은 달에 여러 번 출제된 문제는 출제 연월보다 출제 횟수가 많을 수 있습니다.${D?'':' 환산 점수는 정답 수 기반 추정치입니다.'}</div>
    <div class="exp-controls"><button class="btn" onclick="expandAll(true)">모두 펼치기</button><button class="btn" onclick="expandAll(false)">모두 접기</button></div>
    <div class="tier-legend"><span>빈출 등급(출제 횟수):</span><span class="tier tier-top">★★★ 최상위</span>8회↑<span class="tier tier-high">★★ 상위</span>4–7회<span class="tier tier-mid">★ 중위</span>2–3회<span class="tier tier-low">☆ 저빈도</span>1회</div>
    <div class="results-table"><table><thead><tr><th style="width:70px;">번호</th><th style="width:172px;">모모집 · 빈출 등급</th><th>유형</th><th>내 답</th><th>정답</th><th style="width:52px;text-align:center;">결과</th><th style="width:88px;">해설</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="results-actions" style="text-align:center;display:flex;gap:12px;justify-content:center;">
      <button class="btn" onclick="window.print()">결과 인쇄</button><button class="btn btn-primary" onclick="location.reload()">다시 풀기</button><a class="btn" href="./">다른 회차 보기</a></div>
  </main>`;}
function renderPromo(){return `<section class="promo" aria-labelledby="promo-title">
    <h3 id="promo-title">GRE Verbal의 모든 정보는 greverbal.com에 있습니다</h3>

    <div class="promo-row"><a class="btn btn-primary" href="https://greverbal.com/" target="_blank" rel="noopener">greverbal.com 바로가기 →</a><a class="btn" href="https://open.kakao.com/o/s0ifxj1f" target="_blank" rel="noopener">카카오톡으로 물어보기</a></div>
  </section>`;}
function shortType(t){return t==='RC_SINGLE'?'RC':t==='RC_MULTI'?'RC·다':t==='RC_SELECT'?'RC·문장':t;}
function tierBadge(f){const M={'최상위':['tier-top','★★★'],'상위':['tier-high','★★'],'중위':['tier-mid','★'],'저빈도':['tier-low','☆']};const t=M[f.bucket]||['tier-low','☆'];return `<span class="tier ${t[0]}">${t[1]} ${f.bucket} · ${f.count}회</span>`;}
function toggleExp(id){state.expanded[id]=!state.expanded[id];render();}
function expandAll(v){examData.sections.forEach(s=>s.questions.forEach(q=>state.expanded[q.id]=v));render();}
/* ── 내 기록 코드 저장 (Portal «기록 코드» 연동, 2026-11-06) ──
   결과 화면에 들어선 순간 attempt_id·taken_at을 한 번 만들고, 해설 펼침 등으로 다시 그려도 유지한다. */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
function newAttemptId(){try{if(crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});}
function initSave(){if(state.save)return;const saved=lsGet('mycode');
  state.save={attempt:newAttemptId(),takenAt:new Date().toISOString(),code:saved||'',remember:!!saved,busy:false,done:false,msg:'',cls:''};}
function normCode(v){return(v||'').replace(/[\s-]+/g,'').toUpperCase();}
function fmtCode(c){return c.length>4?c.slice(0,4)+' '+c.slice(4):c;}
function escAttr(t){return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function renderCodeSave(){initSave();const v=state.save;const dis=(v.busy||v.done)?' disabled':'';
  return `<section class="code-save" aria-labelledby="cs-title">
    <h3 id="cs-title">이 결과를 내 기록에 담기</h3>
    <div class="cs-desc">${examData.codeContract?'코드를 넣어야 누적 결과에 남습니다.':'코드를 넣으면 이 회차 점수가 내 기록에 쌓입니다. 비워 두면 저장되지 않습니다.'}</div>
    <div class="cs-row"><input type="text" id="cs-code" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="11" placeholder="ABCD EFGH" aria-label="내 코드 8자" value="${escAttr(fmtCode(v.code))}" oninput="state.save.code=normCode(this.value)" onkeydown="if(event.key==='Enter')saveToCode()"${dis}>
      <button class="btn btn-primary" id="cs-btn" onclick="saveToCode()"${dis}>${v.busy?'저장 중…':v.done?'저장됨':'저장'}</button></div>
    <label class="cs-remember"><input type="checkbox" id="cs-remember" ${v.remember?'checked':''} onchange="state.save.remember=this.checked;if(!this.checked)lsSet('mycode',null)"> 이 기기에서 코드 기억하기</label>
    <div class="cs-msg ${v.cls}" role="status" aria-live="polite">${v.msg}</div>
    <div class="cs-foot">${examData.codeContract?'고른 보기도 함께 저장됩니다. /me/에서 언제든 지울 수 있습니다.<br>':''}이름·연락처·IP는 받지 않습니다. 코드를 가진 사람만 이 기록을 볼 수 있습니다.</div>
  </section>`;}
function setSaveMsg(msg,cls){const v=state.save;v.msg=msg;v.cls=cls||'';
  const box=document.querySelector('.code-save');if(!box){render();return;}
  const tmp=document.createElement('div');tmp.innerHTML=renderCodeSave();box.replaceWith(tmp.firstElementChild);}
async function saveToCode(){const v=state.save;if(!v||v.busy||v.done)return;
  const inp=document.getElementById('cs-code');if(inp)v.code=normCode(inp.value);const c=v.code;
  if(!c){setSaveMsg('코드를 넣어 주세요.','err');return;}
  if(/[0O1I]/.test(c)){setSaveMsg('이 코드는 0·O·1·I를 쓰지 않습니다.','err');return;}
  if(c.length!==8||[...c].some(ch=>!CODE_ALPHABET.includes(ch))){setSaveMsg('코드는 8자입니다. 다시 확인해 주세요.','err');return;}
  let correct=0;const items=[];const V1=!!examData.codeContract;
  examData.sections.forEach(s=>s.questions.forEach(q=>{const ok=isCorrect(q);if(ok)correct++;const it={n:q.id,pool:q.poolId,ok:ok};
    if(V1){it.a=isAnswered(q.id);const p=pickOf(q);if(p!==null)it.pick=p;}items.push(it);}));
  const body={code:c,attempt_id:v.attempt,exam:examData.round,taken_at:v.takenAt,correct:correct,total:totalQ(),items:items};
  if(V1)body.map_rev=examData.mapRev||1;
  v.busy=true;setSaveMsg('저장 중…','');
  /* 계약 v1.0 §2-4: 완료는 200(ok·dup)뿐. 429는 Retry-After, 503은 2·4·8·16초 지수 대기(최대 5회), 409 conflict·507 full은 재전송 안 함 */
  let st=0,j=null,tries=0;
  while(true){
    try{const r=await fetch(CODE_API,{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      st=r.status;j=null;try{j=await r.json();}catch(e){}
      if(st===429&&tries<5){tries++;const ra=Math.min(60,Math.max(1,parseInt(r.headers.get('Retry-After')||'5',10)||5));setSaveMsg('요청이 몰려 '+ra+'초 뒤 다시 보냅니다…','');await new Promise(res=>setTimeout(res,ra*1000));continue;}
      if(st===503&&tries<5){const w=2**(tries+1);tries++;setSaveMsg('서버가 잠시 바빠 '+w+'초 뒤 다시 보냅니다…','');await new Promise(res=>setTimeout(res,w*1000));continue;}
    }catch(e){v.busy=false;setSaveMsg('연결이 되지 않았습니다. 잠시 뒤 다시 시도해 주세요.','err');return;}
    break;}
  v.busy=false;
  if(st===200&&j&&j.ok){v.done=true;lsSet('mycode',v.remember?c:null);setSaveMsg(j.dup?'이미 저장된 응시입니다 ✓ 내 기록에서 볼 수 있습니다':'저장했어요 ✓ 내 기록에서 볼 수 있습니다','ok');return;}
  const err=j&&j.error;
  if(st===404)setSaveMsg('코드가 맞지 않습니다.','err');
  else if(st===400&&!V1)setSaveMsg('코드가 맞지 않습니다.','err');
  else if(st===400)setSaveMsg('결과 형식이 맞지 않아 저장하지 못했습니다. 선생님께 알려 주세요. ('+(err||'bad-request')+')','err');
  else if(st===507||err==='full')setSaveMsg('저장 공간이 찼습니다. 내 기록(/me/)에서 오래된 기록을 지운 뒤 다시 저장해 주세요.','err');
  else if(st===409){v.done=true;setSaveMsg('이 응시에는 이미 다른 결과가 저장돼 있습니다.','err');}
  else setSaveMsg('잠시 뒤 다시 시도해 주세요.','err');}
/* 계약 v1.0 §2-3 pick: TC는 빈칸 순서대로(무응답 칸 '-'), SE·RCM은 알파벳 오름차순, RC1·CR은 0~1개.
   RCS(문장 선택)는 문장 배열 고정 전까지 보내지 않는다(null = 필드 생략). */
function pickOf(q){const u=state.answers[q.id]||[];
  if(q.type==='RC_SELECT')return null;
  if(q.type==='TC'){if(!isAnswered(q.id))return [];return q.blanks.map((b,i)=>u[i]?u[i]:'-');}
  return u.filter(x=>x!==undefined&&x!=='').slice().sort();}


function renderReview(q){const u=state.answers[q.id]||[];const isRC=['CR','RC_SINGLE','RC_MULTI'].includes(q.type);
  let h='';
  if(q.type==='RC_SELECT'){const selN=u[0]?normSent(u[0]):null,corN=q.answer.length?normSent(q.answer[0]):null;
    h+='<div class="rev-passage">'+q.passage.split(/\n\n+/).map(para=>{const ss=splitSentences(para.replace(/<[^>]+>/g,''));
      return '<p>'+ss.map(s=>{const n=normSent(s);let c=(corN&&n===corN)?'rev-sent-correct':((selN&&n===selN)?'rev-sent-wrong':'');return c?`<span class="${c}">${s}</span>`:s;}).join(' ')+'</p>';}).join('')+'</div>';
    h+=`<div class="rev-stem">${q.questionText}</div><div style="font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);">초록 = 정답 문장 · 빨강 = 내가 고른 문장${corN?'':' · ⚠️ 정답 문장 매핑 검수 필요'}</div>`;
    return h;}
  if(isRC){h+=`<div class="rev-passage">${q.passage.split(/\n\n+/).map(p=>'<p>'+p+'</p>').join('')}</div>`;
    if(q.directions)h+=`<div class="directions">${q.directions}</div>`;
    h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.choices.map(c=>{const correct=q.answer.includes(c.label),mine=u.includes(c.label);
      let cls=correct?'is-correct':(mine?'is-wrong':'');let tag='';
      if(correct)tag='<span class="rev-tag t-correct">정답</span>';else if(mine)tag='<span class="rev-tag t-mine">내 선택</span>';
      const m=q.type==='RC_SINGLE'||q.type==='CR'?'oval':'square';
      return `<div class="rev-choice ${cls}"><span class="rc-let">${c.label}</span><div>${c.text}</div>${tag}</div>`;}).join('');
  }else if(q.type==='SE'){h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.choices.map(c=>{const correct=q.answer.includes(c.label),mine=u.includes(c.label);
      let cls=correct?'is-correct':(mine?'is-wrong':'');let tag=correct?'<span class="rev-tag t-correct">정답</span>':(mine?'<span class="rev-tag t-mine">내 선택</span>':'');
      return `<div class="rev-choice ${cls}"><div>${c.text}</div>${tag}</div>`;}).join('');
  }else{ // TC
    h+=`<div class="rev-stem">${q.questionText}</div>`;
    h+=q.blanks.map((bl,i)=>{const correct=q.answer[i],mine=u[i];const ct=labelText(q,correct);const mt=mine?labelText(q,mine):'미응답';const ok=mine===correct;
      return `<div class="rev-blank"><span class="bl">Blank ${bl.id==='i'?'(i)':bl.id==='ii'?'(ii)':'(iii)'}</span><br>정답: <span class="ans-ok">${ct}</span> · 내 답: <span class="${ok?'ans-ok':'ans-no'}">${mt}${mine&&!ok?' ✗':''}</span></div>`;}).join('');
  }
  return h;}

function renderExplanation(q){const e=examData.explanations[q.id]||{};const f=q.frequency;const ok=isCorrect(q);
  const months=f.months.join(', ');
  const myDisp=isAnswered(q.id)?myAnswerDisplay(q):'<span class="mark-skip">미응답</span>';
  let wrong='';
  if(e.wrong&&typeof e.wrong==='object'){wrong=Object.keys(e.wrong).map(L=>{const t=labelText(q,L);return `<li><b>(${L}) ${t?'<i>'+t+'</i>':''}</b> — ${e.wrong[L]}</li>`;}).join('');}
  return `<div class="exp-grid">
    <div class="exp-left"><div class="exp-col-title">▣ 풀이 다시보기</div>${renderReview(q)}</div>
    <div class="exp-right"><div class="exp-col-title">▤ 해설</div>
      <div class="exp-meta">
        <span class="m-id">모모집 ${q.poolId}</span>${q.part?`<span class="m-part">${q.part}</span>`:''}<span class="m-cnt">출제 ${f.count}회</span> ${tierBadge(f)}${q.ets?`<span class="m-ets">ETS 모의고사</span>`:''}
        <div class="m-row">출제 연월: ${months}${f.recent?` · 최근 1년 ${f.recent}회`:''}</div>
        ${q.link?`<div class="m-row"><a href="${q.link}" target="_blank" rel="noopener">전체 해설 보기 ↗</a></div>`:''}
        <div class="m-row m-ans">정답: <span class="ans-c">${correctDisplay(q)}</span> · 내 선택: <span class="ans-m ${ok?'':'mark-wrong'}">${myDisp}${ok?' ✓':' ✗'}</span></div>
      </div>
      ${e.html?`
      <div class="exp-sec"><h4>【해석】</h4><div class="md">${e.interp||''}</div></div>
      <div class="exp-sec"><h4>【유형·해법】</h4><div class="md">${e.strat||''}</div></div>
      <div class="exp-sec"><h4>【정답 근거】</h4><div class="md">${e.correct||''}</div></div>
      <div class="exp-sec"><h4>【오답 이유】</h4><div class="md">${e.wrong||''}</div></div>
      ${e.vocab?`<div class="exp-sec"><h4>【핵심 어휘】</h4><div class="md">${e.vocab}</div></div>`:''}`:`
      <div class="exp-sec"><h4>【해석】</h4><p>${e.interp||''}</p></div>
      <div class="exp-sec"><h4>【유형·해법】</h4><p>${e.strat||''}</p></div>
      <div class="exp-sec"><h4>【정답 근거】</h4><p>${e.correct||''}</p></div>
      <div class="exp-sec"><h4>【오답 이유】</h4><ul>${wrong}</ul></div>`}
      ${e.uncertain?'<div class="exp-uncertain">⚠️ 근거 불확실 — 검수 필요</div>':''}
    </div></div>`;}

/* ---- handlers ---- */
function handleStart(){state.screen='sectionIntro';render();}
function handleSectionStart(){state.screen='question';state.questionIdx=0;startTimer();render();}
function handlePrev(){if(state.questionIdx>0){state.questionIdx--;render();}}
function handleNext(){if(state.questionIdx<curSection().questions.length-1){state.questionIdx++;render();}}
document.addEventListener('DOMContentLoaded',render);render();

</script>
