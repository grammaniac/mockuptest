<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Verbal 빈출 문제 모의고사 — 무료 공개 1회</title>
<style>
:root{
  --bg:#f7f5f0; --paper:#fff; --ink:#1a1a1a; --ink-soft:#555; --ink-mute:#888;
  --line:#d8d4ca; --line-soft:#e8e5dd; --accent:#1f3a5f; --accent-soft:#e8eef5;
  --correct:#2d6a4f; --wrong:#b03a2e; --warn:#c0392b; --highlight:#fff3a8;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
  --ui:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --serif:'Iowan Old Style','Palatino','Georgia','Noto Serif KR',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;}
body{background-image:radial-gradient(circle at 20% 10%,rgba(31,58,95,.03) 0,transparent 50%),radial-gradient(circle at 80% 90%,rgba(31,58,95,.03) 0,transparent 50%);}
.ui{font-family:var(--ui);}

/* topbar */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;font-family:var(--ui);}
.topbar-left{font-size:13px;color:var(--ink-soft);}
.topbar-left .label{color:var(--ink-mute);margin-right:6px;} .topbar-left .value{color:var(--ink);font-weight:600;}
.timer{font-family:'SF Mono','Menlo',monospace;font-size:21px;font-weight:600;color:var(--accent);letter-spacing:.05em;padding:5px 13px;background:var(--accent-soft);border-radius:4px;min-width:104px;text-align:center;}
.timer.warning{color:var(--warn);background:#fdecea;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.progress-bar{height:3px;background:var(--line-soft);} .progress-fill{height:100%;background:var(--accent);transition:width .3s;}

main{max-width:1120px;margin:0 auto;padding:30px 26px 120px;}

/* buttons */
.btn{font-family:var(--ui);font-size:14px;font-weight:500;padding:11px 22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;transition:all .15s;}
.btn:hover:not(:disabled){border-color:var(--ink);background:#fafaf7;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover:not(:disabled){background:#15294a;border-color:#15294a;}
.btn-finish{background:var(--correct);color:#fff;border-color:var(--correct);}
.btn-finish:hover:not(:disabled){background:#1d4d39;}
.btn-large{font-size:16px;padding:14px 38px;}

/* ===== INTRO (1-viewport) ===== */
.intro{max-width:640px;margin:34px auto;text-align:center;}
.intro-eyebrow{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px;}
.intro-title{font-family:var(--serif);font-size:2.2em;font-weight:700;line-height:1.3;letter-spacing:-.01em;}
.intro-round{font-size:1.1em;font-style:italic;color:var(--ink-soft);margin-top:4px;}
.main-copy{background:linear-gradient(180deg,#fbfaf6,#f3f0e8);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 24px;margin:20px auto;max-width:560px;font-size:1.18em;font-weight:600;line-height:1.5;color:var(--accent);}
.author{font-size:1.05em;font-weight:500;color:var(--ink-soft);margin-bottom:18px;letter-spacing:.02em;white-space:pre-wrap;}
.intro-info{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 26px;max-width:600px;margin:0 auto 16px;text-align:left;box-shadow:var(--shadow);}
.intro-info .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-family:var(--ui);font-size:14px;}
.intro-info .row:last-child{border-bottom:none;}
.intro-info .k{color:var(--ink-mute);} .intro-info .v{color:var(--ink);font-weight:500;}
.intro-note{max-width:600px;margin:0 auto 18px;text-align:left;font-family:var(--ui);font-size:.92em;color:var(--ink-soft);line-height:1.7;}
.intro-note ul{padding-left:20px;} .intro-note li{margin-bottom:3px;}

/* section intro / end */
.card-center{max-width:580px;margin:54px auto;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:46px 44px;box-shadow:var(--shadow);}
.card-center .num{font-family:var(--ui);font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:16px;}
.card-center h2{font-family:var(--serif);font-size:2.1em;font-weight:700;margin-bottom:20px;}
.card-center .meta{font-family:var(--ui);font-size:15px;color:var(--ink-soft);margin-bottom:30px;line-height:1.8;}
.card-center .meta strong{color:var(--ink);}
.warn-box{background:#fdf6ec;border:1px solid #f0d9b5;border-radius:8px;padding:16px 18px;margin:0 auto 26px;max-width:460px;font-family:var(--ui);font-size:14px;color:#92400e;line-height:1.7;}
.end-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* question */
.question-meta{font-family:var(--ui);font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.14em;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.question-meta .qtype{background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:3px;font-size:11px;}
.layout-rc{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:start;}
.passage{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:24px 28px;font-size:15.5px;line-height:1.82;box-shadow:var(--shadow);}
@media(min-width:769px){.passage{position:sticky;top:82px;max-height:calc(100vh - 108px);overflow-y:auto;}}
.passage::-webkit-scrollbar{width:8px;} .passage::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.passage-label{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;margin-bottom:14px;}
.qnum-badge{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 10px;border-radius:4px;margin-bottom:16px;}
.passage p{margin-bottom:12px;text-align:justify;} .passage p:last-child{margin-bottom:0;}
.highlighted{background:var(--highlight);padding:1px 2px;border-radius:2px;}
.passage .sentence{cursor:pointer;padding:0 1px;border-radius:2px;transition:background .12s;}
.passage .sentence:hover{background:rgba(31,58,95,.12);}
.passage .sentence:focus{outline:2px solid var(--accent);outline-offset:1px;}
.passage .sentence.sel{background:#bcd6f0;box-shadow:inset 0 -2px 0 var(--accent);}
.rev-sent-correct{background:#cde8d8;padding:0 1px;border-radius:2px;} .rev-sent-wrong{background:#f6cfca;padding:0 1px;border-radius:2px;}
.question-body{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 32px;box-shadow:var(--shadow);}
.question-text{font-size:16.5px;line-height:1.7;margin-bottom:22px;font-weight:500;}
.directions{font-family:var(--ui);font-size:13.5px;color:var(--ink-soft);font-style:italic;margin-bottom:16px;}

/* choices markers */
.choices{list-style:none;}
.choice{display:flex;gap:13px;align-items:flex-start;padding:9px 6px;margin-bottom:2px;border:none;border-radius:0;cursor:pointer;transition:background .12s;font-size:15.5px;line-height:1.55;}
.choice:hover{background:#faf9f4;}
.choice .mk{flex-shrink:0;margin-top:3px;border:2px solid var(--ink-mute);background:#fff;transition:all .12s;}
.choice.oval .mk{width:24px;height:15px;border-radius:50%;}
.choice.square .mk{width:16px;height:16px;border-radius:3px;}
.choice.selected{background:var(--accent-soft);border-radius:6px;}
.choice.selected .mk{border-color:var(--accent);background:var(--accent);}
.se-hint{font-family:var(--ui);font-size:13px;color:var(--ink-mute);margin-bottom:10px;}
.se-warning{font-family:var(--ui);font-size:13px;color:var(--warn);margin-top:12px;padding:8px 12px;background:#fdecea;border-radius:4px;display:none;}
.se-warning.show{display:block;}

/* TC table */
.tc-table{border-collapse:collapse;margin-top:6px;width:100%;max-width:560px;}
.tc-table th{font-family:var(--ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);font-weight:700;border:1px solid var(--line);padding:9px 8px;background:#fafaf7;text-align:center;}
.tc-table td{border:1px solid var(--line);padding:12px 16px;cursor:pointer;font-size:15px;transition:all .1s;}
.tc-table td:hover{background:#faf9f4;}
.tc-table td.selected{background:var(--accent-soft);font-weight:600;box-shadow:inset 0 0 0 2px var(--accent);}
.tc-table.single{max-width:430px;}

/* footer nav */
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;z-index:5;box-shadow:0 -2px 10px rgba(0,0,0,.03);}
.footer-nav .nav-group{display:flex;gap:10px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--paper);border-radius:8px;padding:34px 38px;max-width:460px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);}
.modal h3{font-size:20px;margin-bottom:14px;font-weight:600;}
.modal p{font-family:var(--ui);font-size:14.5px;color:var(--ink-soft);margin-bottom:26px;line-height:1.6;}
.modal .modal-actions{display:flex;gap:10px;justify-content:center;}

/* results */
.results{max-width:1000px;margin:0 auto;}
.results-header{text-align:center;margin-bottom:34px;}
.results-header .eyebrow{font-family:var(--ui);font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px;}
.results-header h2{font-family:var(--serif);font-size:2.2em;font-weight:700;}
.score-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:34px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;text-align:center;box-shadow:var(--shadow);}
.score-cell .label{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px;}
.score-cell .value{font-size:46px;font-weight:300;color:var(--accent);line-height:1;}
.score-cell .value .total{font-size:21px;color:var(--ink-mute);}
.score-cell .sub{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
/* 내 기록 코드 저장 (Portal «기록 코드», 2026-11-06) */
.code-save{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);font-family:var(--ui);}
.code-save h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.code-save .cs-desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.55;}
.code-save .cs-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.code-save input[type=text]{font-family:'SF Mono','Menlo',monospace;font-size:17px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--line);border-radius:6px;width:13ch;min-width:0;}
.code-save input[type=text]:disabled{background:var(--line-soft);}
.code-save .cs-remember{font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;margin-top:10px;}
.code-save .cs-msg{font-size:13.5px;margin-top:10px;min-height:1em;}
.code-save .cs-msg.ok{color:var(--correct);font-weight:600;} .code-save .cs-msg.err{color:var(--wrong);}
.code-save .cs-foot{font-size:12px;color:var(--ink-mute);margin-top:10px;}
.diag-note{border-left:3px solid var(--accent);background:#f4f7fb;padding:10px 14px;font-family:var(--ui);font-size:.95em;color:var(--ink);line-height:1.6;margin:-6px 0 18px;border-radius:0 6px 6px 0;}
.meta-notice{background:#fafaf7;border:1px solid var(--line-soft);border-radius:8px;padding:12px 16px;font-family:var(--ui);font-size:.9em;color:var(--ink-soft);line-height:1.6;margin-bottom:18px;}
.exp-controls{display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px;}
.results-table{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px;box-shadow:var(--shadow);}
.results-table table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px;}
.results-table th{background:#fafaf7;padding:13px 14px;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;border-bottom:1px solid var(--line);}
.results-table td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
.results-table tr.section-divider td{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.mark-correct{color:var(--correct);font-weight:700;} .mark-wrong{color:var(--wrong);font-weight:700;} .mark-skip{color:var(--ink-mute);}
.exp-toggle{font-family:var(--ui);font-size:12.5px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;}
.exp-toggle:hover{background:var(--accent-soft);}
.m-pool{font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.tier{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.tier-top{background:#b8860b;color:#fff;} .tier-high{background:var(--accent);color:#fff;}
.tier-mid{background:#6b7a8f;color:#fff;} .tier-low{background:#e8e5dd;color:var(--ink-soft);}
.tier-legend{font-family:var(--ui);font-size:12px;color:var(--ink-soft);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}

/* explanation 2-col */
.exp-row td{padding:0 !important;background:#fbfaf6;border-bottom:2px solid var(--line);}
.exp-wrap{padding:22px 22px;}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
.exp-col-title{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:12px;border-bottom:1px solid var(--line-soft);padding-bottom:6px;}
.rev-passage{background:#fff;border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:6px;padding:16px 18px;font-size:14.5px;line-height:1.75;margin-bottom:14px;}
.rev-stem{font-size:15px;font-weight:600;margin-bottom:12px;line-height:1.6;}
.rev-choice{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line-soft);border-radius:6px;margin-bottom:6px;font-size:14px;line-height:1.5;}
.rev-choice .rc-let{font-family:var(--ui);font-weight:700;color:var(--ink-mute);min-width:18px;}
.rev-choice.is-correct{background:#eaf5ef;border-color:var(--correct);}
.rev-choice.is-wrong{background:#fdeeec;border-color:var(--wrong);}
.rev-tag{font-family:var(--ui);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:auto;white-space:nowrap;}
.rev-tag.t-correct{background:var(--correct);color:#fff;} .rev-tag.t-mine{background:var(--wrong);color:#fff;}
.rev-blank{font-size:14px;margin-bottom:8px;padding:8px 12px;border:1px solid var(--line-soft);border-radius:6px;}
.rev-blank .bl{font-family:var(--ui);font-weight:700;color:var(--ink-mute);font-size:12px;}
.ans-ok{color:var(--correct);font-weight:600;} .ans-no{color:var(--wrong);font-weight:600;}

.exp-meta{background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-family:var(--ui);font-size:13px;line-height:1.7;}
.exp-meta .m-id{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.02em;}
.exp-meta .m-cnt{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:1px 9px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta .m-row{margin-top:6px;color:var(--ink-soft);}
.exp-meta .m-ans .ans-c{color:var(--correct);font-weight:700;} .exp-meta .m-ans .ans-m{font-weight:700;}
.exp-sec{margin-bottom:13px;}
.exp-sec h4{font-family:var(--ui);font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.02em;}
.exp-sec p,.exp-sec li{font-size:14px;line-height:1.65;color:var(--ink);}
.exp-sec ul{padding-left:4px;list-style:none;} .exp-sec li{margin-bottom:5px;}
.exp-sec li b{color:var(--ink);}
.exp-uncertain{color:var(--warn);font-weight:700;font-family:var(--ui);font-size:12.5px;margin-top:6px;}

/* v2: Mark / Review (ETS) */
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-btn{font-family:var(--ui);font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px;cursor:pointer;}
.tb-btn:hover{border-color:var(--ink);}
.tb-btn.marked{background:#fff6d6;border-color:#b8860b;color:#7a5a00;}
.review-wrap{max-width:760px;margin:0 auto;}
.review-wrap h2{font-family:var(--serif);font-size:1.7em;margin-bottom:6px;}
.review-wrap .sub{font-family:var(--ui);font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
.review-table{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
.review-table th{background:#fafaf7;text-align:left;padding:11px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);border-bottom:1px solid var(--line);}
.review-table td{padding:10px 14px;border-bottom:1px solid var(--line-soft);}
.review-table tr.rv-row{cursor:pointer;} .review-table tr.rv-row:hover td{background:var(--accent-soft);}
.review-table tr.rv-cur td{background:#eef3f9;font-weight:600;}
.st-ans{color:var(--correct);font-weight:600;} .st-not{color:var(--wrong);font-weight:600;} .st-inc{color:#b8860b;font-weight:600;}
.mk-flag{color:#b8860b;font-weight:700;}
/* v2: Vault 해설 */
.exp-sec .md p{margin-bottom:6px;} .exp-sec .md ul{padding-left:18px;list-style:disc;} .exp-sec .md li{margin-bottom:4px;}
.exp-sec .md table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:12.5px;margin-top:4px;}
.exp-sec .md th,.exp-sec .md td{border:1px solid var(--line-soft);padding:4px 6px;text-align:left;vertical-align:top;}
.exp-sec .md th{background:#f3f0e8;}
.exp-sec .md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--ink-soft);margin:6px 0;}
.exp-sec .md h5{font-family:var(--ui);font-size:12.5px;color:var(--ink-soft);margin:8px 0 3px;}
.exp-meta .m-part{display:inline-block;background:#fff;border:1px solid var(--accent);color:var(--accent);font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta .m-ets{display:inline-block;background:#1f3a5f;color:#fff;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;font-size:12px;}
.exp-meta a{color:var(--accent);font-weight:600;}
@media(max-width:768px){
  .layout-rc{grid-template-columns:1fr;}
  .passage{position:static !important;max-height:none !important;overflow-y:visible !important;top:auto !important;}
  .score-card{grid-template-columns:1fr;gap:18px;}
  .exp-grid{grid-template-columns:1fr;gap:18px;}
  main{padding:22px 14px 120px;} .intro-title{font-size:1.8em;}
}
@media print{.footer-nav,.topbar,.exp-controls,.results-actions,.code-save{display:none;}body{background:#fff;}}

/* 공개판: greverbal.com 안내 (build_pub.py) */
.promo{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);font-family:var(--ui);}
.promo h3{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:6px;}
.promo p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px;}
.promo .promo-row{display:flex;gap:8px;flex-wrap:wrap;}
a.btn{text-decoration:none;display:inline-block;}
@media print{.promo{display:none;}}
</style>

: "i", "choices": [{"label": "A", "text": "owing to"}, {"label": "B", "text": "despite"}, {"label": "C", "text": "reflecting"}]}, {"id": "ii", "choices": [{"label": "D", "text": "disarms"}, {"label": "E", "text": "attacks"}, {"label": "F", "text": "obscures"}]}, {"id": "iii", "choices": [{"label": "G", "text": "extolled"}, {"label": "H", "text": "refuted"}, {"label": "I", "text": "ignored"}]}], "answer": ["B", "D", "I"], "answerText": ["despite", "disarms", "ignored"], "directions": "For each blank select one entry from the corresponding column of choices. Fill all blanks in the way that best completes the text."}, {"id": "S2-Q5", "poolId": "RCCR 1027", "frequency": {"count": 2, "months": ["2025-12", "2026-08"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "One proposed explanation for the Cambrian explosion, the relatively short evolutionary event during which most major animal phyla evolved hard external parts, is that the Cambrian Period was simply a hospitable time for animals to evolve. However, recent discoveries indicate that the eggs of Cambrian jellyfish and bristle worms are large compared with those of their ancestors. This and the close resemblance of the embryos to their adult forms are clues that they hatched fully equipped to enter the environment rather than passing through a series of juvenile stages. This strategy, known as direct development, is common under harsh environmental conditions but is not the usual method of development because a highly developed hatchling comes with a high energy cost to its parent.", "passageGroupId": "G_1027", "rangeLabel": "S2 Q5-Q6", "questionText": "The passage suggests that when hatchlings are the product of direct development, they", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "differ from adults in relatively minor ways"}, {"label": "B", "text": "are poorly equipped to survive in harsh environments"}, {"label": "C", "text": "begin to forage for food almost immediately"}, t critical attention, her comparably quiet, yet formidable, corpus of poetry has been virtually ignored by scholars. Significantly, Jones's first publication appeared in verse, and her literary production from 1969 through the early 1980s includes nearly as many poems as short stories, betraying a formative and consistent involvement with poetry. Jones's lack of critical recognition as a poet is at least partially traceable to her documented ambivalence regarding genre boundaries and artistic identity: \"I've never really considered myself a poet. I've written what I call poetry but I've always thought of myself as primarily a fiction writer and so I write poetry from the viewpoint and interest of a storyteller.\" Consistent with this self-conceptualization, Jones's critical observations regarding the work of other poets often focus on techniques traditionally associated with fiction writing: narrative and its rendering usually appear to outweigh the various poetic conventions of prosody and form. While reviewing the work of Sterling Brown, Jones provides a <span class=\"highlighted\">checklist<\/span> of what chiefly attracts her in poetry: characterization and narrative voice are foregrounded, accompanied by such structural concerns of fiction as dramatic forms and scenes, all of which combine to reveal a sensibility interested primarily in formulating a poetics of effective storytelling.", "passageGroupId": "G_683", "rangeLabel": "S2 Q7-Q9", "questionText": "According to the passage, the \"checklist\" provides a record of which of the following?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "The features of Sterling Brown's poetry that Jones finds unique"}, {"label": "B", "text": "The techniques that Jones believes distinguish poetry from fiction"}, {"label": "C", "text": "Jones's effort to distinguish herself from other poets"}, {"label": "D", "text": "Ways in which Jones influenced Sterling Brown"}, {"label": "E", "text": "The qualities in poetry th  "B", "text": "It is more assertive than her poetry criticism."}, {"label": "C", "text": "It is acclaimed more as storytelling than as actual poetry."}, {"label": "D", "text": "It uses dramatic forms and scenes in unprecedented ways."}, {"label": "E", "text": "Its concern with narrative voice is greater than that of most fiction of the period."}], "answer": ["A"]}, {"id": "S2-Q9", "poolId": "RCCR 683", "frequency": {"count": 7, "months": ["2022-10", "2023-02", "2025-02", "2025-04", "2025-07", "2026-02", "2026-08"], "bucket": "상위", "recent": 2}, "part": "Part II", "ets": false, "passage": "While Gayl Jones's fiction has received significant critical attention, her comparably quiet, yet formidable, corpus of poetry has been virtually ignored by scholars. Significantly, Jones's first publication appeared in verse, and her literary production from 1969 through the early 1980s includes nearly as many poems as short stories, betraying a formative and consistent involvement with poetry. Jones's lack of critical recognition as a poet is at least partially traceable to her documented ambivalence regarding genre boundaries and artistic identity: \"I've never really considered myself a poet. I've written what I call poetry but I've always thought of myself as primarily a fiction writer and so I write poetry from the viewpoint and interest of a storyteller.\" Consistent with this self-conceptualization, Jones's critical observations regarding the work of other poets often focus on techniques traditionally associated with fiction writing: narrative and its rendering usually appear to outweigh the various poetic conventions of prosody and form. While reviewing the work of Sterling Brown, Jones provides a checklist of what chiefly attracts her in poetry: characterization and narrative voice are foregrounded, accompanied by such structural concerns of fiction as dramatic forms and scenes, all of which combine to reveal a sensibility interested primarily in formulating a poetics of effective storytelling.", "passageGroupId": "G_683", "rangeLabel": "S2 Q7-Q9", "questionText": "The passage suggests which of the following regarding critics of Jones's work?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "Their lack of interest in Jones's poetry has been prompted by their unawareness of the extent of her poetic production."}, {"label": "B", "text": "They have tended to judge Jones's work in different genres according to the definitions of those genres accepted by Jones's contemporaries."}, {"label": "C", "text": "The nature of their focus on Jones has been influenced by Jones's own characterizations of her work."}, {"label": "D", "text": "They have discounted Jones's observations regarding the work of other poets as narrow-minded."}, {"label": "E", "text": "They have foregrounded Jones's explorations of prosody and form at the expense of her interest in narrative."}], "answer": ["C"]}, {"id": "S2-Q10", "poolId": "TCSE 3685", "frequency": {"count": 1, "months": ["2026-09"], "bucket": "저빈도", "recent": 1}, "part": "Part V", "ets": false, "type": "SE", "questionText": "During early modern times, political arrangements in the Japanese province of Shinano were unusually __________: the central government reshuffled political roles in Shinano more rapidly than elsewhere.", "choices": [{"label": "A", "text": "variable"}, {"label": "B", "text": "antagonistic"}, {"label": "C", "text": "convoluted"}, {"label": "D", "text": "fluid"}, {"label": "E", "text": "contentious"}, {"label": "F", "text": "ineffective"}], "answer": ["A", "D"], "answerText": ["variable", "fluid"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q11", "poolId": "TCSE 2940", "frequency": {"count": 3, "months": ["2025-11", "2026-03", "2026-09"], "bucket": "중위", "recent": 3}, "part": "Part III", "ets": false, "type": "SE", "questionText": "A strong basic science program can be __________: the rate of return on capital invested in basic science is about three times that of capital invested in applied research and development.", "choices": [{"label": "A", "text": "idealistic"}, {"label": "B", "text": "remunerative"}, {"label": "C", "text": "lucrative"}, {"label": "D", "text": "transcendent"}, {"label": "E", "text": "feasible"}, {"label": "F", "text": "radical"}], "answer": ["B", "C"], "answerText": ["remunerative", "lucrative"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q12", "poolId": "TCSE 3469", "frequency": {"count": 3, "months": ["2023-09", "2025-12", "2026-04"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "type": "SE", "questionText": "Only novel ideas should be awarded patents; if a concept is __________ to practitioners in a given field or has previously been published in almost any fashion, that fact should invalidate the application.", "choices": [{"label": "A", "text": "lucrative"}, {"label": "B", "text": "manifest"}, {"label": "C", "text": "presented"}, {"label": "D", "text": "described"}, {"label": "E", "text": "obvious"}, {"label": "F", "text": "rewarding"}], "answer": ["B", "E"], "answerText": ["manifest", "obvious"], "directions": "Select the two answer choices that, when used to complete the sentence, fit the meaning of the sentence as a whole and produce completed sentences that are alike in meaning."}, {"id": "S2-Q13", "poolId": "RCCR 656", "frequency": {"count": 4, "months": ["2022-10", "2023-11", "2026-01", "2026-03"], "bucket": "상위", "recent": 2}, "part": "Part I", "ets": false, "passage": "Normally, seeds of Emmenanthe penduliflora stay dormant for years and germinate only when a fire burns through their habitat. Nitrogen dioxide in the smoke induces the seeds to germinate. Fires clear the brush, allowing germinating seeds to receive the sunlight they need to grow. The plants mature quickly, produce seeds, and then die. In areas with heavy automobile traffic, however, the seed germinates in the absence of fire, with automobile exhaust supplying the required nitrogen dioxide.", "passageGroupId": "G_656", "rangeLabel": "S2 Q13", "questionText": "The information given, if accurate, most strongly supports which of the following hypotheses?", "type": "CR", "choices": [{"label": "A", "text": "Fires in the habitat of E. penduliflora do not entirely destroy the plant’s seeds even in the places where the fire burns most intensely."}, {"label": "B", "text": "The nitrogen dioxide in automobile exhaust cannot harm plants of E. penduliflora, after germination."}, {"label": "C", "text": "If human intervention decreases the number of fires in the habitat of E. penduliflora, automobile exhaust can replicate the conditions the plant requires in order to thrive."}, {"label": "D", "text": "Within the habitat of E. penduliflora, natural fires are significantly more frequent in areas with heavy automobile traffic than they are in other areas."}, {"label": "E", "text": "Unless E. penduliflora seeds that have germinated can survive in the shade, automobile exhaust threatens the long-term survival of the plant in areas with heavy automobile traffic."}], "answer": ["E"], "stimulus": "Normally, seeds of Emmenanthe penduliflora stay dormant for years and germinate only when a fire burns through their habitat. Nitrogen dioxide in the smoke induces the seeds to germinate. Fires clear the brush, allowing germinating seeds to receive the sunlight they need to grow. The plants mature quickly, produce seeds, and then die. In areas with heavy automobile traffic, however, the seed germinates in the absence of fire, with automobile exhaust supplying the required nitrogen dioxide."}, {"id": "S2-Q14", "poolId": "RCCR 1051", "frequency": {"count": 2, "months": ["2026-03", "2026-06"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "Critics have traditionally reacted with ambivalence to the structure of American author William Wells Brown's novel Clotel (1853), noting, for instance, that the book contains \"enough material for a dozen novels.\" This comment is accurate in stating, hyperbolically, the richness of the novel, but its negative connotations need to be reinterpreted. Rather than a shortcoming, this wealth of material is in fact a crucial, deliberate element of Brown's aesthetic. Brown's narrative strategy is a finely tuned literary tool to re-create on the page—and to make readers experience, albeit mildly—the overwhelming, absurd, brutal, uncertain qualities of slavery. Brown mirrors in the very structure of the novel the uncertainty and limited control endemic to his characters' lives.", "passageGroupId": "G_1051", "rangeLabel": "S2 Q14-Q15", "questionText": "According to the passage, certain narrative strategies employed by Brown in Clotel", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "are characteristic of the author's fictional works"}, {"label": "B", "text": "are at odds with the novel's overarching themes"}, {"label": "C", "text": "anticipate the novel's dramatic resolution"}, {"label": "D", "text": "are directly related to the novel's subject matter"}, {"label": "E", "text": "are based on conventions used by early-nineteenth-century American writers"}], "answer": ["D"]}, {"id": "S2-Q15", "poolId": "RCCR 1051", "frequency": {"count": 2, "months": ["2026-03", "2026-06"], "bucket": "중위", "recent": 2}, "part": "Part IV", "ets": false, "passage": "Critics have traditionally reacted with ambivalence to the structure of American author William Wells Brown's novel Clotel (1853), noting, for instance, that the book contains \"enough material for a dozen novels.\" This comment is accurate in stating, hyperbolically, the richness of the novel, but its negative connotations need to be reinterpreted. Rather than a shortcoming, this wealth of material is in fact a crucial, deliberate element of Brown's aesthetic. Brown's narrative strategy is a finely tuned literary tool to re-create on the page—and to make readers experience, albeit mildly—the overwhelming, absurd, brutal, uncertain qualities of slavery. <span class=\"highlighted\">Brown mirrors in the very structure of the novel the uncertainty and limited control endemic to his characters' lives.<\/span>", "passageGroupId": "G_1051", "rangeLabel": "S2 Q14-Q15", "questionText": "Which of the following best describes the function of the highlighted sentence?", "type": "RC_SINGLE", "choices": [{"label": "A", "text": "It qualifies the claims for the novel made previously in the passage."}, {"label": "B", "text": "It validates traditional criticisms of the novel mentioned earlier in the passage."}, {"label": "C", "text": "It compares the novel's structure to that of other contemporary works."}, {"label": "D", "text": "It elaborates upon an idea expressed in the previous sentence."}, {"label": "E", "text": "It concedes that certain qualities in the novel's style could be considered flaws."}], "answer": ["D"]}]}], "passageGroups": {"G_871": {"appliedTo": ["S1-Q4", "S1-Q5"], "range": "S1 Q4-Q5"}, "G_77": {"appliedTo": ["S1-Q10", "S1-Q11", "S1-Q12"], "range": "S1 Q10-Q12"}, "G_1027": {"appliedTo": ["S2-Q5", "S2-Q6"], "range": "S2 Q5-Q6"}, "G_683": {"appliedTo": ["S2-Q7", "S2-Q8", "S2-Q9"], "range": "S2 Q7-Q9"}, "G_656": {"appliedTo": ["S2-Q13"], "range": "S2 Q13"}, "G_1051": {"appliedTo": ["S2-Q14", "S2-Q15"], "range": "S2 Q14-Q15"}}, "explanations": {"S1-Q1": {"html": true, "interp": "<p>그 고생물학자는 통용되던 분류법이 표본들 사이에 그럴듯하지만 실은 잘못된 구분을 지어내어 그 본질적 연속성을 가리고 실상과 다르게 비치게 한다고 보아, 그 문제를 새롭게 다시 검토했다.<\/p><p><b>해석 노트:<\/b> belie는 단순히 \"반박하다(disprove)\"가 아니라 \"실상을 감춰 사실과 다르게 보이도록 하다\"는 뜻이므로 \"가리고 실상과 다르게 비치게 하다\"로 두 겹을 풀었습니다. specious는 겉보기의 그럴듯함과 실제의 오류를 함께 담은 말이라 \"그럴듯하지만 실은 잘못된\"으로 옮겼습니다. 분사구문 believing that…은 판단의 근거이므로 \"…라고 보아\"로 주절 앞에 세워, 뒤에 매달릴 때 생기는 어색함을 없앴습니다. of the specimens와 among them이 같은 대상을 가리키므로 뒤쪽은 \"그\"로 받아 반복을 덜었습니다.<\/p>", "strat": "<p>강조 부호 없는 Zone5(관계절·분사 구조)와 문어체 공식이 함께 작동한다(4Rules 5 Zone·문어체, trigger-10 continuity ↔ specious distinctions의 대조 — but 같은 신호어는 없고, 정답 belie 자체가 trigger-10의 '역접을 유도하는 단어'다).<\/p><ul><li>핵심 구조: <code>the accepted classification 빈칸 the essential continuity … by making specious distinctions<\/code>. 타동사(빈칸)의 주어 \"accepted classification\"이 원인, \"by making specious distinctions(그럴듯하나 거짓된 구분을 만들어)\"가 수단이다(4Rules 문어체).<\/li><li>표본들은 본래 <b>연속성(continuity)<\/b>이 있는데, 분류법이 \"specious(허울뿐인) distinctions\"로 그것을 가린다 → 빈칸 동사 = \"(연속성을) 거짓으로 가리다·실상과 다르게 드러내다\".<\/li><li>고생물학자가 \"새롭게 다시(afresh)\" 본 이유 = 기존 분류가 진실(연속성)을 <b>호도<\/b>한다고 판단했기 때문. 표본의 <code>essential continuity<\/code> ↔ 분류법의 <code>specious distinctions<\/code>가 맞서는 이 대조(trigger-10 — 신호어 없이 두 말이 맞선다)가 belie의 방향을 확정한다.<\/li><\/ul>", "correct": "<p><b>belied(거짓으로 보이게 하다, 실상과 다르게 나타내다, 호도하다).<\/b> \"specious distinctions로 연속성을 가린다\"는 곧 연속성을 belie(실상과 어긋나게 드러냄)하는 것이다.<\/p><p><b>완성 문장<\/b><\/p><p>The paleontologist examined the problem afresh, believing that the accepted classification <b>belied<\/b> the essential continuity of the specimens by making specious distinctions among them.<\/p>", "wrong": "<ul><li><b>disproved(반증하다)<\/b>: 분류법이 연속성을 \"반증(논리적으로 거짓임을 증명)\"한 게 아니라, 거짓 구분으로 <b>가린<\/b> 것이다. 논증적 반증과 다르다.<\/li><li><b>conflated(뒤섞다, 혼동하다)<\/b>: specious \"distinctions(구분)\"를 만든다고 했으니 오히려 갈라놓는 쪽 → \"뒤섞다\"와 모순.<\/li><li><b>divulged(폭로하다, 누설하다)<\/b>: 연속성을 \"드러낸다\"는 정반대(가리는 게 아니라). 함정.<\/li><li><b>relaxed(완화하다)<\/b>: 의미축 무관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>belie<\/td><td>v.<\/td><td>거짓으로 보이게 하다, 호도하다<\/td><td>misrepresent, contradict<\/td><td>belied(정답)<\/td><\/tr><tr><td>disprove<\/td><td>v.<\/td><td>반증하다<\/td><td>refute, rebut<\/td><td>(거만어 외) 오답<\/td><\/tr><tr><td>conflate<\/td><td>v.<\/td><td>뒤섞다, 융합하다<\/td><td>merge, blend<\/td><td>오답(정반대)<\/td><\/tr><tr><td>divulge<\/td><td>v.<\/td><td>폭로하다, 누설하다<\/td><td>disclose, reveal<\/td><td>오답(정반대)<\/td><\/tr><tr><td>specious<\/td><td>adj.<\/td><td>그럴듯하나 거짓된, 허울뿐인<\/td><td>plausible but false<\/td><td>본문 단서어<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q2": {"html": true, "interp": "<p>1980년 루이스와 월터 앨버레즈(Luis and Walter Alvarez) 부자와 그 동료들이 백악기 말 대멸종을 파국적인 외계 충돌과 연결지었을 때, 대부분의 고생물학자들은 이를 회의의 눈길로 맞았다. 놀랄 일은 아니었다. 1800년대 중반 이래의 지질학 교육은 점진적 과정(gradual processes)이 무엇보다 앞선다고 가르쳐 왔기 때문이다.<\/p><p><b>해석 노트:<\/b> unsurprising을 ‘놀랍지 않은’이라는 관형형으로 앞 절에 붙이면 문장이 무거워지므로, 계속적 관계절을 끊어 ‘놀랄 일은 아니었다’라는 단문으로 세우고 given that절을 ‘…기 때문이다’로 받아 근거가 뒤따르게 했다. 영어의 한 문장을 그대로 끌지 않고 세 마디로 끊어 읽히게 한 것이다. gradual processes는 ‘서서히 일어나는 변화’ 대신 지질학 용어로 굳은 ‘점진적 과정’을 택해 동일과정설의 맥락을 살렸고, primacy는 명사 ‘우위’ 대신 ‘무엇보다 앞선다’는 서술로 풀어 그것이 교육이 주입해 온 신조임을 드러냈다.<\/p>", "strat": "<p><code>which was (i) given that …<\/code>(~을 고려하면 (i)했다)가 인과 설명이다(trigger-02 given/인과). given that 뒤가 (i)의 <em>근거<\/em>다.<\/p><p>근거: \"지질학 교육은 줄곧 (ii)의 우위를 강조\". 앨버레즈 가설은 \"<em>파국적·급작스러운<\/em> 충돌\"이다. 만약 학계가 \"<em>점진적<\/em> 과정\"을 정설로 배워 왔다면, 갑작스러운 파국설에 회의적인 건 <b>당연<\/b>하다.<\/p><ul><li>(ii) = \"점진적 과정(gradual processes)\" — 파국설과 대비.<\/li><li>(i) = \"놀랍지 않은(unsurprising)\" — 점진론을 배운 학계가 파국설을 의심한 건 당연.<\/li><\/ul>", "correct": "<ul><li><b>(i) unsurprising(놀랍지 않은·당연한)<\/b> — 점진론 교육을 받은 학계가 파국설을 의심한 건 예상되는 일.<\/li><li><b>(ii) gradual processes(점진적 과정)<\/b> — 지질학이 강조해 온 정설. \"파국적 충돌\"과 정반대라 회의를 부름.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>When in 1980 the father and son pair of Luis and Walter Alvarez and their colleagues linked the end-Cretaceous mass extinction to a catastrophic extraterrestrial impact, they were met with skepticism by most paleontologists, which was <b>unsurprising<\/b> given that geological training since the mid-1800s had emphasized the primacy of <b>gradual processes<\/b>.<\/p>", "wrong": "<ul><li><b>(i) unwarranted(부당한)<\/b> / <b>prescient(선견지명 있는)<\/b> — given that의 근거(점진론 교육)는 회의를 <em>정당화<\/em>하지, 부당하다고 하거나 선견지명이라 하지 않는다.<\/li><li><b>(ii) discernible causes(식별 가능한 원인)<\/b> — 파국적 충돌과 대비되는 축이 아니다(충돌도 식별 가능한 원인).<\/li><li><b>(ii) reversible changes(가역적 변화)<\/b> — \"급작 vs 점진\"의 대비축이 아니다. 근거 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>unsurprising<\/td><td>adj.<\/td><td>놀랍지 않은, 당연한<\/td><td>predictable, expected<\/td><td>(거만어 외). 정답(i)<\/td><\/tr><tr><td>gradual<\/td><td>adj.<\/td><td>점진적인, 서서히의<\/td><td>incremental, steady, slow<\/td><td>(거만어 외). 정답(ii). ↔ sudden/catastrophic<\/td><\/tr><tr><td>unwarranted<\/td><td>adj.<\/td><td>부당한, 근거 없는<\/td><td>unjustified, groundless<\/td><td>(거만어). 오답(i)<\/td><\/tr><tr><td>prescient<\/td><td>adj.<\/td><td>선견지명 있는, 예지의<\/td><td>farsighted, prophetic<\/td><td>(거만어 외). 오답(i)<\/td><\/tr><tr><td>skepticism<\/td><td>n.<\/td><td>회의, 의심<\/td><td>doubt, incredulity<\/td><td>skeptic (거만어, 명사형). 본문<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q3": {"html": true, "interp": "<p>역사적으로 중요한 건축물의 보존은 한때 논란을 거의 일으키지 않았다. 그러나 개별 건물에서 도시 구역 전체로 그 범위가 넓어지면서, 보존은 문화적 격전장(battleground)이 되었다. 논쟁의 상당 부분은 역사 지구로 보존된 지역에서 모더니즘 건축이 맡는 역할을 둘러싼 것이다. 보존 전문가들은 이런 환경에 모더니즘적 요소를 덧붙이는 일을 흔히 옹호하지만, 새 건물을 전통적인 모습으로 지어야 한다는 대중의 지지는 강하다.<\/p><p><b>해석 노트:<\/b> provoked little controversy는 부정어를 앞세워 '논란을 거의 일으키지 않았다'로 옮겨, 뒤따르는 But의 반전이 문장 사이에서 그대로 드러나게 했다. battleground는 '전쟁터'로 직역하면 과하고 '논쟁의 장'으로 흐리면 어감이 죽으므로, 두 진영이 맞붙는다는 비유를 살려 '격전장'으로 옮기고 원어를 병기했다. 현재완료 has widened·has become은 과거의 변화가 지금까지 이어진다는 상을 살려 '넓어지면서 ~이 되었다'로 연결했고, additions는 '추가물'이라는 사물명사보다 행위로 읽는 편이 자연스러워 '덧붙이는 일'로 풀어 advocate(옹호하다)의 목적어로 삼았다.<\/p>", "strat": "<p><code>once (i) … But …<\/code>(trigger-17 once = 과거 turning point, trigger-10 But)이 시간적 대조를 만든다. \"한때는 X였다 → 그러나 이제는 X 아님\".<\/p><ul><li><b>Blank (i)<\/b>: 둘째 문장이 \"문화적 […(ii)]이 되었다\"로 <em>갈등화<\/em>되므로, 과거에는 그 반대 → \"논쟁을 거의 일으키지 않았다(provoked little controversy)\".<\/li><li><b>Blank (ii)<\/b>: <code>But … it has become a cultural (ii)<\/code>. 이제는 논쟁거리 → \"전쟁터(battleground)\". (셋째 문장 \"Much of the debate\"가 trigger-06 식으로 받아줌.)<\/li><li><b>Blank (iii)<\/b>: 마지막 문장 <code>Although professionals (iii) … there is strong public support for keeping new buildings traditional<\/code>(trigger-10 Although 역접). 대중은 \"전통 유지\"를 원하므로, 전문가는 그와 <em>반대로<\/em> 모더니즘 추가물을 → \"옹호하다(advocate)\".<\/li><\/ul>", "correct": "<ul><li><b>(i) provoked little controversy(논쟁을 거의 일으키지 않았다)<\/b> · <b>(ii) battleground(전쟁터)<\/b> · <b>(iii) advocate(옹호하다)<\/b>.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Preservation of historically significant architecture once <b>provoked little controversy<\/b>. But as preservation’s scope has widened from individual buildings to entire urban districts, it has become a cultural <b>battleground<\/b>. Much of the debate involves modernist architecture’s role in areas preserved as historic districts. Although preservation professionals often <b>advocate<\/b> modernist additions to these settings, there is strong public support for keeping new buildings traditional.<\/p>", "wrong": "<ul><li><b>(i) faced much opposition / was widely misunderstood<\/b>: <code>But<\/code>으로 \"이제 갈등\"이 되려면 과거는 <em>평온<\/em>이어야 한다. 과거에 이미 반대/오해가 많았다면 시간 대조가 무너진다.<\/li><li><b>(ii) panacea(만병통치약) / catastrophe(대재앙)<\/b>: \"논쟁(debate)\"의 무대를 받는 말은 <em>전쟁터<\/em>다. 만병통치약은 정반대, 대재앙은 과장이며 \"debate\"와 결이 다르다.<\/li><li><b>(iii) loathe(혐오하다) / misconstrue(오해하다)<\/b>: <code>Although<\/code>로 대중(\"전통 유지\")과 대비되려면 전문가는 모더니즘을 <em>지지<\/em>해야 한다. loathe면 대중과 같은 편이 되어 역접이 사라진다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>advocate<\/td><td>v.<\/td><td>옹호하다, 지지하다<\/td><td>endorse, champion<\/td><td><\/td><\/tr><tr><td>battleground<\/td><td>n.<\/td><td>전쟁터, 논쟁의 장<\/td><td>arena of conflict<\/td><td>(거만어 외)<\/td><\/tr><tr><td>panacea<\/td><td>n.<\/td><td>만병통치약<\/td><td>cure-all<\/td><td><\/td><\/tr><tr><td>loathe<\/td><td>v.<\/td><td>혐오하다<\/td><td>abhor, detest<\/td><td><\/td><\/tr><tr><td>misconstrue<\/td><td>v.<\/td><td>오해하다<\/td><td>misinterpret<\/td><td><\/td><\/tr><\/table>", "uncertain": false}, "S1-Q4": {"html": true, "interp": "<p>제인 오스틴의 예술은 『수전(Susan)』과 『맨스필드 파크』 사이의 세월 동안 무엇이 바뀌었나? 오스틴의 후기 소설을 초기작과 구별하려는 시도는 <em>서로 이어지지 않는 일련의 구별<\/em>만 낳았다: 한 비평가는 후기작에서 더 철저한 사회 비판을 보고, 다른 비평가는 욕망의 요구를 새롭게 역설한 점을, 또 다른 비평가는 나폴레옹 전쟁에 대한 새로운 자각을 본다. 이런 특징짓기들은 <em>나무랄 데 없지만(unobjectionable)<\/em>, 오스틴의 예술이 <em>어떻게 성숙했는지를 일관되게 설명해 주지는 못한다.<\/em> 또한 그런 구별들은 후기 소설의 더 높은 가치 — 더 깊은 정서적 깊이와 예술적 복잡성 — 에 대해 <span class=\"highlighted\">독자로서 우리가 공통으로 갖는 직관(common readerly intuitions)<\/span>도, 그 소설들이 18세기가 아니라 <em>19세기에 속함<\/em>을 보여 주는 <span class=\"highlighted\">주제적·태도적 발전(thematic and attitudinal developments)<\/span>도 <em>설명하지 못한다<\/em>.<\/p>", "strat": "<p><b>질문 1 — RC-08<\/b><\/p><p><b>주제 문장 = S3<\/b> — S1 의문문 «What changed, in Jane Austen's art…?»은 제목, S3 «While these characterizations are unobjectionable, they fail to provide a coherent account…»의 주절이 논지 = 주제.<\/p><p>논지: 기존 비평가들의 구별은 <em>단편적<\/em>이라, (1) 오스틴 예술의 <em>성숙<\/em>을 일관되게 설명 못 하고, (2) 독자의 직관(후기작이 더 우수)과 (3) 19세기적 주제·태도 발전도 설명 못 한다. 강조된 \"주제·태도 발전\"은 <em>기존 비평이 못 다룬<\/em> 미해결 항목. FAC 문장 기능 — 통념의 미흡 지적형.<\/p>", "correct": "<p>신호어: <code>The author notes the \"thematic and attitudinal developments\" primarily in order to<\/code> → 언급 목적(RC-08).<\/p><ul><li><b>★해법<\/b>: thematic and attitudinal developments가 든 문장(Nor do they explain …)을 해석한다. 이 어구는 앞 문장의 keyword «fail to provide a coherent account»를 support하는, 비평가들이 설명하지 못한 또 하나의 항목이다. 비평의 공백을 짚는 목적으로 읽고, 오스틴의 강점이나 영향 관계로 읽은 보기는 버린다.<\/li><li><b>정답 E — \"지문에 언급된 비평가들이 <em>여전히 설명하지 못한 사안을 식별<\/em>하기 위해\"<\/b><\/li><li>근거: \"주제·태도 발전\"은 \"Nor do they explain ~\"의 목적어 — 기존 구별이 <em>설명 못 하는<\/em> 또 하나의 항목으로 제시됨. 즉 비평가들이 <em>미해결<\/em>로 남긴 것을 짚는 기능. RC-08 해법: 그 언급이 앞 keyword(\"fail to provide a coherent account\")를 <em>support<\/em>.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A \"오스틴 작품의 <em>인정받지 못한 강점을 강조<\/em>\" — 강점 부각이 아니라 <em>비평의 공백<\/em>을 짚음. B \"<em>논쟁적인 측면을 예시<\/em>\" — 논쟁이 아니라 <em>미설명<\/em> 항목. C \"공통 독자 직관의 <em>부적절함을 부각<\/em>\" — 직관이 아니라 <em>비평가들<\/em>이 그것을 설명 못 함(주체 혼동). D \"오스틴이 19세기 작가들에게 <em>영향<\/em>\" — 영향 관계 아님.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>unobjectionable<\/td><td>adj.<\/td><td>나무랄 데 없는, 흠잡을 수 없는<\/td><td>acceptable, inoffensive<\/td><td>(거만어 외) 비평에 대한 평가<\/td><\/tr><tr><td>coherent<\/td><td>adj.<\/td><td>일관된, 조리 있는<\/td><td>consistent, unified<\/td><td>(거만어 외) \"coherent account\"<\/td><\/tr><tr><td>intuition<\/td><td>n.<\/td><td>직관<\/td><td>insight, instinct<\/td><td>(거만어 외) 핵심어<\/td><\/tr><tr><td>merit<\/td><td>n.<\/td><td>가치, 장점<\/td><td>worth, excellence<\/td><td>(거만어) \"higher merits\"<\/td><\/tr><tr><td>illustrate<\/td><td>v.<\/td><td>예시하다, 보여 주다<\/td><td>exemplify, demonstrate<\/td><td>(거만어) 오답 질문 1-B<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q5": {"html": true, "interp": "<p>제인 오스틴의 예술은 『수전(Susan)』과 『맨스필드 파크』 사이의 세월 동안 무엇이 바뀌었나? 오스틴의 후기 소설을 초기작과 구별하려는 시도는 <em>서로 이어지지 않는 일련의 구별<\/em>만 낳았다: 한 비평가는 후기작에서 더 철저한 사회 비판을 보고, 다른 비평가는 욕망의 요구를 새롭게 역설한 점을, 또 다른 비평가는 나폴레옹 전쟁에 대한 새로운 자각을 본다. 이런 특징짓기들은 <em>나무랄 데 없지만(unobjectionable)<\/em>, 오스틴의 예술이 <em>어떻게 성숙했는지를 일관되게 설명해 주지는 못한다.<\/em> 또한 그런 구별들은 후기 소설의 더 높은 가치 — 더 깊은 정서적 깊이와 예술적 복잡성 — 에 대해 <span class=\"highlighted\">독자로서 우리가 공통으로 갖는 직관(common readerly intuitions)<\/span>도, 그 소설들이 18세기가 아니라 <em>19세기에 속함<\/em>을 보여 주는 <span class=\"highlighted\">주제적·태도적 발전(thematic and attitudinal developments)<\/span>도 <em>설명하지 못한다<\/em>.<\/p>", "strat": "<p><b>질문 2 — RC-02<\/b><\/p><p><b>주제 문장 = S3<\/b> — S1 의문문 «What changed, in Jane Austen's art…?»은 제목, S3 «While these characterizations are unobjectionable, they fail to provide a coherent account…»의 주절이 논지 = 주제.<\/p><p>논지: 기존 비평가들의 구별은 <em>단편적<\/em>이라, (1) 오스틴 예술의 <em>성숙<\/em>을 일관되게 설명 못 하고, (2) 독자의 직관(후기작이 더 우수)과 (3) 19세기적 주제·태도 발전도 설명 못 한다. 강조된 \"주제·태도 발전\"은 <em>기존 비평이 못 다룬<\/em> 미해결 항목. FAC 문장 기능 — 통념의 미흡 지적형.<\/p>", "correct": "<p>신호어: <code>The author … suggests which of the following about the \"common readerly intuitions\"?<\/code> → 추론(RC-02).<\/p><ul><li><b>★해법<\/b>: common readerly intuitions를 주어로 재구성한다. 저자는 이 직관(후기작이 더 깊고 복잡하다)을 반박하지 않고 비평가들이 «설명하지 못함»을 문제 삼으므로, 직관 자체는 타당하다고 전제한다. 비평가 구별의 한계를 직관의 결함으로 바꿔 놓은 보기는 주체 혼동이므로 버린다.<\/li><li><b>정답 B — \"그것들은 오스틴 후기 소설의 <em>품질에 대해 대체로 옳다<\/em>.\"<\/b><\/li><li>근거: 본문은 그 직관(후기작이 <em>더 깊고 복잡<\/em>하다)을 <em>반박하지 않고<\/em>, 오히려 비평가들이 그것을 <em>설명하지 못함<\/em>을 문제 삼는다. 즉 직관 자체는 타당하다고 전제(설명이 필요한 <em>참된<\/em> 현상으로 다룸). 비약 없는 추론.<\/li><\/ul>", "wrong": "<ul><li><b>오답<\/b>: A \"오스틴 예술이 <em>얼마나 크게 변했는지 못 잡음<\/em>\" — 그건 <em>비평가들의 구별<\/em>의 한계이지 <em>독자 직관<\/em>의 결함이 아님. C \"현재 학계 연구를 <em>예견<\/em>\" — 근거 없음. D \"<em>낡은 가정<\/em>에 기반\" — 본문은 직관을 낡았다 하지 않음(오히려 19세기적 발전을 감지하는 <em>유효한<\/em> 직관). E \"후기 소설이 <em>얼마나 다양한지<\/em>를 가리킴\" — 다양성이 아니라 <em>우수성(깊이·복잡성)<\/em>에 대한 직관.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>unobjectionable<\/td><td>adj.<\/td><td>나무랄 데 없는, 흠잡을 수 없는<\/td><td>acceptable, inoffensive<\/td><td>(거만어 외) 비평에 대한 평가<\/td><\/tr><tr><td>coherent<\/td><td>adj.<\/td><td>일관된, 조리 있는<\/td><td>consistent, unified<\/td><td>(거만어 외) \"coherent account\"<\/td><\/tr><tr><td>intuition<\/td><td>n.<\/td><td>직관<\/td><td>insight, instinct<\/td><td>(거만어 외) 핵심어<\/td><\/tr><tr><td>merit<\/td><td>n.<\/td><td>가치, 장점<\/td><td>worth, excellence<\/td><td>(거만어) \"higher merits\"<\/td><\/tr><tr><td>illustrate<\/td><td>v.<\/td><td>예시하다, 보여 주다<\/td><td>exemplify, demonstrate<\/td><td>(거만어) 오답 질문 1-B<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q6": {"html": true, "interp": "<p>환경을 지키기 위해 미국 정부는 현재 석탄재(coal ash)를 30년간 안전하게 보관하도록 요구한다 — 다만 “실현 가능하다면”이라는 단서가 붙는다. 그러나 석탄을 태우는 많은 나라에는 그처럼 이행 여부를 각자의 재량에 맡긴(discretionary) 환경 안전장치조차 없다.<\/p><p><b>해석 노트:<\/b> discretionary는 '강제되지 않고 당사자의 판단에 맡겨진'이라는 결이므로 \"재량에 맡긴\"으로 옮겼다. “if feasible”은 원문에서 술어 한가운데 삽입되어 있어 직역하면 문장이 끊기므로 뒤로 빼 \"단서가 붙는다\"로 독립시켰다(내용을 더한 것이 아니라 위치만 옮겼다). 원문의 대조 접속사 but은 미국의 규제와 다른 나라의 부재 사이에 걸리므로 그 자리를 \"그러나\"로 받았다. even such는 \"그처럼 ~조차\"로 받아 가장 느슨한 규제마저 없다는 양보의 계단을 드러냈다. 다른 정답 optional을 넣으면 \"선택 사항에 지나지 않는 환경 안전장치\"가 되어 뜻이 같다.<\/p>", "strat": "<p>trigger-06 반복: <code>such ___ safeguards<\/code>의 <code>such<\/code>가 앞의 미국 규정을 받는다. 따라서 빈칸 = 미국 규정의 <em>성격<\/em>을 한 단어로 요약한 것.<\/p><ul><li>미국 규정의 핵심 단서 = <code>\"if feasible\"<\/code>(실현 가능하면) — 즉 <em>강제가 아니라 임의·재량<\/em>에 맡긴 느슨한 규정. trigger-16 류 강조: \"그런 <em>재량적인<\/em>(느슨한) 장치<em>조차<\/em> 없다\"로 even/such의 강조와 호응.<\/li><li>빈칸 = \"재량적인, 임의의\". SE 동의어 쌍 → <code>discretionary<\/code>(재량적인)·<code>optional<\/code>(임의의, 선택적인).<\/li><\/ul>", "correct": "<ul><li><b>discretionary(재량적인)<\/b> / <b>optional(임의의)<\/b> — 둘 다 \"강제가 아니라 <em>마음대로 정할 수 있는<\/em>.\" <code>\"if feasible\"<\/code>(실현 가능하면)이라는 단서를 정확히 받음. \"그런 느슨한 장치<em>조차<\/em> 없다\"의 강조와도 호응.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>To help protect the environment, the United States government currently requires safe storage of coal ash for 30 years, “if feasible,” but many countries that burn coal lack even such <b>discretionary<\/b> environmental safeguards.<\/p>", "wrong": "<ul><li><b>modest(소박한)·practical(실용적인)<\/b> — <code>\"if feasible\"<\/code>이 가리키는 <em>재량성<\/em>과 다른 축(규모/실용성).<\/li><li><b>onerous(부담스러운)·burdensome(부담스러운)<\/b> — 동의어 쌍이긴 하나 \"if feasible(있으면 좋고)\" = <em>느슨함<\/em>과 <em>반대<\/em>(부담스러움) → 문장 모순.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>discretionary<\/td><td>adj.<\/td><td>재량적인, 임의의<\/td><td>optional, elective<\/td><td><\/td><\/tr><tr><td>optional<\/td><td>adj.<\/td><td>선택적인, 임의의<\/td><td>voluntary, elective<\/td><td>(거만어 외)<\/td><\/tr><tr><td>onerous<\/td><td>adj.<\/td><td>부담스러운, 성가신<\/td><td>burdensome, taxing<\/td><td><\/td><\/tr><tr><td>modest<\/td><td>adj.<\/td><td>소박한; 그리 크지 않은<\/td><td>unpretentious, moderate<\/td><td><\/td><\/tr><\/table>", "uncertain": false}, "S1-Q7": {"html": true, "interp": "<p>할렘 르네상스는 문학·시각예술 운동으로 폭넓게 연구되어 왔으나, 최근 학자들은 음악의 역할을 부수적인 데 그치지 않는 것으로, 실은 할렘 르네상스를 가능케 한 것으로 서술해 왔다.<\/p><p><b>해석 노트:<\/b> more than incidental을 “부수적 이상”으로 직역하면 우리말에서 정도 비교로 읽히지 않으므로 “부수적인 데 그치지 않는”으로 풀었다. incidental은 본류에 딸린 곁가지라는 결이라 “부수적”이 그 폄하의 어감까지 담는다. 세미콜론 뒤 in fact는 “실은”으로 받아 앞의 부정을 뒤집고 한 단계 끌어올리는 구조를 살렸고, 두 보어를 쉼표로 나란히 놓아 described ... as의 병렬이 한국어에서도 보이게 했다. has been studied는 수동태를 직역하지 않고 완료의 지속을 살려 “연구되어 왔으나”로 옮겼다. 다른 정답 peripheral을 넣어도 “주변적인 데 그치지 않는”, 곧 같은 뜻이 된다.<\/p>", "strat": "<p>\"음악의 역할을 <b>more than [빈칸]<\/b>; in fact, as having <b>made the Harlem Renaissance possible<\/b>\" 구조다. <code>more than … in fact …<\/code>는 \"단지 A가 아니라 사실은 (그보다 큰) B\"라는 <b>점층·강조<\/b>(trigger-09 계열: not only … but …)다. 뒤에 \"할렘 르네상스를 <b>가능케 한<\/b>(=필수적인)\"이 오므로, 빈칸은 그 <b>반대편<\/b> 극 — \"부수적인, 있으나 마나 한\"이어야 한다(\"음악은 부수적 이상이었다, 사실 필수였다\"). SE이므로 동의어 쌍을 고른다. 세미콜론(trigger-05) 뒤 <code>in fact, as having made the Harlem Renaissance possible<\/code>이 앞 <code>more than ___<\/code>를 풀어 준다. <code>more than ___<\/code>는 «단지 ___가 아니다»라는 내장된 not A이고, <code>in fact<\/code> 뒤에 더 강한 말이 온다(trigger-12 — trigger-09 점층과 같은 방향).<\/p>", "correct": "<p><b>incidental(부수적인, 우연히 딸린)<\/b> 과 <b>peripheral(주변적인, 중요치 않은)<\/b> — 둘 다 \"핵심이 아닌, 부차적인\"을 뜻하는 동의어 쌍. \"음악은 부수적인 것 <b>이상<\/b>이었고, 사실은 필수였다\"는 대비가 성립한다.<\/p><p><b>완성 문장<\/b><\/p><p>The Harlem Renaissance has been studied extensively as a literary and visual arts movement, but recent scholars have described the role of music as more than <b>incidental<\/b>; in fact, as having made the Harlem Renaissance possible.<\/p>", "wrong": "<ul><li><b>essential(필수적인)<\/b> / <b>necessary(필요한)<\/b> — 문장 뒷부분(\"made possible=필수\")과 <b>같은 극<\/b>이라, \"more than [필수]\"가 되어 의미가 뒤틀린다. 빈칸은 그 반대여야 한다.<\/li><li><b>mundane(평범한)<\/b> — \"부차적\"이 아니라 \"평범·일상적\"이라 방향이 어긋나고, peripheral과 동의어 쌍을 이루지 못한다.<\/li><li><b>emotional(감정적인)<\/b> — 역할의 경중과 무관한 속성. 문맥에 맞지 않는다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>incidental<\/td><td>형<\/td><td>부수적인, 우연히 딸린<\/td><td>minor, secondary<\/td><td>(거만어 외) 정답<\/td><\/tr><tr><td>peripheral<\/td><td>형<\/td><td>주변적인, 중요치 않은<\/td><td>marginal, tangential<\/td><td>거만어. incidental과 동의어 쌍<\/td><\/tr><tr><td>essential<\/td><td>형<\/td><td>필수적인<\/td><td>indispensable, vital<\/td><td>(거만어 외) 오답(반대)<\/td><\/tr><tr><td>mundane<\/td><td>형<\/td><td>평범한, 일상적인<\/td><td>ordinary, humdrum<\/td><td>거만어. 오답<\/td><\/tr><tr><td>Harlem Renaissance<\/td><td>명(고유)<\/td><td>할렘 르네상스<\/td><td>—<\/td><td>(거만어 외) 1920s 흑인 문화운동<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q8": {"html": true, "interp": "<p>응고 인자는 유용한 단백질이지만, 그 단순한 이름은 — 상당수는 로마 숫자만으로 불린다 — 정작 그 중요성과, 혈액의 희석과 응고에서 그것들이 맡은 역할이 얼마나 세밀하게 나뉘어 있는지를 가려 실상과 어긋난 인상을 준다.<\/p><p><b>해석 노트:<\/b> belie는 단순한 '가리다'가 아니라 '가린 결과 실상과 반대되는 인상을 준다'는 두 겹이 핵심이어서, '가려 실상과 어긋난 인상을 준다'로 두 겹을 모두 드러냈다. specificity는 '특정성'이라는 딱딱한 명사 대신 '얼마나 세밀하게 나뉘어 있는지'로 풀어, 인자마다 역할이 갈라져 있다는 실질을 살렸다. 대시 삽입절은 영어 위치를 그대로 두어 이름의 단순함을 예증하는 호흡을 유지했다. 다만 ‘이름이 단순해서 가린다’처럼 인과로 못 박지 않고, 원문 구조 그대로 ‘단순한 이름이 …을 가린다’로 두었다. 정답이 belie·mask 둘이므로 본문에는 belie를 넣었다. 다른 정답인 mask를 넣어도 '이름이 중요성을 가린다'는 같은 뜻이 되며, 다만 mask는 은폐 자체에, belie는 그 은폐가 실상과 반대되는 인상까지 준다는 데 무게가 실린다.<\/p>", "strat": "<p>\"단순한 이름 ↔ 중요·특정 역할\"의 함의된 대조가 축이다(trigger-16 only — 로마 숫자로만).<\/p><ul><li>핵심: <code>simple names — many known only by Roman numerals — 빈칸 their importance and the specificity of their roles<\/code>. 이름은 \"단순(로마 숫자뿐, only)\"한데, 실제 역할은 \"중요하고 특정적\"이다 → 단순함과 중요·특정성이 어긋난다.<\/li><li>그러므로 단순한 이름이 그 중요·특정성을 \"겉으로 가린다/실상과 다르게 보이게 한다\" = 빈칸.<\/li><li>SE이므로 \"가리다·실상을 숨기다\"라는 같은 방향의 <b>두 단어 pair<\/b>.<\/li><\/ul>", "correct": "<p><b>belie(실상과 다르게 보이게 하다)<\/b> 와 <b>mask(가리다, 감추다)<\/b>. 둘 다 \"단순한 이름이 그 중요·특정성을 겉으로 안 드러나게 함\"으로 의미가 같다(SE pair 성립).<\/p><p><b>완성 문장<\/b><\/p><p>Coagulation factors are useful proteins whose simple names—many are known only by Roman numerals—<b>belie<\/b> their importance and the specificity of their roles in the thinning and clotting of blood.<\/p>", "wrong": "<ul><li><b>nullify(무효화하다)<\/b> / <b>obviate(미연에 없애다)<\/b> / <b>mitigate(완화하다)<\/b>: 이름이 중요성을 \"없애거나 줄이는\" 것이 아니라, 단지 <b>가리는<\/b>(여전히 중요하되 안 보일 뿐) 것이다. 의미가 너무 강하거나 방향이 어긋남.<\/li><li><b>accentuate(강조하다, 두드러지게 하다)<\/b>: \"가림\"의 정반대. 단순한 이름이 중요성을 부각한다는 것은 본문 대조와 모순.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>belie<\/td><td>v.<\/td><td>실상과 다르게 보이게 하다, 가리다<\/td><td>misrepresent, disguise<\/td><td>정답 pair<\/td><\/tr><tr><td>mask<\/td><td>v.<\/td><td>가리다, 감추다<\/td><td>conceal, disguise<\/td><td>정답 pair<\/td><\/tr><tr><td>nullify<\/td><td>v.<\/td><td>무효화하다<\/td><td>invalidate, negate<\/td><td>오답<\/td><\/tr><tr><td>obviate<\/td><td>v.<\/td><td>미연에 없애다, 불필요하게 하다<\/td><td>preclude, forestall<\/td><td>오답<\/td><\/tr><tr><td>mitigate<\/td><td>v.<\/td><td>완화하다, 경감하다<\/td><td>alleviate, lessen<\/td><td>오답<\/td><\/tr><tr><td>accentuate<\/td><td>v.<\/td><td>강조하다, 두드러지게 하다<\/td><td>highlight, emphasize<\/td><td>(거만어 외) 오답(정반대)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q9": {"html": true, "interp": "<p>저자는 미국에서 지배적인 산업적 농업 체계가 지속 불가능하며, 따라서 그 체계를 더 굳건히 떠받치는(reinforce) 것이라면 무엇이든 의문시해야 한다고 주장했다.<\/p><p><b>해석 노트:<\/b> reinforces는 이미 서 있는 구조물에 힘을 덧대어 더 튼튼하게 만드는 '보강'의 결이므로, 밋밋한 '강화하다' 대신 \"더 굳건히 떠받치다\"로 옮겨 체계(system)라는 구조물 비유를 살렸다. prevails는 '만연하다'(부정적 확산)가 아니라 '지배적이다·우세하다'는 뜻이라 \"미국에서 지배적인\"으로 잡았다. anything that…은 \"~하는 것이라면 무엇이든\"으로 앞당겨 관계절이 뒤에서 밀려오는 번역기투를 피했고, 수동태 should be questioned는 한국어답게 능동 당위 \"의문시해야 한다\"로 풀었다. 다른 정답 buttresses(부벽으로 받치다)를 넣어도 '떠받쳐 지탱해 준다'는 같은 뜻이 된다.<\/p>", "strat": "<ul><li>구조: \"the system is unsustainable <b>and, therefore<\/b>(trigger-02 인과), anything that 빈칸 it should be <b>questioned<\/b>(의문시)\".<\/li><li>나쁜(지속 불가능한) 체계를 <b>떠받치는/강화하는<\/b> 것이라면 당연히 의심받아야 한다. 즉 빈칸 = \"그 체계를 <b>강화·지지하다<\/b>\". (만약 빈칸이 \"약화/위협\"이면, 나쁜 체계를 약화하는 것을 의심하라는 게 되어 논지와 모순.)<\/li><li>4Rules 문어체: \"그러므로(therefore)\" 뒤 동사 파트(Zone 2)가 키워드 자리 — \"강화하면 → 의심하라\".<\/li><li>SE이므로 \"강화·지지하다\"라는 같은 뜻의 두 단어 pair.<\/li><\/ul>", "correct": "<ul><li><b>reinforces<\/b>(강화하다): 나쁜 체계를 떠받침.<\/li><li><b>buttresses<\/b>(보강하다, 떠받치다): reinforces와 동의어 pair.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>The author argued that the industrial agricultural system that prevails in the United States is unsustainable and, therefore, anything that <b>reinforces<\/b> it should be questioned.<\/p>", "wrong": "<ul><li><b>streamlines<\/b>(간소화하다): \"강화\"와 다른 축 — 효율화이지 지지가 아님.<\/li><li><b>encumbers<\/b>(방해하다)·<b>endangers<\/b>(위태롭게 하다)·<b>hampers<\/b>(저해하다): 모두 체계를 <b>약화<\/b>시키는 정반대 극성. 셋끼리 pair될 수 있어 함정이지만, 그러면 \"나쁜 체계를 망치는 것을 의심하라\"는 모순 → 탈락.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>reinforce<\/td><td>v.<\/td><td>강화하다<\/td><td>bolster, fortify<\/td><td>(거만어 외)<\/td><\/tr><tr><td>buttress<\/td><td>v.<\/td><td>보강하다, 떠받치다<\/td><td>prop up, shore up<\/td><td><\/td><\/tr><tr><td>encumber<\/td><td>v.<\/td><td>방해하다, 짐 지우다<\/td><td>hinder, burden<\/td><td>반대 극성<\/td><\/tr><tr><td>streamline<\/td><td>v.<\/td><td>간소화하다<\/td><td>simplify, rationalize<\/td><td><\/td><\/tr><\/table>", "uncertain": false}, "S1-Q10": {"html": true, "interp": "<p>엘리자베스 개스켈은 소설가 샬럿 브론테의 첫 전기이자 가장 널리 알려진 전기인 『샬럿 브론테의 생애』(1857)에서, 브론테에 대해 오래도록 이어져 온 낭만적 견해를 퍼뜨렸다. 산업화가 큰 격동을 일으키던 시기에도 브론테는 영국 사회의 나머지와 아무런 연관이 없었으며, 그저 보랏빛 히스(heather)처럼 영국 시골에서 자연스레 솟아난 존재라는 것이다. 개스켈은 또한 브론테를 \"숙녀답지 못한\" 감정이나 위험한 견해를 품을 수 없는, 나무랄 데 없이 정숙한 인물로 그렸다 — 이는 매슈 아널드가 다소 거리를 둔 채로나마 브론테 소설 깊은 곳에서 정확히 간파한 전복적(subversive) 정신과는 어긋나는 것이었다. 개스켈의 오류와 누락을 마침내 상당 부분 바로잡은 위니프레드 제린의 『샬럿 브론테: 천재의 진화』(1967)조차 개스켈의 관점만은 버리지 못했다. 페미니스트들이 브론테의 삶에 대한 새로운 해석을 내놓기는 했으나, 그 삶에 영향을 미친 더 큰 세계 — 계급과 젠더의 낡은 구분이 압박을 받던 변화하는 영국 — 를 본격적으로 고려한 사람은 주로 줄리엣 바커다.<\/p>", "strat": "<p><b>질문 1 — 주제·목적<\/b><\/p><ul><li><b>주제 문장 = S4<\/b> — 바커가 브론테의 삶을 더 큰 사회적 맥락에서 해석했다는 관점의 변화를 제시한다. 앞의 개스켈과 제린에 대한 설명은 이 변화가 무엇을 넘어섰는지 보여 준다.<\/li><\/ul><p>FAC 흐름(FAC 문장 기능): 개스켈의 낭만적·정숙한 브론테상(像) 제시(FAC 1 논박 대상) → 아널드의 상반된 간파, 제린의 답습 → 페미니스트, 그리고 결정적으로 바커가 \"더 큰 사회 맥락\"을 도입. 글의 큰 줄기는 <b>브론테상에 대한 관점의 변화<\/b>(개스켈의 고립된 시골 천재상 → 바커의 사회 맥락 속 브론테). 저자 태도: 바커 쪽 진전을 긍정.<\/p>", "correct": "<ul><li><b>정답 근거 (C)<\/b>: 글은 개스켈 → 제린 → 페미니스트 → 바커로 이어지는 <b>브론테 삶에 대한 관점의 변화<\/b>를 논한다. \"discuss a change in perspective\"가 전체 구조와 정확히 일치.<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: (A) 여러 연구의 \"유사성\"이 아니라 관점의 \"변화\"가 핵심 — 범위 어긋남. (B) 저자가 바커 쪽 진전을 높이 사긴 하나, 글이 하는 일은 반론에 맞서 한 견해를 지키는(defend) 것이 아니라 개스켈→바커로 이어진 관점의 변화를 서술하는 것. (D) 사회 환경 묘사는 바커 부분의 일부일 뿐 전체 목적 아님(범위 초과). (E) 브론테를 \"초기 페미니스트 작가\"로 그리는 글이 아님 — 근거 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>subversive<\/td><td>adj.<\/td><td>전복적인, 체제 파괴적인<\/td><td>seditious, insurgent<\/td><td>(거만어 외) · 본문 핵심어<\/td><\/tr><tr><td>irreproachable<\/td><td>adj.<\/td><td>나무랄 데 없는<\/td><td>impeccable, blameless<\/td><td>(거만어 외)<\/td><\/tr><tr><td>impinge (on)<\/td><td>v.<\/td><td>영향을 미치다, 침범하다<\/td><td>encroach, affect<\/td><td><\/td><\/tr><tr><td>albeit<\/td><td>conj.<\/td><td>비록 ~이지만<\/td><td>although, even though<\/td><td><\/td><\/tr><tr><td>perspective<\/td><td>n.<\/td><td>관점, 시각<\/td><td>viewpoint, standpoint<\/td><td><\/td><\/tr><tr><td>at variance with<\/td><td>구<\/td><td>~와 어긋나는<\/td><td>inconsistent with<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q11": {"html": true, "interp": "<p>엘리자베스 개스켈은 소설가 샬럿 브론테의 첫 전기이자 가장 널리 알려진 전기인 『샬럿 브론테의 생애』(1857)에서, 브론테에 대해 오래도록 이어져 온 낭만적 견해를 퍼뜨렸다. 산업화가 큰 격동을 일으키던 시기에도 브론테는 영국 사회의 나머지와 아무런 연관이 없었으며, 그저 보랏빛 히스(heather)처럼 영국 시골에서 자연스레 솟아난 존재라는 것이다. 개스켈은 또한 브론테를 \"숙녀답지 못한\" 감정이나 위험한 견해를 품을 수 없는, 나무랄 데 없이 정숙한 인물로 그렸다 — 이는 매슈 아널드가 다소 거리를 둔 채로나마 브론테 소설 깊은 곳에서 정확히 간파한 전복적(subversive) 정신과는 어긋나는 것이었다. 개스켈의 오류와 누락을 마침내 상당 부분 바로잡은 위니프레드 제린의 『샬럿 브론테: 천재의 진화』(1967)조차 개스켈의 관점만은 버리지 못했다. 페미니스트들이 브론테의 삶에 대한 새로운 해석을 내놓기는 했으나, 그 삶에 영향을 미친 더 큰 세계 — 계급과 젠더의 낡은 구분이 압박을 받던 변화하는 영국 — 를 본격적으로 고려한 사람은 주로 줄리엣 바커다.<\/p>", "strat": "<p><b>질문 2 — 추론<\/b><\/p><ul><li><b>주제 문장 = S4<\/b> — 바커가 브론테의 삶을 더 큰 사회적 맥락에서 해석했다는 관점의 변화를 제시한다. 앞의 개스켈과 제린에 대한 설명은 이 변화가 무엇을 넘어섰는지 보여 준다.<\/li><\/ul><p>FAC 흐름(FAC 문장 기능): 개스켈의 낭만적·정숙한 브론테상(像) 제시(FAC 1 논박 대상) → 아널드의 상반된 간파, 제린의 답습 → 페미니스트, 그리고 결정적으로 바커가 \"더 큰 사회 맥락\"을 도입. 글의 큰 줄기는 <b>브론테상에 대한 관점의 변화<\/b>(개스켈의 고립된 시골 천재상 → 바커의 사회 맥락 속 브론테). 저자 태도: 바커 쪽 진전을 긍정.<\/p>", "correct": "<ul><li><b>정답 근거 (B)<\/b>: 개스켈은 브론테를 \"위험한 견해를 가질 수 없는 정숙한 인물\"로 그렸으나, 아널드는 소설 \"deep within\"에서 \"subversive spirit(전복적 정신)\"을 간파했다. 발문의 disapproved는 삽입구 \"albeit with distance\"에서 나온다 — 정확히 간파했으되 공감하지 않고 거리를 둠. 아널드가 못마땅해한 지점 = 소설에 묻혀 있는 위험한 사상 → \"contained dangerous ideas buried within it\".<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: (A) 시골 낭만화는 개스켈의 견해이지 아널드가 비판한 대상이 아님. (C) 낡은 사회 구분 영속화는 본문에 아널드의 비판으로 명시 안 됨. (D) 산업사회 묘사 실패는 언급 없음. (E) 정숙함에 대한 과도한 집착은 개스켈의 묘사이지 아널드의 비판점 아님 — 주체 혼동.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>subversive<\/td><td>adj.<\/td><td>전복적인, 체제 파괴적인<\/td><td>seditious, insurgent<\/td><td>(거만어 외) · 본문 핵심어<\/td><\/tr><tr><td>irreproachable<\/td><td>adj.<\/td><td>나무랄 데 없는<\/td><td>impeccable, blameless<\/td><td>(거만어 외)<\/td><\/tr><tr><td>impinge (on)<\/td><td>v.<\/td><td>영향을 미치다, 침범하다<\/td><td>encroach, affect<\/td><td><\/td><\/tr><tr><td>albeit<\/td><td>conj.<\/td><td>비록 ~이지만<\/td><td>although, even though<\/td><td><\/td><\/tr><tr><td>perspective<\/td><td>n.<\/td><td>관점, 시각<\/td><td>viewpoint, standpoint<\/td><td><\/td><\/tr><tr><td>at variance with<\/td><td>구<\/td><td>~와 어긋나는<\/td><td>inconsistent with<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S1-Q12": {"html": true, "interp": "<p>엘리자베스 개스켈은 소설가 샬럿 브론테의 첫 전기이자 가장 널리 알려진 전기인 『샬럿 브론테의 생애』(1857)에서, 브론테에 대해 오래도록 이어져 온 낭만적 견해를 퍼뜨렸다. 산업화가 큰 격동을 일으키던 시기에도 브론테는 영국 사회의 나머지와 아무런 연관이 없었으며, 그저 보랏빛 히스(heather)처럼 영국 시골에서 자연스레 솟아난 존재라는 것이다. 개스켈은 또한 브론테를 \"숙녀답지 못한\" 감정이나 위험한 견해를 품을 수 없는, 나무랄 데 없이 정숙한 인물로 그렸다 — 이는 매슈 아널드가 다소 거리를 둔 채로나마 브론테 소설 깊은 곳에서 정확히 간파한 전복적(subversive) 정신과는 어긋나는 것이었다. 개스켈의 오류와 누락을 마침내 상당 부분 바로잡은 위니프레드 제린의 『샬럿 브론테: 천재의 진화』(1967)조차 개스켈의 관점만은 버리지 못했다. 페미니스트들이 브론테의 삶에 대한 새로운 해석을 내놓기는 했으나, 그 삶에 영향을 미친 더 큰 세계 — 계급과 젠더의 낡은 구분이 압박을 받던 변화하는 영국 — 를 본격적으로 고려한 사람은 주로 줄리엣 바커다.<\/p>", "strat": "<p><b>질문 3 — 추론<\/b><\/p><ul><li><b>주제 문장 = S4<\/b> — 바커가 브론테의 삶을 더 큰 사회적 맥락에서 해석했다는 관점의 변화를 제시한다. 앞의 개스켈과 제린에 대한 설명은 이 변화가 무엇을 넘어섰는지 보여 준다.<\/li><\/ul><p>FAC 흐름(FAC 문장 기능): 개스켈의 낭만적·정숙한 브론테상(像) 제시(FAC 1 논박 대상) → 아널드의 상반된 간파, 제린의 답습 → 페미니스트, 그리고 결정적으로 바커가 \"더 큰 사회 맥락\"을 도입. 글의 큰 줄기는 <b>브론테상에 대한 관점의 변화<\/b>(개스켈의 고립된 시골 천재상 → 바커의 사회 맥락 속 브론테). 저자 태도: 바커 쪽 진전을 긍정.<\/p>", "correct": "<ul><li><b>정답 근거 (E)<\/b>: 개스켈은 브론테가 \"산업화와 무관하게 영국 시골에서 자연스레 솟아났다(sprung naturally ... out of the English countryside)\"고 그렸다 → \"chiefly the product of a rustic environment\".<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>: (A) \"가장 유명한 낭만주의 소설가\"는 전기의 명성에 대한 말이지 개스켈이 advance한 브론테상 아님. (B) 사회 변화의 옹호자 — 개스켈은 오히려 정숙·무관함을 강조, 정반대. (C) 산업화 반대 — 본문은 \"무관(no connection)\"이라 했지 \"반대\"는 아님. (D) 사회 격변에 강하게 영향받음 — 개스켈은 정확히 그 반대(무관)를 주장.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>subversive<\/td><td>adj.<\/td><td>전복적인, 체제 파괴적인<\/td><td>seditious, insurgent<\/td><td>(거만어 외) · 본문 핵심어<\/td><\/tr><tr><td>irreproachable<\/td><td>adj.<\/td><td>나무랄 데 없는<\/td><td>impeccable, blameless<\/td><td>(거만어 외)<\/td><\/tr><tr><td>impinge (on)<\/td><td>v.<\/td><td>영향을 미치다, 침범하다<\/td><td>encroach, affect<\/td><td><\/td><\/tr><tr><td>albeit<\/td><td>conj.<\/td><td>비록 ~이지만<\/td><td>although, even though<\/td><td><\/td><\/tr><tr><td>perspective<\/td><td>n.<\/td><td>관점, 시각<\/td><td>viewpoint, standpoint<\/td><td><\/td><\/tr><tr><td>at variance with<\/td><td>구<\/td><td>~와 어긋나는<\/td><td>inconsistent with<\/td><td>(거만어 외)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q1": {"html": true, "interp": "<p>밀과 보리, 호밀에 들어 있는 단백질인 글루텐(gluten)은 예전에는 셀리악병(celiac disease) 환자들만 피하던 것이었으나, 근래에는 누구나 지목하는 식단의 악당(villain)이 되었고, 글루텐 프리 식품은 사방에서 쏟아져 나오고 있다.<\/p><p><b>해석 노트:<\/b> popular를 '인기 있는'으로 직역하면 악당과 충돌하므로, '널리 퍼진 지목의 대상'이라는 본뜻을 살려 '누구나 지목하는'으로 풀었다. villain은 비유가 선명한 낱말이라 '기피 대상' 같은 밋밋한 말로 중화하지 않고 '악당'을 그대로 살렸다. was formerly avoided의 수동태는 '~에게 피해졌다'가 어색하므로 행위자를 주어로 돌려 '환자들만 피하던 것이었으나'로 능동 어순으로 옮겼고, 현재완료 has become은 '되었다'에 '근래에는'을 얹어 지금까지 이어지는 상태임을 드러냈다. 부대상황의 with 분사구문은 어느 쪽이 원인인지 원문이 못 박지 않으므로, 인과를 보태지 않고 '되었고, ~ 쏟아져 나오고 있다'로 나란히 놓았다.<\/p>", "strat": "<p>시간 신호어 <b>formerly … but recently …<\/b>(trigger-17 turning point + trigger-10 but 역접)가 핵심이다. 과거에는 \"특정 질환자만 피하던\" 대상이, 지금은 대중이 피한다는 turning point. 빈칸은 \"대중이 피해야 할 나쁜 것 = 식단의 악역\"이어야 한다. 단순히 \"유행\"이 아니라 \"기피 대상으로 지목된 것\"이라는 부정적 함의를 살린다.<\/p>", "correct": "<p><b>villain(악당, 주범)<\/b> — \"과거엔 일부만 피하던 것이 이제 대중적으로 피하는 식단의 악역이 되었다\"는 turning point에 부합. gluten-free 열풍 = 글루텐을 \"나쁜 것\"으로 몰아세우는 현상.<\/p><p><b>완성 문장<\/b><\/p><p>Gluten—a protein found in wheat, barley, and rye—was formerly avoided only by those suffering from celiac disease but has recently become a popular dietary <b>villain<\/b>, with gluten-free foods popping up everywhere.<\/p>", "wrong": "<ul><li>fad(일시적 유행): 그럴듯하나 \"기피 대상\"이라는 부정 극성이 빠짐. 빈칸은 \"피하는 대상\"이지 \"유행 자체\"가 아님.<\/li><li>substitute(대체물): 글루텐이 무엇의 대체물이 된 게 아님 — 의미 부정합.<\/li><li>panacea(만병통치약): 긍정 극성, 정반대.<\/li><li>scam(사기): 글루텐을 \"사기\"로 보는 건 과하고 문맥 근거 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>formerly<\/td><td>adv.<\/td><td>예전에<\/td><td>previously<\/td><td>trigger-17 신호<\/td><\/tr><tr><td>villain<\/td><td>n.<\/td><td>악당, (지목된) 주범<\/td><td>culprit<\/td><td>(거만어 외) · 정답<\/td><\/tr><tr><td>fad<\/td><td>n.<\/td><td>일시적 유행<\/td><td>craze<\/td><td>(거만어 외)<\/td><\/tr><tr><td>panacea<\/td><td>n.<\/td><td>만병통치약<\/td><td>cure-all<\/td><td><\/td><\/tr><\/table>", "uncertain": false}, "S2-Q2": {"html": true, "interp": "<p>일부 연구자들은, 새로 개발된 여러 이식 기법 중 단 하나만 사용한 연구 실험에 자금을 대기로 한 결정이, 결과가 긍정적이지 않을 경우 그 치료적 접근 전체를 후퇴시킬(set back) 수 있다고 우려했다. 지난주 신문과 잡지, 텔레비전 뉴스가 실망스러운 실험 결과를 보도하며 그 접근을 실패라고 규정하자, 그 우려는 앞일을 미리 내다본 것으로 보였다.<\/p><p><b>해석 노트:<\/b> set back에는 '뒤로 밀어 놓는다'는 물리적 결이 남아 있어 '지장을 주다' 같은 평평한 말 대신 '후퇴시키다'로 옮겼다 — 접근법 자체가 부정당한다기보다 그동안의 진전이 되돌려진다는 함의가 이 문제의 초점이기 때문이다. prescient는 서술 자리에서 '선견지명이 있었다'로 두면 딱딱해지므로 '앞일을 미리 내다본 것으로 보였다'로 풀어 seemed의 판단 어미와 맞췄다. as절은 시간과 원인이 겹치는 자리라 '~하자'로 처리해, 언론 보도가 그 우려를 사후에 입증했다는 순서가 그대로 읽히게 했다.<\/p>", "strat": "<ul><li><b>(i)<\/b>: \"결과가 부정적이면 치료적 접근 <b>전체를<\/b> (i)[…]할 수 있다\"는 걱정. 부정적 결과가 접근 전체에 미칠 나쁜 영향 = <b>후퇴시키다·해치다<\/b>.<\/li><li><b>(ii)<\/b>: 뒤 문장이 근거(trigger-02 인과). 실제로 \"실망스러운 결과 → 실패라고 보도\"되었으므로, 그 우려는 <b>들어맞았다<\/b> = <b>선견지명이 있었던(prescient)<\/b> 것으로 보였다.<\/li><\/ul>", "correct": "<ul><li><b>(i) set back(후퇴시키다, 지장을 주다)<\/b> — 부정적 결과가 치료 접근 전체를 뒷걸음질 치게 함.<\/li><li><b>(ii) prescient(선견지명이 있는)<\/b> — 우려가 실제로 들어맞음.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Some researchers worried that the decision to fund a research experiment that used only one of several newly developed transplant techniques could <b>set back<\/b> the whole therapeutic approach if the results were not positive. Those fears seemed <b>prescient<\/b> last week as newspapers, magazines, and television news programs reported the disappointing experimental results and called the approach a failure.<\/p>", "wrong": "<ul><li>(i) invigorate(활력을 불어넣다) / transform(변모시키다) — invigorate는 정반대(북돋움). transform은 좋고 나쁨이 불분명해 \"부정적 결과의 악영향\"에 맞지 않는다.<\/li><li>(ii) overblown(과장된) / understated(축소된) — 우려가 실제로 <b>적중<\/b>했으므로 \"과장·축소\"는 반대다. 특히 overblown은 \"괜한 걱정\"이라 결과(실패)와 모순된다.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>set back<\/td><td>동(구)<\/td><td>후퇴시키다, 지장을 주다<\/td><td>hinder, impede<\/td><td>(거만어 외) 정답 (i)<\/td><\/tr><tr><td>prescient<\/td><td>형<\/td><td>선견지명이 있는<\/td><td>far-sighted, prophetic<\/td><td>(거만어 외) 정답 (ii)<\/td><\/tr><tr><td>invigorate<\/td><td>동<\/td><td>활력을 불어넣다<\/td><td>energize, revitalize<\/td><td>거만어. 오답 (i, 반대)<\/td><\/tr><tr><td>overblown<\/td><td>형<\/td><td>과장된<\/td><td>exaggerated, inflated<\/td><td>거만어. 오답 (ii)<\/td><\/tr><tr><td>understate<\/td><td>동<\/td><td>축소해 말하다<\/td><td>downplay, minimize<\/td><td>거만어. 오답 (ii)<\/td><\/tr><tr><td>transplant<\/td><td>명/동<\/td><td>이식(하다)<\/td><td>graft<\/td><td>거만어. transplant techniques<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q3": {"html": true, "interp": "<p>도시의 성장이 여전히 널리 퍼진 현상인 것은 사실이지만, 도시 인구의 감소를 예외적인 이상(異常) 현상으로 여겨서는 안 된다. 실제로 쇠퇴하는 도시들 역시 성장하는 도시들 못지않게 현대라는 시대가 낳은 산물이었다.<\/p><p><b>해석 노트:<\/b> widespread는 부정적 함의가 없는 말이라 '만연한' 대신 '널리 퍼진'으로 옮겼고, While절은 '~인 것은 사실이지만'으로 끊어 주절과의 대비를 앞세웠다. anomaly는 단순한 '이례'가 아니라 정상 궤도에서 벗어난 예외라는 결을 지니므로 앞 문장의 phenomenon(현상)과 짝을 이루도록 '예외적인 이상(異常) 현상'으로 풀어, 뒤에 이어지는 '쇠퇴도 현대의 산물'이라는 반박과 정면으로 맞물리게 했다. 현재완료 have been은 지금까지 이어져 온 사실을 가리키므로 '산물이었다'로 받았고, 직역하면 어색한 as much A as B는 '못지않게'로 재구성했다.<\/p>", "strat": "<p><code>While A, B<\/code>(비록 A지만 B) 역접 구조(trigger-10)와, 콜론 뒤 <code>in fact<\/code>(사실은) 강조(trigger-12 not A + in fact + 더 강한 말, trigger-05 콜론 부연)가 핵심이다.<\/p><p>콜론 뒤 = <code>shrinking cities have been as much a product of the modern age as growing cities<\/code>(쇠퇴 도시도 성장 도시 <em>못지않게<\/em> 흔한 현대 현상). 이것이 (ii)를 정한다: 인구 감소를 \"(ii)로 여기지 말라\" + \"사실은 성장만큼 흔하다\" → (ii) = \"이례·예외(anomaly)\". \"예외로 보지 말라, 실은 흔하다\".<\/p><p>(i) — <code>While 도시 성장이 (i)한 현상이지만<\/code>. 콜론 뒤가 \"감소도 성장만큼 <em>흔하다<\/em>\"이므로, 성장도 당연히 \"흔한·널리 퍼진\" 현상. (i) = \"널리 퍼진\".<\/p>", "correct": "<ul><li><b>(i) widespread(널리 퍼진·흔한)<\/b> — 도시 성장은 흔한 현상.<\/li><li><b>(ii) an anomaly(이례·예외)<\/b> — 인구 감소를 <em>예외<\/em>로 보지 말라; 사실은 성장만큼 흔하다.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>While urban growth remains a <b>widespread<\/b> phenomenon, urban population loss should not be perceived as <b>an anomaly<\/b>: in fact, shrinking cities have been as much a product of the modern age as growing cities.<\/p>", "wrong": "<ul><li><b>(i) complex(복잡한)<\/b> — 콜론 뒤 \"흔하다(as much a product)\"라는 <em>빈도<\/em> 논리와 연결 안 됨.<\/li><li><b>(i) problematic(문제 있는)<\/b> — 가치 평가어. 뒤 \"감소가 흔하다\"의 <em>보편성<\/em>과 정합 약함.<\/li><li><b>(ii) a trend(추세)<\/b> — \"추세로 여기지 말라 + 사실 흔하다\"는 자기모순(추세=흔함).<\/li><li><b>(ii) a solution(해결책)<\/b> — 인구 감소를 \"해결책\"으로 보는 논리는 본문에 근거 없음.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>widespread<\/td><td>adj.<\/td><td>널리 퍼진, 만연한<\/td><td>prevalent, pervasive, rife<\/td><td>(거만어 외). 정답(i)<\/td><\/tr><tr><td>anomaly<\/td><td>n.<\/td><td>이례, 변칙, 예외<\/td><td>aberration, irregularity, deviation<\/td><td>(거만어 외). 정답(ii). 형용사 anomalous<\/td><\/tr><tr><td>problematic<\/td><td>adj.<\/td><td>문제가 있는, 미심쩍은<\/td><td>troublesome, questionable<\/td><td>(거만어). 오답(i)<\/td><\/tr><tr><td>trend<\/td><td>n.<\/td><td>추세, 경향<\/td><td>tendency, drift, current<\/td><td>(거만어 외). 오답(ii)<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q4": {"html": true, "interp": "<p>타루스킨(Taruskin)의 서양 음악사는 그 분량이 놀랍도록 방대함에도 포괄성을 표방하지 않는다. 타루스킨은 자기 책이 레퍼토리의 개관이 아니라 어디까지나 역사서임을 강조하는 데 꼼꼼하며, 그럴 만한 자부심도 지니고 있다. 실상 그는, 20세기 중반까지 영국 교향곡 전통을 이어 간 본 윌리엄스(Vaughan Williams) 같은 곁가지 작곡가들을 그냥 지나쳤노라고 선선히 인정함으로써, 누락을 문제 삼는 비판의 예봉을 미리 꺾어 놓는다.<\/p><p><b>해석 노트:<\/b> disarm은 상대의 무기를 미리 빼앗는다는 비유이므로 '무마한다'보다 '비판의 예봉을 미리 꺾어 놓는다'로 옮겨, 비판이 나오기 전에 스스로 인정해 버리는 전략의 결을 살렸다. cheerfully는 '유쾌하게'보다 거리낌 없는 태도에 가까워 '선선히'로, ignored는 고의적 무시가 아니라 다루지 않고 넘어갔다는 뜻이므로 '그냥 지나쳤다'로 옮겼다. 관계절 who maintained는 뒤에 늘어놓으면 문장이 늘어지므로 선행사 앞으로 당겨 수식어로 처리했고, despite 삽입구는 '…에도'로 주절 앞에 붙여 역접을 먼저 드러냈다. 인명은 국내 통용 표기를 따라 '본 윌리엄스'로 적었다.<\/p>", "strat": "<ul><li><b>(i)<\/b>: \"놀라운 분량에도 (i)[…], 포괄성을 주장하지 않는다.\" 방대한데도 포괄성을 주장하지 않는다는 것은 양보·역접이다(trigger-11 역접의 전치사). 따라서 (i) = <b>~에도 불구하고(despite)<\/b>.<\/li><li><b>(ii)·(iii)<\/b>: 그가 곁가지 작곡가를 \"(iii)[…]했음을 <b>유쾌히 인정<\/b>\"함으로써 누락 비판을 \"(ii)[…]\"한다. 잘못(누락)을 흔쾌히 시인하면 상대의 공격이 무력해지므로 (ii) = <b>무장 해제하다(disarms)<\/b>. 그리고 그가 인정하는 내용은 곁가지 작곡가를 다루지 않았다는 것이므로 (iii) = <b>무시했다·다루지 않았다(ignored)<\/b>.<\/li><\/ul>", "correct": "<ul><li><b>(i) despite(~에도 불구하고)<\/b> — 방대함에도 포괄성을 표방하지 않음.<\/li><li><b>(ii) disarms(무장 해제하다, 누그러뜨리다)<\/b> — 흔쾌한 인정으로 비판을 무력화.<\/li><li><b>(iii) ignored(무시했다, 다루지 않았다)<\/b> — 곁가지 작곡가를 뺐음을 인정.<\/li><\/ul><p><b>완성 문장<\/b><\/p><p>Taruskin's history of Western music, <b>despite<\/b> its remarkable length, makes no claims to comprehensiveness. Taruskin is punctilious, and justifiably proud, in emphasizing that his book is a work of history, not a survey of the repertory. In fact, he <b>disarms<\/b> criticism on grounds of omission by cheerfully admitting he has <b>ignored<\/b> such side-branch composers as Vaughan Williams, who maintained the British symphonic tradition into the mid-twentieth century.<\/p>", "wrong": "<ul><li>(i) owing to(~때문에) / reflecting(~을 반영하여) — 분량과 \"포괄성 없음\"은 인과가 아니라 <b>양보<\/b> 관계다. despite만이 맞는다.<\/li><li>(ii) attacks(공격하다) / obscures(흐리다) — 비판을 유쾌히 인정으로 \"무력화\"하는 것이지, 공격하거나 흐리는 것이 아니다.<\/li><li>(iii) extolled(격찬하다) / refuted(반박하다) — \"누락을 인정\"하는 문맥이므로, 곁가지 작곡가를 \"뺐다(ignored)\"여야 한다. 격찬·반박은 반대 방향.<\/li><\/ul>", "vocab": "<table><tr><th>단어<\/th><th>품사<\/th><th>핵심뜻<\/th><th>대표 동의어<\/th><th>비고<\/th><\/tr><tr><td>despite<\/td><td>전<\/td><td>~에도 불구하고<\/td><td>in spite of, notwithstanding<\/td><td>(거만어 외) 정답 (i), 역접 전치사<\/td><\/tr><tr><td>disarm<\/td><td>동<\/td><td>무장 해제하다, 누그러뜨리다<\/td><td>mollify, placate<\/td><td>(거만어 외) 정답 (ii)<\/td><\/tr><tr><td>ignore<\/td><td>동<\/td><td>(다루지 않고) 지나치다, 무시하다<\/td><td>overlook, pass over<\/td><td>(거만어 외) 정답 (iii) — has ignored<\/td><\/tr><tr><td>punctilious<\/td><td>형<\/td><td>꼼꼼한, 격식을 차리는<\/td><td>meticulous, scrupulous<\/td><td>(거만어 외) Taruskin is punctilious<\/td><\/tr><tr><td>comprehensiveness<\/td><td>명<\/td><td>포괄성, 망라성<\/td><td>thoroughness<\/td><td>(거만어 외) claims to comprehensiveness<\/td><\/tr><tr><td>repertory<\/td><td>명<\/td><td>(연주) 목록, 레퍼토리<\/td><td>repertoire<\/td><td>(거만어 외) survey of the repertory<\/td><\/tr><\/table>", "uncertain": false}, "S2-Q5": {"html": true, "interp": "<p><b>캄브리아 폭발(Cambrian explosion)<\/b>은 대부분의 주요 동물문(門)이 단단한 외부 구조를 갖추게 된, 비교적 짧은 진화적 사건이다. 이에 대해 제안된 한 설명은 캄브리아기가 단지 동물이 진화하기에 우호적인(hospitable) 시기였다는 것이다. 그러나 최근 발견들은 캄브리아기 해파리와 강모충(bristle worm)의 알이 그 조상들의 알보다 크다는 것을 보여 준다. 이 점과 <b>배아가 성체 형태와 매우 닮았다는 점<\/b>은, 이들이 일련의 유생(juvenile) 단계를 거치지 않고 <b>환경에 곧바로 나설 채비를 온전히 갖춘 채 부화<\/b>했다는 단서다. <b>직접 발생(direct development)<\/b>으로 알려진 이 전략은 가혹한 환경 조건에서 흔하지만, 고도로 발달한 상태로 부화한 새끼는 부모에게 큰 에너지 비용을 지우기 때문에 통상적인 발생 방법은 아니다.<\/p>", "strat": "<p><b>질문 1 — 추론<\/b><\/p><p><b>주제 문장 = S4<\/b> «This strategy, known as direct development, is common under harsh environmental conditions but is not the usual method of development because a highly developed hatchling comes with a high energy cost to its parent.» — 논박 구조의 글이다(설명문이 아니다).<\/p><ul><li><b>S1(논박 대상)<\/b>: 캄브리아 폭발에 대한 한 설명 — «그 시기가 그저 동물이 진화하기 좋은(hospitable) 때였다».<\/li><li><b>S2(However, 증거)<\/b>: 최근 발견 — 캄브리아기 해파리·갯지렁이의 알이 조상보다 크다.<\/li><li><b>S3(해석)<\/b>: 큰 알 + 성체를 닮은 배아 = 유생 단계를 건너뛰고 완전히 갖춰 부화하는 <b>직접 발생<\/b>의 단서.<\/li><li><b>S4(논박 = 주제)<\/b>: 직접 발생은 <b>가혹한 환경에서 흔한<\/b> 전략이고, 비용이 커서 통상적 방식은 아니다 → 캄브리아기가 «살기 좋은 때»였다는 설명과 어긋난다. 질문 2(주제·목적)의 답 D «설명의 타당성에 의문 제기»가 여기서 나온다.<\/li><\/ul><p>S2·S3만으로는 «우호적 시기» 설명과 충돌하지 않고, S4에 이르러서야 논박이 완성된다 — 마지막 문장이 주제인 예외 사례. S4의 «but is not the usual method»는 문장 안 양보 대비다.<\/p><ul><li><b>구조의 이름 — 논박 대상 → 그러나 근거(Fact) → 전제(assumption) → 결론<\/b>: S1 논박 대상 → S2 However에서 Fact(증거) → S3에서 그 해석(= 전제, assumption) → S4에서 첫 문장을 뒤집는 결론. 이 «논박 대상·그러나 근거·전제·결론» 구조는 주로 CR에서 보이는 구조이며, 이 구조에서는 마지막 문장(결론)이 전체 주제가 된다.<\/li><\/ul>", "correct": "<ul><li><b>★해법<\/b>: 질문의 본문 단어(직접 발생으로 부화한 개체)를 주어로 본문을 재구성한다. 근거는 셋째 문장의 «close resemblance of the embryos to their adult forms»와 fully equipped(유생 단계를 건너뜀)이므로, 부화 때 이미 성체와 거의 같다는 데서 한 걸음만 나아간 보기를 고르고, 섭식·보호처럼 본문에 없는 말은 버린다.<\/li><\/ul><p>직접 발생의 산물인 부화체의 특징을 RC-02로 도출한다.<\/p><ul><li><b>정답 A<\/b> — \"성체와 <b>비교적 사소한 방식으로만<\/b> 다르다.\"<\/li><li><b>정답 근거<\/b>: 지문은 \"the <b>close resemblance of the embryos to their adult forms<\/b>\"(배아가 성체와 매우 닮음)와 \"hatched <b>fully equipped<\/b> … rather than passing through a series of juvenile stages\"(유생 단계 없이 완전 장비를 갖춰 부화)를 직접 발생의 특징으로 든다. 즉 부화 시점에 이미 성체와 거의 같은 형태이므로, 성체와의 차이는 사소하다(A).<\/li><\/ul>", "wrong": "<ul><li><b>오답 분석<\/b>:<\/li><li>B(가혹한 환경에서 생존하기에 <b>부적합하다<\/b>) —
